<tr><th>主要互動族群</th><td>西南部平埔族群（<span class="hl">西拉雅族</span>為主）</td><td>北臺灣平埔族群（<span class="hb">凱達格蘭族</span>為主）</td><td><span class="hl">中部平埔族群</span>（<span class="hl">大肚王</span>統轄部落）</td></tr>
<tr><th>武力反抗</th><td><span class="hb">麻豆社之役</span></td><td>雞籠、淡水原住民均曾反抗</td><td><span class="hb">大肚王反抗</span>（因漢人侵墾）</td></tr>
<tr><th>經濟變遷</th><td colspan="3">•外來者以鹿皮作為貿易商品➡原住民大量捕鹿➡<span class="hl">梅花鹿數量大量減少</span><br>•游耕、漁獵➡<span class="hl">定居耕種</span>（尤其漢人帶來水田耕作技術）</td></tr>
<tr><th>文化變遷</th><td colspan="2">傳統信仰➡西方宗教（<span class="hb">基督新教、天主教</span>）</td><td>傳統信仰➡<span class="hb">漢人信仰</span>（例：媽祖）</td></tr>
<tr><th>例外</th><td colspan="3">管轄之外的原住民（多為<span class="hl">高山族群</span>）仍維持原有生活，不受外來者影響</td></tr>
</table>`},
t9:{title:"清帝國在臺行政區劃的調整（五階段）",html:`<table>
<tr><th>時期</th><th>區劃</th><th>新增／改名的行政區</th><th>調整原因</th></tr>
<tr><th>①康熙時期<br>康熙23年 1684</th><td><span class="hl">一府三縣</span></td><td><span class="hb">臺灣府</span>；臺灣縣、鳳山縣、諸羅縣</td><td>納入版圖，隸<span class="hb">福建省</span></td></tr>
<tr><th>②雍正～乾隆<br>1723・1727・1787</th><td>一府<span class="hb">四縣二廳</span></td><td>增<span class="hl">彰化縣、淡水廳</span>（雍正元年1723）、澎湖廳（雍正5年1727）；諸羅縣改名<span class="hl">嘉義縣</span>（乾隆52年1787）</td><td><span class="hb">朱一貴事件</span>後加強統治；<span class="hb">林爽文事件</span>時諸羅縣民守城有功→改名「嘉義」</td></tr>
<tr><th>③嘉慶～同治<br>嘉慶17年 1812</th><td>一府<span class="hb">四縣三廳</span></td><td>增<span class="hl">噶瑪蘭廳</span>（前期最晚設立的行政區）</td><td>漢人移民漸增（<span class="hb">吳沙</span>開墾蛤仔難）、沿海受<span class="hb">海盜</span>侵擾</td></tr>
<tr><th>④沈葆楨時期<br>光緒元年 1875</th><td><span class="hb">二府八縣四廳</span></td><td>北部崛起→增<span class="hl">臺北府</span>（淡水縣、新竹縣、宜蘭縣、基隆廳）；牡丹社事件後→增<span class="hl">恆春縣、卑南廳、埔里社廳</span></td><td><span class="hb">牡丹社事件</span>後加強防務、經營後山</td></tr>
<tr><th>⑤劉銘傳時期<br>光緒13年 1887</th><td><span class="hl">三府一州十一縣三廳</span></td><td>中部增設<span class="hl">臺灣府</span>（省城；雲林縣、苗栗縣等），原臺灣府改稱<span class="hb">臺南府</span>；東部增<span class="hl">臺東直隸州</span></td><td><span class="hb">清法戰爭</span>後、光緒11年（1885）<span class="hl">臺灣建省</span></td></tr>
<tr><th>開發重心</th><td>集中在<span class="hb">中南部平原</span></td><td>開發往<span class="hb">北部</span>發展</td><td>拓墾範圍擴及<span class="hb">東北部</span>（宜蘭）</td><td colspan="2">政經重心<span class="hl">北移</span>（臺北府→省城）</td></tr>
<tr><th colspan="4" style="text-align:left">原則：①依社會、經濟發展需求設置調整 ②在<span class="hl">治安（民變）</span>、<span class="hl">國防（外力入侵）</span>需要時才增設<br>口訣（府數只增不減 1→1→1→2→3）：<span class="hl">3縣 → 4縣2廳 → 4縣3廳 → 2府8縣4廳 → 3府1州11縣3廳</span></th></tr>
</table>`},
t10:{title:"清帝國時期臺灣貿易活動的比較",html:`<table>
<tr><th>分期</th><th style="color:var(--blue)">開港通商前</th><th style="color:var(--orange)">開港通商後</th></tr>
<tr><th>主要型態</th><td><span class="hl">兩岸貿易</span>（對渡）</td><td><span class="hl">國際貿易</span></td></tr>
<tr><th>貿易對象</th><td>中國大陸為主</td><td>中國大陸、<span class="hb">世界各國</span></td></tr>
<tr><th>重要市鎮</th><td>對渡港口（海港、河港）：最初<span class="hl">鹿耳門</span>（唯一合法正港）；發展為<span class="hb">一府二鹿三艋舺</span></td><td>通商口岸：<span class="hb">雞籠、淡水、安平、打狗</span></td></tr>
<tr><th>出口商品</th><td>稻米、蔗糖</td><td><span class="hl">茶葉、蔗糖、樟腦</span></td></tr>
<tr><th>進口商品</th><td>紡織品、藥材、日用品</td><td><span class="hb">鴉片</span>、紡織品</td></tr>
<tr><th>商業組織</th><td><span class="hl">郊</span>（行郊：泉郊、廈郊／<span class="hb">米郊</span>、糖郊、布郊）</td><td><span class="hl">洋行</span></td></tr>
<tr><th>影響</th><td>「<span class="hb">正港</span>」一說的出現</td><td><span class="hl">政經中心北移</span>、1878 入超轉出超、<span class="hb">大稻埕</span>崛起</td></tr>
</table>`},
t11:{title:"沈、劉的行政改革與建設",html:`<table>
<tr><th style="width:12%"></th><th style="width:44%;color:var(--blue)">沈葆楨時期</th><th style="width:44%;color:var(--orange)">劉銘傳時期</th></tr>
<tr><th>來臺背景</th><td><span class="hl">牡丹社事件</span>（1874）</td><td><span class="hl">清法戰爭</span>（1884）➡<span class="hb">首任臺灣巡撫</span></td></tr>
<tr><th>調整行政區</th><td><b>2府8縣4廳</b>（1875），隸屬<span class="hb">福建省</span><br>臺北府：宜蘭縣、淡水縣、基隆廳、新竹縣<br>臺灣府：彰化縣、嘉義縣、臺灣縣、鳳山縣、恆春縣、埔里社廳、卑南廳、澎湖廳<br>‧因應<span class="hl">經濟重心北移</span>，在北部設臺北府<br>‧為<span class="hl">防外患</span>，在恆春設縣<br>‧19世紀後期<span class="hl">開始在東部設行政區</span></td>
<td><b>3府11縣3廳1直隸州</b>（1887），<span class="hb">臺灣省</span><br>臺北府、臺灣府、臺南府、臺東直隸州<br>‧<span class="hl">臺灣巡撫衙門設於臺北府</span><br>‧<span class="hl">提高東部行政區的層級</span>（卑南廳→臺東直隸州）</td></tr>
<tr><th>政治</th><td>①廢除<span class="hl">渡臺禁令</span>，<span class="hl">獎勵漢人移墾</span> ②廢除<span class="hl">劃界封山</span>，<span class="hl">開山撫番</span> ③開始在東部設立行政區（卑南廳）</td>
<td>設立<span class="hl">臺東直隸州</span>，加強管理東部</td></tr>
<tr><th>軍事</th><td>修建西式炮臺　例<span class="hl">二鯤鯓炮臺（億載金城）</span>、旗後炮臺；恆春<span class="hb">築城牆</span></td>
<td>修建西式炮臺　例基隆<span class="hl">二沙灣炮臺（海門天險）</span>、淡水<span class="hb">滬尾炮臺</span></td></tr>
<tr><th>交通</th><td>開闢<span class="hl">北、中、南三條聯絡東部的道路</span>（為了開山撫番）</td>
<td>①修築臺灣<span class="hl">最早的鐵路</span>（基隆～臺北；臺北至新竹段為繼任巡撫<span class="hb">邵友濂</span>完成，含<span class="hb">獅球嶺隧道</span>）②開辦郵政，設立<span class="hl">郵政總局</span> ③架設<span class="hl">電報線</span>（延伸至福州）、購置<span class="hb">輪船</span>促進貿易</td></tr>
<tr><th>教育</th><td>—</td><td>設<span class="hb">西學堂、電報學堂</span></td></tr>
<tr><th colspan="3" style="text-align:left"><b>南北對比</b>：<span class="hl">沈葆楨</span>重視<span class="hb">南部</span>的國防建設（安平、旗後炮臺、恆春城牆），與<span class="hb">牡丹社事件</span>有關；<span class="hl">劉銘傳</span>較多<span class="hb">北部</span>建設——國防（基隆、淡水炮臺）與<span class="hb">清法戰爭</span>有關，交通等其他建設則與<span class="hb">經濟重心北移</span>有關。</th></tr>
<tr><th colspan="3" style="text-align:left">劉銘傳的建設<span class="hl">多集中於北部</span>（鐵路、電報、郵政總局、學堂都在臺北），顯示<span class="hl">重北輕南</span>——這正是開港後政經重心北移的延續。</th></tr>
</table>`},
t12:{title:"械鬥與三大民變",html:`<table>
<tr><th>類型</th><th>內容</th></tr>
<tr><th>械鬥</th><td>移民爭利益，以<span class="hl">閩粵、漳泉（祖籍別）</span>最盛</td></tr>
<tr><th>三大民變</th><td><span class="hl">朱一貴（1721）→ 林爽文（1786，規模最大）→ 戴潮春（1862，歷時最久）</span></td></tr>
<tr><th>共同背景</th><td><span class="hb">官逼民反</span>（吏治不良、會黨問題多）</td></tr>
</table>`},
t13:{title:"漢人的社會與文教（宗教・宗族・文教）",html:`<table>
<tr><th colspan="7" class="grp">宗教信仰</th></tr>
<tr><th style="width:12%">背景</th><td colspan="6">早期來臺的<span class="hb">閩、粵</span>移民，拓墾過程充滿危機；常在<span class="hl">原鄉聚居</span>的村莊建廟，供奉原鄉神明為守護神</td></tr>
<tr><th>原鄉神明<br>（依祖籍）</th><td colspan="2"><b>漳州人</b><br><span class="hl">開漳聖王</span></td><td colspan="2"><b>泉州人</b><br><span class="hl">保生大帝、清水祖師</span></td><td colspan="2"><b>潮州人</b><br><span class="hl">三山國王</span></td></tr>
<tr><th>共同信仰</th><td colspan="6"><span class="hb">媽祖、王爺、土地公</span>；<span class="hl">有應公廟</span>＝祭祀孤魂野鬼</td></tr>
<tr><th colspan="7" class="grp">宗族組織</th></tr>
<tr><th>分類</th><td colspan="3" style="text-align:center;color:var(--blue);font-weight:600">唐山祖</td><td colspan="3" style="text-align:center;color:var(--orange);font-weight:600">開臺祖</td></tr>
<tr><th>時間</th><td colspan="3" style="font-weight:600">初期</td><td colspan="3" style="font-weight:600">後期</td></tr>
<tr><th>成員</th><td colspan="3">同姓、<span class="hl">不一定有血緣</span>關係</td><td colspan="3">同姓，<span class="hl">有血緣</span>關係</td></tr>
<tr><th>祭祀對象</th><td colspan="3">共同祭祀<span class="hb">中國大陸原鄉</span>的祖先</td><td colspan="3">祭祀<span class="hb">來臺開發</span>的祖先</td></tr>
<tr><th>費用</th><td colspan="3"><span class="hl">集資</span></td><td colspan="3">修族譜、建祠堂，以<span class="hl">部分祖產</span>作公費</td></tr>
<tr><th colspan="7" class="grp">文教風氣</th></tr>
<tr><th>早期不盛</th><td colspan="6">移民為求生存，忙於<span class="hb">墾殖</span>，文教並不發達</td></tr>
<tr><th>後來興盛<br>（原因）</th><td colspan="6">①人民<span class="hb">經濟生活改善</span> ②官方及民間<span class="hb">教育機構增設</span> ③官方與地方人士提倡</td></tr>
<tr><th>結果</th><td colspan="6">①通過<span class="hl">科舉</span>考試的人數逐年增加 ②臺灣<span class="hl">文風日益興盛</span>（18～19世紀）</td></tr>
<tr><th>科舉人數<br>（舉人／進士）</th><td colspan="6">康雍 1687–1735：<b>15</b>／0　｜　乾隆 1736–1795：<b>56</b>／2　｜　嘉道 1796–1850：<b>74</b>／6　｜　<span class="hl">咸同光 1851–1894：106／21（最多）</span></td></tr>
</table>`},
tSoc:{title:"開港通商後的社會變遷",html:`<table>
<tr><th colspan="3" class="grp">社會的轉變</th></tr>
<tr><th style="width:14%">豪族形成</th><td colspan="2">部分<span class="hb">地主、郊商</span>與政府合作，取得<span class="hl">樟腦經營權</span>致富，成為<span class="hl">豪族</span></td></tr>
<tr><th>客家人<br>地位提升</th><td colspan="2">原本：北部客家人多居<span class="hb">丘陵、近山</span>，不利水稻、甘蔗生產<br>提升：開港後因<span class="hl">茶葉、樟腦</span>生產致富，社會地位逐漸上升</td></tr>
<tr><th colspan="3" class="grp">西方文化再傳入</th></tr>
<tr><th>傳播者</th><td colspan="2">傳教士在臺灣建教堂、傳福音，並以<span class="hl">醫療、教育</span>作為傳教的方式；以基督教<span class="hb">長老教會</span>為主</td></tr>
<tr><th>代表人物</th><th style="text-align:center;color:var(--blue)">馬偕（<span class="hb">加拿大籍</span>）・北部</th><th style="text-align:center;color:var(--orange)">馬雅各（<span class="hb">英國籍</span>）・南部</th></tr>
<tr><th>事蹟</th><td>①在<span class="hb">淡水</span>設醫館 ②建<span class="hl">理學堂大書院</span>（又稱牛津學堂，在今淡水真理大學內）③設<span class="hl">淡水女學堂</span>，倡導女子教育（今淡江中學前身）</td><td>在<span class="hb">臺南</span>設立臺灣第一間<span class="hl">西醫醫館</span>（看西街醫館，今臺南新樓醫院前身）</td></tr>
<tr><th colspan="3" style="text-align:left">影響：<span class="hl">現代醫學知識與新式教育</span>傳入臺灣。記法：<span class="hb">北馬偕‧南馬雅各</span>。</th></tr>
</table>`},
j1:{title:"日治三階段（治臺政策的轉變）",html:`<table>
<tr><th style="width:10%">時期</th><th style="width:30%;color:var(--blue)">殖民地特殊統治時期<br>（無方針主義）</th><th style="width:30%;color:var(--green)">內地延長主義時期</th><th style="width:30%;color:var(--red)">皇民化運動時期</th></tr>
<tr><th>時間</th><td><span class="hl">1895～1919</span></td><td><span class="hl">1919～1937</span></td><td><span class="hl">1937～1945</span></td></tr>
<tr><th>背景</th><td>①日本領有臺灣，抗日事件頻繁（例：1915 <span class="hb">西來庵事件</span>）②至第一次世界大戰結束</td><td>①一次大戰（1914–<span class="hb">1918</span>）結束後 ②「<span class="hl">民族自決</span>」思潮風行（各民族有權決定自身事務）③各地掀起<span class="hb">殖民地獨立運動</span>風潮</td><td>①1937 <span class="hl">中日戰爭</span>爆發 ②配合<span class="hb">南進政策</span>，1941 太平洋戰爭</td></tr>
<tr><th>總督</th><td><span class="hl">武官</span></td><td><span class="hl">文官</span></td><td><span class="hl">武官</span></td></tr>
<tr><th>目的</th><td>①漸進式統治、鎮壓反抗鞏固統治 ②<span class="hb">非同化</span>政策</td><td>避免臺灣人追求<span class="hb">自治、獨立</span>→改採<span class="hb">同化</span>政策</td><td>戰爭需充分動員人力物資、強化臺人對日本的<span class="hb">愛國心</span></td></tr>
<tr><th>方式</th><td>①鎮壓武裝抗日 ②安撫——尊重臺灣人的風俗習慣、籠絡人心消除反抗</td><td>①殖民地視為「<span class="hl">內地</span>」的一部分 ②標榜「<span class="hl">日臺合一</span>」 ③日本部分國內法可施行於臺灣</td><td><span class="hl">說日語・改日姓・穿和服・拜神社</span>、行日本風俗禮儀、徵召臺人從軍、部分臺籍婦女被迫充當「慰安婦」</td></tr>
<tr><th>抗日</th><td>1915 <span class="hb">西來庵（噍吧哖）事件</span>：失敗收場</td><td>①漢人＝轉向<span class="hb">非武裝的社會運動</span> ②原住民＝1930 <span class="hb">霧社事件</span></td><td><span class="hl">社會運動均被禁止</span></td></tr>
<tr><th>結果</th><td>一次大戰後轉向同化政策</td><td>臺灣人並未獲得與日本人<span class="hl">相同的待遇</span></td><td>日本戰敗投降，中華民國接收臺灣</td></tr>
</table>`},
jZ:{title:"日治時期最精華（一頁背完）",html:`<table>
<tr><th colspan="4" class="grp">一、十個必背年份</th></tr>
<tr><th style="width:13%">前期<br>1895–1919</th><td colspan="3"><span class="hl">1895</span> 馬關條約割臺・臺灣民主國　│　<span class="hl">1908</span> 西部縱貫鐵路通車　│　<span class="hl">1910–15</span> 五年理蕃計畫　│　<span class="hl">1915</span> 西來庵事件（武裝抗日終點）</td></tr>
<tr><th>中期<br>1919–1937</th><td colspan="3"><span class="hl">1919</span> 內地延長主義（一戰1918結束）　│　<span class="hl">1921</span> 文化協會＋議會請願　│　<span class="hl">1930</span> 霧社事件＋嘉南大圳　│　<span class="hl">1934</span> 日月潭發電所　│　<span class="hl">1935</span> 首次地方議員選舉</td></tr>
<tr><th>後期<br>1937–1945</th><td colspan="3"><span class="hl">1937</span> 中日戰爭→皇民化　│　1941 太平洋戰爭・國民學校　│　1943 六年義務教育　│　<span class="hl">1945</span> 日本投降</td></tr>
<tr><th colspan="4" class="grp">二、三階段一句話</th></tr>
<tr><th>階段</th><td style="color:var(--blue)"><b>無方針主義</b> 1895–1919<br><span class="hb">武官</span>・非同化</td><td style="color:var(--green)"><b>內地延長主義</b> 1919–1937<br><span class="hb">文官</span>・同化「日臺合一」</td><td style="color:var(--red)"><b>皇民化運動</b> 1937–1945<br><span class="hb">武官</span>・徹底同化</td></tr>
<tr><th>關鍵字</th><td>鎮壓＋安撫（尊重臺人風俗）</td><td>民族自決→避免臺人求自治，實際仍差別待遇</td><td>說日語・改日姓・穿和服・拜神社・徵召從軍</td></tr>
<tr><th colspan="4" class="grp">三、四條主線</th></tr>
<tr><th>統治</th><td colspan="3">總督專制（<span class="hl">六三法</span>，集行政立法司法軍事於一身）＋<span class="hl">警察政治</span>（派出所「大人」＋保甲10戶1甲・10甲1保・壯丁團）</td></tr>
<tr><th>經濟</th><td colspan="3"><span class="hb">後藤新平</span>打底（專賣・三大調查・臺灣銀行・縱貫鐵路）→<span class="hl">工業日本農業臺灣</span>（蓬萊米・新式製糖・嘉南大圳）→<span class="hb">1930年代</span>→<span class="hl">工業臺灣農業南洋</span>（日月潭電力・軍需工業）</td></tr>
<tr><th>社會</th><td colspan="3">差別教育（小學校／公學校／蕃童教育所）→社會菁英崛起；放足斷髮・公共衛生・守時守法・都會休閒；死亡率下降、人口快速成長</td></tr>
<tr><th>原住民</th><td colspan="3">隘勇線圍堵＋蕃童教育所→<span class="hl">五年理蕃計畫</span>（1910）→<span class="hl">霧社事件</span>（1930，莫那魯道）→集團移住與同化→高砂義勇隊</td></tr>
<tr><th colspan="4" class="grp">四、「最」與「第一」（送分題）</th></tr>
<tr><th>之最</th><td colspan="3">最大規模武裝抗日＝<span class="hl">西來庵（噍吧哖）事件</span>　│　原住民最大抗日＝<span class="hl">霧社事件</span>　│　第一個合法政黨＝<span class="hl">臺灣民眾黨</span>（蔣渭水）　│　最高學府＝<span class="hl">臺北帝國大學</span>　│　首所專收臺人的中學＝<span class="hl">臺中中學校</span>　│　最早的義務教育＝<span class="hl">1943 六年國民義務教育</span>　│　臺人首次行使參政權＝<span class="hl">1935 地方議員選舉</span></td></tr>
<tr><th>人物</th><td colspan="3"><span class="hb">唐景崧・丘逢甲・劉永福</span>（臺灣民主國）│ <span class="hb">余清芳</span>（西來庵）│ <span class="hb">後藤新平</span>（基礎建設）│ <span class="hb">磯永吉</span>（蓬萊米）│ <span class="hb">八田與一</span>（嘉南大圳）│ <span class="hb">莫那魯道</span>（霧社）│ <span class="hb">林獻堂</span>（文協・請願・自治聯盟）│ <span class="hb">蔣渭水</span>（文協・民眾黨）</td></tr>
</table>`},

jD:{title:"日治統治體制總覽（四條線）",html:`<table>

<tr><th colspan="4" style="text-align:left">兩個分界年份一起背：<span class="hl">1919</span>（一戰1918結束→民族自決→內地延長主義、改文官總督）、<span class="hl">1937</span>（中日戰爭→皇民化、改回武官）。</th></tr>

jE:{title:"日治經濟發展與社會文化總覽",html:`<table>
<tr><th colspan="4" class="grp">經濟發展</th></tr>
<tr><th style="width:13%">專賣制度</th><td colspan="3"><span class="hl">鴉片、樟腦</span>等（後續菸、酒、鹽）＝總督府獨占經營，日治初期最大財源</td></tr>
<tr><th>基礎建設<br><span style="font-weight:400">★常考</span></th><td style="width:29%"><b>目標</b><br><span class="hl">強化統治、獲取資源</span></td><td style="width:29%"><b>調查事業</b><br>土地與林野調查、<span class="hb">人口普查</span>（1905）</td><td style="width:29%"><b>統一貨幣</b>　<span class="hl">臺灣銀行</span>發行（1899）<br><b>交通運輸</b>　<span class="hl">基隆－高雄縱貫鐵路</span>（1908）、<span class="hb">基隆港、高雄港</span></td></tr>
<tr><th>產業發展<br><span style="font-weight:400">★常考</span></th><td colspan="2"><b><span class="hl">工業日本，農業臺灣</span></b>（日治前期）<br><span class="hb">蓬萊米</span>（1922 磯永吉）、<span class="hb">新式製糖</span>（糖業王國）、<span class="hb">嘉南大圳</span>（1930 八田與一）</td><td><b><span class="hl">工業臺灣，農業南洋</span></b>　<span class="hb">←1930 年代</span><br><span class="hl">南進政策</span>、<span class="hl">日月潭發電所</span>（1934）、軍需與輕工業</td></tr>

j2:{title:"總督專制體制（總督・警察・保甲）",html:`<table>
<tr><th colspan="3" class="grp">總督專制</th></tr>
<tr><th style="width:12%">機構</th><td colspan="2">1895 年設立<span class="hl">臺灣總督府</span>，是日本在臺最高統治機構，以<span class="hb">臺灣總督</span>為首長</td></tr>
<tr><th>法源</th><td colspan="2">1896 年頒布「法律第六十三號」（簡稱<span class="hl">六三法</span>），授權總督頒布具法律效力的命令（律令）</td></tr>
<tr><th>權責</th><td colspan="2">總督集<span class="hl">行政、立法、司法及軍事</span>大權於一身</td></tr>
<tr><th colspan="3" class="grp">地方控制：警察 ＋ 保甲</th></tr>
<tr><th></th><th style="text-align:center;color:var(--blue)">警察制度</th><th style="text-align:center;color:var(--orange)">保甲制度</th></tr>
<tr><th>目的</th><td>鎮壓臺人反抗、加強地方控制</td><td><span class="hb">配合警察</span>，穩定社會秩序</td></tr>
<tr><th>編制／作法</th><td>在各地廣設<span class="hl">派出所</span></td><td>沿用<span class="hb">清代既有的地方自衛組織</span>：<span class="hl">10 戶為 1 甲</span>設甲長（類似鄰長）；<span class="hl">10 甲為 1 保</span>設保正（類似里長）</td></tr>
<tr><th>職務</th><td>無所不管：鎮壓抗日分子、檢查衛生、宣傳政令、調查戶口</td><td>①維護治安、嚴密監控社會 ②推動政務（調查戶口、宣達政令），並採<span class="hl">連坐法</span>（一人違法全甲同罰）③青壯年男子組<span class="hl">壯丁團</span>，協助救災與鎮壓抗日</td></tr>
<tr><th>特色</th><td>權力很大使人民畏懼→被稱為「<span class="hl">大人</span>」（每萬人配置的警察比例最高）</td><td>以臺人管臺人，成本低、監控密</td></tr>
<tr><th colspan="3" style="text-align:left">成效：警察與保甲制度的<span class="hl">相互配合</span>，有效監控臺灣社會、建立堅實的統治基礎。</th></tr>
</table>`},
j3:{title:"臺灣民主國與西來庵事件（武裝抗日）",html:`<table>
<tr><th colspan="3" class="grp">臺灣割讓與臺灣民主國</th></tr>
<tr><th style="width:12%">背景</th><td colspan="2">1894 清、日因<span class="hb">朝鮮問題</span>爆發<span class="hl">甲午戰爭</span>→1895 清帝國戰敗，簽訂《<span class="hl">馬關條約</span>》割讓臺灣、澎湖給日本</td></tr>
<tr><th>倡組</th><td colspan="2">割讓消息傳回臺灣後，臺灣<span class="hb">官紳</span>倡組「<span class="hl">臺灣民主國</span>」</td></tr>
<tr><th>目的</th><td colspan="2"><span class="hl">效忠清朝、抗拒日本接收</span>——並非追求獨立建國</td></tr>
<tr><th>領導</th><td colspan="2"><span class="hb">唐景崧</span>（總統）、<span class="hb">丘逢甲</span>（義軍統領）、<span class="hb">劉永福</span>（大將軍）；旗幟＝<span class="hl">藍地黃虎旗</span></td></tr>
<tr><th>結果</th><td colspan="2">①劣勢：兵力、武器不如日本 ②失敗：領導者先後離臺，民主國瓦解 ③意義：臺灣進入日本<span class="hl">50 年</span>的殖民統治</td></tr>
<tr><th colspan="3" class="grp">西來庵事件（1915）</th></tr>
<tr><th>背景</th><td colspan="2">日本接收臺灣後，臺灣漢人在各地發動抗日行動</td></tr>
<tr><th>時間地點</th><td colspan="2"><span class="hl">1915 年</span>，<span class="hl">噍吧哖</span>（今臺南市玉井區）</td></tr>
<tr><th>經過</th><td colspan="2"><span class="hb">余清芳</span>以<span class="hl">宗教</span>為名，組織群眾武裝抗日</td></tr>
<tr><th>結果</th><td colspan="2">因缺乏訓練，無法與日軍抗衡，多人失敗被捕</td></tr>
<tr><th>影響</th><td colspan="2">臺人有鑑於武裝抗日犧牲慘重，<span class="hl">轉以非武裝的政治、社會運動</span>爭取權益</td></tr>
</table>`},
j4:{title:"理蕃政策與霧社事件",html:`<table>
<tr><th style="width:10%">分期</th><th style="width:45%;color:var(--blue)">日治初期（安撫與圍堵）</th><th style="width:45%;color:var(--orange)">1910 年起（武力征討）</th></tr>
<tr><th>背景</th><td>總督府疲於壓制平地武裝抗日事件</td><td>已大致控制臺灣社會，為<span class="hl">開發山林資源</span>（第五任總督佐久間左馬太）</td></tr>
<tr><th>方針</th><td><span class="hl">防堵、安撫</span></td><td><span class="hl">武力征討</span></td></tr>
<tr><th>措施</th><td>①安撫＝設置<span class="hl">隘勇線</span>（鐵絲電網、木柵）限制原住民活動範圍 ②教化＝設<span class="hb">蕃童教育所</span> ③宣威＝招待部落頭目<span class="hb">赴日參觀</span>，宣揚日本現代化成果以籠絡威嚇 ④圍堵＝軍警深入山區</td><td>實施<span class="hl">五年理蕃計畫</span>（1910–1915）迫原住民歸順：①軍警深入山區武力鎮壓 ②打通<span class="hb">東西橫貫道路</span>，建立開發東部的運輸幹線 ③透過<span class="hb">教育同化</span>使原住民歸順；並將土地收歸公有、沒收槍械、強制勞役</td></tr>
<tr><th>結果</th><td>①原住民傳統文化受衝擊 ②部分接受教化者幫助日本統治→<span class="hb">部落內部衝突</span></td><td>林木與樟腦被掠奪、被迫改變生活方式、以勞力換取物資、受山地警察欺凌→<span class="hl">對日不滿</span></td></tr>
<tr><th colspan="3" class="grp">霧社事件（1930）</th></tr>
<tr><th>原因</th><td colspan="2">①日本開發山林資源並侵擾部落 ②強迫族人服<span class="hb">勞役</span>，又不尊重原住民文化</td></tr>
<tr><th>經過</th><td colspan="2"><span class="hl">賽德克族</span>頭目<span class="hl">莫那魯道</span>率族人襲殺日人→總督府出動軍警，使用<span class="hb">大炮、飛機、毒氣</span>鎮壓</td></tr>
<tr><th>結果</th><td colspan="2">原住民死傷慘重；日本國內及國際輿論譴責（臺灣民眾黨曾致電<span class="hb">國際聯盟</span>抗議），<span class="hl">臺灣總督下臺</span></td></tr>
<tr><th>影響</th><td>對總督府：改採較<span class="hl">溫和</span>的統治手段——加強教育與同化、警察應善待原住民</td><td>對原住民：<span class="hl">集團移住</span>——山區原住民集體遷往山下集中管理；知難以武力抗日，逐漸接受教化→二戰後期組成<span class="hb">高砂義勇隊</span>赴南洋作戰</td></tr>
</table>`},
j5:{title:"日治基礎建設（後藤新平）",html:`<table>
<tr><th style="width:14%">主導</th><td colspan="2">民政長官<span class="hl">後藤新平</span>等人</td></tr>
<tr><th>拓展財源</th><td colspan="2">背景＝日治初期臺灣財政依賴日本國庫補助；作法＝將<span class="hl">鴉片、樟腦</span>等列為<span class="hl">專賣</span>由總督府獨占經營→財政收入大增，<span class="hb">1898 年後財政逐漸獨立</span></td></tr>
<tr><th rowspan="3">調查工作</th><td style="width:16%"><b>戶口</b></td><td><span class="hl">1905 年第一次人口普查</span>，之後定期舉辦；利用<span class="hb">警察</span>深入調查（出現「戶口調查簿」）→有助統治與人力運用</td></tr>
<tr><td><b>土地</b></td><td>確定土地所有權以利徵稅→<span class="hb">田賦收入增加</span></td></tr>
<tr><td><b>林野</b></td><td>無主山林收歸<span class="hb">國有</span>，部分賣給資本家開發山林資源</td></tr>
<tr><th>統一貨幣<br>及度量衡</th><td colspan="2">1899 年成立<span class="hl">臺灣銀行</span>發行統一貨幣「<span class="hb">臺灣銀行券</span>」（解決清代幣制混亂、方便臺日資金流通、提供日商前進南洋的資金）；統一度量衡與日本一致，減少交易爭議</td></tr>
<tr><th rowspan="3">交通建設</th><td><b>陸運</b></td><td><span class="hl">1908 年完成基隆到高雄的西部縱貫鐵路</span>——突破西部河川東西向的不便，成為<span class="hb">南北交通動脈</span>；另建阿里山森林鐵路（臺灣林業開發的見證）</td></tr>
<tr><td><b>海運</b></td><td>整建<span class="hb">基隆港</span>（臺灣與日本聯絡的門戶）、<span class="hb">高雄港</span>（南部貨物主要進出港），有利南進政策</td></tr>
<tr><td><b>通訊</b></td><td>普設郵局（郵便局）、電報、電話</td></tr>
<tr><th colspan="3" style="text-align:left">結果：奠定臺灣日後<span class="hl">工業化</span>的發展基礎，提高日本企業的投資意願。目的則是便於<span class="hb">殖民統治及獲取臺灣資源</span>。</th></tr>
</table>`},
j6:{title:"農業臺灣・工業日本 vs 工業臺灣・農業南洋",html:`<table>
<tr><th style="width:12%">時間</th><th style="width:44%;color:var(--blue)">日治初期</th><th style="width:44%;color:var(--orange)">1930 年代起</th></tr>
<tr><th>策略</th><td><span class="hl">工業日本，農業臺灣</span></td><td><span class="hl">工業臺灣，農業南洋</span></td></tr>
<tr><th>目的</th><td>供應<span class="hb">日本國內</span>民生需求</td><td>配合日本的<span class="hb">南進政策</span>，南進基地化</td></tr>
<tr><th rowspan="3">措施</th><td><b>新式製糖業</b>：獎勵日本企業設立<span class="hl">新式製糖廠</span>（機械動力取代舊式糖廍）→「<span class="hl">糖業王國</span>」</td><td><b>電力開發</b>：<span class="hl">1934 日月潭水力發電所</span>完工</td></tr>
<tr><td><b>改良稻作</b>：1922 年<span class="hb">磯永吉</span>培育出<span class="hl">蓬萊米</span></td><td><b>軍需工業</b>：機械、石化、金屬、造船</td></tr>
<tr><td><b>興修水利</b>：<span class="hb">八田與一</span>設計建造<span class="hl">嘉南大圳</span>（1930 完工，<span class="hb">日治規模最大的水利工程</span>）</td><td><b>輕工業</b>：紡織、食品加工（鳳梨罐頭）</td></tr>
<tr><th>影響</th><td>①米、糖產量大增，並銷往日本 ②蔗農被<span class="hb">限制販售對象</span>、遭<span class="hb">偷斤減兩</span>→「<span class="hl">第一憨，種甘蔗予會社磅</span>」→1925 <span class="hl">二林事件</span>，開啟全島性農民運動</td><td>①提供充足電力，有利發展工業 ②輕工業顯著成長，臺灣從農業社會走向<span class="hl">半農半工</span>的社會</td></tr>
</table>`},
j7:{title:"差別待遇的殖民教育",html:`<table>
<tr><th style="width:12%">原則</th><td colspan="3"><span class="hl">差別待遇、隔離政策</span>，同時建立<span class="hb">西式教育制度</span></td></tr>
<tr><th>目的</th><td colspan="3">①<span class="hb">同化</span>——作為同化臺灣人民及推動產業政策的工具 ②<span class="hb">新知</span>——讓臺灣人從教育中獲得現代知識</td></tr>
<tr><th colspan="4" class="grp">初等教育（三軌並行）</th></tr>
<tr><th>學校</th><td style="width:29%"><span class="hl">小學校</span>：<b>日本人</b>就讀，課程比照日本內地</td><td style="width:29%"><span class="hl">公學校</span>：<b>臺灣人</b>就讀，以教授<span class="hb">日語</span>為主</td><td style="width:30%"><span class="hl">蕃人公學校・蕃童教育所</span>：<b>原住民</b>就讀（教師多由<span class="hb">日本警察</span>擔任）</td></tr>
<tr><th>差別</th><td colspan="3">無論師資、設備均比不上小學校，有種種限制與不公平待遇</td></tr>
<tr><th>政策調整</th><td colspan="3"><span class="hl">1941 年</span>配合皇民化運動，小學校、公學校一律改稱「<span class="hl">國民學校</span>」；<span class="hl">1943 年</span>實施<span class="hb">六年國民義務教育</span>（臺灣最早的義務教育）</td></tr>
<tr><th colspan="4" class="grp">中等以上教育</th></tr>
<tr><th>中等</th><td colspan="3">初期以招收日人為主；<span class="hl">1915 年</span>林獻堂等人成立第一所專收臺人子弟的<span class="hl">臺中中學校</span>（今臺中一中）。職業學校培養<span class="hb">醫師</span>（醫學校）、<span class="hb">公學校教師</span>（師範學校）、初級技術人才</td></tr>
<tr><th>高等</th><td colspan="3"><span class="hl">1928 年臺北帝國大學</span>（今臺灣大學）＝日治時期臺灣最高學府；高等教育機構不足，有志升學者多前往<span class="hb">日本留學</span></td></tr>
<tr><th>統計<br>（差別）</th><td colspan="3">初等學生：日 23,711／臺 210,272；<b>就學率</b>：日 98.2%／臺 <span class="hl">28.4%</span>；專門學校：日 6,856／臺 4,642；高等學校：日 220／臺 <span class="hl">28</span> →「差別待遇、基礎教育不足」</td></tr>
<tr><th>其他</th><td colspan="3"><span class="hb">日語</span>漸成臺人的共通語言，臺人也藉此吸收現代知識，影響延續至今；1943 年實施義務教育後，臺籍兒童就學率<span class="hl">超過 70%</span></td></tr>
<tr><th>影響</th><td colspan="3">1920 年代以後新的<span class="hl">社會菁英</span>階層逐漸崛起（新思想＋專業訓練），成為日後政治、社會與文化運動的推手</td></tr>
</table>`},
j8:{title:"文化啟蒙與政治社會運動（四大組織）",html:`<table>
<tr><th style="width:12%">背景</th><td colspan="4">1920 年代臺籍知識分子受國際「<span class="hl">民族自決</span>」風潮鼓舞（一戰後美國總統威爾遜提出），加上日本國內民主呼聲高漲，起而爭取臺人權益</td></tr>
<tr><th>類別</th><th>組織（起訖）</th><th>領導人</th><th>主張／內容</th><th>意義・結果</th></tr>
<tr><th>文化啟蒙</th><td><span class="hl">臺灣文化協會</span><br>1921–1931</td><td><span class="hb">蔣渭水<br>林獻堂</span></td><td>宗旨「謀臺灣文化之向上」；創辦《<span class="hl">臺灣民報</span>》、設讀報社、辦文化演講與夏季學校</td><td>傳播新知、改良社會風氣，<span class="hb">喚起臺人民族意識</span></td></tr>
<tr><th rowspan="3">政治社會運動</th><td><span class="hl">臺灣議會設置<br>請願運動</span><br>1921–1934</td><td><span class="hb">林獻堂</span></td><td>共請願 <span class="hl">15 次</span>，要求設立<span class="hb">民選的臺灣議會</span>、爭取立法權</td><td>雖未獲同意，但<span class="hb">喚起臺人的政治意識</span></td></tr>
<tr><td><span class="hl">臺灣民眾黨</span><br>1927–1931</td><td><span class="hb">蔣渭水</span></td><td>宣導民權、自治，扶助農、工運動；反對吸食鴉片、破除迷信</td><td>臺灣史上<span class="hl">第一個合法政黨</span></td></tr>
<tr><td><span class="hl">臺灣地方<br>自治聯盟</span><br>1930–1937</td><td><span class="hb">林獻堂</span></td><td>爭取<span class="hb">地方自治、參政權</span></td><td>促成 <span class="hl">1935 年</span>總督府首次開放地方議員選舉（有限度）→臺灣民眾<span class="hl">首次行使投票權</span></td></tr>
<tr><th colspan="5" style="text-align:left">結束：<span class="hl">1937 中日戰爭</span>爆發後，臺人的政治社會運動受到打壓而被迫終止。　1935 年選舉的限制：僅少數男性有投票權、半數席次仍官派，並未落實真正的地方自治。</th></tr>
</table>`},
j9:{title:"移風易俗與現代觀念的建立",html:`<table>
<tr><th style="width:10%">項目</th><th style="width:30%;color:var(--blue)">放足斷髮・禁吸鴉片</th><th style="width:30%;color:var(--green)">公共衛生與醫療</th><th style="width:30%;color:var(--orange)">守法與守時</th></tr>
<tr><th>原因</th><td>移風易俗、改造「陋習」</td><td>有效防止臺灣<span class="hb">傳染病</span>肆虐</td><td>守法＝有效控制社會、維持秩序；守時＝符合<span class="hb">工業生產</span>的需要</td></tr>
<tr><th>作法</th><td>臺灣<span class="hl">三大陋習</span>＝吸食鴉片、辮髮、纏足。放足斷髮：①最初<span class="hb">消極</span>（避免臺人抗爭）②後來透過<span class="hb">保甲制度</span>與多方宣導、士紳倡導放足剪辮，帶動「<span class="hb">易服改裝</span>」風氣。鴉片：①初採消極的<span class="hl">漸禁</span>（管制吸食人口）②後因知識分子反對而改變作法</td><td>①醫療＝建立<span class="hl">西式醫院</span>、辦理預防注射和接種（推廣疫苗對抗<span class="hb">霍亂</span>等傳染病） ②公共＝建造<span class="hl">自來水</span>、廁所等公共衛生設施</td><td>①守法＝引進現代<span class="hl">司法制度</span>、設立各級地方法院 ②守時＝改用<span class="hb">西曆</span>，引進<span class="hl">標準時間制</span>與一週七天的<span class="hl">星期制</span>，舉辦守時宣傳活動</td></tr>
<tr><th>影響</th><td>①改變服飾風潮（漢、日、洋並存）②<span class="hl">婦女得到解放</span>——走出家庭，從事教師、護士、車掌等工作 ③禁鴉片<span class="hl">效果有限</span>，並沒有絕跡</td><td>①改善傳染病肆虐的環境 ②防疫、保健、衛生觀念逐漸普及 ③<span class="hl">傳染病逐漸得到控制，臺灣人壽命提升</span></td><td>①確立臺灣的司法制度、臺人養成<span class="hb">守法</span>觀念 ②養成<span class="hb">守時</span>習慣、行政與交通遵守時間、開始重視放假與休閒（民間仍沿用農曆）</td></tr>
<tr><th colspan="4" class="grp">現代都市的出現與休閒生活</th></tr>
<tr><th>都市出現</th><td colspan="3">1920 年代以後人口增加與集中，總督府引進<span class="hl">現代化都市計畫</span>（道路、自來水、下水道）→<span class="hl">1940 年代</span>形成臺北、高雄、臺南等大都市</td></tr>
<tr><th>休閒公共化</th><td colspan="3">各地建造<span class="hb">公園、博物館</span>；1930 年代臺北<span class="hl">菊元百貨</span>、臺南<span class="hl">林百貨</span>落成，開百貨公司之先河（<span class="hb">搭電梯</span>是當時最時髦的活動）；咖啡館、新式餐廳、博物館；推廣<span class="hb">棒球</span>運動；報紙、廣播、咖啡廳與劇院出現；日本溫泉料理歌曲流行；搭<span class="hb">鐵路</span>的長程旅遊觀光盛行</td></tr>
<tr><th>城鄉差距</th><td colspan="3">現代化均出現於<span class="hl">都市</span>；鄉村和原住民部落則大致保留原來的生活型態</td></tr>
</table>`},
j10:{title:"原住民的社會演變與身分認同",html:`<table>
<tr><th style="width:14%">項目</th><th style="width:43%">作法</th><th style="width:43%">結果</th></tr>
<tr><th>族群觀念<br>改變</th><td>原先原住民只有<span class="hb">部落意識</span>；總督府派學者根據習俗、語言、分布等要素進行調查，以「<span class="hl">族</span>」來區分原住民</td><td>促使<span class="hl">族群觀念</span>發生變化（今日族群分類的源頭）</td></tr>
<tr><th>傳統文化<br>改變</th><td>透過「<span class="hl">蕃童教育所</span>」與警察，教原住民接受現代禮儀與醫療等知識；強迫停止<span class="hb">出草、文面與室內葬</span>等習俗</td><td>改變原住民傳統的社會文化</td></tr>
<tr><th>語言姓氏<br>改變</th><td>原住民被要求<span class="hl">改日姓、說日語</span></td><td>①族群語言混雜日語，甚至姓名以日語發音 ②<span class="hb">平埔族語言快速流失</span>，只剩噶瑪蘭族等語言可在族內流通</td></tr>
<tr><th>身分上的<br>矛盾</th><td>原住民以部落為中心、<span class="hb">無國族意識</span>；太平洋戰爭時參加「<span class="hl">高砂義勇隊</span>」至南洋作戰</td><td>產生新的身分（<span class="hl">日本兵</span>）；對參戰有不同態度——<span class="hb">有志願的，也有被迫的</span></td></tr>
<tr><th colspan="3" style="text-align:left">對照清帝國時期：清代是「劃界封山→開山撫番」，日治是「隘勇線圍堵→五年理蕃計畫→霧社後集團移住與同化」——手段從<span class="hb">隔離</span>走向<span class="hl">深入控制與改造</span>。</th></tr>
</table>`},
jA:{title:"日治時期臺人抗日行動統整",html:`<table>
<tr><th style="width:10%">類別</th><th style="width:22%">接收臺灣時</th><th colspan="2" style="text-align:center;color:var(--blue)">武裝抗日</th><th style="width:24%;color:var(--orange)">非武裝抗日</th></tr>
<tr><th>行動</th><td><span class="hl">臺灣民主國</span></td><td><span class="hl">西來庵事件</span></td><td><span class="hl">霧社事件</span></td><td><span class="hl">政治社會運動</span></td></tr>
<tr><th>時間</th><td>1895 年</td><td>1915 年</td><td>1930 年</td><td>1920 年代～1937 年</td></tr>
<tr><th>領導</th><td><span class="hb">唐景崧</span>（丘逢甲、劉永福）</td><td><span class="hb">余清芳</span></td><td><span class="hb">莫那魯道</span>（賽德克族）</td><td><span class="hb">林獻堂、蔣渭水</span></td></tr>
<tr><th>性質</th><td>抗拒日本接收</td><td>漢人抗日</td><td><span class="hl">原住民</span>抗日</td><td>文化啟蒙，爭取權益</td></tr>
<tr><th>背景</th><td><span class="hl">甲午戰爭</span>戰敗，簽訂《<span class="hl">馬關條約</span>》割讓臺、澎</td><td>日治初期，漢人武裝抗日行動不斷</td><td>①<span class="hb">理蕃政策</span>侵奪土地 ②警察高壓管制部落 ③族人負擔沉重勞役</td><td>一次大戰後<span class="hl">民族自決</span>風潮盛行</td></tr>
<tr><th>結果</th><td>抵抗失敗</td><td>遭武力鎮壓</td><td>遭武力鎮壓，引發日本及<span class="hb">國際輿論抨擊</span></td><td><span class="hl">皇民化運動後受到禁制</span>、被迫終止</td></tr>
<tr><th>影響<br>或意義</th><td>並非欲爭取民主政治或獨立，而是<span class="hl">回歸清帝國統治</span></td><td>臺人有感於武裝抗日死傷慘重，<span class="hl">改採非武裝的政治社會運動</span></td><td>總督府<span class="hl">調整統治原住民政策</span>➡教育同化、將部落集體遷往他處</td><td>臺人對<span class="hl">自治、普選、參政權</span>等觀念已有初步認識</td></tr>
</table>`},
jB:{title:"荷治至日治：原住民政策的演變（跨章總表）",html:`<table>
<tr><th style="width:10%">時期</th><th style="width:17%;color:var(--orange)">荷治時期</th><th style="width:15%;color:var(--green)">鄭氏時期</th><th style="width:20%;color:var(--blue)">清帝國前期</th><th style="width:15%;color:var(--blue)">開港通商後</th><th style="width:23%;color:var(--red)">日治時期</th></tr>
<tr><th>措施</th><td>武力征討、<span class="hb">地方會議</span>、宗教教化</td><td>武力征討、<span class="hb">儒家教化</span></td><td>對生番：<span class="hl">劃界封山</span><br>對熟番：推廣漢文化</td><td><span class="hl">開山撫番</span></td><td>安撫＋圍堵（<span class="hb">隘勇線</span>）➡<span class="hl">五年理蕃計畫</span>➡教育同化＋<span class="hb">集團移住</span>➡皇民化運動</td></tr>
<tr><th>反抗事件</th><td><span class="hb">麻豆社之役</span>、大肚王反抗</td><td><span class="hb">大肚王抗鄭</span></td><td>—（大甲西社事件）</td><td>原住民反抗➡遭鎮壓</td><td><span class="hl">霧社事件</span></td></tr>
<tr><th>影響</th><td>部分原住民接受<span class="hb">基督教</span>信仰</td><td>原住民生活型態受影響、生活空間受壓縮</td><td>加速<span class="hb">平埔族群漢化</span>、傳統文化漸趨式微</td><td>被迫<span class="hb">遷移他處</span>（四次大遷移）</td><td>原住民的<span class="hl">語言及傳統習俗逐漸流失</span>；以「族」區分族群、改日姓說日語、組高砂義勇隊</td></tr>
</table>`},
jC:{title:"清帝國與日治時期的經濟・商業・交通比較（跨章總表）",html:`<table>
<tr><th style="width:10%">時期</th><th colspan="2" style="text-align:center;color:var(--blue)">清帝國時期</th><th colspan="2" style="text-align:center;color:var(--red)">日治時期</th></tr>
<tr><th>分期</th><td style="width:22%">開港通商前</td><td style="width:22%">開港通商後</td><td style="width:23%">日治前期</td><td style="width:23%">1930 年代起</td></tr>
<tr><th>經濟型態</th><td><span class="hl">對渡貿易</span><br>農業、兩岸貿易</td><td><span class="hl">國際貿易</span><br>農業、國際貿易</td><td>強化基礎建設<br><span class="hl">工業日本，農業臺灣</span></td><td><span class="hl">工業臺灣，農業南洋</span><br>軍需工業、輕工業</td></tr>
<tr><th>主要港口</th><td><span class="hb">府城、鹿港、艋舺</span><br>（一府二鹿三艋舺）</td><td><span class="hb">安平、淡水、雞籠、打狗</span></td><td colspan="2"><span class="hb">基隆、高雄</span>（基隆＝對日門戶；高雄＝南部進出港）</td></tr>
<tr><th>貿易對象</th><td>與中國大陸<span class="hl">對渡貿易</span></td><td>發展<span class="hl">進出口貿易</span></td><td colspan="2">與<span class="hl">日本本土、南洋</span>往來</td></tr>
<tr><th>商業組織</th><td><span class="hl">郊</span>（郊商）</td><td><span class="hl">洋行</span>（＋買辦）</td><td colspan="2"><span class="hl">會社</span>（公司）</td></tr>
<tr><th>水利</th><td colspan="2">瑠公圳、貓霧捒圳、八堡圳、曹公圳（民間合資為主）</td><td colspan="2"><span class="hl">嘉南大圳</span>（八田與一，1930，日治規模最大）</td></tr>
<tr><th>道路</th><td colspan="2">沈葆楨開闢三條通往山區及東部的道路</td><td colspan="2">在各地修築<span class="hb">公路</span>；五年理蕃計畫打通東西橫貫道路</td></tr>
<tr><th>鐵路</th><td colspan="2"><span class="hl">最早的鐵路</span>：基隆－新竹（劉銘傳，1891/1893）</td><td colspan="2"><span class="hl">西部縱貫鐵路</span>：基隆－高雄（1908）、阿里山鐵路</td></tr>
<tr><th>海運</th><td colspan="2">購置輪船，航行臺灣、中國、東南亞之間</td><td colspan="2">整建<span class="hb">基隆港、高雄港</span></td></tr>
<tr><th>空運</th><td colspan="2">—</td><td colspan="2">興建<span class="hb">飛行場</span>（機場）</td></tr>
<tr><th>通訊</th><td colspan="2">架設電報線、設<span class="hb">郵政總局</span></td><td colspan="2">設立<span class="hb">郵便局</span>（郵局）、電報、電話</td></tr>
<tr><th>電力</th><td colspan="2">—（劉銘傳於臺北街道裝設電燈）</td><td colspan="2"><span class="hl">日月潭水力發電所</span>（1934）</td></tr>
<tr><th>製糖</th><td colspan="2">傳統<span class="hb">糖廍</span>（人力畜力）</td><td colspan="2"><span class="hl">新式製糖廠</span>（機械）→糖業王國</td></tr>
<tr><th colspan="5" style="text-align:left">一句話：清代的建設是<span class="hb">因應外力入侵、由官員零星推動</span>；日治的建設是<span class="hl">殖民母國有計畫地榨取資源</span>——但客觀上奠定了臺灣現代化與工業化的基礎。</th></tr>
</table>`},
r1:{title:"二二八事件（原因・經過・影響）",html:`<table>
<tr><th style="width:12%">背景</th><td colspan="2">民34（1945）8月日本無條件投降、二戰結束→中華民國接收臺灣、澎湖，成立<span class="hl">臺灣省行政長官公署</span>，<span class="hb">陳儀</span>任行政長官</td></tr>
<tr><th rowspan="3">初期局勢</th><td style="width:14%"><b>政治</b></td><td>行政長官掌控<span class="hl">政治、軍事大權</span>→被民眾詬病猶如「<span class="hl">新總督</span>」；部分官員、軍警濫權腐敗</td></tr>
<tr><td><b>經濟</b></td><td><span class="hb">米糧短缺</span>，物價飛漲（物資運往中國支援<span class="hb">國共內戰</span>）</td></tr>
<tr><td><b>文化</b></td><td>來臺人士與臺人在<span class="hb">語言文化、習慣</span>上差異大</td></tr>
<tr><th>起因</th><td colspan="2">民36（1947）<span class="hl">2月27日</span>，官員在<span class="hb">臺北</span><span class="hl">查緝私菸</span>，誤殺民眾，引發衝突</td></tr>
<tr><th rowspan="3">經過</th><td colspan="2">①28 日起各地陸續爆發反政府事件</td></tr>
<tr><td colspan="2">②地方人士組「<span class="hl">二二八事件處理委員會</span>」，維持社會秩序、要求改革</td></tr>
<tr><td colspan="2">③中央政府出兵來臺鎮壓（國軍分由<span class="hb">基隆、高雄</span>登陸）、<span class="hl">清鄉</span>——軍警藉由<span class="hb">清查戶口、收繳武器</span>等方式掃蕩反政府分子</td></tr>
<tr><th>結果</th><td colspan="2">陳儀被<span class="hl">撤職</span>，成立<span class="hl">臺灣省政府</span>取代行政長官公署</td></tr>
<tr><th>影響</th><td colspan="2">對日後<span class="hl">政治、族群關係（省籍）</span>產生不良影響</td></tr>
<tr><th>後續</th><td colspan="2">政府對當年處置失當<span class="hb">公開道歉</span>、<span class="hb">賠償</span>、興建<span class="hb">紀念碑</span>、訂定 <span class="hl">228 和平紀念日</span>；設<span class="hb">人權紀念園區</span>、成立<span class="hb">促進轉型正義委員會</span></td></tr>
</table>`},
r2:{title:"戒嚴與動員戡亂的比較",html:`<table>
<tr><th style="width:14%">政策</th><th style="width:43%;color:var(--red)">戒嚴</th><th style="width:43%;color:var(--blue)">動員戡亂</th></tr>
<tr><th>施行時間</th><td><span class="hl">民國 38～76 年</span>（1949–1987）</td><td><span class="hl">民國 37～80 年</span>（1948–1991）</td></tr>
<tr><th>法令依據</th><td>《<span class="hl">戒嚴令</span>》</td><td>《<span class="hl">動員戡亂時期臨時條款</span>》</td></tr>
<tr><th>施行範圍</th><td><span class="hb">臺灣省</span></td><td><span class="hb">全國</span></td></tr>
<tr><th>發布者</th><td><span class="hb">臺灣省政府</span>（省主席：<span class="hb">陳誠</span>）</td><td><span class="hb">中華民國政府</span>（總統：蔣中正）</td></tr>
<tr><th>實施目的</th><td><span class="hl">防範共產勢力滲透</span></td><td>因應<span class="hl">國共內戰</span>，進入<span class="hl">戰爭準備</span></td></tr>
<tr><th>內容</th><td>限縮《<span class="hb">憲法</span>》賦予人民的<span class="hl">自由權</span>（言論、出版、集會、結社）；限制營業時間→<span class="hb">黨禁、報禁</span></td><td><span class="hl">擴大總統職權</span>→後屢經修訂使總統可<span class="hb">一再連任</span></td></tr>
<tr><th>結束</th><td><span class="hl">蔣經國</span>總統宣布解除戒嚴（民76/7/14 令，7/15 零時起）</td><td>民79 <span class="hb">三月學運</span>提出廢除訴求→<span class="hl">李登輝</span>總統順應民意</td></tr>
</table>`},
r3:{title:"政治民主化歷程",html:`<table>
<tr><th colspan="4" class="grp">戒嚴時期</th></tr>
<tr><th style="width:14%">地方自治</th><td colspan="3">民39 年起，政府為<span class="hl">爭取國際支持</span>有限度開放人民參政——實施地方自治，開放<span class="hb">省級以下</span>地方首長和民意代表<span class="hb">直接民選</span>；但<span class="hl">臺灣省主席、直轄市市長仍由官派</span>，未完全落實</td></tr>
<tr><th>反抗運動</th><th>時間</th><th>經過</th><th>結果</th></tr>
<tr><th><span class="hl">雷震事件</span></th><td>民49（1960）</td><td>①雷震等人在《<span class="hl">自由中國</span>》評論時政——批評<span class="hb">蔣中正威權統治</span>、反對其<span class="hb">連任三屆</span> ②籌組<span class="hl">中國民主黨</span>制衡執政黨</td><td>遭政府壓制，雷震以「<span class="hb">知匪不報</span>」入獄，<span class="hb">雜誌停刊</span>，組黨不成</td></tr>
<tr><th><span class="hl">美麗島事件</span></th><td>民68（1979）</td><td>背景＝民60年代<span class="hb">經濟起飛、教育水準提高</span>，人民追求政治改革；美麗島雜誌社以紀念<span class="hb">國際人權日</span>為由在<span class="hl">高雄</span>舉辦遊行、呼籲解嚴→引發<span class="hb">警民衝突</span></td><td>許多黨外人士被捕→其他黨外人士於民75 成立<span class="hl">民主進步黨</span>，<span class="hb">突破黨禁</span></td></tr>
<tr><th colspan="4" class="grp">解嚴後</th></tr>
<tr><th>蔣經國</th><td>民76（1987）</td><td colspan="2"><span class="hl">宣布解除戒嚴</span>，開放<span class="hb">黨禁、報禁</span>→人民的集會、結社等自由權<span class="hb">重獲《憲法》保障</span></td></tr>
<tr><th rowspan="3">李登輝</th><td>民79（1990）</td><td colspan="2">大學生發起<span class="hl">三月學運</span>（野百合學運），提出改革訴求</td></tr>
<tr><td>民80（1991）</td><td colspan="2">宣布<span class="hl">終止動員戡亂</span>、廢除《臨時條款》；推動修憲和<span class="hb">中央民意代表全面改選</span>→解決「<span class="hl">萬年國會</span>」的弊端</td></tr>
<tr><td>民83／85</td><td colspan="2">民83 開放<span class="hb">省長及直轄市市長直接民選</span>；民85 實施<span class="hl">第一次總統直選</span>，李登輝當選首任民選總統</td></tr>
<tr><th>陳水扁</th><td>民89（2000）</td><td colspan="2"><span class="hl">首次政黨輪替</span>（國民黨→民進黨）→政黨輪替成為常態</td></tr>
</table>`},
r4:{title:"戰後臺灣的外交發展（三階段）",html:`<table>
<tr><th style="width:10%">分期</th><th style="width:14%">時間</th><th style="width:46%">重要發展</th><th style="width:30%">外交策略</th></tr>
<tr><th style="color:var(--blue)">鞏固外交</th><td>民38～60</td><td>①民39 <span class="hl">韓戰爆發</span>，美派<span class="hb">第七艦隊</span>協防臺灣海峽，並提供「<span class="hl">美援</span>」②民43 簽訂《<span class="hl">中美共同防禦條約</span>》→臺灣納入<span class="hb">西太平洋反共防禦體系</span></td><td>爭取<span class="hb">友邦支持</span>、鞏固國際地位；謀求「確保臺灣，光復大陸」</td></tr>
<tr><th style="color:var(--green)">彈性外交</th><td>民60～77</td><td>①民60 中華人民共和國取得聯合國「<span class="hl">中國席位</span>」→我國宣布<span class="hl">退出聯合國</span>，邦交國銳減 ②民68 <span class="hl">美國與我國斷交</span>，廢止《中美共同防禦條約》，另訂《<span class="hl">臺灣關係法</span>》維持非官方往來</td><td>①<span class="hb">堅持</span>中華民國是中國唯一合法政府 ②致力與<span class="hb">無邦交國</span>發展經貿、文化交流</td></tr>
<tr><th style="color:var(--orange)">務實外交</th><td>民77～今</td><td>①民77 <span class="hb">李登輝</span>繼任總統，<span class="hl">不再堅持</span>中華民國是代表中國的唯一合法政府 ②積極參與國際社會、善盡國際義務，例：取得<span class="hb">多國免簽證資格</span></td><td>①強調兩岸是<span class="hl">分裂分治的對等政治實體</span> ②以<span class="hb">經濟和民主</span>突破中共外交封鎖</td></tr>
<tr><th colspan="4" style="text-align:left">美援：民40～54（1951–1965）經濟上近 <span class="hl">15 億美元</span>；軍事上提供軍用品、派<span class="hb">美軍顧問團</span>駐臺。邦交國（我／中共）：民40 <span class="hb">37／19</span>→民60 <span class="hb">55／65</span>（逆轉）→民112 <span class="hb">13／182</span>。</th></tr>
</table>`},
r5:{title:"臺海兩岸關係的演變（三階段）",html:`<table>
<tr><th style="width:10%">分期</th><th style="width:30%;color:var(--red)">武力對抗<br>民38～68</th><th style="width:30%;color:var(--blue)">政治對峙<br>民68～76</th><th style="width:30%;color:var(--green)">兩岸交流<br>民76～今</th></tr>
<tr><th>背景</th><td>國共內戰後，兩岸情勢不穩</td><td>民68 <span class="hl">中華人民共和國與美國建交</span>，對我國改採「<span class="hb">和平統戰</span>」</td><td>民76 臺灣<span class="hl">解嚴</span>，開放<span class="hl">赴中國大陸探親</span>→正式揭開兩岸交流序幕</td></tr>
<tr><th>中共策略</th><td><span class="hl">武力解放臺灣</span></td><td>「<span class="hl">一國兩制</span>」、「<span class="hl">三通四流</span>」（三通：通郵、通航、通商；四流：經濟、文化、科技、體育交流）</td><td>不放棄武力犯臺、堅持一個中國</td></tr>
<tr><th>我方策略</th><td><span class="hl">反攻大陸</span>、光復大陸</td><td>「<span class="hl">三民主義統一中國</span>」，堅持<span class="hl">三不政策</span>＝不接觸、不談判、不妥協</td><td>民80 成立<span class="hb">大陸委員會</span>，委託民間<span class="hl">海基會</span>處理交流事務（對岸窗口：<span class="hb">海協會</span>）</td></tr>
<tr><th>重大事件</th><td>民38 <span class="hl">古寧頭戰役</span>；民47 <span class="hl">八二三炮戰</span>（<span class="hb">均發生在金門</span>）→此後不再出現大規模軍事衝突</td><td>軍事衝突趨緩，<span class="hb">民間接觸已逐漸展開</span></td><td>民82 <span class="hl">辜汪會談</span>（海基會vs海協會，新加坡）；民90 <span class="hl">小三通</span>（金門、馬祖、澎湖）；民97 <span class="hl">大三通</span>；民104 馬習會談</td></tr>
<tr><th colspan="4" style="text-align:left"><span class="hb">金門、馬祖</span>：武力對抗時期是<span class="hl">軍事前線</span>，兩岸交流時期轉變為<span class="hl">小三通據點</span>。民80 終止動員戡亂＝<span class="hb">結束內戰狀態</span>。</th></tr>
</table>`},
r6:{title:"戰後經濟政策的轉變（六階段）",html:`<table>
<tr><th style="width:12%">時期</th><th style="width:14%">政策</th><th style="width:44%">內容</th><th style="width:30%">背景・成果</th></tr>
<tr><th>戰後初期</th><td><span class="hl">經濟重整</span></td><td>①幣制：民38 發行<span class="hl">新臺幣</span>（舊臺幣 <span class="hb">4 萬元換 1 元</span>）②<span class="hl">土地改革</span>：<span class="hb">三七五減租</span>（地租不得超過年收穫量 375‰）→<span class="hb">公地放領</span>（佃農優先承購公有耕地）→<span class="hb">耕者有其田</span>（徵收地主土地轉售實際耕作者）</td><td>二戰末工業設施遭美軍轟炸、戰後物價飛漲；成效＝佃農轉為<span class="hl">自耕農</span>，地主轉向工商業</td></tr>
<tr><th>民40年代</th><td><span class="hl">進口替代</span></td><td>保護國內輕工業、管制外國商品進口：利用<span class="hb">農業收益</span>購入工業設備與原料，扶植<span class="hb">紡織</span>等輕工業。例：<span class="hb">鳳梨罐頭</span>大量出口、以農產外銷所得購買紡織機、利用<span class="hb">美援的棉花</span>扶植紡織業</td><td>主張「<span class="hl">以農業培養工業</span>」</td></tr>
<tr><th>民50年代</th><td><span class="hl">出口導向</span></td><td>成立<span class="hl">加工出口區</span>（<span class="hb">高雄、臺中</span>）吸引企業投資設廠，外銷<span class="hb">食品、成衣、家電</span></td><td>優勢＝<span class="hl">勞力充足且低廉</span>；影響＝經濟型態由農業轉為<span class="hl">以工業為主</span></td></tr>
<tr><th>民60年代</th><td><span class="hl">十大建設</span></td><td>主導＝行政院長<span class="hl">蔣經國</span>；<span class="hb">六項交通建設＋三項重工業＋一項能源建設</span>，偏重交通，重工業集中<span class="hb">高雄</span></td><td>背景＝<span class="hl">西亞產油國爆發戰爭</span>→國際能源危機；成果＝外貿成長，成為「<span class="hl">亞洲四小龍</span>」</td></tr>
<tr><th>民70年代</th><td><span class="hl">產業升級</span></td><td>①全力發展<span class="hb">技術與資本密集、高附加價值</span>的高科技產業 ②民69 成立<span class="hl">新竹科學工業園區</span></td><td>背景＝工資上漲、國際競爭增加、<span class="hb">環保意識抬頭</span></td></tr>
<tr><th>民80年代起</th><td><span class="hl">自由化與國際化</span></td><td>放寬貿易限制、積極參與國際市場：<span class="hl">民80 加入 APEC</span>、<span class="hl">民91 加入 WTO</span></td><td>今日課題＝成本提高、薪資上漲、勞力不足→僱用<span class="hb">國際移工</span>、產業外移；推動「<span class="hb">南向</span>」分散對中國投資風險</td></tr>
</table>`},
r7:{title:"戰後文化演變（四期）",html:`<table>
<tr><th style="width:14%">時期</th><th style="width:14%">主流</th><th style="width:36%">背景</th><th style="width:36%">表現・影響</th></tr>
<tr><th>戰後初期</th><td><span class="hl">中華文化</span></td><td>①清除<span class="hb">日本統治</span>的影響 ②培養<span class="hb">國家認同</span></td><td>推行<span class="hl">國語運動</span>、禁止在公開場合說方言→本土語言、文學、音樂受到限制</td></tr>
<tr><th>民40、50年代</th><td><span class="hl">反共文化<br>＋美國文化</span></td><td>①政府以<span class="hb">反共復國</span>為國策 ②<span class="hl">韓戰</span>爆發後<span class="hb">美援</span>來臺</td><td>①反共文學、反共電影、反共標語（「<span class="hb">反攻大陸</span>」「<span class="hb">消滅朱毛</span>」）②美國流行文化傳入，如<span class="hl">搖滾樂、ICRT、好萊塢</span></td></tr>
<tr><th>民60年代</th><td><span class="hl">鄉土文化</span></td><td>①<span class="hb">退出聯合國</span>後外交陷入困境 ②經濟快速發展造成<span class="hb">城鄉差距擴大</span></td><td>作家轉而關懷在地人民生活，帶動<span class="hl">鄉土文學</span>風潮，例<span class="hl">黃春明《兒子的大玩偶》</span>（寫實描繪農民、勞工等小人物）；另有<span class="hb">愛國電影</span>與<span class="hb">民歌運動</span></td></tr>
<tr><th>民70年代後</th><td><span class="hl">多元文化</span></td><td>①政治、社會逐漸開放 ②科技網路發達、<span class="hb">全球化</span>形成 ③<span class="hb">新住民與國際移工</span>持續增加</td><td>融合<span class="hl">本土、原住民、外來文化</span>，朝多元發展；<span class="hb">多元化與族群平等</span>成為主流價值</td></tr>
</table>`},
r8:{title:"戰後原住民政策與正名運動",html:`<table>
<tr><th colspan="3" class="grp">戒嚴時期：對山地原住民的治理</th></tr>
<tr><th style="width:14%">名稱</th><td colspan="2">戰後初期政府統稱原住民為「<span class="hl">山地同胞</span>」（山胞）</td></tr>
<tr><th>項目</th><th style="width:43%">相關措施</th><th style="width:43%">影響</th></tr>
<tr><th>行政</th><td>要求<span class="hl">改漢人姓名</span>，以漢名<span class="hb">登記戶籍</span></td><td>破壞原住民<span class="hb">固有命名方式</span></td></tr>
<tr><th>社會</th><td>推行<span class="hl">國語運動</span>，要求說國語</td><td>造成各族群<span class="hb">語言逐漸流失</span></td></tr>
<tr><th>土地</th><td>設立<span class="hb">國家公園、山林保護區</span>；劃設<span class="hb">山地保留地</span>後開放民間與企業開發</td><td><span class="hl">土地大量流失</span></td></tr>

<tr><th>背景</th><td colspan="2">①文化——語言、姓名與文化漸流失 ②經濟——離開部落到城市從事<span class="hb">重勞力</span>工作，衍生適應問題 ③社運——臺灣民主化，原住民<span class="hb">知識青年</span>投入運動</td></tr>
<tr><th>目標</th><td colspan="2">爭取「<span class="hl">正名</span>」與「<span class="hl">自治</span>」</td></tr>
<tr><th>活動</th><td colspan="2">①<span class="hl">原住民正名運動</span>（要求修改山胞用語、恢復族名）②<span class="hb">拆除吳鳳銅像</span> ③<span class="hl">還我土地運動</span> ④平埔族要求恢復原住民身分</td></tr>
<tr><th>成果</th><td colspan="2">正名：民83（1994）<span class="hl">修憲以「原住民」取代「山胞」</span>、民85 成立<span class="hb">原住民族委員會</span>（民91 改稱原住民族委員會）；自治：《原住民族教育法》、<span class="hb">《原住民族基本法》</span>（民94）</td></tr>
</table>`},

<tr><th colspan="4" class="grp">三、四個面向一句話</th></tr>
<tr><th>政治</th><td colspan="3">接收失當→<span class="hb">二二八</span>→戒嚴＋動員戡亂（白色恐怖）→黨外運動（雷震、美麗島）→<span class="hb">解嚴</span>→終止動員戡亂→總統直選→政黨輪替</td></tr>
<tr><th>外交兩岸</th><td colspan="3">靠<span class="hb">韓戰美援</span>站穩→<span class="hb">退出聯合國</span>與<span class="hb">臺美斷交</span>接連挫折→解嚴後<span class="hb">兩岸交流</span>與<span class="hb">務實外交</span></td></tr>
<tr><th>經濟</th><td colspan="3">經濟重整→進口替代→出口導向→十大建設→產業升級→自由化國際化（<span class="hb">農業→輕工業→重工業→高科技</span>）</td></tr>
<tr><th>社會文化</th><td colspan="3">農業社會→<span class="hb">都市化</span>；中華文化→美國文化→<span class="hb">鄉土文學</span>→多元文化；解嚴後社會運動蓬勃</td></tr>
<tr><th colspan="4" class="grp">四、「第一」與「之最」</th></tr>
<tr><th>送分題</th><td colspan="3">第一個合法政黨（日治）＝臺灣民眾黨｜戒嚴時期籌組未成的政黨＝<span class="hl">中國民主黨</span>（雷震）｜突破黨禁＝<span class="hl">民進黨</span>｜首次政黨輪替＝<span class="hl">民89</span>｜首任民選總統＝<span class="hl">李登輝</span>（民85）｜宣布解嚴＝<span class="hl">蔣經國</span>｜終止動員戡亂＝<span class="hl">李登輝</span>｜古寧頭與八二三都在<span class="hl">金門</span></td></tr>
</table>`},
t14:{title:"清帝國對臺灣實施的相關禁令",html:`<table>
<tr><th>政策</th><th>海禁政策</th><th style="color:var(--blue)">渡臺禁令</th><th style="color:var(--orange)">劃界封山</th></tr>
<tr><th>目的</th><td>打擊<span class="hb">鄭氏政權</span></td><td>限制移民，方便統治（防臺灣再成<span class="hb">反清基地</span>）</td><td>避免<span class="hb">漢原衝突</span></td></tr>
<tr><th>實施時間</th><td>清初～<span class="hb">1684年</span></td><td><span class="hb">1684～1875年</span></td><td><span class="hb">1722～1875年</span></td></tr>
<tr><th>內容</th><td>禁止中國沿海人民出海</td><td>男子須先申請<span class="hl">證照</span>，<span class="hl">不得攜眷</span></td><td>劃定<span class="hl">番界</span>（土牛、立碑），隔離漢人與原住民</td></tr>
<tr><th>影響</th><td><span class="hl">走私貿易</span>興起</td><td><span class="hl">偷渡</span>興盛、<span class="hl">性別比例失衡</span>（羅漢腳）</td><td><span class="hl">侵墾</span>興盛，番界往山區移動</td></tr>
<tr><th>廢止</th><td>納臺灣為版圖後</td><td colspan="2" style="text-align:center"><span class="hb">沈葆楨</span>來臺後奏請放寬或廢止</td></tr>
</table>`},
t15:{title:"清代臺灣四大水圳",html:`<table>
<tr><th>名稱</th><th>興建者</th><th>時間</th><th>水源</th><th>灌溉區域</th><th>特色</th></tr>
<tr><th><span class="hl">八堡圳</span></th><td><span class="hb">施世榜</span></td><td><span class="hb">1709 興築</span><br>1719 完工（<span class="hb">康熙</span>）</td><td><span class="hl">濁水溪</span></td><td><span class="hb">彰化平原</span></td><td>清代灌溉規模<span class="hl">最大</span>的水圳</td></tr>
<tr><th><span class="hl">貓霧捒圳</span></th><td><span class="hb">張達京</span></td><td><span class="hb">1733</span><br>（<span class="hb">雍正</span>年間）</td><td><span class="hl">大甲溪</span></td><td><span class="hb">臺中盆地</span></td><td>漢人與<span class="hl">原住民合作</span>修築</td></tr>
<tr><th><span class="hl">瑠公圳</span></th><td><span class="hb">郭錫瑠</span>父子</td><td><span class="hb">1740</span><br>（<span class="hb">乾隆</span>年間）</td><td><span class="hl">新店溪</span></td><td><span class="hb">臺北盆地</span></td><td>臺北地區<span class="hl">最重要</span>的灌溉渠道</td></tr>
<tr><th><span class="hl">曹公圳</span></th><td>鳳山知縣<span class="hb">曹謹</span></td><td><span class="hb">1837</span><br>（<span class="hb">道光</span>年間）</td><td><span class="hl">高屏溪</span></td><td><span class="hb">高雄地區</span></td><td><span class="hl">官方主導</span>興建的水圳</td></tr>
<tr><th colspan="6" style="text-align:left"><b>時間序</b>：八堡（康熙1709）→貓霧捒（雍正1733）→瑠公（乾隆1740）→曹公（道光1837）　│　<b>人名記法</b>：<span class="hb">郭錫瑠</span>→<span class="hl">瑠</span>公圳、<span class="hb">曹謹</span>→<span class="hl">曹</span>公圳（以人名命名）　│　<b>之最</b>：規模最大＝八堡圳、唯一官方主導＝曹公圳、原漢合作＝貓霧捒圳</th></tr>
</table>`},
tExp:{title:"大航海時代至清代的出口貿易（跨章總表）",html:`<table>
<tr><th>時期</th><th>出口商品</th><th>貿易型態</th><th>主要對象</th></tr>
<tr><th style="color:var(--orange)">荷蘭時代</th><td><span class="hl">稻米、蔗糖、鹿皮</span></td><td>轉口貿易</td><td>中國、日本、東南亞、歐洲</td></tr>
<tr><th style="color:var(--orange)">鄭氏政權</th><td><span class="hl">蔗糖、鹿皮</span></td><td>對外貿易（走私、突破封鎖）</td><td>日本、東南亞、英國</td></tr>
<tr><th style="color:var(--blue)">清代開港前</th><td><span class="hl">稻米、蔗糖</span></td><td><span class="hb">兩岸對渡貿易</span>（郊商）</td><td>中國大陸為主</td></tr>
<tr><th style="color:var(--blue)">清代開港後</th><td><span class="hl">茶、糖、樟腦</span></td><td><span class="hb">國際貿易</span>（洋行）</td><td>美國、東南亞、日本、歐美</td></tr>
<tr><th colspan="4" style="text-align:left">記法：<span class="hb">鹿皮</span>在鄭氏之後消失（鹿群枯竭）、<span class="hb">稻米</span>在開港後被茶與樟腦取代，只有「<span class="hl">糖</span>」四個時期都在。</th></tr>
</table>`},
tOC:{title:"清帝國治臺 開港通商前 vs 開港通商後（三大領域）",html:`<table>
<tr><th style="width:12%">領域／項目</th><th style="width:44%;color:var(--blue)">◀ 開港通商前（1684–1860）</th><th style="width:44%;color:var(--orange)">開港通商後（1860–1895）▶</th></tr>
<tr><th colspan="3" class="grp">一、清帝國的治臺政策</th></tr>
<tr><th>治臺方針</th><td>「<span class="hl">為防臺而治臺</span>」——<span class="hb">渡臺禁令</span>（對漢人）＋<span class="hb">劃界封山</span>（對原住民）</td><td><span class="hl">外力入侵→轉趨積極</span>——<span class="hb">牡丹社事件</span>→沈葆楨來臺；<span class="hb">清法戰爭</span>→劉銘傳來臺、<span class="hl">臺灣建省</span></td></tr>
<tr><th>行政區劃</th><td>隸<span class="hb">福建省</span>：1府3縣（康熙）→1府4縣2廳（雍乾）→1府4縣3廳（嘉慶）＝<span class="hb">民變</span>驅動</td><td>1875 <span class="hb">2府8縣4廳</span>（增臺北府）→1885 建省→1887 <span class="hb">3府1州11縣3廳</span>＝<span class="hb">國防</span>驅動</td></tr>
<tr><th>加強建設</th><td>經費不足、幾無建設</td><td>政治→調整行政區劃、<span class="hl">廢除禁令</span>；軍事→<span class="hb">西式炮臺</span>；交通→<span class="hb">電報線、郵政、鐵路</span>；教育→西學堂；原住民→<span class="hl">開山撫番</span></td></tr>
<tr><th colspan="3" class="grp">二、農商發展與對外貿易</th></tr>
<tr><th>農業發展</th><td>多<span class="hl">民間合資拓墾</span>（墾號如金廣福）、興築<span class="hb">瑠公圳</span>等水圳，米糖產量提高</td><td>茶與樟腦成為新興產業，<span class="hl">原始山林被茶、樟腦園取代</span></td></tr>
<tr><th>貿易型態</th><td><span class="hl">對渡貿易</span>——限定對渡港口，兩岸形成<span class="hl">區域分工</span>（對象：<span class="hb">中國大陸</span>）</td><td><span class="hl">國際貿易</span>——<span class="hl">重返國際貿易體系</span>（英法聯軍之役後開港通商）</td></tr>
<tr><th>港口市鎮</th><td><span class="hb">鹿耳門</span>為唯一合法正港→鹿港、八里坌；「<span class="hl">一府二鹿三艋舺</span>」</td><td>四口岸：<span class="hb">雞籠、淡水、安平、打狗</span></td></tr>
<tr><th>商業組織</th><td><span class="hl">行郊</span>組織（郊商）：泉郊廈郊／米郊糖郊布郊</td><td>設立<span class="hl">洋行</span>＋僱漢人<span class="hb">買辦</span>（例：李春生）</td></tr>
<tr><th>出口商品</th><td>出口：<span class="hb">稻米、蔗糖</span><br>進口：紡織品、藥材、日用品</td><td>出口：蔗糖、<span class="hl">茶、樟腦</span><br>進口：<span class="hb">鴉片</span>、紡織品<br>1878 起<span class="hl">出超</span></td></tr>
<tr><th>經濟重心</th><td>南部（臺灣府城）</td><td><span class="hl">經濟重心北移</span>——茶、樟腦帶動中北部近山市鎮興起（例：<span class="hb">大稻埕、大溪</span>）</td></tr>
<tr><th colspan="3" class="grp">三、社會文化變遷</th></tr>
<tr><th>社會衝突</th><td><span class="hl">械鬥</span>（移民爭利益，依祖籍別）、抗官<span class="hl">民變</span>（三年一小反、五年一大亂）</td><td>移墾社會轉為<span class="hb">定居社會</span>，衝突趨緩；豪族與客家因茶、樟腦致富，<span class="hb">社會階層變動</span></td></tr>
<tr><th>文化發展</th><td>原鄉信仰（<span class="hb">祖籍別</span>）→<span class="hl">共同信仰</span>；<span class="hb">唐山祖</span>（集資）→<span class="hb">開臺祖</span>（有血緣）；文風漸興</td><td><span class="hl">西方文化再傳入</span>——傳教士以<span class="hb">醫療和教育</span>傳教（例：<span class="hb">馬偕</span>北部、<span class="hb">馬雅各</span>南部）</td></tr>
<tr><th>原住民</th><td>平埔：土地流失→<span class="hl">生活方式改變</span>；漢人侵墾→展開<span class="hl">4次大遷移</span>。高山：劃界封山，衝突不大</td><td><span class="hl">開山撫番</span>→原漢關係更趨緊張、<span class="hb">山區原住民被迫遷徙</span>；劉銘傳「撫番」變「<span class="hl">剿番</span>」</td></tr>
<tr><th colspan="3" style="text-align:left">分界＝<span class="hb">英法聯軍之役</span>(1857)→<span class="hb">天津條約</span>(1858)→1860年代<span class="hl">正式開港通商</span>。一句話：開港前「<span class="hb">向內、向中國、消極防臺</span>」，開港後「<span class="hl">向外、向世界、積極治臺</span>」。</th></tr>
</table>`},
tAgr:{title:"開港通商前的農商業",html:`<table>
<tr><th colspan="3" class="grp">農業發展</th></tr>
<tr><th style="width:14%">背景</th><td colspan="2">中國東南沿海<span class="hl">人口增加、謀生不易</span>，漢人渡海來臺開墾</td></tr>
<tr><th>土地來源</th><td colspan="2">①向<span class="hb">原住民承租</span> ②向官府申請<span class="hl">墾照</span>開發荒地——取得墾照者＝「<span class="hl">墾戶</span>」；合資經營的開墾組織＝「<span class="hl">墾號</span>」（例：<span class="hb">金廣福</span>）</td></tr>
<tr><th>經費</th><td colspan="2">需要大量資金 ➡ 多<span class="hl">民間合資</span>開墾</td></tr>
<tr><th>作物</th><td colspan="2"><span class="hb">水稻、甘蔗</span></td></tr>
<tr><th>水利設施</th><td colspan="2">墾戶常合資興建水圳（四大水圳）；<span class="hl">拓墾方向由南向北，水圳集中在西部</span></td></tr>
<tr><th>成果</th><td colspan="2">擴大拓墾範圍，提高稻米、蔗糖產量，<span class="hb">足以外銷中國大陸</span></td></tr>
<tr><th colspan="3" class="grp">商業活動</th></tr>
<tr><th>對渡貿易</th><td style="width:43%">對象＝<span class="hl">中國大陸</span>為主</td><td style="width:43%">輸出＝<span class="hl">稻米、蔗糖</span>；輸入＝紡織品、藥材、日用品</td></tr>
<tr><th>對渡港口</th><td colspan="2">①17世紀末僅開放唯一「<span class="hl">正港</span>」<span class="hb">鹿耳門</span>（1684）②18世紀起隨中、北部開發陸續開放<span class="hb">鹿港（1784）、八里坌（1788）</span>　對岸＝福州五虎門、泉州蚶江、廈門、漳州</td></tr>
<tr><th>影響</th><td colspan="2">帶動港口與鄰近市鎮興起 ➡ 形成「<span class="hl">一府二鹿三艋舺</span>」三大港市（反映由南向北的開發方向）；19世紀初新莊河港<span class="hb">淤塞</span>，地位被<span class="hb">艋舺</span>取代</td></tr>
<tr><th>商業組織</th><td colspan="2">「<span class="hl">郊</span>」（行郊）——功能＝配運貨物、維護商業利益、避免同業惡性競爭（<span class="hb">類似今日的同業公會</span>），並參與地方公共事務（例：<span class="hb">修廟</span>）；依<b>貿易地區</b>分泉郊、廈郊，依<b>貿易商品</b>分米郊、糖郊、布郊。三大港市各有其郊：<span class="hb">府城三郊、鹿港八郊、艋舺三郊</span></td></tr>
<tr><th colspan="3" style="text-align:left">地名線索：<span class="hl">營、鎮</span>＝鄭氏軍屯｜<span class="hl">股、份</span>＝清代合資開墾｜<span class="hl">圳、埤</span>＝水利設施｜<span class="hl">厝、屋</span>＝聚落｜<span class="hl">潮州、泉州</span>＝原鄉地名</th></tr>
</table>`},
t16:{title:"開港後三大出口商品",html:`<table>
<tr><th>順位</th><th style="color:var(--green)">茶葉（第一）</th><th style="color:var(--orange)">蔗糖（第二）</th><th style="color:var(--red)">樟腦（第三）</th></tr>
<tr><th>產地</th><td>臺灣<span class="hl">北部</span></td><td>臺灣<span class="hl">南部</span></td><td>臺灣<span class="hl">中、北部</span></td></tr>
<tr><th>出口港</th><td><span class="hb">淡水</span></td><td><span class="hb">安平、打狗</span></td><td><span class="hb">淡水</span></td></tr>
<tr><th>外銷區域</th><td>美國、東南亞</td><td>中國、日本</td><td><span class="hb">歐美各國</span></td></tr>
<tr><th>特色</th><td>當時臺灣<span class="hl">最大輸出商品</span>；風靡歐美，出口大幅成長</td><td><span class="hb">歷史最悠久</span>的外銷商品（自荷治時期起就是各時期的重要外銷品），出口穩定；傳統製糖場所＝<span class="hb">糖廍</span></td><td>產量曾居<span class="hl">世界第一</span></td></tr>
<tr><th>新興市鎮</th><td><span class="hl">大稻埕</span>（加工集散地）</td><td>—</td><td><span class="hl">大溪</span>（樟腦產地）、三峽、關西、東勢、集集</td></tr>
</table>`},
t17:{title:"清帝國時期原住民與漢人的互動",html:`<table>
<tr><th>族群</th><th>清帝國統治政策</th><th>漢原通婚</th><th>族群衝突</th><th>傳統文化</th></tr>
<tr><th style="color:var(--blue)">平埔族群</th><td>須<span class="hb">納稅、服勞役</span>，推行<span class="hl">漢化政策</span>便於統治</td><td><span class="hl">多</span></td><td>官府欺壓、土地流失➡<span class="hb">大甲西社事件</span></td><td>傳統<span class="hb">式微</span>，逐漸融入漢人社會</td></tr>
<tr><th style="color:var(--green)">高山各族</th><td><span class="hb">劃界封山</span>➡<span class="hb">開山撫番</span></td><td><span class="hl">少</span></td><td><span class="hl">開山撫番</span>➡侵入傳統生活領域</td><td>傳統文化<span class="hb">面臨挑戰</span></td></tr>
</table>`},
tRes:{title:"臺灣歷代抗爭事件總覽（分類版・跨全冊）",html:`<table>
<tr><th style="width:16%">事件</th><th style="width:9%">年代</th><th style="width:9%">對象政權</th><th style="width:17%">起事者</th><th style="width:24%">原因</th><th style="width:25%">結果／意義</th></tr>
<tr><th colspan="6" class="grp">❶ 原住民反抗——荷・西・鄭・清・日各一件（好記）</th></tr>
<tr><th>麻豆社之役</th><td>1635</td><td style="color:var(--orange)">荷蘭</td><td><span class="hl">西拉雅族</span>麻豆社</td><td>不服荷蘭統治</td><td>敗；荷聯合<span class="hb">新港社</span>攻打→簽約受統治</td></tr>
<tr><th>雞籠、淡水原住民反抗</th><td>1626–1642</td><td style="color:var(--red)">西班牙</td><td>北部原住民</td><td>築城、<span class="hb">徵稅</span></td><td>雞籠、淡水原住民均曾反抗</td></tr>
<tr><th>大肚王反抗</th><td>17世紀中期</td><td style="color:var(--green)">鄭氏</td><td><span class="hl">大肚王</span>（中部平埔族群）</td><td>漢人侵墾、<span class="hb">勞役沉重</span></td><td>遭鄭軍鎮壓，<span class="hb">勢力衰亡</span></td></tr>
<tr><th>大甲西社事件</th><td>1731</td><td style="color:var(--blue)">清</td><td>平埔族群（大甲西社）</td><td><span class="hl">勞役過重</span></td><td><span class="hl">清代規模最大的平埔抗官</span></td></tr>
<tr><th>霧社事件</th><td>1930</td><td style="color:var(--red)">日本</td><td><span class="hl">賽德克族</span>（莫那魯道）</td><td><span class="hb">高壓理蕃</span>、勞役壓迫</td><td>敗；總督府<span class="hb">檢討理蕃政策</span></td></tr>
<tr><th colspan="6" class="grp">❷ 漢人武裝反抗——終點＝1915 西來庵</th></tr>
<tr><th>郭懷一事件</th><td>1652</td><td style="color:var(--orange)">荷蘭</td><td>漢人</td><td><span class="hl">苛捐雜稅</span>、管制過嚴</td><td>敗；漢人死傷三千多名</td></tr>
<tr><th>朱一貴事件</th><td>1721</td><td style="color:var(--blue)">清</td><td>漢人（民變①）</td><td rowspan="3"><span class="hl">官逼民反</span>——吏治不良、祕密結盟盛行<br>（口訣：<span class="hb">朱→林→戴</span>）</td><td>敗→增<span class="hb">彰化縣、淡水廳</span></td></tr>
<tr><th>林爽文事件</th><td>1786</td><td style="color:var(--blue)">清</td><td>漢人（民變②）</td><td><span class="hl">規模最大</span>；諸羅改名嘉義</td></tr>
<tr><th>戴潮春事件</th><td>1862</td><td style="color:var(--blue)">清</td><td>漢人（民變③）</td><td><span class="hl">歷時最久</span></td></tr>
<tr><th>乙未抗日・臺灣民主國</th><td>1895</td><td style="color:var(--red)">日本</td><td>官紳民（唐景崧）</td><td><span class="hb">抗拒接收</span>（非追求獨立）</td><td>敗→進入武裝抗日期</td></tr>
<tr><th>西來庵事件</th><td>1915</td><td style="color:var(--red)">日本</td><td>漢人（余清芳）</td><td>反總督府<span class="hb">專制統治</span></td><td><span class="hl">漢人最後一次大規模武裝抗日</span>→轉向政治社會運動</td></tr>
<tr><th colspan="6" class="grp">❸ 非武裝／政治社會抗爭——1921 起</th></tr>
<tr><th>議會請願・文化協會</th><td>1921起</td><td style="color:var(--red)">日本</td><td>士紳知識分子（<span class="hb">林獻堂、蔣渭水</span>）</td><td><span class="hb">民族自決</span>思潮</td><td><span class="hl">非武裝抗日的起點</span></td></tr>
<tr><th>二林事件</th><td>1925</td><td style="color:var(--red)">日本</td><td>蔗農</td><td>製糖會社剝削</td><td><span class="hl">全島性農民運動的開端</span></td></tr>
<tr><th>二二八事件</th><td>1947</td><td style="color:var(--red)">民國</td><td>民眾</td><td>貪腐、<span class="hb">通貨膨脹</span>、<span class="hb">查緝私菸</span>處理不當</td><td>派軍鎮壓；影響政治發展與族群關係</td></tr>
<tr><th>雷震事件</th><td>1960</td><td style="color:var(--red)">民國</td><td>知識分子（雷震）</td><td>《<span class="hb">自由中國</span>》籌組<span class="hb">中國民主黨</span></td><td>遭逮捕；戒嚴下言論受壓制</td></tr>
<tr><th>美麗島事件</th><td>1979</td><td style="color:var(--red)">民國</td><td>黨外人士</td><td>爭取<span class="hb">民主</span>（國際人權日集會）</td><td>審判反成民主運動催化</td></tr>
<tr><th>解嚴後社會運動</th><td>1987後</td><td style="color:var(--green)">民國</td><td>各群體</td><td>環保（反六輕、反核四）、<span class="hb">還我客家話</span>、<span class="hb">原住民正名</span>等</td><td>解嚴後蓬勃、社會多元開放</td></tr>

tOcc:{title:"歷代政權取得臺灣比較（跨全冊）",html:`<table>
<tr><th style="width:10%">政權</th><th style="width:11%">取得時間</th><th style="width:26%">取得方式</th><th style="width:12%">從誰手中取得</th><th style="width:23%">目的／背景</th><th style="width:18%">結束（在臺年數）</th></tr>
<tr><th style="color:var(--orange)">荷蘭</th><td>1624</td><td>兩占澎湖被明軍圍攻→<span class="hl">轉占臺灣南部（大員）</span></td><td>原住民各社（<span class="hb">首度占臺的歐洲勢力</span>）</td><td>東亞<span class="hl">貿易轉運站</span></td><td>1662 被鄭成功驅離（<span class="hb">38年</span>）</td></tr>
<tr><th style="color:var(--red)">西班牙</th><td>1626</td><td>進占<span class="hl">北臺</span>雞籠、淡水</td><td>北部原住民</td><td>確保<span class="hb">馬尼拉</span>航運安全、對抗荷蘭</td><td>1642 被荷蘭驅逐（<span class="hb">16年</span>）</td></tr>
<tr><th style="color:var(--green)">鄭氏</th><td>1661–1662</td><td><span class="hl">鹿耳門登陸</span>、圍攻熱蘭遮城→揆一開城投降</td><td><span class="hb">荷蘭</span></td><td><span class="hl">反清復明</span>基地、取得糧食裝備</td><td>1683 施琅攻臺、鄭克塽降清（<span class="hb">約20年</span>）</td></tr>
<tr><th style="color:var(--blue)">清帝國</th><td>1683／1684</td><td><span class="hl">施琅攻臺</span>→棄留論→納入版圖（隸<span class="hb">福建省</span>）</td><td><span class="hb">鄭氏</span></td><td>消滅反清勢力；施琅以<span class="hl">戰略考量</span>建議留臺</td><td>1895 馬關條約割日（<span class="hb">212年</span>）</td></tr>
<tr><th style="color:var(--red)">日本</th><td>1895</td><td>甲午戰勝→<span class="hl">馬關條約割讓</span>（乙未抗日後接收）</td><td><span class="hb">清帝國</span></td><td>殖民地（<span class="hb">農業臺灣・工業日本</span>）</td><td>1945 二戰戰敗（<span class="hb">50年</span>）</td></tr>
<tr><th style="color:var(--green)">中華民國</th><td>1945</td><td>日本戰敗→<span class="hl">接收</span>臺灣</td><td><span class="hb">日本</span></td><td>戰後接收</td><td>—</td></tr>
<tr><th colspan="6" style="text-align:left">規律：取得方式演變 <span class="hl">武力占領</span>（荷、西）→<span class="hl">武力驅逐</span>（鄭、清）→<span class="hl">條約割讓</span>（日）→<span class="hl">戰後接收</span>（民國）；<span class="hb">每個政權的結束＝下一個的開始</span>。</th></tr>
</table>`},

t19:{title:"清帝國時期外力入侵對臺灣的影響",html:`<table>
<tr><th>事件</th><th>英法聯軍</th><th>牡丹社事件</th><th>清法戰爭</th><th>甲午戰爭</th></tr>
<tr><th>時間</th><td>1857（1858 訂約）</td><td><span class="hb">1874</span></td><td><span class="hb">1884</span></td><td><span class="hb">1894</span></td></tr>
<tr><th>背景</th><td>通商、外交限制</td><td><span class="hl">琉球</span>漁民船難</td><td><span class="hl">越南</span>問題</td><td><span class="hl">朝鮮</span>問題</td></tr>
<tr><th>敵方</th><td>英國、法國</td><td>日本</td><td>法國</td><td>日本</td></tr>
<tr><th>起因</th><td>通商與外交要求</td><td>1871 琉球漁民船難漂至<span class="hb">恆春半島</span>（八瑤灣），遭原住民殺害；日本<span class="hl">明治維新</span>後向外擴張。伏筆＝1867 <span class="hl">羅妹號事件</span>，官員以「生番地不歸管轄」消極處理→日本據以主張「<span class="hl">番地無主</span>」</td><td>法軍進攻清帝國的<span class="hl">藩屬</span>越南</td><td><span class="hl">朝鮮</span>的宗主權之爭</td></tr>
<tr><th>結果</th><td>1858 簽<span class="hb">天津條約</span>→開港通商</td><td>清日議和，清廷承認出兵為「<span class="hl">保民義舉</span>」→<span class="hb">1879 日本併吞琉球</span></td><td><span class="hb">法國併吞越南</span></td><td>1895《<span class="hl">馬關條約</span>》割臺</td></tr>
<tr><th>戰場</th><td>中國大陸</td><td><span class="hb">恆春半島</span>（社寮港登陸→車城、楓港）</td><td><span class="hb">基隆、淡水、澎湖</span></td><td>朝鮮半島、黃海</td></tr>
<tr><th>影響</th><td>臺灣<span class="hl">開港通商</span>，開展國際貿易</td><td>清廷體認<span class="hb">臺灣海防</span>重要→<span class="hl">沈葆楨</span>來臺強化防務、積極建設</td><td>清廷提高臺灣<span class="hb">行政層級</span>→<span class="hl">劉銘傳</span>加強北部防禦、<span class="hl">臺灣建省</span></td><td>簽訂《馬關條約》，<span class="hl">割讓臺灣、澎湖</span></td></tr>
</table>`}
