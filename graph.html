<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>臺灣史記憶關係圖</title>
<style>
:root{
  --canvas:#ffffff; --panel:#f5f5f7; --card:#ffffff;
  --ink:#1d1d1f; --muted:#7a7a7a; --hairline:#e0e0e0;
  --theme:#af52de; --pt:#8e8e93;
  --blue:#0066cc; --red:#ff3b30; --green:#34c759; --orange:#ff9f0a;
  --edge:#c9c9ce; --edge-hl:#1d1d1f;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --canvas:#161617; --panel:#1d1d1f; --card:#242426;
    --ink:#f5f5f7; --muted:#98989d; --hairline:#3a3a3c;
    --theme:#bf5af2; --pt:#98989d;
    --blue:#2997ff; --red:#ff453a; --green:#30d158; --orange:#ffd60a;
    --edge:#48484a; --edge-hl:#f5f5f7;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"SF Pro Text",system-ui,-apple-system,"Microsoft JhengHei",sans-serif;
  background:var(--canvas); color:var(--ink); overflow:hidden;
}
header{
  position:fixed; top:0; left:0; right:0; z-index:10;
  padding:14px 24px 12px;
  background:color-mix(in srgb, var(--panel) 82%, transparent);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--hairline);
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
}
h1{
  font-family:"SF Pro Display",system-ui,-apple-system,"Microsoft JhengHei",sans-serif;
  font-size:19px; font-weight:600; letter-spacing:-0.3px; white-space:nowrap;
}
h1 small{font-size:13px; font-weight:400; color:var(--muted); margin-left:10px; letter-spacing:0}
.chips{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.chip{
  font-size:13px; padding:5px 14px; border-radius:9999px; cursor:pointer;
  border:1px solid var(--hairline); background:var(--card); color:var(--ink);
  display:flex; align-items:center; gap:7px; user-select:none;
  transition:opacity .15s, transform .06s;
}
.chip:active{transform:scale(.95)}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip.off{opacity:.35}
.chip.ch{font-weight:600; border-width:1.5px}
.chip.vol{
  font-weight:700; letter-spacing:.2px; padding:5px 13px;
  border:1.5px solid var(--ink); background:transparent; color:var(--ink);
  flex-direction:column; align-items:flex-start; gap:0; line-height:1.25;
}
.chip.vol small{font-size:10px; font-weight:500; color:var(--muted); letter-spacing:0}
.chip.vol.solo{background:var(--ink); color:var(--card)}
.chip.vol.solo small{color:var(--card); opacity:.72}
.vsep{width:1px; height:26px; background:var(--hairline); margin:0 3px}
.sep{width:1px; height:20px; background:var(--hairline)}
.legend{display:flex; gap:12px; margin-left:auto; font-size:12px; color:var(--muted); flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px;white-space:nowrap}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
canvas#graph{position:fixed; inset:0; cursor:grab}
canvas#graph.dragging{cursor:grabbing}
#tip{
  position:fixed; z-index:20; pointer-events:none; display:none;
  background:var(--card); border:1px solid var(--hairline); border-radius:11px;
  padding:8px 12px; font-size:13px; line-height:1.45; max-width:280px;
  box-shadow:0 4px 20px rgba(0,0,0,.12);
}
#tip .t-sub{color:var(--muted); font-size:12px}
#panel{
  position:fixed; top:74px; right:16px; bottom:52px; width:330px; max-width:calc(100vw - 32px); z-index:15;
  background:color-mix(in srgb, var(--card) 92%, transparent);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border:1px solid var(--hairline); border-radius:18px;
  padding:20px; overflow-y:auto; display:none;
}
#panel.show{display:block}
#panel .p-close{
  position:absolute; top:12px; right:12px; width:26px; height:26px; border-radius:50%;
  border:none; background:var(--panel); color:var(--muted); cursor:pointer; font-size:13px;
}
#panel .p-kind{font-size:11px; letter-spacing:1px; color:var(--muted); text-transform:uppercase; margin-bottom:6px}
#panel h2{font-size:18px; font-weight:600; letter-spacing:-0.3px; line-height:1.3; margin-bottom:4px}
#panel .p-sub{font-size:13px; color:var(--muted); margin-bottom:10px}
#panel .p-status{
  display:inline-block; font-size:12px; font-weight:600; padding:3px 11px;
  border-radius:9999px; margin-bottom:12px; color:#fff;
}
#panel .p-note{font-size:13.5px; line-height:1.6; padding-bottom:14px; border-bottom:1px solid var(--hairline); margin-bottom:12px}
#panel .p-rel-title{font-size:12px; font-weight:600; color:var(--muted); margin-bottom:8px}
#panel .rel{
  display:flex; align-items:baseline; gap:8px; padding:7px 10px; border-radius:8px;
  cursor:pointer; font-size:13px; line-height:1.4;
}
#panel .rel:hover{background:var(--panel)}
#panel .rel .r-dot{width:8px;height:8px;border-radius:50%;flex:none;position:relative;top:0}
#panel .rel .r-lab{color:var(--muted); font-size:11.5px; margin-left:auto; text-align:right; flex:none; max-width:110px}
#tblBox{position:relative}
#tblBtn{font-family:inherit}
#tblMenu{
  position:absolute; top:36px; left:0; width:360px; max-width:calc(100vw - 40px);
  max-height:62vh; overflow-y:auto; padding:6px;
  background:var(--card); border:1px solid var(--hairline); border-radius:12px;
  box-shadow:0 8px 30px rgba(0,0,0,.18); display:none; z-index:30;
}
#tblMenu.show{display:block}
#tblMenu .tm-g{font-size:11px; font-weight:600; color:var(--muted); padding:9px 10px 4px; letter-spacing:.5px; border-top:1px solid var(--hairline)}
#tblMenu .tm-g:first-child{border-top:none}
#tblMenu .tm-i{padding:6px 10px; border-radius:8px; cursor:pointer; font-size:13px; line-height:1.4}
#tblMenu .tm-i:hover{background:var(--panel)}
#searchBox{position:relative}
#searchInput{
  width:200px; font-size:13px; padding:6px 14px; border-radius:9999px;
  border:1px solid var(--hairline); background:var(--card); color:var(--ink);
  outline:none; font-family:inherit;
}
#searchInput:focus{border-color:var(--blue); width:240px}
#searchResults{
  position:absolute; top:36px; left:0; width:360px; max-width:calc(100vw - 40px);
  max-height:56vh; overflow-y:auto; padding:6px;
  background:var(--card); border:1px solid var(--hairline); border-radius:12px;
  box-shadow:0 8px 30px rgba(0,0,0,.18); display:none; z-index:30;
}
#searchResults.show{display:block}
.sr{display:flex; align-items:baseline; gap:8px; padding:7px 10px; border-radius:8px; cursor:pointer; font-size:13px; line-height:1.4}
.sr:hover,.sr.act{background:var(--panel)}
.sr .r-dot{width:8px;height:8px;border-radius:50%;flex:none;position:relative;top:-1px}
.sr .sr-sub{color:var(--muted); font-size:11.5px; margin-left:auto; text-align:right; flex:none; max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.sr-empty{padding:9px 10px; font-size:12px; color:var(--muted)}
#pBasic table{width:100%; border-collapse:collapse; font-size:12.5px; line-height:1.55; margin-bottom:12px}
#pBasic th,#pBasic td{border:1px solid var(--hairline); padding:5px 8px; text-align:left; vertical-align:top}
#pBasic th{background:var(--panel); font-weight:600; white-space:nowrap; width:52px}
#pBasic .nt{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:5px}
#pBasic .nt li{display:flex; gap:5px}
#pBasic .nt-n{flex:none; font-weight:600}
#pBasic .nt-lead{margin-bottom:5px}
#pRels table{width:100%; border-collapse:collapse; font-size:12px; line-height:1.45}
#pRels th,#pRels td{border:1px solid var(--hairline); padding:5px 7px; text-align:left; vertical-align:top}
#pRels th{background:var(--panel); font-weight:600; white-space:nowrap}
#pRels tr.lnk{cursor:pointer}
#pRels tr.lnk:hover td{background:var(--panel)}
#pRels .nd{display:flex; align-items:center; gap:6px}
#pRels .r-dot{width:8px;height:8px;border-radius:50%;flex:none}
#pRels .grp2{background:var(--panel); color:var(--muted); font-weight:600; text-align:center; font-size:11px}
#hint{
  position:fixed; bottom:14px; right:20px; z-index:5;
  font-size:11.5px; color:var(--muted);
  display:flex; align-items:center; gap:14px;
}
#fitBtn{
  font-size:12px; padding:5px 14px; border-radius:9999px; cursor:pointer;
  border:1px solid var(--hairline); background:var(--card); color:var(--ink);
}
#fitBtn:active{transform:scale(.95)}
#src{
  position:fixed; bottom:12px; left:20px; z-index:5;
  font-size:11px; color:var(--muted); letter-spacing:.5px;
}
.cmp{margin:0 0 12px; border-top:1px solid var(--hairline); padding-top:12px}
.cmp .c-title{font-size:12px; font-weight:600; color:var(--muted); margin-bottom:6px; display:flex; justify-content:space-between; gap:8px}
.cmp .c-title .c-hint{font-weight:400; opacity:.8}
.cmp table{width:100%; border-collapse:collapse; font-size:11.5px; line-height:1.45; cursor:zoom-in}
.cmp th,.cmp td{border:1px solid var(--hairline); padding:4px 6px; text-align:left; vertical-align:top}
.cmp th{background:var(--panel); font-weight:600; white-space:nowrap}
#ovl{
  position:fixed; inset:0; z-index:40; display:none; cursor:zoom-out;
  background:rgba(0,0,0,.55); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  align-items:center; justify-content:center; padding:40px;
}
#ovl.show{display:flex}
#ovlBox{
  background:var(--card); border:1px solid var(--hairline); border-radius:16px;
  padding:24px 28px; max-width:min(92vw,940px); max-height:86vh; overflow:auto;
  box-shadow:0 20px 60px rgba(0,0,0,.4);
}
#ovlBox h3{font-size:17px; letter-spacing:-0.2px; margin-bottom:14px}
#ovlBox table{border-collapse:collapse; font-size:15px; line-height:1.65; width:100%}
#ovlBox th,#ovlBox td{border:1px solid var(--hairline); padding:8px 12px; text-align:left; vertical-align:top}
#ovlBox th{background:var(--panel); white-space:nowrap}
#ovlBox .o-hint{font-size:12px; color:var(--muted); margin-top:12px}
#ovlBox .o-chips{display:flex; gap:8px; flex-wrap:wrap; margin:0 0 12px}
#ovlBox .o-chip{
  font-size:12.5px; padding:4px 13px; border-radius:9999px; cursor:pointer; user-select:none;
  border:1px solid var(--hairline); background:var(--card); color:var(--ink);
}
#ovlBox .o-chip.on{background:var(--blue); border-color:var(--blue); color:#fff}
#ovlBox .o-chip.o-grp.on{background:var(--green); border-color:var(--green); color:#fff}
#ovlBox .o-chip.o-kw{border-style:dashed}
#ovlBox .o-chip.o-kw.on{background:var(--red); border-color:var(--red); border-style:solid; color:#fff}
#ovlBox .o-chip.o-clear{color:var(--muted)}
#ovlBox td.k-hit, #ovlBox th.k-hit{background:color-mix(in srgb, var(--blue) 16%, transparent)}
.cmp .grp, #ovlBox .grp{background:var(--theme); color:#fff; font-weight:700; text-align:center; letter-spacing:.5px}
.cmp .hl, #ovlBox .hl{color:var(--red); font-weight:600}
.cmp .hb, #ovlBox .hb{color:var(--blue); font-weight:600}

/* ===== ✎ 衛星掛點編輯（右鍵） ===== */
#kwMenu{position:fixed; z-index:60; display:none; min-width:196px; padding:6px;
  background:var(--card); border:1px solid var(--hairline); border-radius:12px;
  box-shadow:0 12px 34px rgba(0,0,0,.18); font-size:13px; user-select:none}
#kwMenu.show{display:block}
#kwMenu .km-t{font-size:11px; font-weight:600; color:var(--muted); padding:6px 9px 5px; letter-spacing:.4px; max-width:240px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
#kwMenu .km-i{padding:7px 10px; border-radius:8px; cursor:pointer; white-space:nowrap}
#kwMenu .km-i:hover{background:var(--panel)}
#kwMenu .km-s{height:1px; background:var(--hairline); margin:5px 4px}
#kwMenu .km-c{display:flex; gap:7px; padding:3px 10px 8px}
#kwMenu .km-c i{width:19px; height:19px; border-radius:50%; cursor:pointer; box-shadow:0 0 0 2px var(--card), 0 0 0 2px transparent}
#kwMenu .km-c i.on{box-shadow:0 0 0 2px var(--card), 0 0 0 4px var(--ink)}
#kwOvl{position:fixed; inset:0; z-index:70; display:none; background:rgba(0,0,0,.35);
  align-items:center; justify-content:center}
#kwOvl.show{display:flex}
#kwBox{background:var(--card); border:1px solid var(--hairline); border-radius:16px; padding:18px 20px;
  width:min(580px,93vw); max-height:86vh; overflow:auto; box-shadow:0 24px 60px rgba(0,0,0,.32)}
#kwBox h3{margin:0 0 3px; font-size:16px}
#kwBox .k-sub{font-size:12px; color:var(--muted); margin-bottom:13px; line-height:1.6}
#kwBox .k-row{display:flex; gap:6px; align-items:center; margin-bottom:7px}
#kwBox .k-row select,#kwBox .k-row input{font:inherit; font-size:13px; padding:6px 8px; border-radius:8px;
  border:1px solid var(--hairline); background:var(--canvas); color:var(--ink)}
#kwBox .k-row input{flex:1; min-width:0}
#kwBox .k-row .k-n{width:20px; text-align:right; color:var(--muted); font-size:11px}
#kwBox .k-row button{width:30px; height:30px; border-radius:8px; border:1px solid var(--hairline);
  background:var(--canvas); color:var(--ink); cursor:pointer; font-size:13px; line-height:1; padding:0}
#kwBox .k-row button:hover{background:var(--panel)}
#kwBox .k-add{margin:4px 0 15px; padding:7px 13px; border-radius:9px; border:1px dashed var(--hairline);
  background:transparent; color:var(--ink); cursor:pointer; font:inherit; font-size:13px}
#kwBox .k-add:hover{background:var(--panel)}
#kwBox .k-btns{display:flex; gap:8px; align-items:center; border-top:1px solid var(--hairline); padding-top:13px}
#kwBox .k-btns button{padding:8px 16px; border-radius:9px; border:1px solid var(--hairline);
  background:var(--canvas); color:var(--ink); cursor:pointer; font:inherit; font-size:13px}
#kwBox .k-btns .k-ok{background:var(--ink); color:var(--card); border-color:var(--ink); font-weight:600}
#kwBox .k-btns .k-sp{flex:1}
#kwBox .k-tip{font-size:11.5px; color:var(--muted); margin-top:11px; line-height:1.7}
</style>
</head>
<body>

<header>
  <h1>臺灣史記憶關係圖<small>第一冊 史前・大航海・清帝國　│　第二冊 日治・中華民國　│　列＝政權／年號／年代／事件／人物／地點／重點／主題　│　<b>➜ 箭頭＝因果／前後關係</b>　│　<span style="opacity:.6">v11・分兩冊・五章全　│　右鍵可改衛星</span></small></h1>
  <div class="chips" id="chChips"></div>
  <div class="sep"></div>
  <div class="chips" id="chips"></div>
  <div class="sep"></div>
  <div id="searchBox">
    <input id="searchInput" type="search" placeholder="🔍 搜尋（可多關鍵字，如：長濱-台東）" autocomplete="off">
    <div id="searchResults"></div>
  </div>
  <div id="tblBox">
    <div id="tblBtn" class="chip">▦ 比較表</div>
    <div id="tblMenu"></div>
  </div>
  <div class="legend">
    <span><i style="background:var(--blue)"></i>舊石器／明海商／清開港前</span>
    <span><i style="background:var(--red)"></i>新石器／西班牙</span>
    <span><i style="background:var(--green)"></i>金屬器／鄭氏</span>
    <span><i style="background:var(--orange)"></i>歷史時代／荷蘭／清開港後</span>
    <span>◆ 時間節點</span>
    <span style="opacity:.85">─ 主要關係　╌ 對照／因果</span>
  </div>
</header>

<canvas id="graph"></canvas>
<div id="tip"></div>

<div id="panel">
  <button class="p-close" id="pClose">✕</button>
  <div class="p-kind" id="pKind"></div>
  <h2 id="pTitle"></h2>
  <div id="pBasic"></div>
  <div class="cmp" id="pTbl" style="display:none"></div>
  <div class="p-rel-title">關聯一覽（直接＋同脈絡・不限層數）</div>
  <div id="pRels"></div>
</div>

<div id="ovl"><div id="ovlBox"></div></div>
<div id="kwMenu"></div>
<div id="kwOvl"><div id="kwBox"></div></div>

<div id="hint"><span>搜尋（Enter 逐筆跳轉）｜章節鈕可開關｜拖曳節點｜滾輪縮放｜點擊看詳情｜<b>右鍵＝編輯衛星掛點</b></span><button id="fitBtn">置中</button></div>
<div id="src">依課本「重點1 史前臺灣與原住民文化」「主題3・4 大航海時期」及重點統整整理｜個人學習用</div>

<script>
"use strict";
/* ===== ① 資料區 ===== */
const CHAPTERS = {1:"史前與原住民", 2:"大航海時期", 3:"清帝國時期", 4:"日治時期", 5:"中華民國時期"};
const KIND = {
  time:{name:"時間節點", cssVar:"--muted", r:10},
  theme:{name:"主題", cssVar:"--theme", r:14},
  point:{name:"重點", cssVar:"--pt", r:9},
  ex:{name:"實例・人物", cssVar:"--pt", r:8}
};
/* ---- 節點分類：年代／事件／人物／地點／重點／主題（與心智圖同一套規則）---- */
const CAT = {
  "年代":{cssVar:"--muted",  ck:"muted"},
  "事件":{cssVar:"--red",    ck:"red"},
  "人物":{cssVar:"--blue",   ck:"blue"},
  "地點":{cssVar:"--green",  ck:"green"},
  "重點":{cssVar:"--orange", ck:"orange"},
  "主題":{cssVar:"--theme",  ck:"theme"}
};
const CAT_PEOPLE = ["顏思齊","鄭芝龍","沈有容","郭懷一","鄭成功","鄭經","陳永華","施琅","唐景崧","丘逢甲",
  "劉永福","余清芳","沈葆楨","劉銘傳","邵友濂","馬偕","馬雅各","吳沙","鄭用錫","黃纘緒","李春生",
  "施世榜","張達京","郭錫瑠","曹謹","後藤新平","磯永吉","八田與一","莫那魯道","林獻堂","蔣渭水",
  "佐久間左馬太","小林躋造","威爾遜",
  "陳儀","陳誠","蔣中正","蔣經國","李登輝","陳水扁","馬英九","蔡英文","賴清德",
  "雷震","辜振甫","汪道涵","黃春明","吳鳳"];
const CAT_PLACES = ["熱蘭遮城","普羅民遮城","聖薩爾瓦多城","聖多明哥城","麻豆社","新港社","大肚王國",
  "一府二鹿三艋舺","雞籠・淡水・安平・打狗","大稻埕・大嵙崁","億載金城・海門天險","四大水圳",
  "嘉南大圳・八田與一","日月潭水力發電所","臺北帝國大學","臺中中學校","西部縱貫鐵路・基隆高雄港",
  "隘勇線・蕃童教育所","番界（土牛・土牛溝）","小學校・公學校・蕃童教育所",
  "加工出口區","十大建設","新竹科學工業園區"];
const CAT_PLACE_RE = /(城|港|圳|嶼|澎湖|大員|鹿耳門|艋舺|鹿港|府城|噍吧哖|霧社|日月潭|埕|大嵙崁|山|線|社$|社（|社之役)/;
const CAT_EVENT_RE = /(事件|之役|戰爭|條約|抗日|抗荷|抗清|攻臺|運動|禁令|改制|通商|割臺|投降|普查|通車|完工|建省|正名|鎖國|海禁|請願|選舉|義務教育|問世|成立|入侵|遷移|移住|戰役|炮戰|輪替|建交|斷交|會談|三通|學運|接收|戡亂|戒嚴|恐怖)/;
function catOf(n){
  if(n.kind==="time") return "年代";
  if(n.kind==="theme") return "主題";
  const L=n.label;
  if(CAT_EVENT_RE.test(L)) return "事件";          // 「鄭成功攻臺」＝事件，不是人物
  if(CAT_PLACES.includes(L)) return "地點";        // 「嘉南大圳・八田與一」＝地點
  if(CAT_PEOPLE.some(p=>L.includes(p))) return "人物";
  if(CAT_PLACE_RE.test(L)) return "地點";
  return "重點";
}

{id:"kPin",ch:1,kind:"point",ord:1,label:"平埔族群",sub:"漢化較深・西部東北部",
 note:"①與漢人接觸早，漢化較深，逐漸融入漢人社會。②分布於西部、東北部的平原、丘陵。③稱呼：熟番→平埔族。④代表（比較表）：西拉雅、凱達格蘭、噶瑪蘭。17 世紀族群另有：道卡斯、巴則海、巴布拉、貓霧捒、和安雅。起源＝南島語族（與高山各族相同）。"},
{id:"kHi",ch:1,kind:"point",ord:2,label:"高山各族",sub:"漢化較淺・山區與東部",
 note:"①與漢人接觸晚，漢化較淺，保有不少原有文化。②分布於山區與東部地區。③稱呼：生番→高砂族→高山族（山地同胞）。④代表（比較表）：邵、排灣、賽夏。其他如：泰雅、賽德克、太魯閣、撒奇萊雅、鄒、卡那卡那富、拉阿魯哇、布農、阿美、卑南、魯凱、達悟。起源＝南島語族（與平埔族群相同）。"},
{id:"kQ",ch:1,kind:"point",era:"hist",ord:1,label:"清帝國：熟番／生番",sub:"依納稅・服勞役",
 note:"清帝國依據「是否納稅、服勞役」分為熟番（多為平埔族群）、生番（多為高山各族）。"},
{id:"kJ",ch:1,kind:"point",era:"hist",ord:2,label:"日治：平埔族／高砂族",sub:"熟番→平埔・生番→高砂",
 note:"日治時期改稱：熟番→平埔族、生番→高砂族。"},
{id:"kR",ch:1,kind:"point",era:"hist",ord:3,label:"民國：原住民族",sub:"民國83年正名・16族",
 note:"中華民國時期：部分平埔族／高山族（山地同胞）→民國83年修憲正名統稱「原住民族」。跨科（公民）：法源《原住民族基本法》；部落＝特定區域＋血緣關係＋共同文化；重要性＝文化傳承＋共享互助＋部落自治。跨科（地理）：都市原住民人口漸增；辦理祭典維繫文化傳統。"},
// ---- 重點（第2章）----
{id:"kBan",ch:2,kind:"point",era:"ming",label:"海禁→走私貿易",sub:"澎湖臺灣＝貿易據點",
 note:"明朝海禁（14世紀後期起）：目標＝防範倭寇；限制人民私自出海→「海商」走私貿易。對臺影響：16世紀起，澎湖、臺灣位於南北航道及東亞貿易圈要地→成為海商根據地／重要貿易據點。（比較表：明海禁 vs 清海禁 vs 日鎖國）"},
{id:"kZhi",ch:2,kind:"point",era:"ming",label:"顏思齊・鄭芝龍據臺",sub:"17世紀・海上霸主",
 note:"17 世紀「海商」來臺：顏思齊、鄭芝龍在雲林、嘉義一帶建立據點、招募漢人開墾。海上新霸主：後鄭芝龍併吞數個海上勢力，成為東南沿海的霸主。荷蘭曾聯合其他海商對付鄭芝龍為首的明軍但被擊敗→關係好轉後合作（貿易發展順利開展）。明亡後鄭芝龍投降清帝國→荷蘭轉口貿易急遽衰退。"},
{id:"kMot",ch:2,kind:"point",label:"動機→新航路→大航海",sub:"香料・絲綢",
 note:"歐洲人對東南亞、中國、印度的香料、絲綢等需求大增→尋求前往東方的道路→發現來亞洲的新航路→進入「大航海時代」（15世紀末）。"},
{id:"kBase",ch:2,kind:"point",label:"歐人亞洲三據點",sub:"澳門・馬尼拉・巴達維亞",
 note:"背形勢圖編號：①1557 葡萄牙占澳門 ②1571 西班牙占馬尼拉 ③1619 荷蘭占巴達維亞（荷蘭聯合東印度公司據點）。影響：全球經濟貿易網開始形成。"},
{id:"kCast",ch:2,kind:"point",era:"nl",label:"荷蘭築城",sub:"熱蘭遮＋普羅民遮",
 note:"①政治中心：占領初期在大員（今臺南安平區）建「熱蘭遮城」（今安平古堡）。②商業中心：後在今赤崁一帶興築「普羅民遮城」。③驅離西班牙後在淡水築城＝今淡水紅毛城。"},
{id:"kTrans",ch:2,kind:"point",era:"nl",label:"貿易轉運站",sub:"稻米蔗糖鹿皮／瓷器香料絲織品",
 note:"以臺灣為中心，與中國、日本和巴達維亞貿易，透過公司船隻延伸貿易至全球。②吸引中、日等國商人前來貿易。③輸出：稻米、蔗糖、鹿皮。④轉運：瓷器、香料、絲織品。"},
{id:"kHan",ch:2,kind:"point",era:"nl",label:"招募漢人開墾",sub:"→控制過嚴→郭懷一",
 note:"為增加稻米、糖產量，招募漢人來臺開墾。漢人反抗：①原因：荷人對漢人控制過嚴 ②爆發：1652 年郭懷一抗荷事件。"},
{id:"kCtrl",ch:2,kind:"point",era:"nl",label:"控制原住民",sub:"武力＋結盟＋地方會議",
 note:"對抗：武力征服（聯合新港社攻打反抗的麻豆社→被迫簽約接受統治）。合作：部落藉荷人勢力提升地位、取得西式武器。行政控制：①地方會議（長老參與，推行政令；北部150、南部120、淡水18、卑南20村落）②司法：各社由授予手杖的長老統治、長老可行使司法權 ③行政：傳教士為統治原住民的行政官員。"},
{id:"kRel",ch:2,kind:"point",era:"nl",label:"宗教教化・新港文",sub:"羅馬字母拼西拉雅語",
 note:"①傳教：建教堂、設學校，由基督教傳教士擔任老師，教授青少年及婦女。②文字：傳教士利用羅馬字母拼寫西拉雅族的語言，翻譯《聖經》，形成「新港文」。影響：南部平埔族與漢人以新港文字與漢文簽訂土地契約＝「新港文書」（又稱「番仔契」）。"},
{id:"kEco",ch:2,kind:"point",era:"nl",label:"經濟影響",sub:"耕牛↑・鹿隻↓・轉耕種",
 note:"①引進耕牛：為增加稻米產量。②鹿隻減少：漢人以布匹、鹽、鐵向原住民收購鹿皮，轉賣東印度公司→大量捕鹿使梅花鹿數量大量減少；土地開墾也使鹿隻減少。③原住民生活改變：17 世紀減少狩獵、由游耕漁獵轉為定居耕種（漢人帶來水田耕作技術）。"},
{id:"kEsN",ch:2,kind:"point",era:"es",label:"占雞籠淡水・築城傳教",sub:"天主教・西班牙語彙",
 note:"對原住民：武力降服、安撫（比較：荷蘭是結盟新港社＋武力麻豆社）。築城：聖薩爾瓦多城（基隆／雞籠）、聖多明哥城（淡水）。傳教：在北臺灣建立教堂傳播天主教、使用西班牙文（比較：荷蘭傳基督教、創新港文）。影響：北部原住民話語留下西班牙語彙。"},
{id:"kBasay",ch:2,kind:"point",era:"es",label:"馬賽人與外人合作",sub:"操舟・貿易・採金",
 note:"①航行：善於操舟航行 ②學習語言：與漢人溝通 ③與漢人貿易：提供鹿皮、硫磺，交換布匹、鹽、鐵 ④協助西班牙人：至東部採黃金。"},
{id:"kJpConf",ch:2,kind:"point",label:"荷日貿易衝突",sub:"徵稅問題→鎖國",
 note:"原因：因徵稅問題，荷蘭與來臺日商發生爭執。經過：日本曾關閉荷蘭商館報復、多次協商後恢復貿易。結束：1633 年日本宣布「鎖國政策」（17世紀前期起；目標＝減少西方文化傳入後的衝突），日商退出東亞貿易，荷、日衝突不再；西班牙因而減少駐軍。（鎖國時期荷蘭獲准與日本貿易。）"},
{id:"kAtk",ch:2,kind:"point",era:"cheng",label:"鄭成功攻臺",sub:"反清復明・鹿耳門",
 note:"反清復明：1646 鄭芝龍降清，其子鄭成功接續勢力，以金門、廈門為根據地持續反清。攻臺原因：為取得抗清所需的糧食與裝備，決定攻取「資源豐富且有戰略價值」的臺灣。經過：1661 自鹿耳門登陸、圍攻熱蘭遮城→1662 荷蘭人被驅離。"},
{id:"kGov",ch:2,kind:"point",era:"cheng",label:"政經初建",sub:"承天府・軍屯・科舉",
 note:"①行政：設承天府（今臺南市）為行政中心。②面臨海禁：清帝國為打擊鄭氏實施海禁。土地拓墾：為解決糧食問題積極開墾，採「寓兵於農」軍屯。漢人典章制度開始移植臺灣、舉行科舉、實施屯田軍屯、漢人文化從此在臺生根。"},
{id:"kTrade",ch:2,kind:"point",era:"cheng",label:"鄭經貿易",sub:"走私＋國際轉運",
 note:"①中國走私貿易：清朝實施海禁→與當時英、日等合作取得中國商品；輸出蔗糖、鹿皮，輸入絲織品、瓷器、茶葉及日用品。②國際貿易：對象＝英國東印度公司、日本、東南亞；轉賣中國物品、取得軍火等物資；臺灣成為連結中國大陸、日本及東南亞各地的貿易轉運站。與英國簽訂通商條約的原因＝突破清廷經濟封鎖。"},
{id:"kBlock",ch:2,kind:"point",label:"清廷圍堵鄭氏",sub:"海禁遷界・片板不許下海",
 note:"清朝海禁（17世紀中期）：目標＝封鎖鄭氏政權。清順治至康熙年間：沿海居民向內地撤遷、「片板不許下海，粒貨不許越疆」；國姓爺使者在廈門遭逮捕（新政權清朝與鄭氏政權敵對）。對臺影響：鄭氏政權與中國進行走私貿易。統計圖：因實施海禁，造成（中國海外）貿易額減少。"},
{id:"kEdu",ch:2,kind:"point",era:"cheng",label:"文教發展",sub:"孔廟・典章制度",
 note:"協助者：陳永華（在陳永華的協助下提倡文教）。①在今臺南市內興建首座孔廟——全臺首學 ②廟旁設明倫堂培育人才 ③在原住民部落設學校，原住民逐漸接受儒家文化。將漢人典章制度移植臺灣。觀念提示：流亡臺灣的知識分子沈光文（字文開）等人在民間講學、教授原住民。"},
{id:"kFall",ch:2,kind:"point",era:"cheng",label:"鄭克塽降清",sub:"政務廢弛→1683",
 note:"①繼位：鄭經病逝後，幼子鄭克塽繼位（政務廢弛）。②衰亡：1683 年清帝國派將施琅攻取臺灣。③結束：鄭氏在臺約 20 年的統治；兵敗「薙髮」終降清。"},
{id:"kAbCh",ch:2,kind:"point",label:"原住民的改變",sub:"宗教・文字・耕種",
 note:"外來勢力入臺：宗教（荷＝基督新教、西＝天主教、鄭＝漢人信仰如媽祖與儒家文化）、文字（新港文）、經濟（游耕漁獵→定居耕種、梅花鹿銳減）面臨改變。例外：管轄之外的原住民（多為高山族群）仍維持原有生活，不受外來者影響。"},
{id:"kDadu",ch:2,kind:"point",label:"中部大肚王",sub:"荷攻→受管轄；鄭時抗官",
 note:"「大肚王」＝統轄中部平埔族群多個部落的共主。荷治：被荷人攻擊後，與一些部落接受荷人管轄，頭目受封賜，失去獨立性。鄭氏：因漢人侵墾壓縮生活空間、侵占土地、負擔沉重勞役→大肚王反抗／抗官（造成原住民嚴重傷亡）。"},
// ---- 實例（第1章）----
{id:"eCh",ch:1,kind:"ex",era:"pal",label:"長濱文化",sub:"臺東縣長濱鄉・舊石器晚期",
 note:"臺灣目前發現最早的史前文化（★常考）。舊石器時代「晚期」。關鍵字：採集、漁獵生活、已知用火、打製石器。"},
{id:"eDb",ch:1,kind:"ex",era:"neo",ord:1,label:"❶大坌坑文化",sub:"新北市八里區・新石器早期",
 note:"又稱「粗繩紋陶文化」；種植根莖類作物（初級農業）。中國東南沿海也有相似的文化。新石器時代「早期」代表（打製到磨製石器的過渡）。"},
{id:"eYs",ch:1,kind:"ex",era:"neo",ord:2,label:"❷圓山文化",sub:"臺北市（臺北盆地）・新石器晚期",
 note:"貝塚遺跡→臺北湖存在的證據。新石器時代「晚期」。"},
{id:"eBn",ch:1,kind:"ex",era:"neo",ord:3,label:"❸卑南文化",sub:"臺灣東部（臺東縣）・新石器晚期",
 note:"出土大量石器、陶器；以石板屋、石板棺著稱；玉器陪葬品。注意！人獸形玉器在臺灣其他史前文化（如圓山文化）、東南亞也有發現→反映不同區域的互動。新石器時代「晚期」。"},
{id:"eNg",ch:1,kind:"ex",era:"neo",ord:4,label:"南關里遺址",sub:"臺南（南科）",
 note:"南科南關里遺址出土碳（炭）化稻米——農耕的證據；南關里遺址最早。新石器時代。"},
{id:"eSs",ch:1,kind:"ex",era:"metal",label:"十三行文化",sub:"新北市八里區",
 note:"煉鐵作坊遺跡（煉鐵爐、鐵渣）、鐵製工具、砥石（磨利生產的鐵器）；以農業為主、種植穀物；干欄式住屋（建築）。出土玻璃珠、玻璃手環、瑪瑙珠飾、中國銅錢等外來器物——顯示與島外其他地區貿易頻繁。金屬器時代。"},
{id:"eL1",ch:1,kind:"ex",label:"排灣族：蛇生始祖",sub:"族群起源傳說",
 note:"族群起源傳說：排灣族——蛇生始祖。"},
{id:"eL2",ch:1,kind:"ex",label:"泰雅族：岩石始祖",sub:"族群起源傳說",
 note:"族群起源傳說：泰雅族——岩石始祖。"},
{id:"eL3",ch:1,kind:"ex",label:"邵族：白鹿傳說",sub:"族群遷徙傳說",
 note:"族群遷徙傳說：邵族——白鹿傳說。"},
{id:"eL4",ch:1,kind:"ex",label:"布農・西拉雅：洪水避難",sub:"族群遷徙傳說",
 note:"族群遷徙傳說：布農族、西拉雅族——洪水避難傳說。"},
// ---- 實例（第2章）----
{id:"eShen",ch:2,kind:"ex",era:"ming",label:"沈有容",sub:"1604 諭退荷蘭",
 note:"明將沈有容於 1604 年諭退占領澎湖的荷蘭人。"},
{id:"eYan",ch:2,kind:"ex",era:"ming",label:"顏思齊登臺紀念碑",sub:"雲林・嘉義",
 note:"顏思齊、鄭芝龍在雲林、嘉義一帶建立據點、招募漢人開墾（顏思齊登臺紀念碑）。"},
{id:"eZeel",ch:2,kind:"ex",era:"nl",label:"熱蘭遮城",sub:"大員（今安平古堡）",
 note:"荷蘭政治中心，占領初期建於大員（今臺南安平區），今安平古堡。留有《熱蘭遮城日誌》、《聯合東印度公司檔案》等史料。"},
{id:"eProv",ch:2,kind:"ex",era:"nl",label:"普羅民遮城",sub:"今赤崁",
 note:"荷蘭商業中心，後在今赤崁一帶興築。"},
{id:"eSin",ch:2,kind:"ex",era:"nl",label:"新港文書（番仔契）",sub:"新港文＋漢文契約",
 note:"南部平埔族與漢人以新港文字與漢文簽訂的土地契約，稱「新港文書」，又稱「番仔契」。"},
{id:"eGuo",ch:2,kind:"ex",era:"nl",label:"郭懷一",sub:"1652 抗荷",
 note:"「荷蘭人的苛捐雜稅，實在不合理。讓我們一起來反抗荷蘭人的統治吧！」——1652 年郭懷一抗荷事件，臺灣漢人死傷三千多名。"},
{id:"eMatou",ch:2,kind:"ex",era:"nl",label:"麻豆社",sub:"西拉雅族・武力征服的例子",
 note:"麻豆社屬西拉雅族。反抗荷蘭人→1635 麻豆社之役被荷蘭人聯合新港社攻打→被迫簽訂協定，接受荷蘭人統治。"},
{id:"eSinkan",ch:2,kind:"ex",era:"nl",label:"新港社",sub:"與荷結盟",
 note:"新港社與荷人結盟，協助鎮壓其他部落和平定郭懷一事件（合作目的：藉荷蘭勢力提升自己地位、取得西式武器對付敵對部落）。"},
{id:"eSant",ch:2,kind:"ex",era:"es",label:"聖多明哥城・聖薩爾瓦多城",sub:"淡水・雞籠",
 note:"西班牙在北臺灣的築城（觀念提示：在雞籠建聖薩爾瓦多城、淡水建聖多明哥城）。北部留下遺跡。"},
// ---- 古城現址（第三層：古城 → 今地名）----
{id:"eNow1",ch:2,kind:"ex",era:"es",ord:1,label:"今基隆",sub:"聖薩爾瓦多城現址",
 note:"西班牙在雞籠（今基隆）所建「聖薩爾瓦多城」的現址。"},
{id:"eNow2",ch:2,kind:"ex",era:"es",ord:2,label:"今新北淡水（紅毛城）",sub:"聖多明哥城現址",

{id:"eNow3",ch:2,kind:"ex",era:"nl",label:"今臺南安平（安平古堡）",sub:"熱蘭遮城現址",

{id:"eNow4",ch:2,kind:"ex",era:"nl",label:"今臺南赤崁（赤崁樓）",sub:"普羅民遮城現址",

{id:"eNow5",ch:2,kind:"ex",era:"cheng",label:"今臺南市",sub:"承天府現址",

{id:"eBasay",ch:2,kind:"ex",era:"es",label:"馬賽人",sub:"北部原住民",

{id:"eKox",ch:2,kind:"ex",era:"cheng",label:"鄭成功（父）",sub:"驅紅毛・國姓爺",
 note:"攻下熱蘭遮城、城主「揆一」開城投降、驅離入侵福爾摩沙的荷蘭人。明末清初：銅銃鑄有「國姓爺」的「國」字、鑄有「永曆通寶」的銅錢在東南沿海流通。"},
{id:"eJing",ch:2,kind:"ex",era:"cheng",label:"鄭經（子）",sub:"與清對抗・興孔廟・英國貿易",
 note:"「中原王朝氣數已盡、文化傳承保留在海外、謀恢復故土」；長期與清朝對抗、接受建議興建孔廟、與英國貿易。"},
{id:"eChen",ch:2,kind:"ex",era:"cheng",label:"陳永華（臣）",sub:"鄭家諸葛",
 note:"「鄭家諸葛」——輔佐君王、推廣文化事業、內課農桑、外興貿易。鄭經時首建孔廟，推展文教。"},
{id:"eTun",ch:2,kind:"ex",era:"cheng",label:"軍屯地名",sub:"臺南－新營・林鳳營｜高雄－左營・前鎮",

{id:"t20a",ch:3,kind:"time",era:"qpre",label:"1721 朱一貴事件",sub:"三大民變①",
 note:"官逼民反（吏治不良、會黨問題多）。行政區劃連動：事件後增彰化縣、淡水廳→一府四縣二廳（雍正）。"},
{id:"t20b",ch:3,kind:"time",era:"qpre",label:"1731 大甲西社事件",sub:"平埔族群反抗",
 note:"中部平埔族群（大甲西社）因勞役過重起而反抗，為清代規模最大的平埔族抗官事件。"},
{id:"t20c",ch:3,kind:"time",era:"qpre",label:"1786 林爽文事件",sub:"三大民變②・規模最大",
 note:"清代臺灣規模最大的民變。官逼民反。"},
{id:"t20d",ch:3,kind:"time",era:"qpre",label:"1812 增設噶瑪蘭廳",sub:"一府四縣三廳（嘉慶）",
 note:"嘉慶17年（1812）。原因：①漢人移民漸增（吳沙越界開墾蛤仔難）②沿海受海盜侵擾 → 增設噶瑪蘭廳，成一府四縣三廳。這是清帝國前期最晚設立的行政區（嘉慶～同治期間再無變動，直到牡丹社事件）。"},
{id:"t20e",ch:3,kind:"time",era:"qpost",label:"1858–1860年代 開港通商",sub:"英法聯軍→天津條約・★常考",
 note:"1857 英法聯軍之役、1858（咸豐8年）天津條約先開放淡水、安平，後又增開雞籠（基隆）、打狗（高雄）→1860 年代臺灣正式開港通商。四口順序：先淡水、安平，後雞籠、打狗（雞籠、打狗為後來增開）。影響：外國勢力「再度」進入臺灣（上一次是荷西時期），臺灣與外國接觸頻繁，此後數次捲入國際紛爭。這是臺灣史「開港通商前／後」的分界。"},
{id:"t20f",ch:3,kind:"time",era:"qpost",label:"1862 戴潮春事件",sub:"三大民變③・歷時最久",
 note:"同治元年（1862）戴潮春抗清事件，是三大民變中歷時最久的一次，也是清帝國統治下最後一次大規模民變。背景與前兩次相同＝官逼民反（吏治不良、會黨問題多）。三大民變順序：1721 朱一貴→1786 林爽文（規模最大）→1862 戴潮春（歷時最久）。此後臺灣的動盪主因由「內部民變」轉為「外力入侵」（牡丹社、清法、甲午）。"},
{id:"t20f2",ch:3,kind:"time",era:"qpost",label:"1867 羅妹號事件",sub:"番地無主的伏筆・★常考",
 note:"同治6年（1867）美國商船羅妹號（Rover）在臺灣恆春半島觸礁，船員上岸後遭原住民殺害。當時臺灣官員以「生番地不歸管轄」為由消極處理——這句話後來成為牡丹社事件時，日本出兵製造「番地無主」的藉口。也就是說：清廷自己承認管不到番地，日本便主張那片土地無主可佔。"},
{id:"t20f5",ch:3,kind:"time",era:"qpost",label:"1871 琉球漂民事件",sub:"牡丹社事件的導火線",
 note:"同治10年（1871）11月，琉球漁民遭遇船難，漂流至恆春半島，在八瑤灣上岸；船員因語言不通與原住民發生衝突而遇害。這是三年後日本出兵的藉口。"},
{id:"t20g",ch:3,kind:"time",era:"qpost",label:"1874 牡丹社事件",sub:"沈葆楨來臺・轉趨積極",
 note:"背景：①明治維新後日本向外擴張 ②1867 羅妹號事件時，臺灣官員以「生番地不歸管轄」消極處理，被日本拿來作為「番地無主」的藉口。過程：同治13年（1874）5月日本藉口「懲辦凶手」出兵，自社寮港登陸，經車城、楓港攻打臺灣南部牡丹社等部落。結果：清、日議和簽約，清廷承認日本出兵為「保民義舉」→日本藉此聲稱琉球人是日本臣民，1879（光緒5年）正式併吞琉球。影響：①清廷體認臺灣海防的重要，派沈葆楨來臺加強防務並積極建設 ②治臺政策由「為防臺而治臺」轉趨積極。"},
{id:"t20g5",ch:3,kind:"time",era:"qpost",label:"1875 沈葆楨改制",sub:"二府八縣四廳・增臺北府",
 note:"光緒元年（1875）沈葆楨調整為「二府八縣四廳」。兩個方向：①北部崛起→增設臺北府（下轄淡水縣、新竹縣、宜蘭縣、基隆廳）——反映政經重心北移 ②牡丹社事件後為經營後山、鞏固主權→增設恆春縣、卑南廳、埔里社廳。"},
{id:"t20h",ch:3,kind:"time",era:"qpost",label:"1878 對外貿易出超",sub:"入超轉出超",
 note:"開港後對外貿易大幅成長，茶、糖、樟腦出口暢旺（占出口值約94%），1878 年起臺灣對外貿易由入超轉為出超。"},
{id:"t20i",ch:3,kind:"time",era:"qpost",label:"1884 清法戰爭",sub:"劉銘傳來臺・「西仔反」",
 note:"背景：19世紀中期法國擴張勢力至越南。起因：光緒10年（1884）法軍進攻越南，與清帝國爆發戰爭——越南是清帝國的藩屬（臣服中國，發生內亂或外患時可請求清廷出兵）。過程：戰火自越南擴大至中國東南沿海，波及基隆、淡水、澎湖；清廷派劉銘傳來臺督辦防務、加強北部防禦。臺灣人稱這場戰爭為「西仔反」（「西仔」＝法蘭西，「反」＝戰爭動亂）。結果：法國併吞越南。影響：清廷更加重視臺灣、提高行政層級→1885 臺灣建省，首任巡撫劉銘傳。"},
{id:"t20j",ch:3,kind:"time",era:"qpost",label:"1885 臺灣建省",sub:"首任巡撫劉銘傳",
 note:"光緒11年（1885）清法戰爭後宣布臺灣建省，劉銘傳為首任巡撫。意義＝提升行政層級、增加自主權（不再隸屬福建省），並展開各項現代化建設。"},
{id:"t20j5",ch:3,kind:"time",era:"qpost",label:"1887 劉銘傳改制",sub:"三府一州十一縣三廳",
 note:"光緒13年（1887）臺灣建省後，劉銘傳調整為「三府一州十一縣三廳」：中部增設臺灣府（省城所在，新設雲林縣、苗栗縣等），原臺灣府（南部）改稱臺南府，東部增設臺東直隸州——清代臺灣行政區劃的最終樣貌。三府＝臺北府、臺灣府、臺南府。"},
{id:"t20k",ch:3,kind:"time",era:"qpost",label:"1894 甲午戰爭",sub:"→1895 乙未割臺",
 note:"清日甲午戰爭清敗→1895 馬關條約割讓臺灣。末代巡撫唐景崧。"},

{id:"m3Gov",ch:3,kind:"theme",era:"qpre",label:"開港前消極治臺",sub:"為防臺而治臺・★常考",
 note:"與「開港後積極治臺」對稱的另一半：1684 納入版圖～1860 年代開港前，清廷治臺消極。棄留論→施琅建議留臺（戰略考量）。清帝國在西部陸疆積極進取，但海疆政策始終圍繞「禁」與「防」：渡臺禁令（對漢人，目的＝限制移民、防止動亂）＋劃界封山（對原住民，目的＝避免漢原衝突）——合稱「為防臺而治臺」。兩者都在牡丹社事件後由沈葆楨奏請廢除。"},
{id:"m3Late",ch:3,kind:"theme",era:"qpost",label:"開港後積極治臺",sub:"外力入侵→建設・★常考",
 note:"用「年代＋事件＋人物」成串背：1860年代英法聯軍→臺灣開港；1870年代牡丹社事件→沈葆楨；1880年代清法戰爭→劉銘傳、臺灣建省；1890年代甲午戰爭→乙未割臺。"},
{id:"m3Adm",ch:3,kind:"theme",label:"行政區劃演變",sub:"一府三縣→三府一州十一縣三廳・★常考",
 note:"隸屬福建省，1885 建省後獨立為臺灣省。調整原則：依社會與經濟發展需求，並在治安（民變）、國防（外力入侵）需要時才增設；府數只增不減（1→1→1→1→2→3）。①康熙23年（1684）＝一府三縣：設臺灣府，下轄臺灣縣、鳳山縣、諸羅縣（澎湖隸屬臺灣縣）。②雍正元年（1723）、5年（1727）＝一府四縣二廳：增彰化縣、淡水廳、澎湖廳——朱一貴事件後加強統治。③乾隆52年（1787）＝一府四縣二廳：諸羅縣改名嘉義縣，數量不變——嘉勉平定林爽文事件的義行。④嘉慶17年（1812）＝一府四縣三廳：增噶瑪蘭廳，前期最晚設立——漢人移墾引發漢原衝突、海盜侵擾蛤仔難。⑤光緒元年（1875）沈葆楨＝二府八縣四廳：增臺北府（淡水、新竹、宜蘭縣與基隆廳）、恆春縣、卑南廳、埔里社廳——牡丹社事件後開山撫番，東部開始設官治理。⑥光緒13年（1887）劉銘傳＝三府一州十一縣三廳：中部增臺灣府（省城）、原臺灣府改臺南府、原臺灣縣改安平縣、卑南廳升格臺東直隸州——清法戰爭後臺灣建省。"},
{id:"m3Eco",ch:3,kind:"theme",label:"經濟發展",sub:"開港前 vs 開港後・★常考",
 note:"前期＝農業拓墾＋對渡貿易（郊商）；開港後＝國際貿易（洋行）、經濟重心北移、入超轉出超。"},
{id:"m3Soc",ch:3,kind:"theme",label:"社會文化",sub:"移民社會的演變",
 note:"來臺移民以福建（閩）＋廣東（粵）為主。性別失衡→械鬥民變多；信仰與宗族逐步在地化；文風漸興（舉人、進士漸多）；開港後西方文化傳入。"},
{id:"m3Ab",ch:3,kind:"theme",label:"原住民政策與社會",sub:"劃界封山→開山撫番",
 note:"政策：前期劃界封山→牡丹社後沈葆楨開山撫番→劉銘傳擴大開山撫番、剿番。社會：平埔族土地文化流失→反抗、四次大遷移；高山族前期衝突不大、開山撫番後反抗或遷徙。"},
// ---- 重點 ----
{id:"k3Aband",ch:3,kind:"point",era:"qpre",label:"棄留爭議→留臺",sub:"施琅建議・戰略考量",
 note:"放棄派（許多大臣）理由：①臺灣小而無用、又是海盜聚集地，管理不易 ②非中國固有領土 ③增加政府財政負擔。保留派（施琅）理由：①物產豐富 ②戰略地位重要——可保東南沿海（屏障大陸東南沿海四省的門戶）。結果：康熙同意留下→納入版圖→隸福建省管轄；但因經費不足無法全力治理，只能「為防臺而治臺」。"},
{id:"k3Ban",ch:3,kind:"point",era:"qpre",label:"渡臺禁令＋劃界封山",sub:"消極治臺・★常考",
 note:"三大禁令一起記：①海禁（清初～1684，打擊鄭氏→走私興起，納臺後廢止）②渡臺禁令（1684～1875，限制移民：男子須先申請渡臺證照、不得攜眷→偷渡興盛、性別比例失衡）③劃界封山（1722～1875，避免漢原衝突：劃番界＝土牛、土牛溝、立碑，隔離漢原→侵墾興盛、番界往山區移動）。②③都在沈葆楨來臺後奏請放寬或廢止。合稱「為防臺而治臺」。"},
{id:"k3OC",ch:3,kind:"point",label:"開港前 vs 開港後",sub:"清帝國時期的分水嶺・★常考",
 note:"分界＝英法聯軍之役（1857）→天津條約（1858）→1860 年代正式開港通商。一句話：開港前「向內、向中國、消極防臺」，開港後「向外、向世界、積極治臺」。分三大領域記：①治臺政策——為防臺而治臺（渡臺禁令對漢人／劃界封山對原住民）、區劃由民變驅動 ⇒ 外力入侵轉趨積極（牡丹社→沈葆楨、清法→劉銘傳與建省）、區劃由國防驅動、政治軍事交通教育全面建設 ②農商發展與對外貿易——合資拓墾與水圳、對渡貿易（行郊、出口米糖、一府二鹿三艋舺）⇒ 國際貿易（洋行與買辦、出口茶糖樟腦、四口岸、1878 出超、經濟重心北移） ③社會文化變遷——械鬥民變、原鄉信仰與唐山祖、平埔土地流失與四次大遷移 ⇒ 定居社會與階層變動、西方醫療教育傳教（馬偕北／馬雅各南）、開山撫番後原漢關係更緊張。"},
{id:"k3Mudan",ch:3,kind:"point",era:"qpost",label:"牡丹社事件",sub:"琉球問題・1874",
 note:"背景：明治維新後日本向外擴張。起因：1871 琉球漁民船難漂流至恆春半島（八瑤灣上岸），遭原住民殺害。過程：1874 日本藉口「懲辦凶手」，自社寮港登陸出兵攻打牡丹社等部落。因應：清廷派沈葆楨來臺加強防務。結果：簽訂和約，清廷承認日本出兵為「保民義舉」，日本藉此聲稱琉球是其臣民→1879 併吞琉球。影響：清廷體認臺灣海防重要而積極建設——沈葆楨開山撫番、增臺北府、廢渡臺禁令。"},
{id:"k3War",ch:3,kind:"point",era:"qpost",label:"清法戰爭",sub:"越南問題・1884",
 note:"背景：19世紀中期法國擴張勢力至越南。起因：法軍進攻清帝國的藩屬越南（藩屬＝臣服中國，遇內亂或外患可請求清廷出兵）而爆發戰爭。過程：戰火自越南擴大到中國東南沿海，波及基隆、淡水、澎湖；劉銘傳來臺督辦防務、加強北部防禦。結果：法國併吞越南。影響：清廷提高臺灣的行政層級→1885 臺灣建省，劉銘傳任首任巡撫。"},
{id:"k3Agr",ch:3,kind:"point",era:"qpre",label:"農業拓墾",sub:"合資開墾＋水圳",
 note:"背景：中國東南沿海人口增加、謀生不易，漢人渡海來臺開墾。土地來源：①自行占領無主地 ②向原住民承租 ③向官府申請墾照——取得墾照者稱「墾戶」，合資經營的開墾組織稱「墾號」。拓墾方式：民間開墾為主，向官府申請墾照後開墾，因需龐大資金而多採「合資」共同拓墾（合資墾號以「金廣福」為代表）；墾戶按股份分配土地，留下臺南七股、苗栗頭份等地名。原漢衝突：漢人巧取強占原住民土地、違禁越過番界開墾（例證＝18世紀末吳沙越界開墾蛤仔難）→清廷數次重定番界，成效有限。水利：開墾需要灌溉水源，墾戶常合資興建水圳，擴大拓墾範圍、提高稻米與蔗糖產量，不僅自足還能外銷中國大陸。整體方向：拓墾由南向北推進，水圳集中在西部平原。"},
{id:"k3Guo",ch:3,kind:"point",era:"qpre",label:"兩岸對渡貿易（開港前）",sub:"郊商主導・★常考",
 note:"型態＝兩岸（對渡）貿易，對象以中國大陸為主。區域分工：輸出米、糖（長年豐收、足以外銷中國），輸入紡織品、藥材等日用品。商業組織＝「郊」（行郊）：商人為維護利益、避免惡性競爭而成立，並參與地方公共事務——依貿易區域分泉郊、廈郊，依商品分米郊、糖郊、布郊。"},
{id:"k3Intl",ch:3,kind:"point",era:"qpost",label:"國際貿易（開港後）",sub:"洋行主導・★常考",
 note:"英法聯軍→清廷戰敗→臺灣開港通商，重新進入國際貿易市場。主導者＝外國商人在通商口岸設立的「洋行」，掌握臺灣進出口貿易（淡水有寶順、美利士、公泰等洋行）。洋行僱用漢人「買辦」處理商務，部分買辦成為新興商人——代表人物李春生。輸入：鴉片、紡織品；輸出：茶葉（第一）、蔗糖（第二）、樟腦（第三）。貿易對象擴及世界各國。"},
{id:"k3Shift",ch:3,kind:"point",era:"qpost",label:"政經重心北移",sub:"入超轉出超・大稻埕",
 note:"影響有三個面向：①社會——茶、樟腦產地在中北部近山→帶動中北部市鎮興起；製茶創造就業機會，出現職業婦女（揀茶）；漢人為茶與樟腦的利益持續入山開墾，原住民生存空間受壓迫 ②政治——政府稅收大增，有助推動現代化建設 ③空間——（大嵙崁＝今桃園大溪、鹹菜甕＝今新竹關西）；淡水河岸的大稻埕成為茶葉加工與集散地，取代艋舺的商業地位；1878 入超轉出超（茶、糖、樟腦占出口值約94%）；連帶政治重心也北移（1875 增臺北府、1887 臺灣巡撫衙門設於臺北府）；劉銘傳的建設也多集中北部，形成「重北輕南」。"},
{id:"k3Mig",ch:3,kind:"point",era:"qpre",label:"移民與性別失衡",sub:"閩粵為主・羅漢腳",
 note:"福建（閩）、廣東（粵）人多耕地少→人口外移來臺。渡臺禁令不准攜眷→男多女少、人口比例失衡（俗諺「一個某，較贏三個天公祖」）。→部分男子與原住民女子通婚（「有唐山公，無唐山媽」）、入贅女方家、收養子女；部分男子無固定職業又沒結婚，被稱為「羅漢腳」，成為社會亂源。解決：沈葆楨來臺後取消渡臺禁令。"},
{id:"k3Hakka",ch:3,kind:"point",era:"qpre",label:"閩南人 vs 客家人",sub:"分布不同・同鄉聚居",
 note:"閩南人：主要來自福建泉州及漳州，大多分布在平原。客家人：主要來自福建西部、廣東，北部客家人多分布丘陵（近山、不利水稻，多種甘蔗茶葉），南部客家人多分布平原；約占臺灣人口1/6，唱山歌、刻苦耐勞。地緣：為了互相照應，移民往往同鄉聚居——這也是後來械鬥依「祖籍別」爆發的原因。"},
{id:"k3Fight",ch:3,kind:"point",era:"qpre",label:"械鬥與民變",sub:"三大民變・★常考",
 note:"械鬥原因：①結盟盛行（移民多為單身、缺乏家族依靠，同鄉同姓結盟結社）②利益衝突（爭奪水源、田地、商業利益）③依祖籍、姓氏集結→最頻繁的是閩粵械鬥與漳泉械鬥（漳州人有時聯合客家人抵抗泉州人）。民變＝民眾以武力反抗政府（抗官民變），原因：秘密結社盛行、官員良莠不齊、男女比例失衡社會浮動、官民利益摩擦。三大民變：朱一貴（1721）→林爽文（1786，規模最大）→戴潮春（1862，歷時最久）。俗諺「三年一小反，五年一大亂」。"},
{id:"k3Rel",ch:3,kind:"point",era:"qpre",label:"神明信仰",sub:"原鄉＋共同",
 note:"背景：早期閩粵移民拓墾過程充滿危機，常在原鄉聚居的村莊建廟，供奉原鄉神明為守護神。原鄉神明（依祖籍）：漳州人＝開漳聖王；泉州人＝保生大帝、清水祖師；潮州人＝三山國王。共同信仰：媽祖、王爺、土地公；有應公廟＝祭祀孤魂野鬼。"},
{id:"k3Clan",ch:3,kind:"point",era:"qpre",label:"宗族組織・文風",sub:"唐山祖 vs 開臺祖",
 note:"唐山祖（初期）＝同姓、不一定有血緣關係，共同祭祀中國大陸原鄉的祖先，費用靠集資；開臺祖（後期）＝同姓且有血緣關係，祭祀來臺開發的祖先，修族譜、建祠堂並以部分祖產作公費。文教風氣：早期移民忙於墾殖而不盛→後來興盛（人民經濟生活改善、官方及民間教育機構增設、官方與地方人士倡導）→通過科舉的人數逐年增加，18～19世紀文風日益興盛。"},
{id:"k3West",ch:3,kind:"point",era:"qpost",label:"西方文化再傳入",sub:"開港後・傳教士",
 note:"傳播者＝傳教士，在臺建教堂傳福音，並以「醫療」與「教育」作為傳教方式，以基督教長老教會為主。影響＝現代醫學知識與新式教育傳入臺灣。記法：北馬偕‧南馬雅各。（稱「再」傳入，是因為荷西時期已傳入一次，鄭氏、清前期中斷。）"},
{id:"k3Hao",ch:3,kind:"point",era:"qpost",label:"社會階層變動",sub:"豪族形成・客家提升",
 note:"豪族形成：部分地主、郊商與政府合作，取得樟腦經營權致富，成為豪族。客家人地位提升：原本北部客家人多居丘陵、近山，不利水稻與甘蔗生產；開港後因茶葉、樟腦生產而致富，社會地位逐漸上升。"},
{id:"k3AbPol",ch:3,kind:"point",label:"原住民政策演變",sub:"劃界封山→開山撫番→剿番",
 note:"前期＝劃界封山（隔離漢人與生番，清中期以前衝突不大；但隨漢人墾殖面積擴大，番界逐漸內移，高山族生存空間縮小）。轉捩點＝牡丹社事件（清廷為證明能在「番地」行使主權、阻止外人覬覦）→沈葆楨「開山撫番」：解除劃界封山、開闢通往後山（中央山脈以東）的北中南三條道路、鼓勵漢人開墾、東部設行政區→劉銘傳擴大開山撫番、設「番學堂」教化原住民，「撫番」變「剿番」。"},
{id:"k3AbSoc",ch:3,kind:"point",label:"原住民社會變遷",sub:"平埔四次大遷移",
 note:"平埔族（熟番）：生活受漢俗影響、亦接受官方管理；政府壓迫＝賦役繁重（除納稅還要服勞役）→多次抗官兵變（如1731大甲西社事件）；土地流失＝漢人透過買賣、交換、婚姻甚至欺騙取得，政府18世紀中葉下令禁止漢人承租買賣但成效有限；文化變遷＝被迫改漢姓、學漢字，學會水田耕作與合作開圳（如貓霧捒圳）；族群遷徙＝19世紀逐漸遷往宜蘭、埔里盆地和東部（四次大遷移）→傳統生活方式、語言與宗教信仰逐漸式微，多數融入漢人社會。高山族（生番）：生活區域不易進入、保留較多傳統文化，官府相對無法有效管治；開山撫番後受漢人入侵而遷往他處或更高山區，傳統文化面臨挑戰。"},

{id:"e3Place",ch:3,kind:"ex",era:"qpre",label:"拓墾相關地名",sub:"營鎮・股份・圳埤・厝屋・★常考",
 note:"看地名就能反推它的來源：①營、鎮——鄭氏時期的軍屯（如林鳳營、左鎮）②股、份——清帝國時期的合資開墾，墾戶按股份分地（如五股、頭份、七股）③圳、埤——水利設施（如瑠公圳、大埤）④厝、屋——聚落（如陳厝、新屋）⑤原鄉地名——移民把家鄉地名帶來（如潮州、泉州）。考題常給一個地名問「反映哪個時期／哪種活動」。"},
{id:"e3Jin",ch:3,kind:"ex",era:"qpre",label:"金廣福墾號",sub:"合資墾號的代表・★常考",
 note:"開墾需龐大資金，多由多人「合資」組成「墾號」向官府申請墾照（取得墾照者＝墾戶），代表＝金廣福（閩粵合資，「金」取吉利、「廣」指廣東客家、「福」指福建閩南，共同開墾竹塹（今新竹）東南山區）。墾戶按出資股份分配土地，因此留下臺南七股、苗栗頭份這類以股份命名的地名。"},
{id:"e3ExpSeq",ch:3,kind:"ex",label:"出口商品演變",sub:"荷→鄭→清前→清後・★常考",
 note:"大航海時代至清代的出口貿易一路演變：荷蘭時代＝稻米、蔗糖、鹿皮；鄭氏政權＝蔗糖、鹿皮（稻米改為軍需自用）；清代開港前＝稻米、蔗糖（兩岸對渡）；清代開港後＝茶、糖、樟腦（國際貿易）。記法：鹿皮在鄭氏後消失（鹿群枯竭），稻米在開港後被茶與樟腦取代，只有「糖」四個時期都在。"},
{id:"e3Shen",ch:3,kind:"ex",era:"qpost",label:"沈葆楨",sub:"牡丹社事件後來臺（同治・光緒）",
 note:"牡丹社事件後以欽差大臣身分來臺加強防務。事蹟：①加強海防＝在安平（二鯤鯓炮臺＝億載金城）、旗後架設新式炮臺，並修築恆春城 ②廢除渡臺禁令與劃界封山，獎勵漢人移墾——免費乘船前往臺灣、發給口糧耕具及種子 ③交通＝興築北、中、南三條通往山區與東部的道路：北路 蘇澳→花蓮（蘇花公路前身）、中路 林圯埔（今南投竹山）→八通關→璞石閣（今花蓮玉里）＝八通關古道、南路 射寮（今屏東枋寮）→赤山→卑南（今臺東），並開山撫番、東部設行政區 ④1875 調整行政區劃為二府八縣四廳、增臺北府、在恆春設縣 ⑤基隆採煤。"},
{id:"e3Liu",ch:3,kind:"ex",era:"qpost",label:"劉銘傳",sub:"清法戰爭後・首任巡撫（光緒）",
 note:"清法戰爭時來臺督辦防務，臺灣建省後任首任巡撫。事蹟：①軍事＝基隆「海門天險」、旗後「威震天南」等新式炮臺，設製造槍炮的工廠 ②交通＝購買輪船（航行於臺灣・中國大陸與東南亞之間，促進貿易）、架設電報線（臺灣各地與臺、澎之間，並聯絡福州）、設郵政總局、修築臺灣最早的鐵路基隆—臺北—新竹（含獅球嶺隧道）（1891 光緒17年基隆↔臺北通車，1893 光緒19年臺北↔新竹通車，全線在後任巡撫邵友濂任內完成）③教育＝創立西式學堂、電報學堂，臺北市街裝設電燈 ④原住民＝擴大開山撫番、設番學堂，「撫番」變「剿番」⑤1887 三府一州十一縣三廳，臺灣巡撫衙門設於臺北府。經沈、劉建設後，臺灣已成當時中國相當進步的省分；但建設多集中於北部（鐵路、電報、郵政總局、學堂都在臺北），顯示「重北輕南」。"},
{id:"e3Relic1",ch:3,kind:"ex",era:"qpost",label:"牡丹社事件史蹟",sub:"均位於屏東・★常考",
 note:"四處都在屏東：①「大日本琉球藩民五十四名墓」——日軍為罹難的琉球人所設 ②「石門古戰場」——原住民對抗日軍的戰場 ③恆春古城——事後沈葆楨奏請設縣築城 ④「鵝鑾鼻燈塔」——為防止船隻觸礁而建（羅妹號、琉球漂民都是觸礁與船難引起的）。"},
{id:"e3Relic2",ch:3,kind:"ex",era:"qpost",label:"清法戰爭史蹟",sub:"滬尾・二沙灣・孤拔紀念碑",
 note:"三處對應三個戰場：①新北「滬尾炮臺」（淡水）②基隆「二沙灣炮臺」＝海門天險（劉銘傳建，旁有獅球嶺隧道）③澎湖「孤拔紀念碑」——孤拔（Courbet）是法軍將領。對照戰場：法軍曾進攻基隆、淡水、澎湖。"},
{id:"e3Bayao",ch:3,kind:"ex",era:"qpost",label:"八瑤灣・社寮港",sub:"琉球人上岸／日軍登陸・★常考",
 note:"牡丹社事件的兩個關鍵地點：①八瑤灣——1871年11月琉球漁民船難後的上岸處，在恆春半島 ②社寮港——1874年5月日軍登陸的地點，日軍由此經車城、楓港攻打牡丹社等部落。地圖題常以出兵路線作答。"},
{id:"e3Fort",ch:3,kind:"ex",era:"qpost",label:"億載金城・海門天險",sub:"新式炮臺（防日／防法）",
 note:"沈葆楨（牡丹社事件後・防日）：在安平、旗後架設新式炮臺——安平「二鯤鯓炮臺」即今臺南「億載金城」，旗後炮臺在今高雄旗津。劉銘傳（清法戰爭後・防法與列強）：在基隆等地修建西式炮臺——基隆「二沙灣炮臺」即今「海門天險」。用「防日／防法」記誰建哪座：億載金城＝沈葆楨、海門天險＝劉銘傳。"},
{id:"e3Rail",ch:3,kind:"ex",era:"qpost",label:"鐵路・電報・郵政",sub:"劉銘傳的現代化建設",
 note:"基隆↔新竹鐵路（加強島內聯繫）、電報線（發展對外交通、延伸至福州）、郵政總局、輪船航行於中國・臺灣與東南亞之間。"},
{id:"e3School",ch:3,kind:"ex",era:"qpost",label:"西式學堂・番學堂",sub:"劉銘傳・培養人才／教化",
 note:"創立西式學堂、電報學堂培養相關人才；另設「番學堂」試圖讓原住民接受漢文化。"},
{id:"e3Maya",ch:3,kind:"ex",era:"qpost",ord:1,label:"馬雅各",sub:"英國籍・南部（1865 抵臺南）・★常考",
 note:"馬雅各（1836–1921，英國籍，南部，1865 年抵臺南傳教）：在府城看西街設立醫館＝臺灣第一間西醫醫館（今臺南新樓醫院前身）。"},
{id:"e3Makai",ch:3,kind:"ex",era:"qpost",ord:2,label:"馬偕",sub:"加拿大籍・北部（1872 抵淡水）・★常考",
 note:"馬偕（1844–1901，加拿大籍，北部，1872 年抵淡水傳教）：在淡水設醫館、建「理學堂大書院」（又稱牛津學堂，在今淡水真理大學內）、設「淡水女學堂」倡導女子教育（今淡江中學前身）。"},
{id:"e3Ba",ch:3,kind:"ex",era:"qpre",ord:1,label:"八堡圳",sub:"施世榜・1709・濁水溪・規模最大",
 note:"興建者＝施世榜。時間＝1709 年興築、1719 年完工（康熙年間）。水源＝濁水溪。灌溉區域＝彰化平原。特色＝清代灌溉規模最大的水圳。四大水圳中時間最早的一條。"},
{id:"e3Mao",ch:3,kind:"ex",era:"qpre",ord:2,label:"貓霧捒圳",sub:"張達京・1733・大甲溪・原漢合作",
 note:"興建者＝張達京。時間＝1733 年（雍正年間）。水源＝大甲溪。灌溉區域＝臺中盆地。特色＝漢人與原住民合作修築，是原漢合作的代表——張達京以「割地換水」與岸裡社合作，漢人出資築圳、原住民提供土地。"},
{id:"e3Liu2",ch:3,kind:"ex",era:"qpre",ord:3,label:"瑠公圳",sub:"郭錫瑠・1740・新店溪・臺北最重要",
 note:"興建者＝郭錫瑠父子（以人名命名）。時間＝1740 年（乾隆年間）。水源＝新店溪。灌溉區域＝臺北盆地。特色＝臺北地區最重要的灌溉渠道。"},
{id:"e3Cao",ch:3,kind:"ex",era:"qpre",ord:4,label:"曹公圳",sub:"曹謹・1837・高屏溪・官方主導",
 note:"興建者＝鳳山知縣曹謹（以人名命名）。時間＝1837 年（道光年間）。水源＝高屏溪。灌溉區域＝高雄地區。特色＝四大水圳中唯一由官方主導興建的水圳，時間也最晚。"},
{id:"e3Wusha",ch:3,kind:"ex",era:"qpre",label:"吳沙開墾蛤仔難",sub:"18世紀末・越界開墾（宜蘭）",
 note:"18世紀末吳沙越過番界開墾蛤仔難（今宜蘭）——原漢衝突的例證，也促成 1812 嘉慶年間增設噶瑪蘭廳。"},
{id:"e3Border",ch:3,kind:"ex",era:"qpre",label:"番界（土牛・土牛溝）",sub:"劃界封山的界線",
 note:"在靠近山區地帶設「番界」，以土牛、土牛溝或立碑為界：嚴禁漢人入侵番界、不許漢人與原住民通婚、交易。實際上漢人越界開墾日益嚴重，番界一再往山區內移。"},
{id:"e3Ronin",ch:3,kind:"ex",era:"qpre",label:"羅漢腳",sub:"渡臺禁令的副作用",
 note:"渡臺禁令不准攜眷→形成一批無家眷、又沒固定工作的男子「羅漢腳」；為爭奪資源與利益常發生衝突，成為社會亂源（械鬥、民變的溫床）。"},
{id:"e3Ports1",ch:3,kind:"ex",era:"qpre",label:"一府二鹿三艋舺",sub:"開港前三大港（南→北）",
 note:"初期以鹿耳門為唯一合法正港（1684），與廈門對渡通航；隨中、北部開發與貿易量增加，續開鹿港（1784）、八里坌（1788）→形成三大對渡港口：府城（今臺南市）→鹿港→艋舺。意義：順序由南向北，反映臺灣「由南向北」的開發歷程，也出現「正港」一說。補充：19世紀初新莊河港因淤塞，地位逐漸被艋舺取代——這就是「三艋舺」的由來。"},
{id:"e3Jiao",ch:3,kind:"ex",era:"qpre",label:"郊（行郊）",sub:"泉郊・廈郊／糖郊・布郊",
 note:"商人為維護利益、避免惡性競爭成立的商業組織，也參與地方公共事務、支持民間活動、回饋地方。功能＝配運貨物、維護商業利益、避免同業惡性競爭，性質類似今日的「同業公會」；也參與地方公共事務（例：修廟）。三大港市各有其郊：府城三郊、鹿港八郊、艋舺三郊。分類：依貿易區域分泉郊、廈郊；依貿易商品分米郊、糖郊、布郊。對渡對岸港口有福州五虎門、泉州蚶江（晉江）、廈門、漳州等。（開港後主導者換成洋行）"},
{id:"e3Ports2",ch:3,kind:"ex",era:"qpost",label:"雞籠・淡水・安平・打狗",sub:"四個通商口岸",
 note:"1858（咸豐8年）天津條約先開放淡水、安平，後又增開雞籠（基隆）、打狗（高雄），共四口；外人在臺設洋行、領事館。北部淡水（茶、樟腦）、南部安平打狗（蔗糖）分工明顯；1880 年代淡水的貿易淨值超越打狗。19世紀末安平、淡水因泥沙淤積逐漸被打狗、雞籠取代；日治初期總督府修建基隆港、高雄港為現代化港口，更加速安平、淡水的沒落。"},
{id:"e3Tea",ch:3,kind:"ex",era:"qpost",label:"茶・糖・樟腦",sub:"出口三寶・★必考順序",
 note:"茶葉（第一）：北部產，淡水出口，銷美國與東南亞，當時臺灣最大輸出商品。蔗糖（第二）：南部產，安平、打狗出口，銷中國、日本，歷史悠久的外銷商品。樟腦（第三）：中北部產，淡水出口，銷歐美各國，產量曾居世界第一。"},
{id:"e3Dadao",ch:3,kind:"ex",era:"qpost",label:"大稻埕・大嵙崁",sub:"新興市鎮（茶葉帶動）",
 note:"大稻埕（淡水河岸）＝茶葉加工與集散地，取代艋舺的商業地位；中北部近山新市鎮還有大嵙崁（今桃園市大溪區）、鹹菜甕（今新竹縣關西鎮）。"},
{id:"e3Move4",ch:3,kind:"ex",label:"平埔四次大遷移",sub:"蘭陽→埔里→花東",
 note:"①中部平埔族群進入蘭陽平原開墾 ②中部平埔族群移墾埔里盆地 ③噶瑪蘭族遷至花、東等地 ④西拉雅族遷往花、東等地。方向：19世紀逐漸遷往宜蘭縣、埔里盆地和東部。"},
{id:"e3Exam",ch:3,kind:"ex",era:"qpre",label:"鄭用錫・黃纘緒",sub:"新竹進士・宜蘭舉人",
 note:"科舉制度下的臺灣文風實例：新竹進士鄭用錫宅第的「進士第」匾額、宜蘭舉人黃纘緒宅第的「文魁」匾額。清代通過科舉的人數逐年增加：康雍時期（1687–1735）舉人15、進士0；乾隆（1736–1795）56／2；嘉道（1796–1850）74／6；咸同光（1851–1894）106／21＝最多。"},
{id:"e3Gods",ch:3,kind:"ex",era:"qpre",label:"開漳聖王・保生大帝・三山國王",sub:"漳州／泉州／潮州・★常考",
 note:"漳州人＝開漳聖王；泉州人＝保生大帝、清水祖師；潮州人（多為客家）＝三山國王——考題常用神明反推移民祖籍。背景：拓墾過程充滿危機，移民在原鄉聚居的村莊建廟，供奉原鄉神明為守護神。"},
{id:"e3Common",ch:3,kind:"ex",era:"qpre",label:"媽祖・王爺・土地公",sub:"共同信仰",
 note:"不分祖籍的共同信仰：媽祖、王爺、土地公；另有「有應公廟」祭祀無主的孤魂野鬼。由「原鄉信仰（依祖籍）」轉向「共同信仰」，是移墾社會走向定居社會的指標。"},
// ===== 第5章 中華民國時期（戰後臺灣）=====
// ---- 時間軸 ----
{id:"t40",ch:5,kind:"time",era:"roc1",label:"1947 二二八事件",sub:"民36・查緝私菸・★常考",
 note:"民36（1947）2月27日官員在臺北查緝私菸誤殺民眾。28日起各地爆發反政府事件；地方人士組「二二八事件處理委員會」要求改革；中央派兵鎮壓並「清鄉」。結果：陳儀被撤職，成立臺灣省政府取代行政長官公署。影響：對日後政治發展與族群關係（省籍）產生不良影響。同年政府宣布實施憲政、選出總統副總統與中央民代。"},
{id:"t41",ch:5,kind:"time",era:"roc1",label:"1948 動員戡亂臨時條款",sub:"民37・擴大總統職權",
 note:"民37（1948）因應國共內戰制定《動員戡亂時期臨時條款》，擴大總統職權；後屢經修訂，使總統連任不受限制。施行範圍＝全國，民80（1991）廢止。"},
{id:"t42",ch:5,kind:"time",era:"roc1",label:"1949 政府遷臺・戒嚴",sub:"民38・古寧頭・新臺幣・土地改革",
 note:"民38（1949）是關鍵的一年：①10/1 中華人民共和國成立 ②10月共軍進犯金門、國軍戰勝＝古寧頭戰役 ③12月中華民國政府遷臺 ④臺灣省政府為防止共產勢力滲透發布《戒嚴令》（施行範圍＝臺灣省，至民76）⑤發行新臺幣穩定物價（舊臺幣4萬元換新臺幣1元）⑥土地改革起步。"},
{id:"t43",ch:5,kind:"time",era:"roc1",label:"1950 韓戰爆發・地方自治",sub:"民39・第七艦隊・美援",
 note:"民39（1950）韓戰爆發，美國為圍堵共產勢力派第七艦隊協防臺灣海峽，並提供軍事與經濟援助（美援）。同年起實施地方自治，開放省級以下地方首長與民意代表直接民選——政府為爭取國際支持而有限度開放參政。"},
{id:"t44",ch:5,kind:"time",era:"roc1",label:"1954 中美共同防禦條約",sub:"民43・納入西太平洋反共體系",
 note:"民43（1954）與美國簽訂《中美共同防禦條約》，臺灣被納入東亞（西太平洋）反共防禦體系，臺海局勢逐漸穩定。民68 臺美斷交後廢止。"},
{id:"t45",ch:5,kind:"time",era:"roc1",label:"1958 八二三炮戰",sub:"民47・金門",
 note:"民47（1958）共軍猛烈炮火轟擊金門，國軍在美國協防下給予反擊。結果：此後兩岸雖有零星衝突，但不再出現大規模的武力對抗。與古寧頭戰役均發生在金門。"},
{id:"t46",ch:5,kind:"time",era:"roc1",label:"1960 雷震事件",sub:"民49・自由中國・中國民主黨",
 note:"民49（1960）雷震等人在《自由中國》雜誌評論時政，批評蔣中正威權統治、反對其連任三屆，並為制衡執政黨籌組中國民主黨。結果：遭政府壓制，雷震被以「知匪不報」罪名逮捕入獄，雜誌被迫停刊，組黨不成。"},
{id:"t47",ch:5,kind:"time",era:"roc1",label:"1971 退出聯合國",sub:"民60・外交轉彈性・★常考",
 note:"民60（1971）聯合國表決由中華人民共和國取得「中國席位」，我國宣布退出聯合國。中華民國原是聯合國創始會員國。影響：友邦紛紛與我國斷交、邦交國銳減，國際地位孤立，外交由鞏固外交改採彈性外交。"},
{id:"t48",ch:5,kind:"time",era:"roc1",label:"1973 推動十大建設",sub:"民62・行政院長蔣經國",
 note:"民62（1973）因西亞產油國爆發戰爭引發國際能源危機、衝擊全球經濟，行政院長蔣經國推動「十大建設」：六項交通建設＋三項重工業＋一項能源建設，偏重交通、重工業集中在高雄。成果：外貿成長，臺灣成為「亞洲四小龍」之一。"},
{id:"t49",ch:5,kind:"time",era:"roc1",label:"1979 臺美斷交・美麗島事件",sub:"民68・雙重轉折・★常考",
 note:"民68（1979）兩件大事：①美國為拉攏中共對抗蘇聯與中華人民共和國建交，與我國斷交，《中美共同防禦條約》廢止，美另訂《臺灣關係法》維持非官方往來與軍售 ②美麗島雜誌社以紀念國際人權日為由在高雄舉辦遊行、呼籲解嚴，引發警民衝突，許多黨外人士被捕。兩岸自此進入政治對峙期。"},
{id:"t4a",ch:5,kind:"time",era:"roc1",label:"1980 新竹科學工業園區",sub:"民69・產業升級",
 note:"民69（1980）設置新竹科學工業園區（現稱新竹科學園區），全力發展技術與資本密集、高附加價值的高科技產業（資訊、電子、光電、生物科技）。背景：民60年代末工資上漲、國際競爭增加、環保意識抬頭。"},
{id:"t4b",ch:5,kind:"time",era:"roc1",label:"1986 民主進步黨成立",sub:"民75・突破黨禁",
 note:"民75（1986）黨外人士突破戒嚴時期黨禁組成民主進步黨，開啟政黨政治新頁。「黨外」＝指非國民黨籍人士。"},
{id:"t4c",ch:5,kind:"time",era:"roc2",label:"1987 解除戒嚴",sub:"民76・蔣經國・★常考",
 note:"民76（1987）蔣經國總統宣布解除戒嚴（7/14 發布總統令，7/15 零時起生效），開放黨禁、報禁，人民的集會結社等自由權重獲《憲法》保障。同年開放赴中國大陸探親，正式揭開兩岸交流序幕。臺灣民主政治從此邁向新的里程碑。"},
{id:"t4d",ch:5,kind:"time",era:"roc2",label:"1988 李登輝繼任總統",sub:"民77・務實外交起點",
 note:"民77（1988）李登輝繼任總統後推動務實外交：不再堅持中華民國是代表中國的唯一合法政府，強調兩岸是分裂分治的對等政治實體，以經濟實力和政治民主化的成就突破中共外交封鎖。"},
{id:"t4e",ch:5,kind:"time",era:"roc2",label:"1990 三月學運",sub:"民79・野百合學運",
 note:"民79（1990）大學生發起三月學運（野百合學運），提出「廢除臨時條款」等改革訴求，促成隔年終止動員戡亂與中央民代全面改選。"},
{id:"t4f",ch:5,kind:"time",era:"roc2",label:"1991 終止動員戡亂",sub:"民80・廢除臨時條款・陸委會",
 note:"民80（1991）李登輝總統順應民意宣布終止動員戡亂、廢除《動員戡亂時期臨時條款》＝結束內戰狀態；同時推動修憲與中央民意代表全面改選，解決「萬年國會」的弊端。同年成立行政院大陸委員會，委託民間的海基會處理兩岸交流事務。另針對二二八公開道歉、賠償、興建紀念碑。"},
{id:"t4g",ch:5,kind:"time",era:"roc2",label:"1993 辜汪會談",sub:"民82・新加坡・首次會談",
 note:"民82（1993）海基會董事長辜振甫與海協會會長汪道涵在新加坡舉行海峽兩岸第一次正式會談，稱辜汪會談。"},
{id:"t4h5",ch:5,kind:"time",era:"roc2",label:"1994 省長・直轄市長民選",sub:"民83・臺北市、高雄市",
 note:"民83（1994）開放省長及直轄市市長直接民選（臺北市、高雄市）——戒嚴時期這兩個職位都由官方指派，至此地方自治才真正落實。同年國民大會修憲，以「原住民」取代「山胞」。"},
{id:"t4i",ch:5,kind:"time",era:"roc2",label:"1996 首次總統直選",sub:"民85・李登輝當選",
 note:"民85（1996）實施第一次總統直選，李登輝當選首任民選總統，民主政治更加落實。同年成立原住民族委員會（民91／2002 改稱「原住民族委員會」）。"},
{id:"t4j",ch:5,kind:"time",era:"roc2",label:"2000 首次政黨輪替",sub:"民89・國民黨→民進黨",
 note:"民89（2000）首次政黨輪替，由國民黨交棒民進黨（陳水扁當選）。此後民97（2008）二次輪替、民105（2016）三次輪替，政黨輪替成為常態，民主政治落實在人民生活中。"},
{id:"t4k",ch:5,kind:"time",era:"roc2",label:"2001 小三通",sub:"民90・金門馬祖澎湖",
 note:"民90（2001）起開放「小三通」，開放金門、馬祖、澎湖與對岸往來交流。同年客家委員會成立。金門、馬祖從軍事前線轉變為交流據點。"},
{id:"t4l",ch:5,kind:"time",era:"roc2",label:"2008 大三通",sub:"民97・兩岸直航",
 note:"民97（2008）政府開放兩岸直航「大三通」（通商、通郵、通航）。同年第二次政黨輪替。"},
{id:"t4m",ch:5,kind:"time",era:"roc2",label:"2015 馬習會談",sub:"民104・新加坡",
 note:"民104（2015）馬英九與習近平在新加坡會談。兩岸交流雖頻繁，但中共不放棄武力犯臺、堅持一個中國、持續打壓我國外交空間，兩岸關係仍充滿變數。"},

{id:"m5Pol",ch:5,kind:"theme",label:"戰後政治發展",sub:"二二八→戒嚴→民主化・★常考",
 note:"一條線背下來：民34 接收（行政長官公署）→民36 二二八→民37/38 動員戡亂＋戒嚴（威權統治、白色恐怖）→民39 地方自治（有限度）→黨外運動（雷震、美麗島）→民75 民進黨→民76 解嚴→民80 終止動員戡亂→民83 省長民選→民85 總統直選→民89 政黨輪替。"},
{id:"m5Dip",ch:5,kind:"theme",label:"外交與兩岸關係",sub:"三階段×兩條線・★常考",
 note:"兩條平行線，各三階段。外交：鞏固外交（民38–60）→彈性外交（民60–77）→務實外交（民77–）。兩岸：武力對抗（民38–68）→政治對峙（民68–76）→兩岸交流（民76–）。三個轉折年份：民60 退出聯合國、民68 臺美斷交、民76 解除戒嚴。"},
{id:"m5Eco",ch:5,kind:"theme",label:"戰後經濟發展",sub:"六階段・★常考",
 note:"經濟重整（戰後初期：新臺幣、土地改革）→進口替代（民40年代：以農業培養工業）→出口導向（民50年代：加工出口區）→十大建設（民60年代：能源危機、重工業）→產業升級（民70年代：新竹科學園區、高科技）→自由化與國際化（民80年代起：APEC、WTO）。"},
{id:"m5Soc",ch:5,kind:"theme",label:"戰後社會與文化",sub:"都市化・社會運動・多元文化",
 note:"社會：民50年代工業產值超過農業→都市化、鄉村人口外移與老化（雙凹型人口結構）；解嚴後社會運動蓬勃（環保、勞工、女權、農民、原住民、客家）。文化：中華文化（國語運動）→美國文化→鄉土文化→多元文化。"},

{id:"k5Take",ch:5,kind:"point",era:"roc1",label:"戰後接收",sub:"行政長官公署・陳儀",
 note:"民34（1945）8月日本無條件投降、二次大戰結束，中華民國接收臺灣、澎湖，成立臺灣省行政長官公署，陳儀擔任行政長官。初期局勢三面向：①政治——行政長官掌控政治、軍事大權，被民眾詬病猶如「新總督」，部分官員與軍警濫權腐敗 ②經濟——米糧短缺、物價飛漲（物資運往中國支援國共內戰）③文化——來臺人士與臺人在語言文化、習慣上差異大。"},
{id:"k5228",ch:5,kind:"point",era:"roc1",label:"二二八事件",sub:"1947・★常考",
 note:"起因：民36（1947）2月27日官員在臺北查緝私菸誤殺民眾。經過：①28日起各地陸續爆發反政府事件 ②地方人士組「二二八事件處理委員會」維持秩序並要求改革 ③中央政府出兵來臺鎮壓（國軍分由基隆、高雄登陸）、清鄉——軍警藉清查戶口、收繳武器等方式掃蕩反政府分子。結果：陳儀被撤職，成立臺灣省政府取代行政長官公署。影響：對日後政治、族群關係（省籍）產生不良影響。後續：近年政府對當年處置失當公開道歉、賠償、興建紀念碑、訂定228和平紀念日，並設人權紀念園區、成立促進轉型正義委員會。"},
{id:"k5Mart",ch:5,kind:"point",era:"roc1",label:"戒嚴體制",sub:"動員戡亂＋戒嚴令・★常考",
 note:"兩部法令並行：①《動員戡亂時期臨時條款》民37–80，全國施行，目的是因應國共內戰進入戰爭準備，內容為擴大總統職權、使總統可一再連任，由李登輝終止 ②《戒嚴令》民38–76，臺灣省施行，臺灣省政府（省主席陳誠）為防範共產勢力滲透而發布，限縮《憲法》賦予人民的自由權（言論、出版、集會、結社）並限制營業時間，由蔣經國宣布解除。"},
{id:"k5White",ch:5,kind:"point",era:"roc1",label:"白色恐怖",sub:"民40–50年代・冤獄",
 note:"背景：民40、50年代情治單位不依正當法律程序對民眾逮捕、審訊、定罪，罪名如「反叛政府」「涉嫌叛亂」「為匪宣傳」「檢肅匪諜」。處置：舉凡辦理讀書會、被告密思想有問題者都可能被捕入獄或處死。影響：①形成許多冤獄，受難者不分性別、年齡、省籍、族群（綠島曾關押女性政治犯）②民眾人心惶惶，畏懼參與政治、避談國事，嚴重影響臺灣社會的正常發展。"},
{id:"k5Demo",ch:5,kind:"point",era:"roc2",label:"民主化歷程",sub:"地方自治→黨外→解嚴→直選・★常考",
 note:"①地方自治（民39起）：政府為爭取國際支持有限度開放參政，開放省級以下地方首長與民意代表直接民選，但臺灣省主席、直轄市市長仍官派＝未完全落實 ②黨外運動：雷震事件（民49）、美麗島事件（民68）→民75 民進黨成立突破黨禁 ③解嚴（民76，蔣經國）→三月學運（民79）→終止動員戡亂（民80，李登輝）→省長民選（民83）→總統直選（民85）→政黨輪替（民89）。"},
{id:"k5Ab",ch:5,kind:"point",label:"戰後原住民政策",sub:"山地同胞→正名・★常考",
 note:"戒嚴時期：①稱呼——稱高山族原住民為「山地同胞」（山胞）②行政——要求改漢人姓名、以漢名登記戶籍，破壞原住民固有命名方式 ③社會——推行國語運動、要求說國語，造成各族群語言逐漸流失 ④土地——設立國家公園、山林保護區，導致土地流失。解嚴後爭取「正名」與「自治」：正名運動、拆除吳鳳銅像、還我土地運動、平埔族要求恢復身分；成果＝民83 修憲以「原住民」取代「山胞」、民85 成立原住民族委員會、民94《原住民族基本法》。"},
{id:"k5Dip",ch:5,kind:"point",label:"外交三階段",sub:"鞏固→彈性→務實・★常考",
 note:"①鞏固外交（民38–60）：爭取友邦支持、鞏固國際地位，謀求「確保臺灣，光復大陸」；靠韓戰後的美援與《中美共同防禦條約》②彈性外交（民60–77）：退出聯合國、臺美斷交後，仍堅持中華民國是中國唯一合法政府，致力與無邦交國發展經貿、文化交流 ③務實外交（民77–）：強調兩岸是分裂分治的對等政治實體，以經濟和民主突破中共外交封鎖，積極參與國際社會、取得多國免簽證資格。"},
{id:"k5Cross",ch:5,kind:"point",label:"兩岸三階段",sub:"武力→對峙→交流・★常考",
 note:"①武力對抗（民38–68）：中共「武力解放臺灣」vs 我方「反攻大陸、光復大陸」；古寧頭戰役與八二三炮戰均發生在金門 ②政治對峙（民68–76）：中共提出「一國兩制」「三通四流」、和平統戰；我方堅持「三民主義統一中國」與「三不政策」（不接觸、不談判、不妥協）③兩岸交流（民76–）：解嚴後開放探親，成立陸委會委託海基會（對岸窗口海協會），辜汪會談、小三通、大三通。"},
{id:"k5Eco",ch:5,kind:"point",label:"經濟政策六階段",sub:"重整→替代→導向→建設→升級→自由化",
 note:"戰後初期經濟重整（新臺幣、土地改革）→民40年代進口替代（保護國內輕工業、管制外國商品進口）→民50年代出口導向（加工出口區、勞力充足且低廉）→民60年代十大建設（能源危機、蔣經國、偏重交通與高雄重工業）→民70年代產業升級（技術與資本密集、新竹科學園區）→民80年代起自由化與國際化（民80 APEC、民91 WTO）。今日課題：生產成本提高、薪資上漲、勞力不足→僱用國際移工、產業外移，推動南向政策分散對中國投資風險。"},
{id:"k5SocC",ch:5,kind:"point",era:"roc2",label:"社會變遷",sub:"都市化・鄉村問題",
 note:"背景：民50年代工業產值逐漸超過農業，臺灣由農業社會轉型為工業社會。影響：①鄉村勞動力大量流入都市，形成人口集中都市的現象（都市有較多工作機會、生活便利），也帶來空氣汙染、噪音、城鄉差距 ②農村、漁村、山村和部落人口外移與老化，傳統產業發展困難、出現隔代教養；因勞力人口外流，鄉村人口結構呈現「雙凹型」。近年改革：整合各地觀光資源、號召專業人才回鄉，形塑地方特色創造商機。"},
{id:"k5Move",ch:5,kind:"point",era:"roc2",label:"社會運動",sub:"解嚴後蓬勃・★常考",
 note:"原因：①民70年代經濟發展帶來環保、勞工問題 ②政府解除戒嚴後各種新興社會運動興起。議題：①環保——反六輕、反核四（反核電）②勞工——保障工作權 ③女權——主張改革法律、追求兩性平等 ④農民——保障生存權 ⑤原住民——正名與還我土地 ⑥客家——提倡母語、還我客家話運動（民90 客家委員會成立）。"},
{id:"k5Cult",ch:5,kind:"point",label:"文化演變",sub:"中華→美國→鄉土→多元・★常考",
 note:"①戰後初期 中華文化：目的是清除日本統治的影響、培養國家認同；措施＝推行國語運動、禁止在公開場合說方言，限制本土語言及文化發展 ②民40、50年代 反共文化＋美國文化：以反共復國為國策，出現反共文學、反共電影與標語（反攻大陸、消滅朱毛）；韓戰後美援來臺，美國流行文化傳入 ③民60年代 鄉土文化：退出聯合國後外交陷入困境、經濟快速發展造成城鄉差距擴大，作家轉而關懷在地人民生活 ④民70年代後 多元文化：政治社會逐漸開放、全球化、新住民與國際移工增加，融合本土、原住民、外來文化。"},

{id:"e5Chen",ch:5,kind:"ex",era:"roc1",label:"陳儀・行政長官公署",sub:"被稱「新總督」",
 note:"陳儀擔任臺灣省行政長官，掌控政治、軍事大權，權力集中的程度被民眾詬病猶如「新總督」（類似日治時期的臺灣總督）。二二八事件後被撤職，臺灣省行政長官公署由臺灣省政府取代，首長改稱省主席。"},
{id:"e5Peace",ch:5,kind:"ex",era:"roc2",label:"228和平紀念日・轉型正義",sub:"公開道歉・賠償・紀念碑",
 note:"民80（1991）起政府針對當年處置失當公開道歉、進行賠償、興建紀念碑，並訂定228和平紀念日；後續設置人權紀念園區、成立「促進轉型正義委員會」，使社會朝向人權公義方向發展。"},
{id:"e5Law",ch:5,kind:"ex",era:"roc1",label:"動員戡亂時期臨時條款",sub:"民37–80・擴大總統職權",
 note:"民37（1948）制定，因應國共內戰進入戰爭準備。施行範圍＝全國。內容：擴大總統職權，後屢經修訂使總統可一再連任。民79 三月學運提出廢除訴求→民80 李登輝總統順應民意廢除，同時終止動員戡亂。"},
{id:"e5Mart",ch:5,kind:"ex",era:"roc1",label:"戒嚴令",sub:"民38–76・臺灣省",
 note:"民38（1949）政府遷臺，臺灣省政府（省主席陳誠）為防範共產勢力滲透實施《戒嚴令》。施行範圍＝臺灣省。內容：限縮《憲法》賦予人民的自由權（言論、出版、集會、結社），並限制營業時間；黨禁、報禁即由此而來。民76 蔣經國總統宣布解除。"},
{id:"e5Lei",ch:5,kind:"ex",era:"roc1",label:"雷震・自由中國",sub:"1949–1960・籌組中國民主黨",
 note:"雷震等人發行《自由中國》雜誌（1949–1960）評論時政，批評蔣中正威權統治、反對其連任三屆，宗旨是擴展民主自由空間；為制衡執政黨籌組中國民主黨。民49（1960）遭政府壓制，雷震以「知匪不報」罪名入獄，雜誌被迫停刊。"},
{id:"e5Formosa",ch:5,kind:"ex",era:"roc1",label:"美麗島雜誌・美麗島事件",sub:"1979・高雄・國際人權日",
 note:"民60年代經濟起飛、教育水準提高，人民追求政治改革。民68（1979）美麗島雜誌社以紀念國際人權日為由在高雄舉辦遊行、呼籲解嚴，引發警民衝突，許多黨外人士被捕入獄。結果：其他黨外人士於民75 成立民主進步黨，突破黨禁。"},
{id:"e5DPP",ch:5,kind:"ex",era:"roc1",label:"民主進步黨",sub:"1986・突破黨禁",
 note:"民75（1986）黨外人士（指非國民黨籍）在戒嚴時期突破黨禁組成民主進步黨，主張解除戒嚴、回歸憲政、追求民主自由，開啟政黨政治新頁。民89（2000）首次政黨輪替執政。"},
{id:"e5Wild",ch:5,kind:"ex",era:"roc2",label:"三月學運（野百合）",sub:"1990・廢除臨時條款",
 note:"民79（1990）大學生發起三月學運（野百合學運），提出「廢除臨時條款」等改革訴求。促成民80 終止動員戡亂、廢除臨時條款、推動修憲與中央民意代表全面改選，解決「萬年國會」的弊端。"},
{id:"e5CCK",ch:5,kind:"ex",era:"roc2",label:"蔣經國",sub:"解嚴・十大建設",
 note:"兩件關鍵事蹟：①行政院長任內推動十大建設（民62）②總統任內於民76 宣布解除戒嚴、開放黨禁報禁。任期 1978–1988（6～7任總統）。"},
{id:"e5Lee",ch:5,kind:"ex",era:"roc2",label:"李登輝",sub:"終止動員戡亂・首任民選總統",
 note:"民77（1988）繼任總統，推動務實外交。事蹟：民80 終止動員戡亂並廢除臨時條款、推動修憲與中央民代全面改選；民83 開放省長與直轄市長民選；民85 當選首任民選總統。任期 1988–2000（7～9任）。"},
{id:"e5Korea",ch:5,kind:"ex",era:"roc1",label:"韓戰・第七艦隊・美援",sub:"1950・轉危為安",
 note:"民39（1950）韓戰爆發，美國為防止共產勢力擴張派第七艦隊協防臺灣海峽。美援：民40～54（1951–1965）經濟上提供近15億美元援助；軍事上提供軍用品、派遣美軍顧問團駐臺。1960年代美國加入越戰，把臺灣當作後勤補給基地，駐臺美軍顯著增加。"},
{id:"e5Treaty",ch:5,kind:"ex",era:"roc1",label:"中美共同防禦條約",sub:"1954–1979",
 note:"民43（1954）簽訂，將臺灣納入東亞（西太平洋）反共防禦體系，臺海局勢逐漸穩定。民68（1979）臺美斷交後廢止，改由《臺灣關係法》維持非官方往來。"},
{id:"e5TRA",ch:5,kind:"ex",era:"roc1",label:"臺美斷交・臺灣關係法",sub:"1979・非官方往來",
 note:"民68（1979）美國為拉攏中共對抗蘇聯與中華人民共和國建交，與我國斷交並廢止《中美共同防禦條約》；另訂《臺灣關係法》，與我國維持實質經貿往來、軍售防禦性武器，維持臺海安全。"},
{id:"e5UN",ch:5,kind:"ex",era:"roc1",label:"退出聯合國",sub:"1971・邦交國銳減",
 note:"中華民國是聯合國創始會員國。民60（1971）中華人民共和國取得聯合國的「中國席位」，我國宣布退出，友邦紛紛與我國斷交。邦交國數量變化（我國／中共）：民40 37／19、民50 54／38、民60 55／65（此年逆轉）、民67 21／112、民112 13／182。"},
{id:"e5Gun",ch:5,kind:"ex",era:"roc1",label:"古寧頭戰役",sub:"1949・金門",
 note:"民38（1949）10月共軍進犯金門，國軍戰勝，史稱古寧頭戰役。影響：國軍獲勝，臺灣局勢暫時穩定。同年 10/1 中華人民共和國成立、12月中華民國政府遷臺。"},
{id:"e5823",ch:5,kind:"ex",era:"roc1",label:"八二三炮戰",sub:"1958・金門",
 note:"民47（1958）共軍猛烈炮火轟擊金門，國軍在美國協防下反擊。影響：此後兩岸不再出現大規模武力對抗。金門在武力對抗時期是軍事前線，兩岸交流時期則轉為小三通據點。"},
{id:"e5SEF",ch:5,kind:"ex",era:"roc2",label:"海基會・海協會",sub:"兩岸事務機構",
 note:"我方：官方行政院大陸委員會（陸委會，民80成立）→委託→民間海峽交流基金會（海基會）。中方：官方國務院臺灣事務辦公室（國臺辦）→委託→民間海峽兩岸關係協會（海協會）。兩會即為兩岸交流的對口窗口。"},
{id:"e5Koo",ch:5,kind:"ex",era:"roc2",label:"辜汪會談",sub:"1993・新加坡",
 note:"民82（1993）海基會董事長辜振甫與海協會會長汪道涵在新加坡舉行海峽兩岸第一次正式會談。民104（2015）另有馬習會談（馬英九與習近平，新加坡）。"},
{id:"e5Links",ch:5,kind:"ex",era:"roc2",label:"小三通・大三通",sub:"2001／2008",
 note:"小三通：民90（2001）開放金門、馬祖、澎湖與對岸往來。大三通：民97（2008）開放兩岸直航。三通＝通商、通郵、通航。金門、馬祖因此從軍事前線轉變為交流據點。"},
{id:"e5NT",ch:5,kind:"ex",era:"roc1",label:"新臺幣",sub:"1949・4萬換1元",
 note:"民38（1949）發行新臺幣以穩定物價，舊臺幣4萬元折換新臺幣1元，穩定戰後臺灣的金融秩序。對照日治時期：成立臺灣銀行、發行臺灣銀行券。"},
{id:"e5Land",ch:5,kind:"ex",era:"roc1",label:"土地改革",sub:"三七五減租・公地放領・耕者有其田",
 note:"民38（1949）起三步驟：①三七五減租——地租不得超過年收穫量的375‰，減輕佃農負擔 ②公地放領——政府讓佃農優先承購公有耕地 ③耕者有其田——政府徵收地主的土地，轉售實際耕作者。成效：佃農逐漸獲得自己的土地、轉型為自耕農，提高農業生產；地主則轉向工商業。"},
{id:"e5EPZ",ch:5,kind:"ex",era:"roc1",label:"加工出口區",sub:"民50年代・高雄臺中",
 note:"民50年代成立加工出口區（高雄、臺中），吸引國內外企業投資設廠，輸出食品、成衣、家電等輕工業產品，優勢是勞力充足且低廉。影響：經濟型態由農業轉變為以工業為主，中小企業蓬勃發展。"},
{id:"e5Ten",ch:5,kind:"ex",era:"roc1",label:"十大建設",sub:"六交通＋三重工業＋一能源",
 note:"民62（1973）行政院長蔣經國推動。交通六項：中山高速公路、鐵路電氣化、北迴鐵路、臺中港、蘇澳港、中正國際機場（今臺灣桃園國際機場）。重工業三項：大煉鋼廠、中國造船廠（今臺灣國際造船公司）、石油化學工業。能源一項：核能發電廠。特色：偏重交通建設，重工業集中在高雄。成果：外貿成長，成為亞洲四小龍（臺灣、香港、南韓、新加坡）。"},
{id:"e5HSP",ch:5,kind:"ex",era:"roc2",label:"新竹科學工業園區",sub:"1980・高科技",
 note:"民69（1980）設置（現稱新竹科學園區），發展資訊、電子、光電及生物科技等高科技產業，促使經濟轉型為技術與資本密集、高附加價值的產業型態。"},
{id:"e5WTO",ch:5,kind:"ex",era:"roc2",label:"APEC・WTO",sub:"民80／民91・走入國際",
 note:"民80（1991）加入亞太經濟合作會議（APEC）；民91（2002）加入世界貿易組織（WTO）。背景：在全球化趨勢下放寬貿易限制、積極參與國際市場。"},
{id:"e5Mand",ch:5,kind:"ex",era:"roc1",label:"國語運動",sub:"戰後初期・禁說方言",
 note:"戰後初期為清除日本統治的影響、培養國家認同，推行國語運動並禁止在公開場合說方言，限制本土語言及文化發展。對照日治後期的國語運動：主導者臺灣總督府、背景皇民化運動、國語＝日語；戰後初期主導者是行政長官公署與臺灣省政府、背景是推廣中華文化去日本化、國語＝漢語（華語）。"},
{id:"e5USCul",ch:5,kind:"ex",era:"roc1",label:"美國文化",sub:"搖滾樂・ICRT・好萊塢",
 note:"韓戰爆發後美援來臺，美國流行文化大量傳入臺灣，例如搖滾樂、ICRT、好萊塢電影與西洋歌曲。1960年代美國加入越戰、臺灣成為後勤補給基地，駐臺美軍增加，更助長美國文化流行。"},
{id:"e5Native",ch:5,kind:"ex",era:"roc1",label:"鄉土文學・黃春明",sub:"民60年代・兒子的大玩偶",
 note:"背景：①退出聯合國後外交陷入困境 ②經濟快速發展造成城鄉差距擴大。部分作家轉而關懷在地人民生活，帶動鄉土文學風潮，代表如黃春明《兒子的大玩偶》——以寫實手法描繪農民、勞工等小人物的遭遇。同期還有愛國電影與民歌運動（「唱自己的歌」）。"},
{id:"e5AbName",ch:5,kind:"ex",era:"roc2",label:"原住民正名・還我土地",sub:"民83 修憲・恢復族名",
 note:"正名運動：解嚴後原住民要求修改「山胞」用語、恢復族名；民83（1994）修憲以「原住民」取代「山胞」，民85 成立原住民族委員會，民94《原住民族基本法》。還我土地運動：戰後初期政府劃設山地保留地，後續為經濟發展開放民間與企業進入開發，導致原住民土地大量流失，解嚴後陸續發起還我土地運動。另有拆除吳鳳銅像、平埔族要求恢復原住民身分。"},
{id:"e5Hakka",ch:5,kind:"ex",era:"roc2",label:"還我客家話運動",sub:"民90 客委會成立",
 note:"客家族群提倡說母語、辦理文化活動（「還我母語」「還我客家話運動」）。成果：民90（2001）客家委員會成立，延續客家傳統文化。閩客族群同樣提倡母語（閩南語、客家語）、維護傳統文化。"},
{id:"e5Green",ch:5,kind:"ex",era:"roc2",label:"反六輕・反核四",sub:"環保運動",
 note:"民70年代經濟發展帶來環保、勞工問題，解嚴後社會運動蓬勃：環保團體訴求反六輕、反核四（反核電）；勞工團體訴求保障工作權、兩性平權。"},
// ===== 第4章 日治時期 =====
// ---- 時間軸 ----
{id:"t30",ch:4,kind:"time",era:"jp1",label:"1896 六三法",sub:"總督專制的法源・★常考",
 note:"日本頒布「法律第六十三號」（簡稱六三法），授予臺灣總督頒布具有法律效力的命令（律令）之權——總督因此集行政、立法、司法及軍事大權於一身。"},
{id:"t31",ch:4,kind:"time",era:"jp1",label:"1899 成立臺灣銀行",sub:"統一發行貨幣",
 note:"清帝國時期各國貨幣都可在臺流通、幣制混亂。1899 成立臺灣銀行統一發行貨幣，解決幣制問題，也提供日商前進南洋的資金。"},
{id:"t32",ch:4,kind:"time",era:"jp1",label:"1905 首次人口普查",sub:"臺灣第一次戶口普查",
 note:"1905 年總督府在臺實施第一次人口普查，之後定期舉辦；作法＝利用警察深入調查，建立詳實的人口資料（出現「戶口調查簿」＝戶口名簿），有助統治與人力運用。"},
{id:"t33",ch:4,kind:"time",era:"jp1",label:"1908 西部縱貫鐵路通車",sub:"基隆↔高雄",
 note:"1908 年完成基隆到高雄的西部縱貫鐵路，強化西半部的連結；另興建阿里山森林鐵路。海運整建基隆港與高雄港（有利南進政策），通訊普設郵局、電報、電話。"},
{id:"t34",ch:4,kind:"time",era:"jp1",label:"1910–1915 五年理蕃計畫",sub:"武力征討・開發山林",
 note:"1910 年代日本已大致控制臺灣社會，第五任總督佐久間左馬太開始「五年理蕃計畫」。目的：①讓全臺原住民歸順 ②開發山林資源。作法：土地公有、沒收槍械、武力鎮壓、強制勞役、驅離傳統領域、警察介入部落。"},
{id:"t35",ch:4,kind:"time",era:"jp1",label:"1915 西來庵事件",sub:"漢人最後一次大規模武裝抗日",
 note:"余清芳以宗教為名，在噍吧哖（今臺南市玉井區）組織群眾武裝抗日。結果：因缺乏訓練無法與日軍抗衡，多人失敗被捕。影響：臺人有鑑於武裝抗日犧牲慘重，轉以非武裝的政治、社會運動爭取權益。"},
{id:"t36",ch:4,kind:"time",era:"jp2",label:"1918 一戰結束→1919 內地延長主義",sub:"民族自決・改派文官總督",
 note:"第一次世界大戰（1914–1918）於 1918 年結束，美國總統威爾遜提出的「民族自決」思潮風行全球；日本自 1919 年起改採內地延長主義。日本改採「內地延長主義」：將臺灣視為日本「內地」的一部分、標榜「日臺合一」、改派文官總督（1919–1937）。目的＝避免臺灣人受風潮影響而追求自治、獨立。"},
{id:"t37",ch:4,kind:"time",era:"jp2",label:"1921 臺灣文化協會・議會請願",sub:"非武裝抗日的起點・★常考",
 note:"1921 年林獻堂、蔣渭水等人成立「臺灣文化協會」（宗旨＝「謀臺灣文化之向上」）；同年展開「臺灣議會設置請願運動」（1921–1934，共請願15次，要求設立民選的臺灣議會、爭取立法權）。"},
{id:"t38",ch:4,kind:"time",era:"jp2",label:"1922 蓬萊米問世",sub:"磯永吉・稻米外銷日本",
 note:"磯永吉培育並種出符合日本人口味的「蓬萊米」，1922 年改良成功。結果：稻米產量增加，可大量銷往日本。"},
{id:"t38a",ch:4,kind:"time",era:"jp2",label:"1925 二林事件",sub:"全島性農民運動的開端",
 note:"彰化二林的蔗農爭取權益時與警察爆發衝突，多人遭逮捕判刑。影響：此後開啟全島性的農民運動，是「第一憨，種甘蔗予會社磅」這句俗諺最具體的事件。"},
{id:"t39",ch:4,kind:"time",era:"jp2",label:"1927 臺灣民眾黨",sub:"臺灣史上第一個合法政黨",
 note:"蔣渭水成立臺灣民眾黨（1927–1931）——臺灣第一個合法政黨。他原是臺灣文化協會的專務理事，因文協左傾、理念不合而另組。主張：提倡自由民權、破除社會惡習與迷信、反對吸食鴉片、積極支持農工運動。"},
{id:"t3a",ch:4,kind:"time",era:"jp2",label:"1928 臺北帝國大學",sub:"日治時期臺灣最高學府",
 note:"1928 年總督府設立「臺北帝國大學」（今臺灣大學前身），是日治時期臺灣最高學府、高等教育最具代表性者。但高等教育機構不足，有志升學者多前往日本留學。"},
{id:"t3b",ch:4,kind:"time",era:"jp2",label:"1930 霧社事件・嘉南大圳完工",sub:"原住民最大抗日・水利工程",
 note:"1930 年賽德克族頭目莫那魯道率領族人在霧社起事，日方調動軍警並使用毒氣、飛機轟炸，原住民死傷慘重。同年八田與一設計建造的嘉南大圳完工，大幅增加嘉南平原的灌溉面積。"},
{id:"t3c",ch:4,kind:"time",era:"jp2",label:"1934 日月潭水力發電所完工",sub:"工業化的電力基礎",
 note:"1934 年日月潭水力發電所完工，提供工業發展所需電力，是「工業臺灣、農業南洋」與南進基地化的關鍵建設；臺灣輕工業生產指數自此明顯上揚。"},
{id:"t3d",ch:4,kind:"time",era:"jp2",label:"1935 首次地方議員選舉",sub:"臺人第一次行使參政權・★常考",
 note:"受臺灣地方自治聯盟推動，1935 年總督府首次開放（有限度的）地方議員選舉——臺灣民眾第一次行使投票權。限制：僅少數男性有投票權、半數席次仍由官派，並未落實真正的地方自治。"},
{id:"t3e",ch:4,kind:"time",era:"jp3",label:"1937 中日戰爭爆發・皇民化",sub:"社會運動全面被禁・★常考",
 note:"1937 中日戰爭爆發（盧溝橋事變），日本推行皇民化運動（1937–1945），並配合南進政策。臺灣的政治社會運動受到打壓而被迫終止，總督改回武官。"},
{id:"t3f",ch:4,kind:"time",era:"jp3",label:"1941 太平洋戰爭・國民學校",sub:"戰爭動員・取消小公學校差別",
 note:"1941 年太平洋戰爭爆發（珍珠港事變）；美軍此後轟炸臺灣，西部縱貫公路與鐵路受損。同年配合皇民化運動，將小學校、公學校一律改稱「國民學校」，取消名稱上的差別（實質差別待遇仍在）。戰爭後期徵召臺人從軍、赴南洋作戰。"},
{id:"t3g",ch:4,kind:"time",era:"jp3",label:"1943 六年國民義務教育",sub:"臺灣最早的義務教育",
 note:"1943 年開始實施六年國民義務教育——臺灣最早的義務教育，學齡兒童就學率大幅提升。"},
{id:"t3h",ch:4,kind:"time",era:"jp3",label:"1945 日本投降",sub:"日治結束・中華民國接收",
 note:"1945 年日本戰敗投降，第二次世界大戰結束，臺灣結束日本 50 年的殖民統治，由中華民國接收。"},
// ---- 主題 ----
{id:"m4Pol",ch:4,kind:"theme",label:"日治政治發展",sub:"抗日→治臺三階段・★常考",
 note:"兩條線一起看：①臺人的反抗——武裝抗日（臺灣民主國、西來庵事件）→非武裝的政治社會運動→1937 後全面被禁 ②日本的統治——無方針主義（1895–1919，武官）→內地延長主義（1919–1937，文官）→皇民化運動（1937–1945，武官）。兩個轉折點：1919 一戰結束、1937 中日戰爭爆發。"},
{id:"m4Rule",ch:4,kind:"theme",era:"jp1",label:"殖民統治體制",sub:"總督專制＋警察保甲",
 note:"以臺灣總督府為最高統治機構，《六三法》授權總督頒布具法律效力的命令，總督集行政、立法、司法、軍事大權於一身。地方控制靠「警察制度」（各地廣設派出所，民眾稱之為「大人」）與「保甲制度」（10戶1甲設甲長、10甲1保設保正，青壯年男子組壯丁團），兩者相互配合，有效監控臺灣社會、穩固統治基礎。"},
{id:"m4Ab",ch:4,kind:"theme",label:"理蕃政策與原住民",sub:"安撫圍堵→武力征討→教化",
 note:"三階段：①日治初期＝安撫＋圍堵（設隘勇線限制活動、招待頭目赴日參觀、設蕃童教育所）②1910 起＝五年理蕃計畫，武力征討、開發山林資源 ③霧社事件後＝改採較溫和手段，加強教育與同化、將山區原住民「集團移住」遷往山下集中管理。"},
{id:"m4Eco",ch:4,kind:"theme",label:"殖民經濟發展",sub:"農業臺灣→工業臺灣・★常考",
 note:"先打基礎（後藤新平：專賣、戶口／土地／林野調查、統一貨幣與度量衡、交通建設），再分兩期：日治前期「農業臺灣、工業日本」（新式製糖、蓬萊米、嘉南大圳，供應日本國內民生需求）；1930 年代起「工業臺灣、農業南洋」（配合南進政策，日月潭電力、軍需工業、輕工業，臺灣轉為半農半工社會）。"},
{id:"m4Soc",ch:4,kind:"theme",label:"日治社會與文化",sub:"差別教育・移風易俗・都市",
 note:"教育＝差別待遇與隔離政策（小學校／公學校／蕃童教育所），但也建立西式教育制度、培養新的社會菁英。移風易俗＝放足斷髮、漸禁鴉片、公共衛生與醫療、守時守法觀念。都市＝1920年代起引進現代都市計畫，1940年代形成臺北、高雄、臺南等大都市，休閒生活公共化。"},
{id:"m4Mov",ch:4,kind:"theme",era:"jp2",label:"政治社會運動",sub:"民族自決→四大組織・★常考",
 note:"背景：1920 年代臺籍知識分子受國際「民族自決」風潮鼓舞，爭取臺人權益。四大組織按時間背：臺灣文化協會（1921–1931，文化啟蒙）→臺灣議會設置請願運動（1921–1934）→臺灣民眾黨（1927–1931，第一個合法政黨）→臺灣地方自治聯盟（1930–1937）。結束：1937 中日戰爭爆發後被迫終止。"},

{id:"k4Rep",ch:4,kind:"point",era:"jp1",label:"臺灣民主國",sub:"抗拒接收・非追求獨立・★常考",
 note:"背景：1894 清、日因朝鮮問題爆發甲午戰爭，1895 清帝國戰敗簽訂《馬關條約》，割讓臺灣、澎湖給日本；消息傳回臺灣後，官紳倡組「臺灣民主國」。目的＝效忠清朝、抗拒日本接收（並非追求獨立建國）。領導：推唐景崧為總統、丘逢甲為義軍統領、劉永福為大將軍。結果：兵力與武器不如日本，領導者先後離臺，民主國瓦解→臺灣進入日本 50 年的殖民統治。象徵物：「藍地黃虎旗」。"},
{id:"k4Armed",ch:4,kind:"point",era:"jp1",label:"漢人武裝抗日",sub:"終點＝1915 西來庵事件",
 note:"日本接收臺灣後，臺灣漢人在各地發動抗日行動；最後一次大規模武裝抗日＝1915 年西來庵事件（余清芳，噍吧哖／今臺南玉井）。影響：武裝抗日犧牲慘重→臺人轉向非武裝的政治、社會運動爭取權益。"},
{id:"k4Gov",ch:4,kind:"point",era:"jp1",label:"總督專制（六三法）",sub:"集四大權於一身・★常考",
 note:"1895 年日人在臺設立臺灣總督府，是日本在臺最高統治機構，以臺灣總督為首長。1896 年頒布「法律第六十三號」（六三法），授予總督頒布具法律效力命令的權力→總督集行政、立法、司法及軍事大權於一身。"},
{id:"k4Ctrl",ch:4,kind:"point",era:"jp1",label:"警察與保甲制度",sub:"「警察政治」・★常考",
 note:"總督專制之外，地方靠「警察政治」＝警察制度＋保甲制度兩隻手。警察制度：目的＝鎮壓臺人反抗、加強地方控制；在各地廣設派出所；職務無所不管（鎮壓抗日分子、檢查衛生、宣傳政令），權力很大使人民畏懼，被稱為「大人」。保甲制度：目的＝配合警察；10戶1甲設甲長（類似鄰長）、10甲1保設保正（類似里長）；工作＝維護治安、嚴密監控社會、推動政務（調查戶口、宣達政令）；保甲中的青壯年男子組成「壯丁團」，協助救災與鎮壓抗日分子。成效：警察與保甲相互配合，建立堅實的統治基礎。"},
{id:"k4S1",ch:4,kind:"point",era:"jp1",label:"無方針主義",sub:"1895–1919・武官・殖民地特殊統治",
 note:"又稱「殖民地特殊統治時期」。時間 1895–1919（總督為武官）。背景＝日本剛領有臺灣，抗日事件頻繁。目的＝漸進式統治、鎮壓反抗鞏固統治，採非同化政策。方式：①鎮壓各地武裝抗日 ②安撫——尊重臺灣人民的風俗習慣、籠絡人心以消除反抗意識。抗日代表＝1915 西來庵事件。結果：一次大戰後轉向同化政策。"},
{id:"k4S2",ch:4,kind:"point",era:"jp2",label:"內地延長主義",sub:"1919–1937・文官・日臺合一",
 note:"時間 1919–1937（改派文官總督）。背景＝一次大戰於 1918 年結束、「民族自決」思潮風行（各民族有權決定自身事務、不受他人干涉）。目的＝避免臺灣人受風潮影響而追求自治、獨立，改採同化政策。方式：①將殖民地視為「內地」（日本）的一部分 ②標榜「日臺合一」 ③日本部分國內法可施行於臺灣。抗日：漢人轉向非武裝的社會運動；原住民 1930 霧社事件。結果：臺灣人並未獲得與日本人相同的待遇——實際上仍存在差別待遇。"},
{id:"k4S3",ch:4,kind:"point",era:"jp3",label:"皇民化運動",sub:"1937–1945・武官・徹底同化",
 note:"時間 1937–1945（總督改回武官）。背景：①1937 中日戰爭爆發（起於盧溝橋事變）②配合日本南進政策，1941 太平洋戰爭（起於珍珠港事變）。1936 年小林躋造總督來臺執行皇民化運動，臺灣進入戰時體制。目的＝戰爭需要充分動員人力物資，強化臺灣人對日本的愛國心，成為效忠天皇的子民。方式（七項）：說日語、改日姓、穿和服、拜神社、實行日本風俗與禮儀、徵召臺人從軍、部分臺籍婦女被迫充當「慰安婦」。抗日：社會運動均被禁止。戰爭實況：1941 年後美軍轟炸臺灣，西部縱貫公路、鐵路受損；學生的旅遊行程也改為參拜神社和到醫院慰問士兵。結果：日本戰敗投降（天皇「玉音放送」宣布終戰），中華民國接收臺灣。"},
{id:"k4AbEarly",ch:4,kind:"point",era:"jp1",label:"初期安撫與圍堵",sub:"隘勇線・蕃童教育所",
 note:"背景：總督府疲於壓制平地武裝抗日事件，對原住民先採防堵、安撫。作法：①安撫＝設置「隘勇線」限制原住民活動範圍 ②教化＝設學校（如「蕃童教育所」）教化原住民、引進現代文明 ③宣威＝集合部落首領赴日參觀，見識現代文明與武力，宣揚日本國力也攏絡原住民 ④圍堵＝運用軍警深入山區迫原住民降服，用鐵絲電網圍堵，藉以取得山地資源。結果：①文化衝擊——原住民傳統文化受到衝擊 ②部落衝突——部分接受教化的原住民幫助日本統治，引發部落內部摩擦與衝突。"},
{id:"k4AbFive",ch:4,kind:"point",era:"jp1",label:"五年理蕃計畫",sub:"1910起・武力征討・★常考",
 note:"背景：1910 年代日本已大致控制臺灣社會（第五任總督佐久間左馬太）。目的：①企圖讓全臺原住民歸順 ②開發山林資源。作法：①土地公有——總督府將大部分土地收歸公有，限縮原住民生活空間 ②壓迫原住民——沒收槍械、武力鎮壓、強制勞役、驅離傳統領域 ③打通東西橫貫道路，建立開發東部的運輸幹線 ④透過教育同化使原住民歸順 ⑤警察介入——以權威統治介入原住民社會，並延續清末以來的制度，將部落領袖稱為「頭目」以方便管理。結果：山林資源被開發、林木與樟腦被掠奪；原住民被迫改變生活方式、以勞力換取生活物資；受山地警察欺凌、負擔過重勞役→引發對日統治的不滿（霧社事件的遠因）。"},
{id:"k4Wushe",ch:4,kind:"point",era:"jp2",label:"霧社事件",sub:"1930・莫那魯道・★常考",
 note:"時間 1930 年。原因：①日本開發山林資源並侵擾原住民部落 ②日軍強迫族人服勞役，又不尊重原住民文化。經過：賽德克族頭目莫那魯道率領族人襲殺日人；總督府出動軍警，使用大炮、飛機、毒氣鎮壓。結果：原住民死傷慘重；日本國內及國際輿論譴責（臺灣民眾黨曾致電國際聯盟，抗議「日本使用毒瓦斯屠殺霧社人民」），臺灣總督下臺。影響：①溫和手段——總督府改變統治手段，強調警察應善待原住民、注意教化山區的風俗文化 ②集團移住——將山區原住民集體遷往山下，影響部落組織型態。原民調適：知難以武力抗日，逐漸調適並接受教化；二戰後期部分原住民組成高砂義勇隊赴南洋作戰。"},
{id:"k4Base",ch:4,kind:"point",era:"jp1",label:"基礎建設",sub:"後藤新平・專賣與三大調查・★常考",
 note:"主導＝民政長官後藤新平等人。①拓展財源：日治初期臺灣財政依賴日本國庫補助，總督府將鴉片、樟腦等列為專賣、獨占經營→財政收入大增（1898 年後財政逐漸獨立）②調查工作：1905 起定期舉辦人口普查（出現戶口調查簿）、土地調查（確定土地所有權以利徵稅，田賦收入增加）、林野調查（無主山林收歸國有，賣給資本家開發山林資源）③統一貨幣及度量衡：1899 成立臺灣銀行統一發行貨幣，並統一度量衡與日本一致，減少市場交易爭議 ④交通建設：1908 完成基隆到高雄的西部縱貫鐵路、興建阿里山森林鐵路，整建基隆港與高雄港（有利南進），普設郵局、電報、電話。結果：奠定臺灣日後工業化的發展基礎，提高日本企業的投資意願。"},
{id:"k4Agr",ch:4,kind:"point",era:"jp1",label:"農業臺灣・工業日本",sub:"糖業王國・蓬萊米・嘉南大圳",
 note:"日治初期採「農業臺灣、工業日本」的分工體系：改善臺灣的農業生產環境，供應日本工業化後的民生需求。①新式製糖業＝總督府扶持日本資本家設立新式製糖廠（以機械動力取代舊式糖廍——糖廍是傳統製糖場所，多分布於南部，以人力或獸力牽引榨出蔗汁，再人工熬製成蔗糖），設糖業試驗所培育新品種、擴大蔗園面積→有「糖業王國」美譽；蔗農備受剝削，出現「第一憨，種甘蔗予會社磅」的俗諺 ②稻作改良＝磯永吉培育「蓬萊米」（1922 改良成功），稻米大量銷往日本 ③水利設施＝八田與一設計建造嘉南大圳（1930 完工），增加嘉南平原灌溉面積，稻米與甘蔗產量大增。"},
{id:"k4Ind",ch:4,kind:"point",era:"jp2",label:"工業臺灣・農業南洋",sub:"1930年代・南進基地化",
 note:"背景：1930 年代日本向外擴張，把臺灣設為南洋補給基地，在臺推動工業化。目標＝「工業臺灣、農業南洋」＝南進基地化。重大建設：①電力＝1934 日月潭水力發電所完工，提供工業發展的電力 ②軍需工業＝發展機械、石化、金屬、造船 ③輕工業＝紡織、食品加工（鳳梨罐頭）也顯著成長。影響：①奠定臺灣日後工業基礎，提供充足電力 ②臺灣逐漸從農業社會走向工業社會（轉成半農、半工的社會）。"},
{id:"k4Edu",ch:4,kind:"point",label:"差別待遇的殖民教育",sub:"小學校／公學校／蕃童教育所・★常考",
 note:"原則＝差別待遇、隔離政策，同時建立西式教育制度。目的：①同化——作為同化臺灣人民及推動產業政策的工具 ②新知——讓臺灣人從教育中獲得現代知識。初等教育：小學校（日本人就讀，課程比照日本內地）／公學校（臺灣人就讀，以教授日語為主）／蕃童教育所（原住民就讀）——無論師資、設備均比不上小學校，有種種限制與不公平待遇；1941 年配合皇民化一律改稱「國民學校」，1943 年開始實施六年國民義務教育。中等教育：初期以招收日人為主；1915 年成立第一所專收臺人子弟的臺中中學校；職業學校培養醫師（醫學校）、公學校教師（師範學校）、初級技術人才。高等教育：1928 臺北帝國大學（今臺灣大學）最具代表性；因高等教育不足，臺人多前往日本留學。影響：1920 年代以後新的社會菁英階層逐漸崛起，成為日後政治、社會與文化運動的推手。"},
{id:"k4Mov",ch:4,kind:"point",era:"jp2",label:"文化啟蒙與政治社會運動",sub:"四大組織・1937 終止・★常考",
 note:"背景：①世界潮流——第一次世界大戰後全世界流行「民族自決」思潮（美國總統威爾遜提出）②日本國內要求民主呼聲高漲，衝擊臺灣知識分子。四大組織：①臺灣文化協會（1921–1931，林獻堂、蔣渭水；發行《臺灣民報》、設讀報社、舉辦演講會與夏季學校；喚起臺人民族意識）②臺灣議會設置請願運動（1921–1934，林獻堂；共請願15次，要求設立民選的臺灣議會、爭取立法權；日本政府雖未採納，但激起臺人追求自治的想法）③臺灣民眾黨（1927–1931，蔣渭水；臺灣史上第一個合法政黨）④臺灣地方自治聯盟（1930–1937，林獻堂等人離開民眾黨另組；宣傳民權與地方自治→促成 1935 年總督府首次開放地方議員選舉）。結束：1937 中日戰爭爆發後被迫終止。"},
{id:"k4Custom",ch:4,kind:"point",era:"jp2",label:"移風易俗與現代觀念",sub:"放足斷髮・公共衛生・守時守法",
 note:"臺灣三大陋習＝吸食鴉片、辮髮、纏足，總督府逐一「改革」。①放足斷髮、禁吸鴉片：放足斷髮最初消極（為避免臺人抗爭而未積極禁止），後來透過保甲制度與多方宣導、由士紳倡導放足剪辮，帶動「易服改裝」風氣；影響＝改變服飾風潮（衣服帽子變成歐美或日式，但漢日洋並存）、婦女得到解放（走出家庭，從事教師、護士、車掌等工作）；鴉片自 1897 年起施行專賣，初採消極的漸禁態度（吸食者持有許可證即可購買，未嚴加禁止），總督府藉專賣獲利，因而被批評「無根絕誠意」，後因知識分子反對而被迫改變作法（臺灣民眾黨曾致電國際聯盟，力陳鴉片之害、請臺人重視基本人權），但效果有限、鴉片並沒有絕跡。②建立公共衛生及醫療制度：原因＝有效防止臺灣傳染病肆虐；作法＝醫療建立西式醫院、辦理預防注射和接種（推廣疫苗對抗霍亂等傳染病），公共建造自來水與下水道等公共衛生設施；影響＝改善傳染病肆虐的環境、防疫保健衛生觀念逐漸普及、傳染病逐漸得到控制、死亡率大幅下降→人口快速成長，臺灣人的壽命獲得提升。③養成守法守時的觀念：守法＝將現代司法制度引進臺灣、各級地方法院設立，確立臺灣的司法制度；守時＝改用西曆，並為符合工業生產需要引進標準時間制（一天24小時）與一週七天的星期制，舉辦守時宣傳活動→民眾養成守時習慣、行政機關與交通逐漸遵守時間、開始重視放假與休閒活動（除政府機關與學校外，民間仍沿用農曆）。"},
{id:"k4City",ch:4,kind:"point",era:"jp2",label:"現代都市與休閒生活",sub:"都市計畫・百貨公司・棒球",
 note:"都市出現：原因＝1920 年代以後人口增加與集中，總督府引進現代化都市計畫（建設道路、自來水、下水道等公共設施）→1940 年代臺灣形成臺北、高雄、臺南等大都市。休閒生活公共化：①總督府在各地建造公園、博物館 ②1930 年代臺北的菊元百貨與臺南的林百貨相繼落成，開臺灣百貨公司之先河——前往百貨公司「搭電梯」是當時民眾最時髦的活動；另有咖啡館、新式餐廳、博物館等休閒場所 ③總督府推廣棒球運動 ④媒體與休閒地點＝報紙、廣播、咖啡廳與劇院出現 ⑤日本文化流行（溫泉、料理、歌曲）⑥搭乘鐵路的長程旅遊觀光盛行——都市中各類休閒娛樂場所日漸普及：百貨公司、咖啡廳、泡溫泉、西餐廳。新舊文化的調適：日治時期引進現代文明，但並未使臺灣原有傳統風俗消失，總督府推行的新制度不完全落實於民間，使臺灣社會中漢人、日本與西洋文化並存。城鄉差距：現代化均出現於都市，鄉村和原住民部落則大致保留原來的生活型態。"},
{id:"k4AbId",ch:4,kind:"point",era:"jp3",label:"原住民社會演變與身分認同",sub:"以「族」區分・高砂義勇隊",
 note:"①族群觀念改變：原先原住民只有部落意識；總督府派學者根據習俗、語言、分布等要素進行調查，以「族」來區分原住民→促使族群觀念發生變化。②傳統文化改變：透過「蕃童教育所」與警察，教育原住民接受現代禮儀與醫療等知識，強迫停止出草、文面與室內葬等習俗→改變原住民傳統的社會文化。③語言姓氏改變：原住民被要求改日姓、說日語；族群語言混雜日語，甚至姓名以日語發音；平埔族語言快速流失，只剩噶瑪蘭族等語言可在族內流通。④身分上的矛盾：原住民以部落為中心、無國族意識；太平洋戰爭時參加「高砂義勇隊」至南洋作戰，產生新的身分（日本兵）——對參戰有不同態度，有志願的，也有被迫的。"},

{id:"e3Yingfa",ch:3,kind:"ex",era:"qpost",label:"通商問題→英法聯軍之役",sub:"1857・開港的起點",
 note:"清帝國與英、法因通商問題（外國要求擴大通商、公使駐京等）交惡，1857 年爆發英法聯軍之役，清廷戰敗。這是臺灣被迫開港通商的起點——外力入侵四部曲的第一部。"},
{id:"e3Tianjin",ch:3,kind:"ex",era:"qpost",label:"天津條約",sub:"1858・開港的法源",
 note:"1857 英法聯軍之役後，清廷於 1858（咸豐8年）簽訂《天津條約》，先開放淡水、安平，後又增開雞籠、打狗。1860 年代臺灣正式開港通商，重新進入國際貿易市場。"},
{id:"e3Viet",ch:3,kind:"ex",era:"qpost",label:"越南問題",sub:"清法戰爭的起因",
 note:"清帝國與法國因越南的宗主權問題爆發衝突，1884 年清法戰爭開打，戰火波及基隆、淡水、澎湖（臺灣人稱「西仔反」）。結果促使清廷更重視臺灣→1885 建省。"},
{id:"e4Korea",ch:4,kind:"ex",era:"jp1",label:"朝鮮問題",sub:"甲午戰爭的起因・★常考",
 note:"清帝國與日本因朝鮮的宗主權問題衝突，1894 年爆發甲午戰爭。這是「朝鮮問題→甲午戰爭→馬關條約→割讓臺澎→臺灣民主國」這條因果鏈的起點。"},
{id:"e4Maguan",ch:4,kind:"ex",era:"jp1",label:"馬關條約",sub:"1895・割讓臺灣澎湖",
 note:"1895 年清帝國於甲午戰爭戰敗，與日本簽訂《馬關條約》，割讓臺灣、澎湖給日本。消息傳回臺灣後，官紳倡組臺灣民主國抗拒接收；同年日本展開統治，臺灣進入 50 年的殖民時期。"},
{id:"e4Tang",ch:4,kind:"ex",era:"jp1",label:"唐景崧・丘逢甲・劉永福",sub:"臺灣民主國三人組",
 note:"唐景崧＝總統（清末代臺灣巡撫）；丘逢甲＝義軍統領；劉永福＝大將軍，抗拒日本接收臺灣。結果：三人先後離臺，民主國瓦解。象徵：「藍地黃虎旗」。"},
{id:"e4Yu",ch:4,kind:"ex",era:"jp1",label:"余清芳・噍吧哖",sub:"西來庵事件・1915",
 note:"余清芳以宗教（西來庵）為名組織群眾武裝抗日，地點在噍吧哖（今臺南市玉井區）。因缺乏訓練無法與日軍抗衡，多人失敗被捕。這是漢人最後一次大規模武裝抗日，之後轉向非武裝的政治社會運動。臺南有余清芳紀念碑。"},
{id:"e4Law",ch:4,kind:"ex",era:"jp1",label:"六三法",sub:"法律第六十三號・1896",
 note:"1896 年日本頒布「法律第六十三號」，授權臺灣總督頒布具有法律效力的命令（律令）→總督集行政、立法、司法及軍事大權於一身，是總督專制的法源。為什麼特殊：日本國內的立法權由帝國議會掌握，僅天皇能發布緊急命令代替法律；《六三法》等於把「立法權」下放給臺灣總督，因此賦予總督極大的權力。"},
{id:"e4Bao",ch:4,kind:"ex",era:"jp1",label:"保甲・壯丁團",sub:"10戶1甲・10甲1保",
 note:"來源：保甲是清代既有的地方自衛組織，日本沿用來輔佐警察與地方機構執行公共事務。編制：10 戶為 1 甲設甲長（類似鄰長）；10 甲為 1 保設保正（類似里長），並採「連坐法」——一人違法全甲同罰，因此監控特別嚴密。運作：保甲輔助警察執行地方行政事務（調查戶口、宣達政令）；保甲中的青壯年男子組成「壯丁團」，協助警察維護治安、救災與鎮壓抗日分子。"},
{id:"e4Cop",ch:4,kind:"ex",era:"jp1",label:"警察「大人」",sub:"派出所・無所不管",
 note:"總督府在各地廣設派出所。警察是地方行政的重要角色，職務無所不管：鎮壓抗日分子、檢查衛生、宣傳政令、調查戶口。權力很大使人民相當畏懼，被稱為「大人」。日治時期臺灣每萬人配置的警察人數比例在當時各地中最高。"},
{id:"e4Line",ch:4,kind:"ex",era:"jp1",label:"隘勇線・蕃童教育所",sub:"圍堵＋教化",
 note:"隘勇線＝在山區設置，限制原住民活動範圍，並以鐵絲電網圍堵，藉以取得山地資源。蕃童教育所＝設在部落的學校，教化原住民、引進現代文明，也是後來改變原住民傳統習俗（出草、文面、室內葬）的推手。另有招待部落首領赴日參觀以宣揚國力。"},
{id:"e4Mona",ch:4,kind:"ex",era:"jp2",label:"莫那魯道・賽德克族",sub:"霧社事件領導者",
 note:"1930 年賽德克族頭目莫那魯道率領族人在霧社襲殺日人。總督府以軍警、大炮、飛機與毒氣鎮壓，原住民死傷慘重；國際輿論譴責日本使用毒瓦斯，臺灣總督因此下臺。"},
{id:"e4Gaosha",ch:4,kind:"ex",era:"jp3",label:"高砂義勇隊",sub:"太平洋戰爭・赴南洋作戰",
 note:"第二次世界大戰後期，部分原住民自願或受徵調組成「高砂義勇隊」前往南洋作戰，產生新的身分（日本兵）。這是原住民在霧社事件後「知難以武力抗日、逐漸調適並接受教化」的延伸結果。對參戰有不同態度：有志願的，也有被迫的。"},
{id:"e4Goto",ch:4,kind:"ex",era:"jp1",label:"後藤新平",sub:"民政長官・基礎建設主導者",
 note:"日治初期的民政長官，主導臺灣的基礎建設：專賣制度拓展財源、戶口／土地／林野三大調查、統一貨幣與度量衡、交通建設。1898 年後臺灣財政逐漸獨立，不再依賴日本國庫補助。"},
{id:"e4Mono",ch:4,kind:"ex",era:"jp1",label:"專賣制度（鴉片・樟腦）",sub:"財政收入大增",
 note:"1897 年起對鴉片施行專賣，之後陸續納入樟腦、菸、酒、鹽等物資，由總督府獨占經營，是日治初期最重要的財源，使臺灣財政收入大增、有助推動各項建設。注意：鴉片專賣與「漸禁」政策並行，這也是禁鴉片效果有限的原因之一。"},
{id:"e4Bank",ch:4,kind:"ex",era:"jp1",label:"臺灣銀行",sub:"1899・統一發行貨幣",
 note:"1899 年成立，發行統一貨幣「臺灣銀行券」，解決清帝國時期各國貨幣都可流通的幣制混亂問題，方便臺日之間資金流通，也提供日商前進南洋的資金。與統一度量衡並列為「統一貨幣及度量衡」的兩大措施。"},
{id:"e4Survey",ch:4,kind:"ex",era:"jp1",label:"戶口・土地・林野調查",sub:"三大調查・★常考",
 note:"①戶口調查：1905 年第一次人口普查，之後定期舉辦，利用警察深入調查，建立詳實人口資料（戶口調查簿）→有助統治與人力運用 ②土地調查：確定土地所有權以利徵稅，使田賦收入增加——但原住民無法證明土地產權，生活空間因此被壓縮 ③林野調查：無主山林收歸國有，部分賣給資本家開發森林資源。"},
{id:"e4Rail",ch:4,kind:"ex",era:"jp1",label:"西部縱貫鐵路・基隆高雄港",sub:"1908 通車",
 note:"陸運：1908 年完成基隆到高雄的西部縱貫鐵路——突破西部河川東西向、不利南北往來的地形限制，連結西部重要城鎮，成為南北交通動脈；另興建阿里山森林鐵路，是臺灣林業開發的見證。海運：整建基隆港（臺灣與日本聯絡的門戶）與高雄港（南部貨物主要進出港），有利南進政策。通訊：普設郵局（郵便局）、電報、電話。目的是便於殖民統治及獲取臺灣資源。"},
{id:"e4Sugar",ch:4,kind:"ex",era:"jp1",label:"新式製糖業・糖業王國",sub:"第一憨種甘蔗予會社磅",
 note:"總督府為提高蔗糖產量，扶持日本資本家設立新式製糖廠（以機械動力取代舊式糖廍），並設糖業試驗所培育新品種、擴大蔗園面積。結果：臺灣製糖蓬勃發展，有「糖業王國」美譽；但蔗農權益備受壓榨——被限制販售對象（只能賣給指定會社）、又遭偷斤減兩，出現「第一憨，種甘蔗予會社磅」的俗諺，並在 1925 年引發二林事件。"},
{id:"e4Erlin",ch:4,kind:"ex",era:"jp2",label:"二林事件",sub:"1925・蔗農抗爭・★常考",
 note:"1925 年彰化二林的蔗農，為爭取甘蔗收購權益而與警察爆發衝突，多人遭逮捕判刑。背景：新式製糖會社限制蔗農的販售對象、又偷斤減兩壓低收購價。影響：此後開啟全島性的農民運動，也是臺灣農民組合成立的契機。"},
{id:"e4Rice",ch:4,kind:"ex",era:"jp2",label:"蓬萊米・磯永吉",sub:"1922 改良成功",
 note:"磯永吉培育並種出符合日本人口味的「蓬萊米」，1922 年改良成功。結果：稻米產量增加，可大量銷往日本。與新式製糖合稱日治前期「農業臺灣、工業日本」的兩大主力：米與糖。"},
{id:"e4Canal",ch:4,kind:"ex",era:"jp2",label:"嘉南大圳・八田與一",sub:"1930 完工",
 note:"八田與一設計建造，1930 年完工，是日治時期規模最大的水利工程。目的＝提升農業生產力。結果：增加嘉南平原的灌溉面積，使稻米、甘蔗產量增加，米、糖產量有助於供應日本的需求。與清代四大水圳對照：從民間合資走向殖民政府主導的大型工程。"},
{id:"e4Power",ch:4,kind:"ex",era:"jp2",label:"日月潭水力發電所",sub:"1934 完工・工業化關鍵",
 note:"1934 年完工，提供工業發展所需的電力，是「工業臺灣、農業南洋」與南進基地化最重要的建設。臺灣輕工業生產指數在 1934 年後明顯上揚——生產指數反映產業發展速度，指數愈高發展愈快。"},
{id:"e4Sch",ch:4,kind:"ex",label:"小學校・公學校・蕃童教育所",sub:"初等教育三軌・★常考",
 note:"小學校＝日本人就讀，課程與日本內地一致；公學校＝臺灣人就讀，以教授日語為主；蕃人公學校與蕃童教育所＝原住民就讀（教師多由日本警察擔任）。無論師資、設備均比不上小學校，有種種限制與不公平待遇。1941 年配合皇民化一律改稱「國民學校」，1943 年實施六年國民義務教育。"},
{id:"e4TC",ch:4,kind:"ex",era:"jp2",label:"臺中中學校",sub:"1915・第一所專收臺人子弟",
 note:"1915 年林獻堂等臺灣士紳集資成立，是第一所專收臺灣人子弟的中學（今臺中一中）。中等教育初期以招收日人為主；職業學校則培養醫師（醫學校）、公學校教師（師範學校）與初級技術人才。"},
{id:"e4Univ",ch:4,kind:"ex",era:"jp2",label:"臺北帝國大學",sub:"1928・今臺灣大學",
 note:"1928 年總督府設立，是日治時期臺灣最高學府（今臺灣大學前身）。因高等教育資源與名額不足、臺灣人升學不易（1928 年臺灣人就學率仍只有20%左右），經濟條件較優渥的臺灣人大多前往日本留學；這些留學生回臺後，扮演推動政治社會運動的主要角色。統計對照：高等學校學生日本人 220 人、臺灣人僅 28 人。"},
{id:"e4Assoc",ch:4,kind:"ex",era:"jp2",label:"臺灣文化協會・臺灣民報",sub:"1921–1931・文化啟蒙",
 note:"1921 年林獻堂、蔣渭水等人成立，宗旨＝「謀臺灣文化之向上」，推行啟迪民智的工作、喚醒臺人民族意識。內容：發行《臺灣民報》、設讀報社、舉辦演講會（文化演講）與夏季學校。1927 年因左傾分裂，蔣渭水另組臺灣民眾黨。"},
{id:"e4Pet",ch:4,kind:"ex",era:"jp2",label:"議會設置請願運動",sub:"1921–1934・15次・林獻堂",
 note:"由林獻堂、蔣渭水等人領導，1921–1934 年間共請願 15 次，訴求＝設立民選的「臺灣議會」、爭取立法權。結果：日本政府雖未採納，但激起臺人追求自治的想法、喚起政治意識。"},
{id:"e4Party",ch:4,kind:"ex",era:"jp2",label:"臺灣民眾黨",sub:"1927・第一個合法政黨・蔣渭水",
 note:"1927 年蔣渭水成立，是臺灣史上第一個合法政黨（1927–1931）。理念與行動：提倡自由民權、破除社會惡習與迷信、反對吸食鴉片、積極支持農工運動。今日國道5號（蔣渭水高速公路）即以他的名字命名。霧社事件時曾致電國際聯盟，抗議日本使用毒瓦斯屠殺霧社人民。"},
{id:"e4League",ch:4,kind:"ex",era:"jp2",label:"臺灣地方自治聯盟",sub:"1930–1937・促成1935選舉",
 note:"1930 年林獻堂等人離開臺灣民眾黨後另組，主張宣傳民權與地方自治、爭取參政權。結果：促成 1935 年總督府首次開放（有限度的）地方議員選舉——臺灣民眾第一次行使投票權。意義：對自治、普選、參政權有了初步概念。"},
{id:"e4Lin",ch:4,kind:"ex",era:"jp2",label:"林獻堂・蔣渭水",sub:"社會運動兩大推手・★常考",
 note:"林獻堂：臺中霧峰士紳，臺中中學校、臺灣文化協會、議會設置請願運動、臺灣地方自治聯盟的核心人物。蔣渭水：醫師，臺灣文化協會創辦人之一，1927 年成立臺灣民眾黨（第一個合法政黨），支持農工運動。記法：請願與自治聯盟＝林獻堂；民眾黨＝蔣渭水；文協＝兩人共同。"},
{id:"e4Foot",ch:4,kind:"ex",era:"jp2",label:"放足斷髮・漸禁鴉片",sub:"移風易俗・效果有限",
 note:"放足斷髮：最初消極（為避免臺人抗爭而未積極禁止），後來由士紳倡導放足、剪辮。影響：①改變服飾風潮（漢、日、洋並存）②婦女得到解放，走出家庭從事教師、護士、車掌等工作。鴉片：初採消極的漸禁態度（管制吸食人口），後因知識分子反對而被迫改變作法，但效果有限、鴉片並沒有絕跡（總督府本身即以鴉片專賣為財源）。"},
{id:"e4Hyg",ch:4,kind:"ex",era:"jp2",label:"公共衛生・自來水・西式醫院",sub:"傳染病受控・壽命提升",
 note:"原因＝有效防止臺灣傳染病肆虐。作法：醫療＝建立西式醫院、辦理預防注射和接種；公共＝建造自來水、廁所等公共衛生設施。影響：①將現代化的經驗引進臺灣，改善傳染病肆虐的環境 ②防疫、保健、衛生觀念逐漸普及 ③傳染病逐漸得到控制，臺灣人的壽命獲得提升。"},
{id:"e4Time",ch:4,kind:"ex",era:"jp2",label:"標準時間・星期制・司法制度",sub:"守時守法觀念",
 note:"守時：為符合工業生產需要，引進標準時間制（一天24小時）與一週七天的星期制，並舉辦各種守時宣傳活動→民眾養成守時習慣、行政機關與交通逐漸遵守時間、開始重視放假與休閒；但除政府機關與學校外，民間仍沿用農曆。守法：將現代司法制度引進臺灣，各級地方法院設立，確立臺灣的司法制度，臺人養成守法觀念。"}

<tr><th>日治</th><td><span style="color:var(--green);font-weight:600">平埔族</span>　／　<span style="color:var(--orange);font-weight:600">高砂族</span></td></tr>
<tr><th>中華民國</th><td><span style="color:var(--green);font-weight:600">部分平埔族</span>（多未列入）　／　<span style="color:var(--orange);font-weight:600">高山族</span>（山地同胞）</td></tr>
<tr><th>民國83年</th><td>兩線合流→修憲正名，統稱「<span class="hl">原住民族</span>」（現認定<span class="hb">16族</span>）</td></tr>

t5:{title:"荷蘭・西班牙・鄭氏在臺統治比較",html:`<table>
<tr><th></th><th style="color:var(--orange)">荷蘭</th><th style="color:var(--red)">西班牙</th><th style="color:var(--green)">鄭氏</th></tr>
<tr><th>時間</th><td>1624～1662年（<span class="hb">38年</span>）</td><td>1626～1642年（<span class="hb">16年</span>）</td><td>1662～1683年（<span class="hb">約20年</span>）</td></tr>
<tr><th>亞洲總部／地區</th><td><span class="hb">巴達維亞</span>（雅加達）・<span class="hl">南部</span></td><td><span class="hb">馬尼拉</span>（菲律賓）・<span class="hl">北部</span></td><td>臺灣</td></tr>
<tr><th>來臺目的</th><td>貿易、傳播<span class="hl">基督教</span></td><td>貿易、傳播<span class="hl">天主教</span></td><td>建立<span class="hl">反清復明</span>根據地</td></tr>
<tr><th>在臺建城</th><td>•<span class="hb">熱蘭遮城</span>（大員）<br>•<span class="hb">普羅民遮城</span>（赤崁）<br>•今<span class="hb">淡水紅毛城</span></td><td><span class="hb">聖薩爾瓦多城</span>（基隆）、<span class="hb">聖多明哥城</span>（淡水）</td><td><span class="hb">承天府</span>（臺南）</td></tr>
<tr><th>統治原住民</th><td>•鎮壓反抗↔與歸順者結盟<br>•定期召開<span class="hl">地方會議</span>，授予各社長老權杖，間接統治<br>•創制<span class="hl">新港文</span></td><td>•鎮壓反抗➡安撫歸降<br>•建教堂、傳播天主教</td><td>•漢人拓墾入侵原住民空間<br>•要求原住民負擔勞役<br>•設學校，教導<span class="hl">儒家文化</span></td></tr>
<tr><th>原住民經濟</th><td>游耕、狩獵（捕鹿➡荷蘭透過漢原交易取得<span class="hb">鹿皮</span>）</td><td>游耕、狩獵</td><td>開始學習漢人農耕技術➡逐漸以<span class="hb">耕種</span>為務</td></tr>
<tr><th>土地拓墾</th><td>招募漢人來臺種<span class="hb">稻米、甘蔗</span></td><td>—</td><td><span class="hl">軍屯</span>最重要</td></tr>
<tr><th>對外貿易</th><td>對象：中國、日本、東南亞<br>出口：<span class="hl">稻米、蔗糖、鹿皮</span><br>進口：絲綢、瓷器、香料<br>➡<span class="hb">轉口貿易獲利可觀</span></td><td>對象：中國、東南亞、日本（<span class="hb">鎖國後中斷</span>）</td><td>對象：中國（<span class="hl">走私貿易</span>）、日本、<span class="hl">英國</span>、東南亞<br>出口：<span class="hl">蔗糖、鹿皮</span><br>進口：<span class="hb">軍需品、布匹</span><br>➡使鄭氏政權穩定在臺發展</td></tr>
<tr><th>退出臺灣</th><td>被<span class="hb">鄭成功</span>驅逐</td><td>被<span class="hb">荷蘭人</span>驅逐</td><td><span class="hb">施琅</span>攻臺、鄭克塽出降</td></tr>
</table>`},
