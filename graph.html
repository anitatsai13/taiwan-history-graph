/* --- ★ 重點字：把比較表中的紅字（.hl）／藍字（.hb）拆成關鍵詞，比對節點「標題＋副標」---
   正規化：臺=台 互通、大小寫互通（搜尋也共用此函式） */
const normS = s => (s||"").toLowerCase().replace(/臺/g,"台");
const HL_WORDS = {hl:new Set(), hb:new Set()};   // 3字以上：節點「點亮」比對用（2字太泛，會亮到近七成節點）
const KW_ALL   = {hl:new Set(), hb:new Set()};   // 2字以上：衛星掛點用（限定在該節點自己的內文，2字不會泛）
const TBL_PAIRS = {};                            // 名稱→地點 配對（來自表格「彩字（地點）」）
{
  const splitWords = t => normS(t)
    .split(/[\s（）()、，,．。・／/→➡↔；;：:「」『』★＝=＋+—–\-～~｜|]+/)
    .filter(w => w.length>=2 && !/^\d+(年|世紀)?$/.test(w));
  const dv = document.createElement("div");
  Object.values(TABLES).forEach(T=>{
    dv.innerHTML = T.html;
    dv.querySelectorAll(".hl").forEach(s=>splitWords(s.textContent).forEach(w=>{ KW_ALL.hl.add(w); if(w.length>=3) HL_WORDS.hl.add(w); }));
    dv.querySelectorAll(".hb").forEach(s=>splitWords(s.textContent).forEach(w=>{ KW_ALL.hb.add(w); if(w.length>=3) HL_WORDS.hb.add(w); }));
    /* 表格配對：彩字後面緊跟「（地點）」→ 記成 名稱→地點，例：聖薩爾瓦多城（基隆） */
    dv.querySelectorAll(".hl,.hb").forEach(s=>{
      const nx = s.nextSibling;
      if(nx && nx.nodeType===3){
        const m = nx.textContent.match(/^（([一-龥]{2,4})）/);
        if(m) splitWords(s.textContent).forEach(w=>{
          /* 只收「建物／據點」類名稱，避免「渡臺禁令（對漢人）」這種非地點括號被誤配 */
          if(!TBL_PAIRS[w] && (/(城|府|圳)$/.test(w) || w==="馬尼拉" || w==="巴達維亞")) TBL_PAIRS[w]=m[1];
        });
      }
    });
  });
}
/* 補充重點詞（表格未標色但屬必背） */
["馬關條約"].forEach(w=>{ const wn=normS(w); KW_ALL.hl.add(wn); HL_WORDS.hl.add(wn); });
nodes.forEach(n=>{
  const hay = normS(n.label);   // 只比對標題（含副標會亮太多）
  if([...HL_WORDS.hl].some(w=>hay.includes(w))) n.hlk="hl";        // 紅字優先
  else if([...HL_WORDS.hb].some(w=>hay.includes(w))) n.hlk="hb";
});
/* ★ 衛星掛點：每個節點把「自己內文（副標＋說明）中的紅/藍重點字」＋「副標中的地點」展開成一串小點
   例：圓山文化 → 貝塚 → 臺北；卑南文化 → 石板屋 → 石板棺 → 玉器 → 臺東 */
const KW_LOC = ["臺北","臺中","臺南","臺東","新北","基隆","高雄","宜蘭","花蓮","屏東","雲林","嘉義","彰化","南投","苗栗","新竹","桃園","澎湖","恆春","淡水","安平","打狗","雞籠","八里","大員","赤崁"];
/* 衛星點停用詞：單獨掛出來沒有意義的泛用詞 */
const KW_STOP = new Set(["司法","行政","政治","經濟","社會","文化","貿易","影響","原因","結果","背景","對抗","合作","安撫","興築","堅持","原住民","漢人","北臺","南臺","意義","發展","最重要","最早","最大","北部","南部","中部","東部","教育","醫療","府城"].map(w=>normS(w)));
/* 至少一次出現且後面不是數字才算命中——避免「北部150、淡水18、卑南20村落」這種統計片段被拆成地名點 */
const hasClean = (text, w)=>{
  let i=-1;
  while((i=text.indexOf(w,i+1))!==-1){
    const c=text[i+w.length];
    if(!c || !/[0-9０-９]/.test(c)) return true;
  }
  return false;
};
nodes.forEach(n=>{
  const lab = normS(n.label);
  /* 「（比較：…）」「（比較表…）」括號是對照別人的內容，不算本節點的重點字——先剔除再比對
     （例：西班牙節點的說明寫「（比較：荷蘭傳基督教、創新港文）」，荷蘭/基督教/新港文不該掛在西班牙身上） */
  const noteC = (n.note||"").replace(/（比較[^）]*）/g,"");
  const hay = normS(n.sub||"")+"｜"+normS(noteC);
  /* 節點內文的配對：「X建Y城/府」與「Y城/府/圳（X）」→ Y 顯示成「X－Y」，例：雞籠－聖薩爾瓦多城 */
  const pairs = {};
  const src = (n.sub||"")+"。"+noteC;
  for(const m of src.matchAll(/(?:在|於)?([一-龥]{2,3})建([一-龥]{2,9}(?:城|府))/g)) pairs[m[2]] = m[1];
  for(const m of src.matchAll(/([一-龥]{2,9}(?:城|府|圳))（([一-龥]{2,4})）/g)) if(!pairs[m[1]]) pairs[m[1]] = m[2];
  const pairOf = w => pairs[w] || TBL_PAIRS[w] || null;
  const kw = [];
  const push = (w,k)=>{
    const wN = normS(w);
    if(KW_STOP.has(wN)) return;                                        // 泛用詞不掛
    const eraN = normS(ERA_LABEL[n.era]||"");
    if(n.era && (eraN.includes(wN) || wN.includes(eraN))) return;      // 分期膠囊已寫的不重掛（荷蘭節點不掛「荷蘭」「荷蘭人」）
    const p = pairOf(w);
    if(lab.includes(wN)){                      // 標題已有的詞：僅在有配對地點時才掛（掛的是配對資訊）
      if(p && !lab.includes(normS(p))) kw.push({w, k, pair:p});
      return;
    }
    if(hasClean(hay, wN)) kw.push(p ? {w, k, pair:p} : {w, k});
  };
  KW_ALL.hl.forEach(w=>push(w,"hl"));
  KW_ALL.hb.forEach(w=>push(w,"hb"));
  kw.sort((a,b)=> (b.pair?1:0)-(a.pair?1:0) ||                              // 配對點（地點－名稱）最優先，不被上限擠掉
                  (a.k===b.k ? b.w.length-a.w.length : (a.k==="hl"?-1:1))); // 再紅先、長詞先
  const picked=[];
  kw.forEach(it=>{
    const nw = normS(it.w);                                            // 臺＝台 正規化後再比，避免「臺北」與「台北盆地」重複掛
    const idx = picked.findIndex(p=>{
      const pw = normS(p.w);
      return pw.includes(nw) || nw.includes(pw) ||
        (p.pair && (normS(p.pair).includes(nw) || nw.includes(normS(p.pair))));
    });
    if(idx<0) picked.push(it);
    else if(!picked[idx].pair && it.w.length>picked[idx].w.length) picked[idx]=it;   // 重疊時取較長的完整詞（英國→英國籍）
  });
  /* 「A→B」改稱/演變配對：合併成一顆「A→B」點（例：熟番→平埔族、生番→高砂族）
     另一側若已在標題裡（不會單獨掛點），直接補在箭頭另一端 */
  /* 第二側用 lookahead 不吃字，讓「大坌坑→圓山→卑南」這種連鎖的每一段都能配到 */
  for(const m of src.matchAll(/([一-龥]{2,5})\s*(?:→|➡)\s*(?=([一-龥]{2,5}))/g)){
    const na=normS(m[1]), nb=normS(m[2]);
    const ia=picked.findIndex(p=>!p.pair && (p.w===na || na.endsWith(p.w) || p.w.endsWith(na)));
    const ib=picked.findIndex(p=>!p.pair && (p.w===nb || nb.startsWith(p.w) || p.w.startsWith(nb)));
    if(ia>=0 && ib>=0 && ia!==ib){
      picked[ia] = {w: picked[ia].w+"→"+picked[ib].w, k: picked[ia].k};
      picked.splice(ib,1);
    } else if(ia>=0 && ib<0 && lab.includes(nb) && !picked[ia].w.includes("→")){
      picked[ia] = {w: picked[ia].w+"→"+m[2], k: picked[ia].k};
    } else if(ib>=0 && ia<0 && lab.includes(na) && !picked[ib].w.includes("→")){
      picked[ib] = {w: m[1]+"→"+picked[ib].w, k: picked[ib].k};
    }
  }
  const subN = normS(n.sub||"");
  KW_LOC.forEach(L=>{
    const Ln=normS(L);
    /* 「配對點」已含該地點、或已有同名關鍵字時略過；一般包含關係（淡水女學堂）不吃掉地點本身 */
    /* 已被任一重點字包含的地點不再單獨掛（例：已有「台北盆地」就不再掛「臺北」）*/
    const used = picked.some(p=>(p.pair && (normS(p.pair).includes(Ln) || normS(p.w).includes(Ln))) || normS(p.w).includes(Ln));
    if(subN.includes(Ln) && !lab.includes(Ln) && !used) picked.push({w:L,k:"loc"});
  });
  /* 「X市的A、B」地名群組 → 一顆配對點「X－A・B」（例：臺南－新營・林鳳營／高雄－左營・前鎮） */
  for(const m of src.matchAll(/([一-龥]{2,3})市的([一-龥]{2,5}(?:、[一-龥]{2,5})*)/g)){
    const names = m[2].split("、").join("・");
    if(!picked.some(p=>p.pair===m[1] && p.w===names)) picked.push({w:names, k:"loc", pair:m[1]});
  }
  /* 「X人＝A、B」對應群組 → 每組一顆配對點，分開向下展開
     （例：漳州－開漳聖王／泉州－保生大帝・清水祖師／潮州－三山國王） */
  for(const m of src.matchAll(/([一-龥]{2,4})人(?:（[^）]*）)?＝([一-龥]{2,6}(?:、[一-龥]{2,6})*)/g)){
    const names = m[2].split("、").join("・");
    if(!picked.some(p=>p.pair===m[1] && p.w===names)) picked.push({w:names, k:"loc", pair:m[1]});
  }
  /* 已被配對點涵蓋的城市字（高雄、臺南…）不再單獨掛 */
  for(let i=picked.length-1;i>=0;i--){
    const it=picked[i];
    if(it.pair) continue;
    if(picked.some(p=>p!==it && p.pair && (normS(p.pair).includes(normS(it.w)) || normS(p.w).includes(normS(it.w))))) picked.splice(i,1);
  }
  /* 相鄰節點的標籤已呈現的資訊不再掛——樹上已經是「節點＋連線」了
     （例：聖薩爾瓦多城下有子節點「今基隆」，就不再掛「基隆－聖薩爾瓦多城」衛星點） */
  const nbLabs = nbrs[n.id].map(o=>normS(o.label));
  const picked2 = picked.filter(it=>{
    const wN = normS(it.w), pN = it.pair ? normS(it.pair) : null;
    return !nbLabs.some(L=> L.includes(wN) || (pN && L.includes(pN)));
  });
  /* 多個地點合併成一顆（例：新北・八里）並保證保留；帶配對的地點群組（臺南－新營…）各自一顆；其餘上限 6 顆 */
  let locs = picked2.filter(it=>it.k==="loc" && !it.pair);
  const locPairs = picked2.filter(it=>it.k==="loc" && it.pair);
  const rest = picked2.filter(it=>it.k!=="loc");
  if(locs.length>1) locs = [{w: locs.map(l=>l.w).join("・"), k:"loc"}];
  const fin = [...rest.slice(0,6), ...locPairs, ...locs];
  /* 顯示順序固定：❶國籍（…籍）❷地點 ❸配對組 ❹其他——同類節點左右對照時同位置同類型 */
  const catRank = it => {
    if(/籍$/.test(it.w)) return 0;
    if(it.pair) return 2;
    if(it.k==="loc" || KW_LOC.some(L=>normS(L)===normS(it.w))) return 1;   // 地名（不論來源）都排第二位
    return 3;
  };
  fin.sort((a,b)=>catRank(a)-catRank(b));
  fin.forEach(it=>{ it.d = (it.pair ? it.pair+"－"+it.w : it.w).replace(/台/g,"臺"); });   // 顯示文字統一用「臺」
  if(fin.length) n.kw = fin;
});
/* 父子去重：實線相鄰的兩節點掛到同一顆字時，保留在階層較高者（主題＞重點・時間＞實例）
   例：「馬賽人與外人合作」已掛 鹿皮／貿易，「馬賽人」就不再重掛 */
{
  const rank = {theme:3, point:2, time:2, ex:1};
  links.forEach(l=>{
    if(l.dash) return;
    const a=l.s, b=l.t;
    if(!a.kw || !b.kw) return;
    const [hi,lo] = (rank[a.kind]||1) >= (rank[b.kind]||1) ? [a,b] : [b,a];
    /* 配對點（X－A・B）保留在較下層的具體節點，從上層移除；一般字保留在上層 */
    const loW = new Set(lo.kw.map(p=>normS(p.w)));
    hi.kw = hi.kw.filter(it=>!(it.pair && loW.has(normS(it.w))));
    if(!hi.kw.length) delete hi.kw;
    const keep = lo.kw.filter(it=> it.pair || !(hi.kw||[]).some(p=>normS(p.w)===normS(it.w)));
    if(keep.length) lo.kw = keep; else delete lo.kw;
  });
}

/* ===== ✎ 衛星掛點編輯：覆蓋層（Patch Layer）=====
   原則：原始資料區 N／E 完全不動。使用者的修改存成一層補丁，
   載入時套在「自動算出來的衛星」之上；隨時可還原、可匯出 JSON 合併回正式檔。 */
const KW_KEY = "twhist_kw_v7";
let KWEDIT = {ver:1, base:"v7", kw:{}};
try{ const raw = localStorage.getItem(KW_KEY); const o = raw && JSON.parse(raw); if(o && o.kw) KWEDIT = o; }catch(e){}
/* 自動算出來的原始衛星先存一份，「還原自動」靠它 */
nodes.forEach(n=>{ n._kwAuto = n.kw ? n.kw.map(x=>({...x})) : null; });
function applyKwEdits(){
  nodes.forEach(n=>{
    const ov = KWEDIT.kw[n.id];
    if(ov){
      const items = ov.map(it=>({w:it.d, d:it.d, k:it.k||"hl"}));
      if(items.length) n.kw = items; else delete n.kw;
      n.kwEdited = true;
    }else{
      if(n._kwAuto) n.kw = n._kwAuto.map(x=>({...x})); else delete n.kw;
      n.kwEdited = false;
    }
  });
}
function saveKwEdits(){ try{ localStorage.setItem(KW_KEY, JSON.stringify(KWEDIT)); }catch(e){} }
/* 目前顯示中的衛星 → 可編輯的純資料陣列 */
function kwListOf(n){ return (n.kw||[]).map(it=>({d: it.d || it.w, k: it.k || "hl"})); }
/* list=null → 移除覆蓋、回到自動；list=[] → 這個節點不掛任何衛星 */
function setKw(n, list){
  if(list === null) delete KWEDIT.kw[n.id];
  else KWEDIT.kw[n.id] = list.filter(it=>it.d && it.d.trim()).map(it=>({d:it.d.trim(), k:it.k||"hl"}));
  applyKwEdits();
  saveKwEdits();
}
applyKwEdits();

/* --- 章節開關 --- */
const chOn = {1:true, 2:true, 3:true, 4:true, 5:true};
const chVis = n => !n.ch || !!chOn[n.ch];

/* --- 分層：0 年代 / 1 事件 / 2 人物 / 3 地點 / 4 重點 / 5 主題 --- */
let LW = 1800;
const ROW_Y = [-400, -225, -55, 115, 295, 470];
const ROW_NAME = ["年代", "事件", "人物", "地點", "重點", "主題"];
const ROW_OF_CAT = {"年代":0,"事件":1,"人物":2,"地點":3,"重點":4,"主題":5};
const ROW_TOP = [-400, -225, -55, 115, 295, 470];   // 佈局時依副線數重算
nodes.forEach(n=>{ n.cat = catOf(n); n.row = ROW_OF_CAT[n.cat]; });
const rows = [[],[],[],[],[],[]];

function place(arr){
  const m = arr.length;
  arr.forEach((n,i)=>{
    n.x = m===1 ? 0 : -LW/2 + i*LW/(m-1);
    n.y = ROW_Y[n.row];
    n.col = i;
  });
}
/* 每個節點的「年代錨點」＝它連到的最早時間節點的 x；沒有就取鄰居的平均 */
const KRANK = {time:0, theme:1, point:2, ex:3};
function anchorAll(){
  nodes.forEach(n=>{ n._ax = undefined; });
  rows[0].forEach(n=>{ n._ax = n.x; });
  const avg = a2 => a2.reduce((sum,v)=>sum+v,0)/a2.length;
  const tAnchor = n => {
    /* 指向「年代節點」的連線一律採用（含虛線，那是年份註記）；
       其餘推論仍只走實線，避免跨章對照把年代拉錯。 */
    const tn = [...adj[n.id]].map(id=>byId[id]).filter(o=>o && chVis(o) && o.kind==="time");
    return tn.length ? Math.min(...tn.map(o=>o.x)) : undefined;
  };
  /* 由下往上：實例→重點→主題，沒有自己的年代就取子節點的平均 */
  ["ex","point","theme"].forEach(kind=>{
    nodes.filter(n=>n.kind===kind && chVis(n)).forEach(n=>{
      const t = tAnchor(n);
      if(t!==undefined){ n._ax = t; return; }
      const lower = nbrs[n.id].filter(o=>o && chVis(o) && KRANK[o.kind]===KRANK[kind]+1 && o._ax!==undefined);
      if(lower.length) n._ax = avg(lower.map(o=>o._ax));
    });
  });
  /* 還是沒有的：往上一層拿，再不行就取任意實線鄰居 */
  for(let p=0;p<3;p++){
    nodes.forEach(n=>{
      if(n.kind==="time" || n._ax!==undefined || !chVis(n)) return;
      const nb = nbrs[n.id].filter(o=>o && chVis(o));
      const up = nb.filter(o=>KRANK[o.kind]===KRANK[n.kind]-1 && o._ax!==undefined);
      if(up.length){ n._ax = avg(up.map(o=>o._ax)); return; }
      const any = nb.filter(o=>o._ax!==undefined);
      if(any.length) n._ax = avg(any.map(o=>o._ax));
    });
  }
  nodes.forEach(n=>{ if(n._ax===undefined) n._ax = 0; });
}
/* 置位：x 直接等於年代錨點（精準對齊），同一列放不下就往下疊一條副線。
   這樣每個節點都在自己的年代正下方，不必為了避讓而左右偏移。 */
let LANE_H = 46;      // 副線之間的垂直距離（★重點字模式放大，見 layout()）
let ROW_PAD = 132;    // 列與列之間的距離（同上）
function placeRow(arr){
  const GAP = 124, SHIFT = 100;   // 容許的最大左右微調（小於一個間距）
  /* 同一年代錨點的節點：有 ord（時間順序）者依 ord 由上而下堆疊，讓垂直順序＝時間先後 */
  arr.sort((a,b)=>a._ax-b._ax || (a.ord||99)-(b.ord||99) || a.id.localeCompare(b.id));
  const laneLast = [];
  arr.forEach(n=>{
    let lane = 0, x = n._ax;
    for(; lane <= laneLast.length; lane++){
      if(laneLast[lane] === undefined){ x = n._ax; break; }       // 開新副線
      const need = laneLast[lane] + GAP;
      if(n._ax >= need){ x = n._ax; break; }                      // 原位就放得下
      if(need - n._ax <= SHIFT){ x = need; break; }               // 往右挪一點就放得下
    }
    laneLast[lane] = x;
    n.x = x;
    n.lane = lane;
  });
  arr.forEach((n,i)=>{ n.col = i; });
  return Math.max(1, laneLast.length);
}
function layout(){
  /* ★重點字模式：衛星鏈（最長約160）一律往下掛，副線距與列距放大到塞得下，關閉時還原 */
  LANE_H = hlOn ? 195 : 46;
  ROW_PAD = hlOn ? 235 : 132;
  rows.forEach(r=>r.length=0);
  nodes.forEach(n=>{ n.fanned=false; if(chVis(n)) rows[n.row].push(n); });
  const maxN = Math.max(1, ...rows.map(r=>r.length));
  LW = Math.max(1800, maxN*132);
  rows[0].sort((a,b)=>a.id.localeCompare(b.id));
  place(rows[0]);
  anchorAll();
  /* 主題下方長樹（心智圖式）：實線「只連到一個主題」的專屬節點，改掛到該主題正下方扇形展開。
     左→右＝時間順序（ord 優先，再依年代錨點）；超過 4 顆分兩層交錯。★重點字模式間距放大。
     ⚠ 先決定認領，再排中間列：被樹認領的節點不佔中間列空間，整列空了就不佔高度（消除中間大片空白）。 */
  const FAN_DY  = hlOn ? 240 : 130;   // 主題到第一層的距離
  const FAN_R2  = hlOn ? 205 : 96;    // 兩層交錯的層距
  const FAN_DX  = hlOn ? 165 : 132;   // 扇形水平間距
  const ordSort = (a,b)=>(a.ord||99)-(b.ord||99) || a._ax-b._ax || a.id.localeCompare(b.id);
  /* 先蒐集每棵樹的內容並估寬 */
  const claimed = new Set();
  const forest = rows[5].slice().sort((a,b)=>a._ax-b._ax || a.id.localeCompare(b.id)).map(t=>{
    const kids = nodes.filter(n=>chVis(n) && n.row>=1 && n.row<=4 && !claimed.has(n.id) &&
      nbrs[n.id].includes(t) &&
      nbrs[n.id].filter(o=>o.row===5).length===1);
    kids.sort(ordSort);
    kids.forEach(n=>claimed.add(n.id));
    const subsMap = new Map();
    kids.forEach(k=>{
      const subs = nodes.filter(n=>chVis(n) && n.row>=1 && n.row<=4 && !claimed.has(n.id) &&
        nbrs[n.id].includes(k) &&
        nbrs[n.id].filter(o=>o.row===5).length===0 &&
        nbrs[n.id].filter(o=>kids.includes(o)).length===1);
      if(!subs.length) return;
      subs.sort(ordSort);
      subs.forEach(n=>claimed.add(n.id));
      subsMap.set(k, subs);
    });
    /* 第三層：實線只連到「某顆第二層節點」的專屬子節點（例：古城 → 今地名） */
    const subs3Map = new Map();
    [...subsMap.values()].flat().forEach(s=>{
      const s3 = nodes.filter(n=>chVis(n) && n.row>=1 && n.row<=4 && !claimed.has(n.id) &&
        nbrs[n.id].includes(s) &&
        nbrs[n.id].filter(o=>o.row===5).length===0);
      if(!s3.length) return;
      s3.sort(ordSort);
      s3.forEach(n=>claimed.add(n.id));
      subs3Map.set(s, s3);
    });
    const two = kids.length>4;
    const cols = two ? Math.ceil(kids.length/2) : kids.length;
    const totalSub = [...subsMap.values()].reduce((s,a)=>s+a.length,0);   // 第二層整棵樹統一均分
    const totalS3 = [...subs3Map.values()].reduce((s,a)=>s+a.length,0);
    const w = Math.max(200, cols*FAN_DX, totalSub*FAN_DX*0.95, totalS3*FAN_DX*0.9) + 60;   // 樹寬＋樹間距
    return {t, kids, subsMap, subs3Map, two, cols, totalSub, w};
  });
  /* 中間列只排「沒被樹認領」的節點；整列空了就不佔高度 */
  for(let r=1;r<=4;r++){
    const keep = rows[r].filter(n=>!claimed.has(n.id));
    rows[r].length = 0; rows[r].push(...keep);
  }
  const lanes = [1];
  let y = ROW_Y[0];
  rows[0].forEach(n=>{ n.y = y; });
  ROW_TOP[0] = y;
  for(let r=1;r<=4;r++){
    if(!rows[r].length){ ROW_TOP[r] = y; lanes[r] = 0; continue; }   // 空列：跳過、不佔高度
    lanes[r] = placeRow(rows[r]);
    y += ROW_PAD;
    ROW_TOP[r] = y;
    rows[r].forEach(n=>{ n.y = y + n.lane*LANE_H; });
    y += (lanes[r]-1)*LANE_H;
  }
  y += ROW_PAD;
  ROW_TOP[5] = y;
  /* 標籤位置（樹上節點在樹排版時另設） */
  rows.forEach((r,i)=>{
    if(i===5) return;
    r.forEach(n=>{ n.labelUp = (i===0) ? (n.col%2===1) : ((lanes[i]||1)>1 ? false : n.col%2===1); });
  });
  /* 主題＝樹根：依年代序水平排開，全部回到同一條水平線，樹與樹不重疊 */
  const totalW = forest.reduce((s,f)=>s+f.w, 0);
  let fx = -totalW/2;
  const y5 = ROW_TOP[5];
  forest.forEach(f=>{
    const {t, kids, subsMap, subs3Map, two, cols, totalSub, w} = f;
    t.x = fx + w/2; t.y = y5; t.lane = 0; t.labelUp = false;
    kids.forEach((n,i)=>{
      const r2 = two ? i%2 : 0;
      const c  = two ? Math.floor(i/2) : i;
      n.x = t.x + (c-(cols-1)/2)*FAN_DX;
      n.y = y5 + FAN_DY + r2*FAN_R2;
      n.labelUp = false;
      n.fanned = true;
    });
    /* 第二層：整棵樹統一均分（依分支順序連續排開），避免各分支各自置中互相重疊 */
    const lv2y = y5 + FAN_DY + (two?FAN_R2:0) + FAN_R2;
    let j = 0;
    kids.forEach(k=>{
      const subs = subsMap.get(k);
      if(!subs) return;
      subs.forEach(n=>{
        n.x = t.x + (j-(totalSub-1)/2)*FAN_DX*0.95;
        n.y = lv2y;
        n.labelUp = false;
        n.fanned = true;
        j++;
      });
    });
    /* 第三層：掛在各自第二層節點正下方（例：古城 → 今地名） */
    const lv3y = lv2y + FAN_R2;
    subs3Map.forEach((s3, parent)=>{
      s3.forEach((n,i)=>{
        n.x = parent.x + (i-(s3.length-1)/2)*FAN_DX*0.9;
        n.y = lv3y;
        n.labelUp = false;
        n.fanned = true;
      });
    });
    fx += w;
  });
}
let hlOn = false;       // ★ 重點字開關（layout() 會讀，須先宣告）
layout();

// 視圖
let scale = 0.9, tx = 0, ty = 0;
const hidden = {"年代":false,"事件":false,"人物":false,"地點":false,"重點":false,"主題":false};
let hoverN = null, selN = null, dragN = null, panning = false;
let lastX=0, lastY=0;
let searchSet = null;   // 搜尋命中節點 id 集（畫布高亮用；draw 會讀，須先宣告）

function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
let C = {};
function refreshColors(){
  C = {
    canvas:css("--canvas"), ink:css("--ink"), muted:css("--muted"),
    edge:css("--edge"), edgeHl:css("--edge-hl"), hairline:css("--hairline"),
    theme:css("--theme"), pt:css("--pt"),
    blue:css("--blue"), red:css("--red"), green:css("--green"), orange:css("--orange")
  };
}
const ERA_C = {pal:"blue", neo:"red", metal:"green", hist:"orange", ming:"blue", nl:"orange", es:"red", cheng:"green", qpre:"blue", qpost:"orange", jp1:"blue", jp2:"green", jp3:"red", roc1:"red", roc2:"green"};
function nodeColor(n){
  if(n.era) return C[ERA_C[n.era]];
  if(n.kind==="theme") return C.theme;
  if(n.kind==="time") return C.muted;
  return C.pt;
}
function nodeR(n){ return KIND[n.kind].r; }
function visible(n){ return chVis(n) && !hidden[n.cat]; }

function resize(){
  DPR = window.devicePixelRatio||1;
  W = innerWidth; H = innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  cv.style.width = W+"px"; cv.style.height = H+"px";
}
addEventListener("resize", resize);
resize(); refreshColors();
if(window.matchMedia) matchMedia("(prefers-color-scheme: dark)").addEventListener("change", refreshColors);

let autoFit = true;
function fitView(){
  const act = nodes.filter(visible);
  if(!act.length) return;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  act.forEach(n=>{
    x0=Math.min(x0,n.x); y0=Math.min(y0,n.y);
    x1=Math.max(x1,n.x); y1=Math.max(y1,n.y);
  });
  x0 -= 150; x1 += 110;
  y0 -= (!hidden["年代"] && rows[0].length) ? 122 : 90;
  y1 += hlOn ? 220 : 70;   // 重點字模式：底列往下掛的衛星鏈要留空間
  const topPad=120, botPad=60, pad=30;
  const bw=Math.max(x1-x0,50), bh=Math.max(y1-y0,50);
  const ts=Math.min((W-pad*2)/bw, (H-topPad-botPad)/bh, 1.6);
  const cx=(x0+x1)/2, cy=(y0+y1)/2;
  const ttx=W/2-cx*ts, tty=topPad+(H-topPad-botPad)/2-cy*ts;
  scale+=(ts-scale)*0.15; tx+=(ttx-tx)*0.15; ty+=(tty-ty)*0.15;
}

/* 因果邊：在靠近終點處畫一個箭頭，方向由 mid→終點推得 */
function arrowHead(l, mid, hl){
  const tx0 = l.t.x, ty0 = l.t.y;
  let dx = tx0 - mid.mx, dy = ty0 - mid.my;
  const len = Math.hypot(dx, dy) || 1;
  dx /= len; dy /= len;
  const back = nodeR(l.t) + 3/scale;
  const ax = tx0 - dx*back, ay = ty0 - dy*back;
  const sz = 9/scale;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(ax, ay);
  ctx.lineTo(ax - dx*sz + dy*sz*0.5, ay - dy*sz - dx*sz*0.5);
  ctx.lineTo(ax - dx*sz - dy*sz*0.5, ay - dy*sz + dx*sz*0.5);
  ctx.closePath();
  ctx.fillStyle = hl ? C.edgeHl : C.ink;
  ctx.globalAlpha = hl ? 0.95 : 0.7;
  ctx.fill();
  ctx.restore();
}
function edgePath(l){
  if(l.s.row===l.t.row){
    const dir = (l.s.row===0 || l.s.row===rows.length-1) ? 1 : -1;
    const dist = Math.abs(l.t.x-l.s.x);
    const off = dir * Math.min(90, Math.max(35, dist*0.12));
    const cx=(l.s.x+l.t.x)/2, cy=(l.s.y+l.t.y)/2+off;
    ctx.moveTo(l.s.x,l.s.y);
    ctx.quadraticCurveTo(cx,cy,l.t.x,l.t.y);
    return {mx:(l.s.x+2*cx+l.t.x)/4, my:(l.s.y+2*cy+l.t.y)/4};
  }
  ctx.moveTo(l.s.x,l.s.y); ctx.lineTo(l.t.x,l.t.y);
  return {mx:(l.s.x+l.t.x)/2, my:(l.s.y+l.t.y)/2};
}

const FONT = f=>`${f.w?f.w+" ":""}${f.s}px system-ui, -apple-system, "Microsoft JhengHei", sans-serif`;
const BAND_DY = {1:-80, 2:-52}, BAND_H = 24;
/* 依可見時間節點的年代內插出「某西元年」在軸上的 x，再畫朝代／年號帶 */
function drawReigns(fsBase){
  const pts = [];
  rows[0].forEach(n=>{ const m = n.label.match(/1[0-9]{3}/); if(m) pts.push({y:+m[0], x:n.x}); });
  pts.sort((a,b)=>a.x-b.x);
  if(pts.length < 2) return;
  const first = pts[0], last = pts[pts.length-1];
  const xOf = y=>{
    if(y <= first.y) return first.x - 34;
    if(y >= last.y)  return last.x + 34;
    for(let i=1;i<pts.length;i++){
      if(y <= pts[i].y){
        const a = pts[i-1], b = pts[i];
        return a.x + (b.x-a.x)*((y-a.y)/Math.max(1, b.y-a.y));
      }
    }
    return last.x;
  };
  let anyT2 = false;
  REIGNS.forEach((rg,i)=>{
    if(rg.ch && !chOn[rg.ch]) return;
    const x0 = xOf(rg.from), x1 = xOf(rg.to), w = x1-x0;
    if(w < 8) return;
    if(rg.tier===2) anyT2 = true;
    const cy = ROW_TOP[0] + BAND_DY[rg.tier];
    ctx.globalAlpha = rg.tier===1 ? 0.22 : (i%2 ? 0.13 : 0.21);
    ctx.fillStyle = C[rg.c];
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(x0+1, cy-BAND_H/2, w-2, BAND_H, 5);
    else ctx.rect(x0+1, cy-BAND_H/2, w-2, BAND_H);
    ctx.fill();
    let fs = fsBase(rg.tier===1 ? 13 : 12);
    ctx.font = FONT({s:fs, w:600});
    if(ctx.measureText(rg.label).width > w-10){ fs = fsBase(9); ctx.font = FONT({s:fs, w:600}); }
    if(ctx.measureText(rg.label).width <= w-6){
      ctx.globalAlpha = 0.95; ctx.fillStyle = C.ink;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(rg.label, (x0+x1)/2, cy);
    }
  });
  ctx.globalAlpha = 0.8; ctx.fillStyle = C.muted;
  ctx.font = FONT({s:fsBase(11), w:600});
  ctx.textAlign = "right"; ctx.textBaseline = "middle";
  ctx.fillText("政權", -LW/2-60, ROW_TOP[0]+BAND_DY[1]);
  if(anyT2) ctx.fillText("年號", -LW/2-60, ROW_TOP[0]+BAND_DY[2]);
  ctx.globalAlpha = 1;
}
/* 關聯集（不限層數）：沿實線「往下」取整棵子樹＋「往上」取完整上層脈絡，再補直接相鄰（含虛線） */
function relatedSet(f){
  const set = new Set([f.id]);
  let stack=[f];
  while(stack.length){            // 往下（同層或更下層）
    const a=stack.pop();
    links.forEach(l=>{
      if(l.dash) return;
      let b=null;
      if(l.s===a && l.t.row>=a.row) b=l.t;
      else if(l.t===a && l.s.row>=a.row) b=l.s;
      if(b && !set.has(b.id)){ set.add(b.id); stack.push(b); }
    });
  }
  const up=new Set([f.id]);
  stack=[f];
  while(stack.length){            // 往上（同層或更上層）
    const a=stack.pop();
    links.forEach(l=>{
      if(l.dash) return;
      let b=null;
      if(l.s===a && l.t.row<=a.row) b=l.t;
      else if(l.t===a && l.s.row<=a.row) b=l.s;
      if(b && !up.has(b.id)){ up.add(b.id); set.add(b.id); stack.push(b); }
    });
  }
  links.forEach(l=>{ if(l.s===f) set.add(l.t.id); else if(l.t===f) set.add(l.s.id); });
  return set;
}

function draw(){
  if(autoFit) fitView();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle = C.canvas;
  ctx.fillRect(0,0,W,H);
  ctx.translate(tx,ty); ctx.scale(scale,scale);

  const focus = hoverN || selN;
  const fset = focus ? relatedSet(focus) : null;
  const isNb = n => fset && fset.has(n.id);
  const fsBase = s => s/Math.max(scale,0.72);

  ctx.globalAlpha = 1;
  ctx.textAlign="right"; ctx.textBaseline="middle";
  ctx.font = FONT({s:fsBase(12), w:600});
  ROW_NAME.forEach((name,i)=>{
    if(hidden[name] || !rows[i].length) return;
    ctx.fillStyle = C[CAT[name].ck] || C.muted; ctx.globalAlpha = .9;
    ctx.fillText(name, -LW/2-60, ROW_TOP[i]);
  });
  if(!hidden["年代"] && rows[0].length){
    ctx.globalAlpha=.8;
    ctx.strokeStyle = C.hairline; ctx.lineWidth = 1.2/scale;
    ctx.beginPath(); ctx.moveTo(-LW/2-40, ROW_TOP[0]); ctx.lineTo(LW/2+40, ROW_TOP[0]); ctx.stroke();
    drawReigns(fsBase);
  }

  links.forEach(l=>{
    if(!visible(l.s)||!visible(l.t)) return;
    const direct = focus && (l.s===focus||l.t===focus);
    const hl = direct || (fset && !l.dash && fset.has(l.s.id) && fset.has(l.t.id));
    const dim = focus ? !hl : (searchSet ? !(searchSet.has(l.s.id)&&searchSet.has(l.t.id)) : (hlOn ? !((l.s.hlk||l.s.kw)&&(l.t.hlk||l.t.kw)) : false));
    ctx.beginPath();
    ctx.setLineDash(l.dash?[5,5]:[]);
    const mid = edgePath(l);
    ctx.lineWidth = (hl?2:(l.cause?1.6:1.2))/scale;
    ctx.strokeStyle = hl ? C.edgeHl : (l.cause ? C.ink : C.edge);
    ctx.globalAlpha = dim ? ((!focus&&!searchSet&&hlOn)?0.18:0.07) : (hl?0.9:(l.cause?0.62:0.45));
    ctx.stroke();
    ctx.setLineDash([]);
    if(l.cause && !dim) arrowHead(l, mid, hl);
    if(direct && scale>0.5){
      ctx.font = FONT({s:11/scale});
      ctx.textAlign="center"; ctx.textBaseline="middle";
      const w = ctx.measureText(l.lab).width;
      ctx.globalAlpha = 0.92;
      ctx.fillStyle = C.canvas;
      ctx.fillRect(mid.mx-w/2-3/scale, mid.my-8/scale, w+6/scale, 16/scale);
      ctx.fillStyle = C.muted;
      ctx.fillText(l.lab, mid.mx, mid.my);
    }
  });

  const mildHl = !focus && !searchSet && hlOn;   // 重點字模式：其餘節點淡化但仍可辨識
  nodes.forEach(n=>{
    if(!visible(n)) return;
    const dim = focus ? !isNb(n) : (searchSet ? !searchSet.has(n.id) : (hlOn ? !(n.hlk||n.kw) : false));
    const r = nodeR(n) * (n===focus?1.25:1);
    ctx.globalAlpha = dim ? (mildHl?0.35:0.12) : 1;
    ctx.beginPath();
    if(n.kind==="time"){
      const d = r*1.25;
      ctx.moveTo(n.x, n.y-d); ctx.lineTo(n.x+d, n.y);
      ctx.lineTo(n.x, n.y+d); ctx.lineTo(n.x-d, n.y);
      ctx.closePath();
    } else {
      ctx.arc(n.x,n.y,r,0,2*Math.PI);
    }
    ctx.fillStyle = nodeColor(n);
    ctx.fill();
    if(hlOn && n.hlk && !dim){          // ★ 重點字光圈（紅字紅圈、藍字藍圈）
      ctx.lineWidth = 2.5/scale;
      ctx.strokeStyle = n.hlk==="hl" ? C.red : C.blue;
      ctx.globalAlpha = 0.95;
      ctx.beginPath();
      ctx.arc(n.x, n.y, r + 4.5/Math.max(scale,0.5), 0, 2*Math.PI);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    if(n===selN){
      ctx.lineWidth=2.5/scale;
      ctx.strokeStyle=C.ink;
      ctx.stroke();
    }
    const fs = fsBase(n.kind==="theme"?13:11);
    ctx.font = FONT({s:fs, w:(n.kind==="theme"||(hlOn&&n.hlk))?600:0});
    const w = ctx.measureText(n.label).width;
    const gap = (nodeR(n)*(n.kind==="time"?1.25:1)) + fs*0.75;
    const ly = n.labelUp ? n.y-gap : n.y+gap;
    ctx.globalAlpha = dim ? (mildHl?0.4:0.20) : 0.85;
    ctx.fillStyle = C.canvas;
    ctx.fillRect(n.x-w/2-3, ly-fs/2-2, w+6, fs+4);
    ctx.globalAlpha = dim ? (mildHl?0.5:0.25) : 0.95;
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillStyle = dim ? C.muted : (hlOn && n.hlk ? (n.hlk==="hl"?C.red:C.blue) : C.ink);
    ctx.fillText(n.label, n.x, ly);
    /* ★ 衛星掛點鏈：重點字一顆一點，往標籤的另一側串下去 */
    n._kwHit = null;                                        // 右鍵命中框（世界座標），每禎重建
    if(hlOn && n.kw && !dim){
      const kwHit = [];
      const down = true;                                    // 鏈一律往下（往上會戳到上一列／上一條副線）
      const sameSide = !n.labelUp;                          // 標籤也在下方時多留空間
      const sgn = down ? 1 : -1;
      const fs2 = fsBase(9.5);
      const step = Math.max(20, fs2*1.8);
      let px = n.x;
      let py = n.y + sgn*(nodeR(n) + (sameSide ? fs2*2+12 : 15));
      let prevX = n.x, prevY = n.y + sgn*nodeR(n);
      if(n.kwEdited){                                       // ✎＝這串衛星是手改過的
        ctx.font = FONT({s:fs2}); ctx.textAlign="left"; ctx.textBaseline="middle";
        ctx.fillStyle = C.muted; ctx.globalAlpha = 0.75;
        ctx.fillText("✎", n.x + 6, n.y + sgn*(nodeR(n) + 7));
      }
      n.kw.forEach(it=>{
        ctx.beginPath(); ctx.moveTo(prevX,prevY); ctx.lineTo(px,py-sgn*4);
        ctx.strokeStyle=C.edge; ctx.lineWidth=1/scale; ctx.globalAlpha=0.6; ctx.stroke();
        const col = it.k==="hl" ? C.red : it.k==="hb" ? C.blue : C.muted;
        ctx.beginPath(); ctx.arc(px,py,4,0,2*Math.PI);
        ctx.fillStyle=col; ctx.globalAlpha=1; ctx.fill();
        ctx.font = FONT({s:fs2});
        const txt = it.d || it.w;
        const w2 = ctx.measureText(txt).width;
        ctx.globalAlpha=0.85; ctx.fillStyle=C.canvas;
        ctx.fillRect(px+7, py-fs2/2-1, w2+4, fs2+2);
        ctx.globalAlpha=0.95; ctx.textAlign="left"; ctx.textBaseline="middle";
        ctx.fillStyle = it.k==="loc" ? C.ink : col;
        ctx.fillText(txt, px+9, py);
        kwHit.push({x0:px-7, y0:py-fs2/2-4, x1:px+11+w2, y1:py+fs2/2+4});
        prevX=px; prevY=py+sgn*4;
        py += sgn*step;
      });
      n._kwHit = kwHit;
      ctx.textAlign="center";
    }
  });
  ctx.globalAlpha=1;
}

function loop(){ draw(); requestAnimationFrame(loop); }

/* 互動 */
function toWorld(px,py){ return [(px-tx)/scale, (py-ty)/scale]; }
function pick(px,py){
  const [x,y]=toWorld(px,py);
  let best=null, bd=1e9;
  nodes.forEach(n=>{
    if(!visible(n)) return;
    const d=Math.hypot(n.x-x,n.y-y);
    if(d<nodeR(n)+7/scale && d<bd){best=n;bd=d;}
  });
  return best;
}
cv.addEventListener("pointerdown",e=>{
  if(e.button!==0) return;            // 右鍵留給衛星編輯選單，不要拖到節點、也不要開詳情面板
  autoFit=false;
  cv.setPointerCapture(e.pointerId);
  const n = pick(e.clientX,e.clientY);
  lastX=e.clientX; lastY=e.clientY;
  if(n){ dragN=n; }
  else { panning=true; cv.classList.add("dragging"); }
});
cv.addEventListener("pointermove",e=>{
  if(dragN){
    const [x,y]=toWorld(e.clientX,e.clientY);
    dragN.x=x; dragN.y=y;
    tip.style.display="none";
    return;
  }
  if(panning){
    tx+=e.clientX-lastX; ty+=e.clientY-lastY;
    lastX=e.clientX; lastY=e.clientY;
    return;
  }
  const n=pick(e.clientX,e.clientY);
  if(n!==hoverN){ hoverN=n; cv.style.cursor = n?"pointer":"grab"; }
  if(n){
    tip.style.display="block";
    tip.innerHTML = `<strong>${n.label}</strong><div class="t-sub">${n.sub||""}</div>`;
    const tw = tip.offsetWidth;
    tip.style.left = Math.min(e.clientX+14, W-tw-10)+"px";
    tip.style.top = (e.clientY+16)+"px";
  } else tip.style.display="none";
});
cv.addEventListener("pointerup",e=>{
  if(e.button!==0) return;
  if(dragN){
    const moved = Math.hypot(e.clientX-lastX,e.clientY-lastY);
    if(moved<4){ select(dragN); }
    dragN=null;
    return;
  }
  if(panning){
    panning=false; cv.classList.remove("dragging");
    const moved = Math.hypot(e.clientX-lastX,e.clientY-lastY);
    if(moved<4 && !pick(e.clientX,e.clientY)) select(null);
  }
});
cv.addEventListener("wheel",e=>{
  e.preventDefault();
  autoFit=false;
  const k = e.deltaY<0 ? 1.12 : 1/1.12;
  const ns = Math.min(3.5, Math.max(0.15, scale*k));
  tx = e.clientX - (e.clientX-tx)*ns/scale;
  ty = e.clientY - (e.clientY-ty)*ns/scale;
  scale = ns;
},{passive:false});

/* 說明欄一律條列式：優先用 ①②③… 分條（括號內的編號如「（形勢圖①）」不拆）；
   沒有編號時，改用句號切成一句一條，仍只有一條時才維持整段。 */
/* 沒有①②③的說明：依句號（其次分號）切條，套用與編號清單相同的版面 */
function fmtSent(t){
  const split = re => t.split(re).map(x=>x.trim()).filter(Boolean);
  let parts = split(/(?<=。)(?![」』）)])/);
  if(parts.length < 2) parts = split(/(?<=；)(?![」』）)])/);
  if(parts.length < 2) return t;
  return `<ol class="nt">` + parts.map((p,i)=>
    `<li><span class="nt-n">${i+1}.</span><span>${p}</span></li>`).join("") + `</ol>`;
}
function fmtNote(t){
  if(!t) return "";
  const marks = t.match(/(?<![（(圖])[①-⑳]/g);
  if(!marks || marks.length < 2) return fmtSent(t);
  const parts = t.split(/(?<![（(圖])(?=[①-⑳])/);
  const lead = !/^[①-⑳]/.test(parts[0]) ? parts.shift() : "";
  let h = "";
  if(lead && lead.trim()) h += `<div class="nt-lead">${lead.trim()}</div>`;
  h += `<ol class="nt">` + parts.map(p=>{
    const m = p.match(/^([①-⑳])\s*([\s\S]*)$/);
    return `<li><span class="nt-n">${m[1]}</span><span>${m[2].trim()}</span></li>`;
  }).join("") + `</ol>`;
  return h;
}
function select(n){
  selN=n;
  if(!n){ panel.classList.remove("show"); return; }
  document.getElementById("pKind").textContent = n.cat + (n.ch ? "・" + CHAPTERS[n.ch] : "・跨章共用");

  bs += `<tr><th>章節</th><td>${n.ch ? CHAPTERS[n.ch] : "跨章共用"}</td></tr>`;
  if(n.era) bs += `<tr><th>分期</th><td><span class="p-status" style="background:${css(ERA_COLOR[n.era])};margin:0">${ERA_LABEL[n.era]}</span></td></tr>`;
  if(n.sub) bs += `<tr><th>副標</th><td>${n.sub}</td></tr>`;
  if(n.note) bs += `<tr><th>說明</th><td>${fmtNote(n.note)}</td></tr>`;
  bs += `</tbody></table>`;
  document.getElementById("pBasic").innerHTML = bs;
  const tb = document.getElementById("pTbl");
  if(n.tbl && TABLES[n.tbl]){
    const T = TABLES[n.tbl];
    tb.innerHTML = `<div class="c-title"><span>▦ ${T.title}</span><span class="c-hint">點表格可放大</span></div>${T.html}`;
    tb.style.display = "block";
    tb.querySelector("table").onclick = ()=> openTable(T);
  } else { tb.style.display = "none"; tb.innerHTML = ""; }
  /* 關聯表：直接關聯＋同脈絡（不限層數），全部列出 */
  const rels = document.getElementById("pRels");
  const direct = links.filter(l=>(l.s===n||l.t===n) && chVis(l.s) && chVis(l.t));
  const directIds = new Set(direct.map(l=>(l.s===n?l.t:l.s).id));
  const fs = relatedSet(n);
  const indirect = [...fs].map(id=>byId[id])
    .filter(o=>o!==n && !directIds.has(o.id) && chVis(o))
    .sort((a,b)=>a.row-b.row || a.x-b.x);
  const nd = o=>`<span class="nd"><span class="r-dot" style="background:${nodeColor(o)}"></span><span>${o.label}</span></span>`;
  let h = `<table><tbody><tr><th>節點</th><th>層</th><th>關係</th></tr>`;
  direct.slice().sort((a,b)=>{
      const oa=a.s===n?a.t:a.s, ob=b.s===n?b.t:b.s;
      return oa.row-ob.row || oa.x-ob.x;
    }).forEach(l=>{
      const o = l.s===n ? l.t : l.s;
      h += `<tr class="lnk" data-id="${o.id}"><td>${nd(o)}</td><td>${ROW_NAME[o.row]}</td><td>${l.dash?"╌ ":""}${l.lab}</td></tr>`;
    });
  if(indirect.length){
    h += `<tr><td colspan="3" class="grp2">同脈絡（間接關聯）共 ${indirect.length} 項</td></tr>`;
    indirect.forEach(o=>{
      h += `<tr class="lnk" data-id="${o.id}"><td>${nd(o)}</td><td>${ROW_NAME[o.row]}</td><td>同脈絡</td></tr>`;
    });
  }
  h += `</tbody></table>`;
  rels.innerHTML = h;
  rels.querySelectorAll("tr.lnk").forEach(tr=>{
    tr.onclick=()=>focusNode(byId[tr.dataset.id]);
  });
  panel.classList.add("show");
}

const OVL_REGIMES = [

const OVL_GROUPS = [
  ["原住民",["原住民","平埔","高山各族","高砂","西拉雅","賽德克","凱達格蘭","噶瑪蘭","大肚王","馬賽","族群"]],
  ["漢人",["漢人","官紳民","閩","粵","客家"]]
];
function openTable(T){
  const box = document.getElementById("ovlBox");
  /* 本表專屬籤＝①表內實際出現的政權 ＋ ②本表自己的紅/藍重點字（依出現次數取前 12） */
  const regs = OVL_REGIMES.filter(([n2,ks])=>ks.some(k=>T.html.includes(k)));
  const grps = OVL_GROUPS.filter(([n2,ks])=>ks.some(k=>T.html.includes(k)));
  const dv = document.createElement("div"); dv.innerHTML = T.html;
  const JUNK1 = new Set(["多","少","例","人","年","大","小","前","後","中","的","有","無"]);
  const freq = new Map();
  dv.querySelectorAll(".hl,.hb").forEach(s=>{
    s.textContent.split(/[\s（）()、，,．。・／/→➡↔；;：:「」『』★＝=＋+—–\-～~｜|]+/).forEach(w=>{
      if(!w || w.length>7 || /^\d+(年|世紀)?$/.test(w)) return;
      if(w.length===1 && JUNK1.has(w)) return;
      freq.set(w,(freq.get(w)||0)+1);
    });
  });
  const kws = [...freq.entries()]
    .filter(([w])=>!regs.some(([n2,ks])=>n2===w || ks.includes(w)))    // 政權字不重複出籤
    .filter(([w])=>!grps.some(([n2,ks])=>n2===w || ks.includes(w)))    // 族群字不重複出籤
    .filter(([w])=> w.length>1 || "糖茶郊圳米".includes(w))            // 單字籤只留有意義的（糖/茶/郊/圳/米）
    .sort((a,b)=>b[1]-a[1] || a[0].length-b[0].length)
    .slice(0,12).map(([w])=>w);
  const chipDefs = [
    ...regs.map(([n2,ks])=>({l:n2, ks, cls:" o-reg"})),
    ...grps.map(([n2,ks])=>({l:n2, ks, cls:" o-grp"})),
    ...kws.map(w=>({l:w, ks:[w], cls:" o-kw"}))
  ];
  const chips = chipDefs.length
    ? `<div class="o-chips">${chipDefs.map(c=>`<span class="o-chip${c.cls}" data-r="${c.l}">${c.l}</span>`).join("")}<span class="o-chip o-clear" data-r="">全部</span></div>`
    : "";
  box.innerHTML = `<h3>▦ ${T.title}</h3>${chips}${T.html}<div class="o-hint">${chipDefs.length?"點籤＝點亮相關的列與格（可複選）｜":""}點表格外任意處關閉</div>`;
  const tb2 = box.querySelector("table");
  const keysOf = l => (chipDefs.find(c=>c.l===l)||{ks:[l]}).ks;
  const active = new Set();
  const apply = ()=>{
    const keys = [...active].flatMap(keysOf);
    [...tb2.rows].forEach((row,i)=>{
      [...row.cells].forEach(cell=>cell.classList.remove("k-hit"));
      if(i===0 || row.cells.length===1 || row.querySelector(".grp")){ row.style.opacity=""; return; }  // 表頭/區段列/註記列恆亮
      if(!keys.length){ row.style.opacity=""; return; }
      const hit = keys.some(k=>row.textContent.includes(k));
      row.style.opacity = hit ? "" : "0.22";
      if(hit) [...row.cells].forEach(cell=>{ if(keys.some(k=>cell.textContent.includes(k))) cell.classList.add("k-hit"); });
    });
    box.querySelectorAll(".o-chip").forEach(c=>c.classList.toggle("on", active.has(c.dataset.r)));
  };
  box.querySelectorAll(".o-chip").forEach(c=>{
    c.onclick = (e)=>{
      e.stopPropagation();
      const r = c.dataset.r;
      if(!r) active.clear();
      else active.has(r) ? active.delete(r) : active.add(r);
      apply();
    };
  });
  document.getElementById("ovl").classList.add("show");
}

const sIn = document.getElementById("searchInput");

let srList = [], srIdx = -1, srTerms = [];
function snippet(n,q){
  const t = n.note||"";
  const i = normS(t).indexOf(q);
  if(i<0) return n.sub||"";
  const a = Math.max(0, i-8);
  return (a>0?"…":"") + t.slice(a, i+q.length+14) + "…";
}
function renderResults(q){
  if(!srList.length){
    sRes.innerHTML = `<div class="sr-empty">找不到「${q}」（可搜標題・副標・說明全文；多關鍵字用空格或 - 分隔，臺＝台互通）</div>`;
    sRes.classList.add("show");
    return;
  }
  /* 片段優先顯示「命中在說明文」的那個關鍵字 */
  const snipQ = n => srTerms.find(t=>normS(n.note).includes(t)) || srTerms[0] || q;
  sRes.innerHTML = srList.slice(0,50).map((n,i)=>
    `<div class="sr${i===srIdx?" act":""}" data-i="${i}">
       <span class="r-dot" style="background:${nodeColor(n)}"></span>
       <span>${n.label}</span><span class="sr-sub">${snippet(n,snipQ(n))}</span>
     </div>`).join("")
    + (srList.length>50 ? `<div class="sr-empty">…共 ${srList.length} 筆，僅列前 50，請再縮小關鍵字</div>` : "");
  sRes.classList.add("show");
  sRes.querySelectorAll(".sr").forEach(d=>{
    d.onclick = ()=>{ srIdx = +d.dataset.i; focusNode(srList[srIdx]); };
  });
}
function doSearch(){
  const raw = sIn.value.trim();
  srIdx = -1;
  /* 多關鍵字：空格・-・－・／・、・，分隔 ＝ AND（每個關鍵字都要在標題/副標/說明其中之一出現） */
  srTerms = normS(raw).split(/[\s\-－–—・/／,，、]+/).filter(Boolean);
  if(!srTerms.length){ searchSet=null; srList=[]; sRes.classList.remove("show"); sRes.innerHTML=""; return; }
  srList = nodes.filter(n=>{
    if(!chVis(n)) return false;
    const hay = normS(n.label)+"｜"+normS(n.sub)+"｜"+normS(n.note);
    return srTerms.every(t=>hay.includes(t));
  });
  searchSet = new Set(srList.map(n=>n.id));
  renderResults(raw);
}

   所有變更走覆蓋層（KWEDIT），自動存 localStorage，原始資料區永遠乾淨。 */
const kwMenu = document.getElementById("kwMenu");
const kwOvl  = document.getElementById("kwOvl");
const kwBox  = document.getElementById("kwBox");
const K_COL  = [["hl","紅：核心重點","var(--red)"],["hb","藍：人名／年代／地區","var(--blue)"],["loc","灰：地點／補充","var(--muted)"]];
const kwEsc  = t => String(t==null?"":t).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* 命中測試：畫面座標 → 哪一顆衛星（命中框由 draw() 每禎寫入 n._kwHit） */
function pickKw(px,py){
  const [x,y] = toWorld(px,py);
  for(const n of nodes){
    if(!n._kwHit || !visible(n)) continue;    /* 章節關掉／隱藏後殘留的命中框不算數 */
    for(let i=0;i<n._kwHit.length;i++){
      const h = n._kwHit[i];
      if(x>=h.x0 && x<=h.x1 && y>=h.y0 && y<=h.y1) return {n, i};
    }
  }
  return null;
}
const closeKwMenu = ()=> kwMenu.classList.remove("show");
function showKwMenu(x, y, html, bind){
  kwMenu.innerHTML = html;
  kwMenu.style.left = "0px"; kwMenu.style.top = "0px";
  kwMenu.classList.add("show");
  const r = kwMenu.getBoundingClientRect();
  kwMenu.style.left = Math.max(6, Math.min(x, innerWidth  - r.width  - 8)) + "px";
  kwMenu.style.top  = Math.max(6, Math.min(y, innerHeight - r.height - 8)) + "px";
  bind(kwMenu);
}
/* 衛星只在 ★重點字 模式看得到，改完要看得見結果就自動開起來 */
function ensureHl(){ if(!hlOn) document.getElementById("hlChip").click(); }

/* --- 右鍵：單顆衛星 --- */
function menuForSat(e, n, i){
  const it = n.kw[i];
  showKwMenu(e.clientX, e.clientY,
    '<div class="km-t">● ' + kwEsc(it.d || it.w) + '</div>' +
    '<div class="km-c">' + K_COL.map(([k,t,c])=>
      '<i data-k="' + k + '" title="' + t + '" class="' + ((it.k||"hl")===k?"on":"") + '" style="background:' + c + '"></i>').join("") + '</div>' +
    '<div class="km-i" data-a="txt">✎ 改文字…</div>' +
    '<div class="km-i" data-a="up">↑ 往上移</div>' +
    '<div class="km-i" data-a="dn">↓ 往下移</div>' +
    '<div class="km-i" data-a="ins">＋ 在下方插入一顆</div>' +
    '<div class="km-s"></div>' +
    '<div class="km-i" data-a="del">🗑 刪除這顆</div>' +
    '<div class="km-i" data-a="edit">▤ 編輯整串…</div>' +
    (n.kwEdited ? '<div class="km-i" data-a="reset">↩ 這個節點還原自動</div>' : ''),
  m=>{
    m.querySelectorAll("i[data-k]").forEach(el=> el.onclick = ()=>{
      const L = kwListOf(n); L[i].k = el.dataset.k; setKw(n, L); closeKwMenu();
    });
    m.querySelectorAll(".km-i").forEach(el=> el.onclick = ()=>{
      const a = el.dataset.a, L = kwListOf(n);
      if(a==="txt"){ const v = prompt("衛星文字（可用「－」做配對，例：臺北－瑠公圳）：", L[i].d); if(v==null || !v.trim()) return; L[i].d = v; setKw(n,L); }
      else if(a==="up"  && i>0)          { const t=L[i-1]; L[i-1]=L[i]; L[i]=t; setKw(n,L); }
      else if(a==="dn"  && i<L.length-1) { const t=L[i+1]; L[i+1]=L[i]; L[i]=t; setKw(n,L); }
      else if(a==="ins"){ const v = prompt("新增衛星文字："); if(v && v.trim()){ L.splice(i+1,0,{d:v, k:"hl"}); setKw(n,L); } }
      else if(a==="del"){ L.splice(i,1); setKw(n,L); }
      else if(a==="edit"){ closeKwMenu(); openKwEditor(n); return; }
      else if(a==="reset"){ setKw(n,null); }
      closeKwMenu();
    });
  });
}
/* --- 右鍵：節點 --- */
function menuForNode(e, n){
  const cnt = (n.kw||[]).length;
  showKwMenu(e.clientX, e.clientY,
    '<div class="km-t">' + kwEsc(n.label) + '　衛星 ' + cnt + ' 顆' + (n.kwEdited ? '　✎已編輯' : '') + '</div>' +
    '<div class="km-i" data-a="edit">▤ 編輯衛星清單…</div>' +
    '<div class="km-i" data-a="add">＋ 新增一顆衛星</div>' +
    '<div class="km-s"></div>' +
    '<div class="km-i" data-a="none">🚫 這個節點不掛衛星</div>' +
    (n.kwEdited ? '<div class="km-i" data-a="reset">↩ 還原自動計算</div>' : ''),
  m=>{
    m.querySelectorAll(".km-i").forEach(el=> el.onclick = ()=>{
      const a = el.dataset.a;
      if(a==="edit"){ closeKwMenu(); openKwEditor(n); return; }
      if(a==="add"){ const v = prompt("新增衛星文字："); if(v && v.trim()){ const L = kwListOf(n); L.push({d:v, k:"hl"}); setKw(n,L); ensureHl(); } }
      else if(a==="none"){ setKw(n, []); }
      else if(a==="reset"){ setKw(n, null); }
      closeKwMenu();
    });
  });
}
/* --- 右鍵：空白處 --- */
function menuForBlank(e){
  const cnt = Object.keys(KWEDIT.kw).length;
  showKwMenu(e.clientX, e.clientY,
    '<div class="km-t">衛星編輯：已改 ' + cnt + ' 個節點</div>' +
    '<div class="km-i" data-a="exp">💾 匯出變更（JSON）</div>' +
    '<div class="km-i" data-a="imp">📥 匯入變更檔</div>' +
    '<div class="km-s"></div>' +
    '<div class="km-i" data-a="all">↩ 全部還原成自動</div>',
  m=>{
    m.querySelectorAll(".km-i").forEach(el=> el.onclick = ()=>{
      const a = el.dataset.a;
      if(a==="exp") exportKw();
      else if(a==="imp") importKw();
      else if(a==="all"){
        if(!cnt) alert("目前沒有任何編輯。");
        else if(confirm("清掉全部 " + cnt + " 個節點的衛星編輯，回到自動計算？")){ KWEDIT.kw = {}; applyKwEdits(); saveKwEdits(); }
      }
      closeKwMenu();
    });
  });
}
/* --- 清單編輯器：一次改整串（順序＝畫面由上往下） --- */
let kwEditNode = null, kwDraft = [];
function kwRenderRows(){
  const rows = document.getElementById("kwRows");
  rows.innerHTML = kwDraft.map((it,i)=>
    '<div class="k-row" data-i="' + i + '">' +
      '<span class="k-n">' + (i+1) + '</span>' +
      '<select data-f="k">' + K_COL.map(([k,t])=>'<option value="' + k + '"' + (it.k===k?" selected":"") + '>' + t + '</option>').join("") + '</select>' +
      '<input data-f="d" value="' + kwEsc(it.d) + '" placeholder="衛星文字">' +
      '<button data-f="up" title="上移">↑</button>' +
      '<button data-f="dn" title="下移">↓</button>' +
      '<button data-f="rm" title="刪除">✕</button>' +
    '</div>').join("") || '<div class="k-sub" style="margin:2px 0 12px">（目前沒有衛星，按下方「＋」新增）</div>';
  rows.querySelectorAll(".k-row").forEach(row=>{
    const i = +row.dataset.i;
    row.querySelector('[data-f="d"]').oninput  = ev => kwDraft[i].d = ev.target.value;
    row.querySelector('[data-f="k"]').onchange = ev => kwDraft[i].k = ev.target.value;
    row.querySelector('[data-f="up"]').onclick = ()=>{ if(i>0){ const t=kwDraft[i-1]; kwDraft[i-1]=kwDraft[i]; kwDraft[i]=t; kwRenderRows(); } };
    row.querySelector('[data-f="dn"]').onclick = ()=>{ if(i<kwDraft.length-1){ const t=kwDraft[i+1]; kwDraft[i+1]=kwDraft[i]; kwDraft[i]=t; kwRenderRows(); } };
    row.querySelector('[data-f="rm"]').onclick = ()=>{ kwDraft.splice(i,1); kwRenderRows(); };
  });
}
function openKwEditor(n){
  kwEditNode = n;
  kwDraft = kwListOf(n);
  const auto = (n._kwAuto||[]).map(x=>x.d||x.w).join("、") || "（無）";
  kwBox.innerHTML =
    '<h3>✎ ' + kwEsc(n.label) + ' 的衛星掛點</h3>' +
    '<div class="k-sub">往下展開的那一串小點，順序＝由上往下。' + (n.kwEdited ? '<b>此節點已手改。</b>' : '') +
      '<br>自動值：' + kwEsc(auto) + '</div>' +
    '<div id="kwRows"></div>' +
    '<button class="k-add" id="kwAdd">＋ 新增一顆</button>' +
    '<div class="k-btns">' +
      '<button id="kwAuto">↩ 還原自動</button>' +
      '<span class="k-sp"></span>' +
      '<button id="kwCancel">取消</button>' +
      '<button class="k-ok" id="kwSave">儲存</button>' +
    '</div>' +
    '<div class="k-tip">顏色＝紅（核心重點）／藍（人名・年代・地區）／灰（地點・補充）。' +
      '文字用「－」可做成配對點，例：<b>臺北－瑠公圳</b>。<br>' +
      '變更存在這台電腦的瀏覽器裡（換電腦／清瀏覽資料會消失），重要修改請在空白處右鍵「匯出變更」。</div>';
  kwRenderRows();
  document.getElementById("kwAdd").onclick = ()=>{
    kwDraft.push({d:"", k:"hl"}); kwRenderRows();
    const ins = kwBox.querySelectorAll('[data-f="d"]'); if(ins.length) ins[ins.length-1].focus();
  };
  document.getElementById("kwCancel").onclick = closeKwEditor;
  document.getElementById("kwSave").onclick   = ()=>{ setKw(kwEditNode, kwDraft); closeKwEditor(); ensureHl(); };
  document.getElementById("kwAuto").onclick   = ()=>{ setKw(kwEditNode, null);    closeKwEditor(); ensureHl(); };
  kwOvl.classList.add("show");
}
function closeKwEditor(){ kwOvl.classList.remove("show"); kwEditNode = null; }

/* --- 匯出／匯入 --- */
function exportKw(){
  const d = new Date(), p = x => String(x).padStart(2,"0");
  const blob = new Blob([JSON.stringify(KWEDIT, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "衛星編輯_" + d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + ".json";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function importKw(){
  const f = document.createElement("input");
  f.type = "file"; f.accept = ".json,application/json";
  f.onchange = ()=>{
    const fl = f.files && f.files[0]; if(!fl) return;
    const rd = new FileReader();
    rd.onload = ()=>{
      let o = null;
      try{ o = JSON.parse(rd.result); }catch(err){}
      if(!o || !o.kw || typeof o.kw !== "object"){ alert("檔案格式不符，需要 {ver, base, kw:{節點id:[{d,k}…]}}"); return; }
      if(o.base && o.base !== KWEDIT.base) alert("提醒：這份變更檔標的是 " + o.base + "，目前檔案是 " + KWEDIT.base + "；節點 id 沒變仍可套用。");
      KWEDIT = {ver:o.ver||1, base:KWEDIT.base, kw:o.kw};
      applyKwEdits(); saveKwEdits(); ensureHl();
      alert("已匯入 " + Object.keys(KWEDIT.kw).length + " 個節點的衛星編輯。");
    };
    rd.readAsText(fl, "utf-8");
  };
  f.click();
}

/* --- 事件綁定 --- */
cv.addEventListener("contextmenu", e=>{
  e.preventDefault();
  const hit = hlOn ? pickKw(e.clientX, e.clientY) : null;
  if(hit) return menuForSat(e, hit.n, hit.i);
  const n = pick(e.clientX, e.clientY);
  if(n) return menuForNode(e, n);
  menuForBlank(e);
});
document.addEventListener("pointerdown", e=>{ if(!kwMenu.contains(e.target)) closeKwMenu(); });
kwOvl.addEventListener("pointerdown", e=>{ if(e.target === kwOvl) closeKwEditor(); });
addEventListener("keydown", e=>{
  if(e.key === "Escape"){ closeKwMenu(); if(kwOvl.classList.contains("show")) closeKwEditor(); }
  if(e.key === "Enter" && kwOvl.classList.contains("show")){ const b = document.getElementById("kwSave"); if(b) b.click(); }
});
</script>
</body>
</html>
