<td><b><span class=\"hl\">工業臺灣，農業南洋</span></b>　<span class=\"hb\">←1930 年代</span><br><span class=\"hl\">南進政策</span>、<span class=\"hl\">日月潭發電所</span>（1934）、軍需與輕工業</td></tr>\n<tr><th colspan=\"4\" class=\"grp\">社會文化</th></tr>\n<tr><th>殖民教育</th><td><b>原則</b><br><span class=\"hl\">差別待遇、隔離原則</span></td><td colspan=\"2\"><b>初等</b>　<span class=\"hl\">小學校</span>（日本人）、<span class=\"hl\">公學校</span>（臺灣人）、<span class=\"hl\">蕃人公學校／蕃童教育所</span>（原住民）<br><b>中等</b>　普通中學、職業學校（1915 臺中中學校＝首所專收臺人）<br><b>高等</b>　<span class=\"hl\">臺北帝國大學</span>（1928），有志升學者多<span class=\"hb\">留學日本</span></td></tr>\n<tr><th>政治社會運動<br><span style=\"font-weight:400\">★常考</span></th><td><b>背景</b><br><span class=\"hl\">民族自決</span>思潮影響</td><td><b>代表</b><br><span class=\"hl\">林獻堂、蔣渭水</span></td><td><b>組織與行動</b><br>臺灣文化協會、臺灣議會設置請願運動、臺灣民眾黨、臺灣地方自治聯盟<br>➡<span class=\"hl\">1935 年首次地方議員選舉</span></td></tr>\n<tr><th>文化新樣貌<br><span style=\"font-weight:400\">★常考</span></th><td colspan=\"3\"><span class=\"hl\">放足斷髮</span>、<span class=\"hl\">現代衛生觀念</span>（西式醫院、自來水、預防注射→死亡率下降、人口成長）、<span class=\"hl\">守法及守時習慣</span>（司法制度、標準時間與星期制）、<span class=\"hl\">都會文化及休閒活動</span>（都市計畫、公園、百貨公司、咖啡廳、棒球、鐵路旅遊）</td></tr>\n</table>"},"j2":{"title":"總督專制體制（總督・警察・保甲）","html":"<table>\n<tr><th colspan=\"3\" class=\"grp\">總督專制</th></tr>\n<tr><th style=\"width:12%\">機構</th><td colspan=\"2\">1895 年設立<span class=\"hl\">臺灣總督府</span>，是日本在臺最高統治機構，以<span class=\"hb\">臺灣總督</span>為首長</td></tr>\n<tr><th>法源</th><td colspan=\"2\">1896 年頒布「法律第六十三號」（簡稱<span class=\"hl\">六三法</span>），授權總督頒布具法律效力的命令（律令）</td></tr>\n<tr><th>權責</th><td colspan=\"2\">總督集<span class=\"hl\">行政、立法、司法及軍事</span>大權於一身</td></tr>\n<tr><th colspan=\"3\" class=\"grp\">地方控制：警察 ＋ 保甲</th></tr>\n<tr><th></th><th style=\"text-align:center;color:var(--blue)\">警察制度</th><th style=\"text-align:center;color:var(--orange)\">保甲制度</th></tr>\n<tr><th>目的</th><td>鎮壓臺人反抗、加強地方控制</td><td><span class=\"hb\">配合警察</span>，穩定社會秩序</td></tr>\n<tr><th>編制／作法</th><td>在各地廣設<span class=\"hl\">派出所</span></td><td>沿用<span class=\"hb\">清代既有的地方自衛組織</span>：<span class=\"hl\">10 戶為 1 甲</span>設甲長（類似鄰長）；<span class=\"hl\">10 甲為 1 保</span>設保正（類似里長）</td></tr>\n<tr><th>職務</th><td>無所不管：鎮壓抗日分子、檢查衛生、宣傳政令、調查戶口</td><td>①維護治安、嚴密監控社會 ②推動政務（調查戶口、宣達政令），並採<span class=\"hl\">連坐法</span>（一人違法全甲同罰）③青壯年男子組<span class=\"hl\">壯丁團</span>，協助救災與鎮壓抗日</td></tr>\n<tr><th>特色</th><td>權力很大使人民畏懼→被稱為「<span class=\"hl\">大人</span>」（每萬人配置的警察比例最高）</td><td>以臺人管臺人，成本低、監控密</td></tr>\n<tr><th colspan=\"3\" style=\"text-align:left\">成效：警察與保甲制度的<span class=\"hl\">相互配合</span>，有效監控臺灣社會、建立堅實的統治基礎。</th></tr>\n</table>"},"j3":{"title":"臺灣民主國與西來庵事件（武裝抗日）","html":"<table>\n<tr><th colspan=\"3\" class=\"grp\">臺灣割讓與臺灣民主國</th></tr>\n<tr><th style=\"width:12%\">背景</th><td colspan=\"2\">1894 清、日因<span class=\"hb\">朝鮮問題</span>爆發<span class=\"hl\">甲午戰爭</span>→1895 清帝國戰敗，簽訂《<span class=\"hl\">馬關條約</span>》割讓臺灣、澎湖給日本</td></tr>\n<tr><th>倡組</th><td colspan=\"2\">割讓消息傳回臺灣後，臺灣<span class=\"hb\">官紳</span>倡組「<span class=\"hl\">臺灣民主國</span>」</td></tr>\n<tr><th>目的</th><td colspan=\"2\"><span class=\"hl\">效忠清朝、抗拒日本接收</span>——並非追求獨立建國</td></tr>\n<tr><th>領導</th><td colspan=\"2\"><span class=\"hb\">唐景崧</span>（總統）、<span class=\"hb\">丘逢甲</span>（義軍統領）、<span class=\"hb\">劉永福</span>（大將軍）；旗幟＝<span class=\"hl\">藍地黃虎旗</span></td></tr>\n<tr><th>結果</th><td colspan=\"2\">①劣勢：兵力、武器不如日本 ②失敗：領導者先後離臺，民主國瓦解 ③意義：臺灣進入日本<span class=\"hl\">50 年</span>的殖民統治</td></tr>\n<tr><th colspan=\"3\" class=\"grp\">西來庵事件（1915）</th></tr>\n<tr><th>背景</th><td colspan=\"2\">日本接收臺灣後，臺灣漢人在各地發動抗日行動</td></tr>\n<tr><th>時間地點</th><td colspan=\"2\"><span class=\"hl\">1915 年</span>，<span class=\"hl\">噍吧哖</span>（今臺南市玉井區）</td></tr>\n<tr><th>經過</th><td colspan=\"2\"><span class=\"hb\">余清芳</span>以<span class=\"hl\">宗教</span>為名，組織群眾武裝抗日</td></tr>\n<tr><th>結果</th><td colspan=\"2\">因缺乏訓練，無法與日軍抗衡，多人失敗被捕</td></tr>\n<tr><th>影響</th><td colspan=\"2\">臺人有鑑於武裝抗日犧牲慘重，<span class=\"hl\">轉以非武裝的政治、社會運動</span>爭取權益</td></tr>\n</table>"},"j4":{"title":"理蕃政策與霧社事件","html":"<table>\n<tr><th style=\"width:10%\">分期</th><th style=\"width:45%;color:var(--blue)\">日治初期（安撫與圍堵）</th><th style=\"width:45%;color:var(--orange)\">1910 年起（武力征討）</th></tr>\n<tr><th>背景</th><td>總督府疲於壓制平地武裝抗日事件</td><td>已大致控制臺灣社會，為<span class=\"hl\">開發山林資源</span>（第五任總督佐久間左馬太）</td></tr>\n<tr><th>方針</th><td><span class=\"hl\">防堵、安撫</span></td><td><span class=\"hl\">武力征討</span></td></tr>\n<tr><th>措施</th><td>①安撫＝設置<span class=\"hl\">隘勇線</span>（鐵絲電網、木柵）限制原住民活動範圍 ②教化＝設<span class=\"hb\">蕃童教育所</span> ③宣威＝招待部落頭目<span class=\"hb\">赴日參觀</span>，宣揚日本現代化成果以籠絡威嚇 ④圍堵＝軍警深入山區</td><td>實施<span class=\"hl\">五年理蕃計畫</span>（1910–1915）迫原住民歸順：①軍警深入山區武力鎮壓 ②打通<span class=\"hb\">東西橫貫道路</span>，建立開發東部的運輸幹線 ③透過<span class=\"hb\">教育同化</span>使原住民歸順；並將土地收歸公有、沒收槍械、強制勞役</td></tr>\n<tr><th>結果</th><td>①原住民傳統文化受衝擊 ②部分接受教化者幫助日本統治→<span class=\"hb\">部落內部衝突</span></td><td>林木與樟腦被掠奪、被迫改變生活方式、以勞力換取物資、受山地警察欺凌→<span class=\"hl\">對日不滿</span></td></tr>\n<tr><th colspan=\"3\" class=\"grp\">霧社事件（1930）</th></tr>\n<tr><th>原因</th><td colspan=\"2\">①日本開發山林資源並侵擾部落 ②強迫族人服<span class=\"hb\">勞役</span>，又不尊重原住民文化</td></tr>\n<tr><th>經過</th><td colspan=\"2\"><span class=\"hl\">賽德克族</span>頭目<span class=\"hl\">莫那魯道</span>率族人襲殺日人→總督府出動軍警，使用<span class=\"hb\">大炮、飛機、毒氣</span>鎮壓</td></tr>\n<tr><th>結果</th><td colspan=\"2\">原住民死傷慘重；日本國內及國際輿論譴責（臺灣民眾黨曾致電<span class=\"hb\">國際聯盟</span>抗議），<span class=\"hl\">臺灣總督下臺</span></td></tr>\n<tr><th>影響</th><td>對總督府：改採較<span class=\"hl\">溫和</span>的統治手段——加強教育與同化、警察應善待原住民</td><td>對原住民：<span class=\"hl\">集團移住</span>——山區原住民集體遷往山下集中管理；知難以武力抗日，逐漸接受教化→二戰後期組成<span class=\"hb\">高砂義勇隊</span>赴南洋作戰</td></tr>\n</table>"},"j5":{"title":"日治基礎建設（後藤新平）","html":"<table>\n<tr><th style=\"width:14%\">主導</th><td colspan=\"2\">民政長官<span class=\"hl\">後藤新平</span>等人</td></tr>\n<tr><th>拓展財源</th><td colspan=\"2\">背景＝日治初期臺灣財政依賴日本國庫補助；作法＝將<span class=\"hl\">鴉片、樟腦</span>等列為<span class=\"hl\">專賣</span>由總督府獨占經營→財政收入大增，<span class=\"hb\">1898 年後財政逐漸獨立</span></td></tr>\n<tr><th rowspan=\"3\">調查工作</th><td style=\"width:16%\"><b>戶口</b></td><td><span class=\"hl\">1905 年第一次人口普查</span>，之後定期舉辦；利用<span class=\"hb\">警察</span>深入調查（出現「戶口調查簿」）→有助統治與人力運用</td></tr>\n<tr><td><b>土地</b></td><td>確定土地所有權以利徵稅→<span class=\"hb\">田賦收入增加</span></td></tr>\n<tr><td><b>林野</b></td><td>無主山林收歸<span class=\"hb\">國有</span>，部分賣給資本家開發山林資源</td></tr>\n<tr><th>統一貨幣<br>及度量衡</th><td colspan=\"2\">1899 年成立<span class=\"hl\">臺灣銀行</span>發行統一貨幣「<span class=\"hb\">臺灣銀行券</span>」（解決清代幣制混亂、方便臺日資金流通、提供日商前進南洋的資金）；統一度量衡與日本一致，減少交易爭議</td></tr>\n<tr><th rowspan=\"3\">交通建設</th><td><b>陸運</b></td><td><span class=\"hl\">1908 年完成基隆到高雄的西部縱貫鐵路</span>——突破西部河川東西向的不便，成為<span class=\"hb\">南北交通動脈</span>；另建阿里山森林鐵路（臺灣林業開發的見證）</td></tr>\n<tr><td><b>海運</b></td><td>整建<span class=\"hb\">基隆港</span>（臺灣與日本聯絡的門戶）、<span class=\"hb\">高雄港</span>（南部貨物主要進出港），有利南進政策</td></tr>\n<tr><td><b>通訊</b></td><td>普設郵局（郵便局）、電報、電話</td></tr>\n<tr><th colspan=\"3\" style=\"text-align:left\">結果：奠定臺灣日後<span class=\"hl\">工業化</span>的發展基礎，提高日本企業的投資意願。目的則是便於<span class=\"hb\">殖民統治及獲取臺灣資源</span>。</th></tr>\n</table>"},"j6":{"title":"農業臺灣・工業日本 vs 工業臺灣・農業南洋","html":"<table>\n<tr><th style=\"width:12%\">時間</th><th style=\"width:44%;color:var(--blue)\">日治初期</th><th style=\"width:44%;color:var(--orange)\">1930 年代起</th></tr>\n<tr><th>策略</th><td><span class=\"hl\">工業日本，農業臺灣</span></td><td><span class=\"hl\">工業臺灣，農業南洋</span></td></tr>\n<tr><th>目的</th><td>供應<span class=\"hb\">日本國內</span>民生需求</td><td>配合日本的<span class=\"hb\">南進政策</span>，南進基地化</td></tr>\n<tr><th rowspan=\"3\">措施</th><td><b>新式製糖業</b>：獎勵日本企業設立<span class=\"hl\">新式製糖廠</span>（機械動力取代舊式糖廍）→「<span class=\"hl\">糖業王國</span>」</td><td><b>電力開發</b>：<span class=\"hl\">1934 日月潭水力發電所</span>完工</td></tr>\n<tr><td><b>改良稻作</b>：1922 年<span class=\"hb\">磯永吉</span>培育出<span class=\"hl\">蓬萊米</span></td><td><b>軍需工業</b>：機械、石化、金屬、造船</td></tr>\n<tr><td><b>興修水利</b>：<span class=\"hb\">八田與一</span>設計建造<span class=\"hl\">嘉南大圳</span>（1930 完工，<span class=\"hb\">日治規模最大的水利工程</span>）</td><td><b>輕工業</b>：紡織、食品加工（鳳梨罐頭）</td></tr>\n<tr><th>影響</th><td>①米、糖產量大增，並銷往日本 ②蔗農被<span class=\"hb\">限制販售對象</span>、遭<span class=\"hb\">偷斤減兩</span>→「<span class=\"hl\">第一憨，種甘蔗予會社磅</span>」→1925 <span class=\"hl\">二林事件</span>，開啟全島性農民運動</td><td>①提供充足電力，有利發展工業 ②輕工業顯著成長，臺灣從農業社會走向<span class=\"hl\">半農半工</span>的社會</td></tr>\n</table>"},"j7":{"title":"差別待遇的殖民教育","html":"<table>\n<tr><th style=\"width:12%\">原則</th><td colspan=\"3\"><span class=\"hl\">差別待遇、隔離政策</span>，同時建立<span class=\"hb\">西式教育制度</span></td></tr>\n<tr><th>目的</th><td colspan=\"3\">①<span class=\"hb\">同化</span>——作為同化臺灣人民及推動產業政策的工具 ②<span class=\"hb\">新知</span>——讓臺灣人從教育中獲得現代知識</td></tr>\n<tr><th colspan=\"4\" class=\"grp\">初等教育（三軌並行）</th></tr>\n<tr><th>學校</th><td style=\"width:29%\"><span class=\"hl\">小學校</span>：<b>日本人</b>就讀，課程比照日本內地</td><td style=\"width:29%\"><span class=\"hl\">公學校</span>：<b>臺灣人</b>就讀，以教授<span class=\"hb\">日語</span>為主</td><td style=\"width:30%\"><span class=\"hl\">蕃人公學校・蕃童教育所</span>：<b>原住民</b>就讀（教師多由<span class=\"hb\">日本警察</span>擔任）</td></tr>\n<tr><th>差別</th><td colspan=\"3\">無論師資、設備均比不上小學校，有種種限制與不公平待遇</td></tr>\n<tr><th>政策調整</th><td colspan=\"3\"><span class=\"hl\">1941 年</span>配合皇民化運動，小學校、公學校一律改稱「<span class=\"hl\">國民學校</span>」；<span class=\"hl\">1943 年</span>實施<span class=\"hb\">六年國民義務教育</span>（臺灣最早的義務教育）</td></tr>\n<tr><th colspan=\"4\" class=\"grp\">中等以上教育</th></tr>\n<tr><th>中等</th><td colspan=\"3\">初期以招收日人為主；<span class=\"hl\">1915 年</span>林獻堂等人成立第一所專收臺人子弟的<span class=\"hl\">臺中中學校</span>（今臺中一中）。職業學校培養<span class=\"hb\">醫師</span>（醫學校）、<span class=\"hb\">公學校教師</span>（師範學校）、初級技術人才</td></tr>\n<tr><th>高等</th><td colspan=\"3\"><span class=\"hl\">1928 年臺北帝國大學</span>（今臺灣大學）＝日治時期臺灣最高學府；高等教育機構不足，有志升學者多前往<span class=\"hb\">日本留學</span></td></tr>\n<tr><th>統計<br>（差別）</th><td colspan=\"3\">初等學生：日 23,711／臺 210,272；<b>就學率</b>：日 98.2%／臺 <span class=\"hl\">28.4%</span>；專門學校：日 6,856／臺 4,642；高等學校：日 220／臺 <span class=\"hl\">28</span> →「差別待遇、基礎教育不足」</td></tr>\n<tr><th>其他</th><td colspan=\"3\"><span class=\"hb\">日語</span>漸成臺人的共通語言，臺人也藉此吸收現代知識，影響延續至今；1943 年實施義務教育後，臺籍兒童就學率<span class=\"hl\">超過 70%</span></td></tr>\n<tr><th>影響</th><td colspan=\"3\">1920 年代以後新的<span class=\"hl\">社會菁英</span>階層逐漸崛起（新思想＋專業訓練），成為日後政治、社會與文化運動的推手</td></tr>\n</table>"},"j8":{"title":"文化啟蒙與政治社會運動（四大組織）","html":"<table>\n<tr><th style=\"width:12%\">背景</th><td colspan=\"4\">1920 年代臺籍知識分子受國際「<span class=\"hl\">民族自決</span>」風潮鼓舞（一戰後美國總統威爾遜提出），加上日本國內民主呼聲高漲，起而爭取臺人權益</td></tr>\n<tr><th>類別</th><th>組織（起訖）</th><th>領導人</th><th>主張／內容</th><th>意義・結果</th></tr>\n<tr><th>文化啟蒙</th><td><span class=\"hl\">臺灣文化協會</span><br>1921–1931</td><td><span class=\"hb\">蔣渭水<br>林獻堂</span></td><td>宗旨「謀臺灣文化之向上」；創辦《<span class=\"hl\">臺灣民報</span>》、設讀報社、辦文化演講與夏季學校</td><td>傳播新知、改良社會風氣，<span class=\"hb\">喚起臺人民族意識</span></td></tr>\n<tr><th rowspan=\"3\">政治社會運動</th><td><span class=\"hl\">臺灣議會設置<br>請願運動</span><br>1921–1934</td><td><span class=\"hb\">林獻堂</span></td><td>共請願 <span class=\"hl\">15 次</span>，要求設立<span class=\"hb\">民選的臺灣議會</span>、爭取立法權</td><td>雖未獲同意，但<span class=\"hb\">喚起臺人的政治意識</span></td></tr>\n<tr><td><span class=\"hl\">臺灣民眾黨</span><br>1927–1931</td><td><span class=\"hb\">蔣渭水</span></td><td>宣導民權、自治，扶助農、工運動；反對吸食鴉片、破除迷信</td><td>臺灣史上<span class=\"hl\">第一個合法政黨</span></td></tr>\n<tr><td><span class=\"hl\">臺灣地方<br>自治聯盟</span><br>1930–1937</td><td><span class=\"hb\">林獻堂</span></td><td>爭取<span class=\"hb\">地方自治、參政權</span></td><td>促成 <span class=\"hl\">1935 年</span>總督府首次開放地方議員選舉（有限度）→臺灣民眾<span class=\"hl\">首次行使投票權</span></td></tr>\n<tr><th colspan=\"5\" style=\"text-align:left\">結束：<span class=\"hl\">1937 中日戰爭</span>爆發後，臺人的政治社會運動受到打壓而被迫終止。　1935 年選舉的限制：僅少數男性有投票權、半數席次仍官派，並未落實真正的地方自治。</th></tr>\n</table>"},"j9":{"title":"移風易俗與現代觀念的建立","html":"<table>\n<tr><th style=\"width:10%\">項目</th><th style=\"width:30%;color:var(--blue)\">放足斷髮・禁吸鴉片</th><th style=\"width:30%;color:var(--green)\">公共衛生與醫療</th><th style=\"width:30%;color:var(--orange)\">守法與守時</th></tr>\n<tr><th>原因</th><td>移風易俗、改造「陋習」</td><td>有效防止臺灣<span class=\"hb\">傳染病</span>肆虐</td><td>守法＝有效控制社會、維持秩序；守時＝符合<span class=\"hb\">工業生產</span>的需要</td></tr>\n<tr><th>作法</th><td>臺灣<span class=\"hl\">三大陋習</span>＝吸食鴉片、辮髮、纏足。放足斷髮：①最初<span class=\"hb\">消極</span>（避免臺人抗爭）②後來透過<span class=\"hb\">保甲制度</span>與多方宣導、士紳倡導放足剪辮，帶動「<span class=\"hb\">易服改裝</span>」風氣。鴉片：①初採消極的<span class=\"hl\">漸禁</span>（管制吸食人口）②後因知識分子反對而改變作法</td><td>①醫療＝建立<span class=\"hl\">西式醫院</span>、辦理預防注射和接種（推廣疫苗對抗<span class=\"hb\">霍亂</span>等傳染病） ②公共＝建造<span class=\"hl\">自來水</span>、廁所等公共衛生設施</td><td>①守法＝引進現代<span class=\"hl\">司法制度</span>、設立各級地方法院 ②守時＝改用<span class=\"hb\">西曆</span>，引進<span class=\"hl\">標準時間制</span>與一週七天的<span class=\"hl\">星期制</span>，舉辦守時宣傳活動</td></tr>\n<tr><th>影響</th><td>①改變服飾風潮（漢、日、洋並存）②<span class=\"hl\">婦女得到解放</span>——走出家庭，從事教師、護士、車掌等工作 ③禁鴉片<span class=\"hl\">效果有限</span>，並沒有絕跡</td><td>①改善傳染病肆虐的環境 ②防疫、保健、衛生觀念逐漸普及 ③<span class=\"hl\">傳染病逐漸得到控制，臺灣人壽命提升</span></td><td>①確立臺灣的司法制度、臺人養成<span class=\"hb\">守法</span>觀念 ②養成<span class=\"hb\">守時</span>習慣、行政與交通遵守時間、開始重視放假與休閒（民間仍沿用農曆）</td></tr>\n<tr><th colspan=\"4\" class=\"grp\">現代都市的出現與休閒生活</th></tr>\n<tr><th>都市出現</th><td colspan=\"3\">1920 年代以後人口增加與集中，總督府引進<span class=\"hl\">現代化都市計畫</span>（道路、自來水、下水道）→<span class=\"hl\">1940 年代</span>形成臺北、高雄、臺南等大都市</td></tr>\n<tr><th>休閒公共化</th><td colspan=\"3\">各地建造<span class=\"hb\">公園、博物館</span>；1930 年代臺北<span class=\"hl\">菊元百貨</span>、臺南<span class=\"hl\">林百貨</span>落成，開百貨公司之先河（<span class=\"hb\">搭電梯</span>是當時最時髦的活動）；咖啡館、新式餐廳、博物館；推廣<span class=\"hb\">棒球</span>運動；報紙、廣播、咖啡廳與劇院出現；日本溫泉料理歌曲流行；搭<span class=\"hb\">鐵路</span>的長程旅遊觀光盛行</td></tr>\n<tr><th>城鄉差距</th><td colspan=\"3\">現代化均出現於<span class=\"hl\">都市</span>；鄉村和原住民部落則大致保留原來的生活型態</td></tr>\n</table>"},"j10":{"title":"原住民的社會演變與身分認同","html":"<table>\n<tr><th style=\"width:14%\">項目</th><th style=\"width:43%\">作法</th><th style=\"width:43%\">結果</th></tr>\n<tr><th>族群觀念<br>改變</th><td>原先原住民只有<span class=\"hb\">部落意識</span>；總督府派學者根據習俗、語言、分布等要素進行調查，以「<span class=\"hl\">族</span>」來區分原住民</td><td>促使<span class=\"hl\">族群觀念</span>發生變化（今日族群分類的源頭）</td></tr>\n<tr><th>傳統文化<br>改變</th><td>透過「<span class=\"hl\">蕃童教育所</span>」與警察，教原住民接受現代禮儀與醫療等知識；強迫停止<span class=\"hb\">出草、文面與室內葬</span>等習俗</td><td>改變原住民傳統的社會文化</td></tr>\n<tr><th>語言姓氏<br>改變</th><td>原住民被要求<span class=\"hl\">改日姓、說日語</span></td><td>①族群語言混雜日語，甚至姓名以日語發音 ②<span class=\"hb\">平埔族語言快速流失</span>，只剩噶瑪蘭族等語言可在族內流通</td></tr>\n<tr><th>身分上的<br>矛盾</th><td>原住民以部落為中心、<span class=\"hb\">無國族意識</span>；太平洋戰爭時參加「<span class=\"hl\">高砂義勇隊</span>」至南洋作戰</td><td>產生新的身分（<span class=\"hl\">日本兵</span>）；對參戰有不同態度——<span class=\"hb\">有志願的，也有被迫的</span></td></tr>\n<tr><th colspan=\"3\" style=\"text-align:left\">對照清帝國時期：清代是「劃界封山→開山撫番」，日治是「隘勇線圍堵→五年理蕃計畫→霧社後集團移住與同化」——手段從<span class=\"hb\">隔離</span>走向<span class=\"hl\">深入控制與改造</span>。</th></tr>\n</table>"},"jA":{"title":"日治時期臺人抗日行動統整","html":"<table>\n<tr><th style=\"width:10%\">類別</th><th style=\"width:22%\">接收臺灣時</th><th colspan=\"2\" style=\"text-align:center;color:var(--blue)\">武裝抗日</th><th style=\"width:24%;color:var(--orange)\">非武裝抗日</th></tr>\n<tr><th>行動</th><td><span class=\"hl\">臺灣民主國</span></td><td><span class=\"hl\">西來庵事件</span></td><td><span class=\"hl\">霧社事件</span></td><td><span class=\"hl\">政治社會運動</span></td></tr>\n<tr><th>時間</th><td>1895 年</td><td>1915 年</td><td>1930 年</td><td>1920 年代～1937 年</td></tr>\n<tr><th>領導</th><td><span class=\"hb\">唐景崧</span>（丘逢甲、劉永福）</td><td><span class=\"hb\">余清芳</span></td><td><span class=\"hb\">莫那魯道</span>（賽德克族）</td><td><span class=\"hb\">林獻堂、蔣渭水</span></td></tr>\n<tr><th>性質</th><td>抗拒日本接收</td><td>漢人抗日</td><td><span class=\"hl\">原住民</span>抗日</td><td>文化啟蒙，爭取權益</td></tr>\n<tr><th>背景</th><td><span class=\"hl\">甲午戰爭</span>戰敗，簽訂《<span class=\"hl\">馬關條約</span>》割讓臺、澎</td><td>日治初期，漢人武裝抗日行動不斷</td><td>①<span class=\"hb\">理蕃政策</span>侵奪土地 ②警察高壓管制部落 ③族人負擔沉重勞役</td><td>一次大戰後<span class=\"hl\">民族自決</span>風潮盛行</td></tr>\n<tr><th>結果</th><td>抵抗失敗</td><td>遭武力鎮壓</td><td>遭武力鎮壓，引發日本及<span class=\"hb\">國際輿論抨擊</span></td><td><span class=\"hl\">皇民化運動後受到禁制</span>、被迫終止</td></tr>\n<tr><th>影響<br>或意義</th><td>並非欲爭取民主政治或獨立，而是<span class=\"hl\">回歸清帝國統治</span></td><td>臺人有感於武裝抗日死傷慘重，<span class=\"hl\">改採非武裝的政治社會運動</span></td><td>總督府<span class=\"hl\">調整統治原住民政策</span>➡教育同化、將部落集體遷往他處</td><td>臺人對<span class=\"hl\">自治、普選、參政權</span>等觀念已有初步認識</td></tr>\n</table>"},"jB":{"title":"荷治至日治：原住民政策的演變（跨章總表）","html":"<table>\n<tr><th style=\"width:10%\">時期</th><th style=\"width:17%;color:var(--orange)\">荷治時期</th><th style=\"width:15%;color:var(--green)\">鄭氏時期</th><th style=\"width:20%;color:var(--blue)\">清帝國前期</th><th style=\"width:15%;color:var(--blue)\">開港通商後</th><th style=\"width:23%;color:var(--red)\">日治時期</th></tr>\n<tr><th>措施</th><td>武力征討、<span class=\"hb\">地方會議</span>、宗教教化</td><td>武力征討、<span class=\"hb\">儒家教化</span></td><td>對生番：<span class=\"hl\">劃界封山</span><br>對熟番：推廣漢文化</td><td><span class=\"hl\">開山撫番</span></td><td>安撫＋圍堵（<span class=\"hb\">隘勇線</span>）➡<span class=\"hl\">五年理蕃計畫</span>➡教育同化＋<span class=\"hb\">集團移住</span>➡皇民化運動</td></tr>\n<tr><th>反抗事件</th><td><span class=\"hb\">麻豆社之役</span>、大肚王反抗</td><td><span class=\"hb\">大肚王抗鄭</span></td><td>—（大甲西社事件）</td><td>原住民反抗➡遭鎮壓</td><td><span class=\"hl\">霧社事件</span></td></tr>\n<tr><th>影響</th><td>部分原住民接受<span class=\"hb\">基督教</span>信仰</td><td>原住民生活型態受影響、生活空間受壓縮</td><td>加速<span class=\"hb\">平埔族群漢化</span>、傳統文化漸趨式微</td><td>被迫<span class=\"hb\">遷移他處</span>（四次大遷移）</td><td>原住民的<span class=\"hl\">語言及傳統習俗逐漸流失</span>；以「族」區分族群、改日姓說日語、組高砂義勇隊</td></tr>\n</table>"},"jC":{"title":"清帝國與日治時期的經濟・商業・交通比較（跨章總表）","html":"<table>\n<tr><th style=\"width:10%\">時期</th><th colspan=\"2\" style=\"text-align:center;color:var(--blue)\">清帝國時期</th><th colspan=\"2\" style=\"text-align:center;color:var(--red)\">日治時期</th></tr>\n<tr><th>分期</th><td style=\"width:22%\">開港通商前</td><td style=\"width:22%\">開港通商後</td><td style=\"width:23%\">日治前期</td><td style=\"width:23%\">1930 年代起</td></tr>\n<tr><th>經濟型態</th><td><span class=\"hl\">對渡貿易</span><br>農業、兩岸貿易</td><td><span class=\"hl\">國際貿易</span><br>農業、國際貿易</td><td>強化基礎建設<br><span class=\"hl\">工業日本，農業臺灣</span></td><td><span class=\"hl\">工業臺灣，農業南洋</span><br>軍需工業、輕工業</td></tr>\n<tr><th>主要港口</th><td><span class=\"hb\">府城、鹿港、艋舺</span><br>（一府二鹿三艋舺）</td><td><span class=\"hb\">安平、淡水、雞籠、打狗</span></td><td colspan=\"2\"><span class=\"hb\">基隆、高雄</span>（基隆＝對日門戶；高雄＝南部進出港）</td></tr>\n<tr><th>貿易對象</th><td>與中國大陸<span class=\"hl\">對渡貿易</span></td><td>發展<span class=\"hl\">進出口貿易</span></td><td colspan=\"2\">與<span class=\"hl\">日本本土、南洋</span>往來</td></tr>\n<tr><th>商業組織</th><td><span class=\"hl\">郊</span>（郊商）</td><td><span class=\"hl\">洋行</span>（＋買辦）</td><td colspan=\"2\"><span class=\"hl\">會社</span>（公司）</td></tr>\n<tr><th>水利</th><td colspan=\"2\">瑠公圳、貓霧捒圳、八堡圳、曹公圳（民間合資為主）</td><td colspan=\"2\"><span class=\"hl\">嘉南大圳</span>（八田與一，1930，日治規模最大）</td></tr>\n<tr><th>道路</th><td colspan=\"2\">沈葆楨開闢三條通往山區及東部的道路</td><td colspan=\"2\">在各地修築<span class=\"hb\">公路</span>；五年理蕃計畫打通東西橫貫道路</td></tr>\n<tr><th>鐵路</th><td colspan=\"2\"><span class=\"hl\">最早的鐵路</span>：基隆－新竹（劉銘傳，1891/1893）</td><td colspan=\"2\"><span class=\"hl\">西部縱貫鐵路</span>：基隆－高雄（1908）、阿里山鐵路</td></tr>\n<tr><th>海運</th><td colspan=\"2\">購置輪船，航行臺灣、中國、東南亞之間</td><td colspan=\"2\">整建<span class=\"hb\">基隆港、高雄港</span></td></tr>\n<tr><th>空運</th><td colspan=\"2\">—</td><td colspan=\"2\">興建<span class=\"hb\">飛行場</span>（機場）</td></tr>\n<tr><th>通訊</th><td colspan=\"2\">架設電報線、設<span class=\"hb\">郵政總局</span></td><td colspan=\"2\">設立<span class=\"hb\">郵便局</span>（郵局）、電報、電話</td></tr>\n<tr><th>電力</th><td colspan=\"2\">—（劉銘傳於臺北街道裝設電燈）</td><td colspan=\"2\"><span class=\"hl\">日月潭水力發電所</span>（1934）</td></tr>\n<tr><th>製糖</th><td colspan=\"2\">傳統<span class=\"hb\">糖廍</span>（人力畜力）</td><td colspan=\"2\"><span class=\"hl\">新式製糖廠</span>（機械）→糖業王國</td></tr>\n<tr><th colspan=\"5\" style=\"text-align:left\">一句話：清代的建設是<span class=\"hb\">因應外力入侵、由官員零星推動</span>；日治的建設是<span class=\"hl\">殖民母國有計畫地榨取資源</span>——但客觀上奠定了臺灣現代化與工業化的基礎。</th></tr>\n</table>"},"t14":{"title":"清帝國對臺灣實施的相關禁令","html":"<table>\n<tr><th>政策</th><th>海禁政策</th><th style=\"color:var(--blue)\">渡臺禁令</th><th style=\"color:var(--orange)\">劃界封山</th></tr>\n<tr><th>目的</th><td>打擊<span class=\"hb\">鄭氏政權</span></td><td>限制移民，方便統治（防臺灣再成<span class=\"hb\">反清基地</span>）</td><td>避免<span class=\"hb\">漢原衝突</span></td></tr>\n<tr><th>實施時間</th><td>清初～<span class=\"hb\">1684年</span></td><td><span class=\"hb\">1684～1875年</span></td><td><span class=\"hb\">1722～1875年</span></td></tr>\n<tr><th>內容</th><td>禁止中國沿海人民出海</td><td>男子須先申請<span class=\"hl\">證照</span>，<span class=\"hl\">不得攜眷</span></td><td>劃定<span class=\"hl\">番界</span>（土牛、立碑），隔離漢人與原住民</td></tr>\n<tr><th>影響</th><td><span class=\"hl\">走私貿易</span>興起</td><td><span class=\"hl\">偷渡</span>興盛、<span class=\"hl\">性別比例失衡</span>（羅漢腳）</td><td><span class=\"hl\">侵墾</span>興盛，番界往山區移動</td></tr>\n<tr><th>廢止</th><td>納臺灣為版圖後</td><td colspan=\"2\" style=\"text-align:center\"><span class=\"hb\">沈葆楨</span>來臺後奏請放寬或廢止</td></tr>\n</table>"},"t15":{"title":"清代臺灣四大水圳","html":"<table>\n<tr><th>名稱</th><th>興建者</th><th>時間</th><th>水源</th><th>灌溉區域</th><th>特色</th></tr>\n<tr><th style=\"color:var(--blue)\">八堡圳</th><td><span class=\"hb\">施世榜</span></td><td><span class=\"hb\">1709 興築</span><br>1719 完工（康熙）</td><td><span class=\"hl\">濁水溪</span></td><td>彰化平原</td><td>清代灌溉規模<span class=\"hl\">最大</span>的水圳</td></tr>\n<tr><th style=\"color:var(--green)\">貓霧捒圳</th><td><span class=\"hb\">張達京</span></td><td><span class=\"hb\">1733</span><br>（雍正年間）</td><td><span class=\"hl\">大甲溪</span></td><td>臺中盆地</td><td>漢人與<span class=\"hl\">原住民合作</span>修築</td></tr>\n<tr><th style=\"color:var(--blue)\">瑠公圳</th><td><span class=\"hb\">郭錫瑠</span>父子</td><td><span class=\"hb\">1740</span><br>（乾隆年間）</td><td><span class=\"hl\">新店溪</span></td><td>臺北盆地</td><td>臺北地區<span class=\"hl\">最重要</span>的灌溉渠道</td></tr>\n<tr><th style=\"color:var(--blue)\">曹公圳</th><td>鳳山知縣<span class=\"hb\">曹謹</span></td><td><span class=\"hb\">1837</span><br>（道光年間）</td><td><span class=\"hl\">高屏溪</span></td><td>高雄地區</td><td><span class=\"hl\">官方主導</span>興建的水圳</td></tr>\n</table>"},"tExp":{"title":"大航海時代至清代的出口貿易（跨章總表）","html":"<table>\n<tr><th>時期</th><th>出口商品</th><th>貿易型態</th><th>主要對象</th></tr>\n<tr><th style=\"color:var(--orange)\">荷蘭時代</th><td><span class=\"hl\">稻米、蔗糖、鹿皮</span></td><td>轉口貿易</td><td>中國、日本、東南亞、歐洲</td></tr>\n<tr><th style=\"color:var(--orange)\">鄭氏政權</th><td><span class=\"hl\">蔗糖、鹿皮</span></td><td>對外貿易（走私、突破封鎖）</td><td>日本、東南亞、英國</td></tr>\n<tr><th style=\"color:var(--blue)\">清代開港前</th><td><span class=\"hl\">稻米、蔗糖</span></td><td><span class=\"hb\">兩岸對渡貿易</span>（郊商）</td><td>中國大陸為主</td></tr>\n<tr><th style=\"color:var(--blue)\">清代開港後</th><td><span class=\"hl\">茶、糖、樟腦</span></td><td><span class=\"hb\">國際貿易</span>（洋行）</td><td>美國、東南亞、日本、歐美</td></tr>\n<tr><th colspan=\"4\" style=\"text-align:left\">記法：<span class=\"hb\">鹿皮</span>在鄭氏之後消失（鹿群枯竭）、<span class=\"hb\">稻米</span>在開港後被茶與樟腦取代，只有「<span class=\"hl\">糖</span>」四個時期都在。</th></tr>\n</table>"},"tOC":{"title":"清帝國治臺 開港通商前 vs 開港通商後（三大領域）","html":"<table>\n<tr><th style=\"width:12%\">領域／項目</th><th style=\"width:44%;color:var(--blue)\">◀ 開港通商前（1684–1860）</th><th style=\"width:44%;color:var(--orange)\">開港通商後（1860–1895）▶</th></tr>\n<tr><th colspan=\"3\" class=\"grp\">一、清帝國的治臺政策</th></tr>\n<tr><th>治臺方針</th><td>「<span class=\"hl\">為防臺而治臺</span>」——<span class=\"hb\">渡臺禁令</span>（對漢人）＋<span class=\"hb\">劃界封山</span>（對原住民）</td><td><span class=\"hl\">外力入侵→轉趨積極</span>——<span class=\"hb\">牡丹社事件</span>→沈葆楨來臺；<span class=\"hb\">清法戰爭</span>→劉銘傳來臺、<span class=\"hl\">臺灣建省</span></td></tr>\n<tr><th>行政區劃</th><td>隸<span class=\"hb\">福建省</span>：1府3縣（康熙）→1府4縣2廳（雍乾）→1府4縣3廳（嘉慶）＝<span class=\"hb\">民變</span>驅動</td><td>1875 <span class=\"hb\">2府8縣4廳</span>（增臺北府）→1885 建省→1887 <span class=\"hb\">3府1州11縣3廳</span>＝<span class=\"hb\">國防</span>驅動</td></tr>\n<tr><th>加強建設</th><td>經費不足、幾無建設</td><td>政治→調整行政區劃、<span class=\"hl\">廢除禁令</span>；軍事→<span class=\"hb\">西式炮臺</span>；交通→<span class=\"hb\">電報線、郵政、鐵路</span>；教育→西學堂；原住民→<span class=\"hl\">開山撫番</span></td></tr>\n<tr><th colspan=\"3\" class=\"grp\">二、農商發展與對外貿易</th></tr>\n<tr><th>農業發展</th><td>多<span class=\"hl\">民間合資拓墾</span>（墾號如金廣福）、興築<span class=\"hb\">瑠公圳</span>等水圳，米糖產量提高</td><td>茶與樟腦成為新興產業，<span class=\"hl\">原始山林被茶、樟腦園取代</span></td></tr>\n<tr><th>貿易型態</th><td><span class=\"hl\">對渡貿易</span>（對象：<span class=\"hb\">中國大陸</span>）</td><td><span class=\"hl\">國際貿易</span>（英法聯軍之役後開港通商）</td></tr>\n<tr><th>港口市鎮</th><td><span class=\"hb\">鹿耳門</span>為唯一合法正港→鹿港、八里坌；「<span class=\"hl\">一府二鹿三艋舺</span>」</td><td>四口岸：<span class=\"hb\">雞籠、淡水、安平、打狗</span></td></tr>\n<tr><th>商業組織</th><td><span class=\"hl\">行郊</span>組織（郊商）：泉郊廈郊／米郊糖郊布郊</td><td>設立<span class=\"hl\">洋行</span>＋僱漢人<span class=\"hb\">買辦</span>（例：李春生）</td></tr>\n<tr><th>出口商品</th><td>出口<span class=\"hb\">稻米、蔗糖</span>；進口紡織品、藥材、日用品</td><td>出口蔗糖、<span class=\"hl\">茶、樟腦</span>；進口<span class=\"hb\">鴉片</span>、紡織品；1878 起<span class=\"hl\">出超</span></td></tr>\n<tr><th>經濟重心</th><td>南部（臺灣府城）</td><td><span class=\"hl\">經濟重心北移</span>——茶、樟腦帶動中北部近山市鎮興起（例：<span class=\"hb\">大稻埕、大溪</span>）</td></tr>\n<tr><th colspan=\"3\" class=\"grp\">三、社會文化變遷</th></tr>\n<tr><th>社會衝突</th><td><span class=\"hl\">械鬥</span>（移民爭利益，依祖籍別）、抗官<span class=\"hl\">民變</span>（三年一小反、五年一大亂）</td><td>移墾社會轉為<span class=\"hb\">定居社會</span>，衝突趨緩；豪族與客家因茶、樟腦致富，<span class=\"hb\">社會階層變動</span></td></tr>\n<tr><th>文化發展</th><td>原鄉信仰（<span class=\"hb\">祖籍別</span>）→<span class=\"hl\">共同信仰</span>；<span class=\"hb\">唐山祖</span>（集資）→<span class=\"hb\">開臺祖</span>（有血緣）；文風漸興</td><td><span class=\"hl\">西方文化再傳入</span>——傳教士以<span class=\"hb\">醫療和教育</span>傳教（例：<span class=\"hb\">馬偕</span>北部、<span class=\"hb\">馬雅各</span>南部）</td></tr>\n<tr><th>原住民</th><td>平埔：土地流失→<span class=\"hl\">生活方式改變</span>；漢人侵墾→展開<span class=\"hl\">4次大遷移</span>。高山：劃界封山，衝突不大</td><td><span class=\"hl\">開山撫番</span>→原漢關係更趨緊張、<span class=\"hb\">山區原住民被迫遷徙</span>；劉銘傳「撫番」變「<span class=\"hl\">剿番</span>」</td></tr>\n<tr><th colspan=\"3\" style=\"text-align:left\">分界＝<span class=\"hb\">英法聯軍之役</span>(1857)→<span class=\"hb\">天津條約</span>(1858)→1860年代<span class=\"hl\">正式開港通商</span>。一句話：開港前「<span class=\"hb\">向內、向中國、消極防臺</span>」，開港後「<span class=\"hl\">向外、向世界、積極治臺</span>」。</th></tr>\n</table>"},"t16":{"title":"開港後三大出口商品","html":"<table>\n<tr><th>順位</th><th style=\"color:var(--green)\">茶葉（第一）</th><th style=\"color:var(--orange)\">蔗糖（第二）</th><th style=\"color:var(--red)\">樟腦（第三）</th></tr>\n<tr><th>產地</th><td>臺灣<span class=\"hl\">北部</span></td><td>臺灣<span class=\"hl\">南部</span></td><td>臺灣<span class=\"hl\">中、北部</span></td></tr>\n<tr><th>出口港</th><td><span class=\"hb\">淡水</span></td><td><span class=\"hb\">安平、打狗</span></td><td><span class=\"hb\">淡水</span></td></tr>\n<tr><th>外銷區域</th><td>美國、東南亞</td><td>中國、日本</td><td><span class=\"hb\">歐美各國</span></td></tr>\n<tr><th>特色</th><td>當時臺灣<span class=\"hl\">最大輸出商品</span></td><td><span class=\"hb\">歷史悠久</span>的外銷商品</td><td>產量曾居<span class=\"hl\">世界第一</span></td></tr>\n</table>"},"t17":{"title":"清帝國時期原住民與漢人的互動","html":"<table>\n<tr><th>族群</th><th>清帝國統治政策</th><th>漢原通婚</th><th>族群衝突</th><th>傳統文化</th></tr>\n<tr><th style=\"color:var(--blue)\">平埔族群</th><td>須<span class=\"hb\">納稅、服勞役</span>，推行<span class=\"hl\">漢化政策</span>便於統治</td><td><span class=\"hl\">多</span></td><td>官府欺壓、土地流失➡<span class=\"hb\">大甲西社事件</span></td><td>傳統<span class=\"hb\">式微</span>，逐漸融入漢人社會</td></tr>\n<tr><th style=\"color:var(--green)\">高山各族</th><td><span class=\"hb\">劃界封山</span>➡<span class=\"hb\">開山撫番</span></td><td><span class=\"hl\">少</span></td><td><span class=\"hl\">開山撫番</span>➡侵入傳統生活領域</td><td>傳統文化<span class=\"hb\">面臨挑戰</span></td></tr>\n</table>"},"t18":{"title":"荷治・鄭氏・清帝國治臺比較（跨章總表）","html":"<table>\n<tr><th>時期</th><th style=\"color:var(--orange)\">荷治時期</th><th style=\"color:var(--green)\">鄭氏時期</th><th style=\"color:var(--blue)\">清・開港前</th><th style=\"color:var(--orange)\">清・開港後</th></tr>\n<tr><th>時間</th><td>1624～1662</td><td>1662～1683</td><td>1684～1860年代</td><td>1860年代～1895</td></tr>\n<tr><th>政治特色</th><td>最早統治臺灣的<span class=\"hb\">歐洲人政權</span></td><td>臺灣第一個<span class=\"hb\">漢人政權</span></td><td>為防臺而治臺：<span class=\"hl\">渡臺禁令、劃界封山</span></td><td>受<span class=\"hb\">外力入侵</span>刺激，展開相關建設</td></tr>\n<tr><th>社會型態</th><td colspan=\"3\" style=\"text-align:center\"><span class=\"hl\">移墾社會</span></td><td><span class=\"hl\">定居社會</span></td></tr>\n<tr><th>文化發展</th><td>傳入基督教、創制<span class=\"hb\">新港文</span></td><td>引進漢人文化（科舉、儒學）</td><td>初期文風不盛，後增設教育機構而漸盛</td><td><span class=\"hb\">西方文化再傳入</span></td></tr>\n<tr><th>土地拓墾</th><td>鼓勵漢人移墾</td><td>以<span class=\"hl\">軍屯</span>為主，自耕自食</td><td>多由民間<span class=\"hb\">合資開墾</span>、興建水圳</td><td>鼓勵漢人來臺拓墾</td></tr>\n<tr><th>原住民政策</th><td>宗教教化、召開<span class=\"hb\">地方會議</span></td><td>推廣儒家文化；拓墾引發漢原衝突</td><td><span class=\"hl\">劃界封山</span></td><td><span class=\"hl\">開山撫番</span></td></tr>\n<tr><th>貿易型態</th><td><span class=\"hl\">轉口貿易</span></td><td>走私貿易</td><td><span class=\"hl\">對渡（兩岸）貿易</span></td><td><span class=\"hl\">國際貿易</span></td></tr>\n<tr><th>出口商品</th><td>稻米、蔗糖、鹿皮</td><td>蔗糖、鹿皮</td><td>稻米、蔗糖</td><td><span class=\"hl\">茶葉、蔗糖、樟腦</span></td></tr>\n<tr><th>抗官事件</th><td><span class=\"hb\">郭懷一事件</span>（漢人）、麻豆社之役</td><td><span class=\"hb\">大肚王反抗</span></td><td><span class=\"hb\">朱一貴、林爽文</span>事件</td><td><span class=\"hb\">戴潮春</span>事件</td></tr>\n</table>"},"t19":{"title":"清帝國時期外力入侵對臺灣的影響","html":"<table>\n<tr><th>事件</th><th>英法聯軍</th><th>牡丹社事件</th><th>清法戰爭</th><th>甲午戰爭</th></tr>\n<tr><th>時間</th><td>1857（1858 訂約）</td><td><span class=\"hb\">1874</span></td><td><span class=\"hb\">1884</span></td><td><span class=\"hb\">1894</span></td></tr>\n<tr><th>背景</th><td>通商、外交限制</td><td><span class=\"hl\">琉球</span>漁民船難</td><td><span class=\"hl\">越南</span>問題</td><td><span class=\"hl\">朝鮮</span>問題</td></tr>\n<tr><th>敵方</th><td>英國、法國</td><td>日本</td><td>法國</td><td>日本</td></tr>\n<tr><th>戰場</th><td>中國大陸</td><td><span class=\"hb\">恆春半島</span></td><td><span class=\"hb\">基隆、淡水、澎湖</span></td><td>朝鮮半島、黃海</td></tr>\n<tr><th>影響</th><td>臺灣<span class=\"hl\">開港通商</span>，開展國際貿易</td><td><span class=\"hl\">沈葆楨</span>來臺強化防務，推動現代化建設</td><td><span class=\"hl\">劉銘傳</span>來臺、<span class=\"hl\">臺灣建省</span>，推動現代化建設</td><td>簽訂《馬關條約》，<span class=\"hl\">割讓臺灣、澎湖</span></td></tr>\n</table>"}},"ERA_LABEL":{"pal":"舊石器時代","neo":"新石器時代","metal":"金屬器時代","hist":"歷史時代・清","ming":"明・海商","nl":"荷蘭","es":"西班牙","cheng":"鄭氏","qpre":"清・開港通商前","qpost":"清・開港通商後","jp1":"日治・無方針主義(1895–1919)","jp2":"日治・內地延長主義(1919–1937)","jp3":"日治・皇民化(1937–1945)"},"REIGN_DATA":[{"tier":1,"label":"荷西時期","from":1624,"to":1662,"c":"orange","ch":2},{"tier":1,"label":"鄭氏時期","from":1662,"to":1683,"c":"green","ch":2},{"tier":1,"label":"清帝國時期","from":1684,"to":1895,"c":"red","ch":0},{"tier":2,"label":"康熙","from":1684,"to":1722,"c":"blue","ch":3},{"tier":2,"label":"雍正","from":1723,"to":1735,"c":"blue","ch":3},{"tier":2,"label":"乾隆","from":1736,"to":1795,"c":"blue","ch":3},{"tier":2,"label":"嘉慶","from":1796,"to":1820,"c":"blue","ch":3},{"tier":2,"label":"道光","from":1821,"to":1850,"c":"blue","ch":3},{"tier":2,"label":"咸豐","from":1851,"to":1861,"c":"blue","ch":3},{"tier":2,"label":"同治","from":1862,"to":1874,"c":"orange","ch":3},{"tier":2,"label":"光緒","from":1875,"to":1895,"c":"orange","ch":3},{"tier":1,"label":"日治時期","from":1895,"to":1945,"c":"theme","ch":4},{"tier":2,"label":"無方針主義","from":1895,"to":1919,"c":"blue","ch":4},{"tier":2,"label":"內地延長主義","from":1919,"to":1937,"c":"green","ch":4},{"tier":2,"label":"皇民化運動","from":1937,"to":1945,"c":"red","ch":4},{"tier":1,"label":"戰後臺灣（中華民國）","from":1945,"to":1994,"c":"blue","ch":0}],"essenceGlobal":["jF","jB","t18"],"essenceByCh":{"1":[],"2":["t6"],"3":["tExp"],"4":["jZ","jD","jE","jC"]},"NODES":{"t01":{"id":"t01","lb":"距今5萬年前","sb":"舊石器時代開始","nt":"臺灣最早的人類活動。舊石器時代：距今 5 萬～5 千年前。","tb":"","era":"pal","ch":1,"kind":"time","cat":"年代","y":-50000},"t02":{"id":"t02","lb":"距今7千年前","sb":"新石器時代開始","nt":"新石器時代：距今 7 千～2 千年前。關鍵轉變：從「採食」到「產食」，文化快速發展。","tb":"","era":"neo","ch":1,"kind":"time","cat":"年代","y":-7000},"t03":{"id":"t03","lb":"距今2千年前","sb":"金屬器時代開始","nt":"金屬器時代：距今 2 千～4 百年前。","tb":"","era":"metal","ch":1,"kind":"time","cat":"年代","y":-2000},"t04":{"id":"t04","lb":"12–13世紀 漢人至澎湖","sb":"歐洲人東來前","nt":"歐洲人東來前，「海商」在東亞海域貿易已相當活躍；12、13 世紀開始，漢人已在澎湖往來活動。","tb":"","era":"ming","ch":2,"kind":"time","cat":"年代","y":1250},"t05":{"id":"t05","lb":"14世紀後期 明海禁","sb":"海商走私貿易","nt":"①明朝實施海禁：限制人民私自出海。②「海商」走私貿易：澎湖與臺灣位於南北航道及東亞貿易圈的要地，因而成為重要貿易據點。","tb":"","era":"ming","ch":2,"kind":"time","cat":"年代","y":1350},"t06":{"id":"t06","lb":"1557 葡占澳門","sb":"歐人東亞據點①","nt":"葡萄牙占領中國澳門——葡萄牙在東亞的貿易據點（形勢圖①）。","tb":"","era":"","ch":2,"kind":"time","cat":"年代","y":1557},"t07":{"id":"t07","lb":"1571 西占馬尼拉","sb":"歐人東亞據點②","nt":"西班牙占領菲律賓馬尼拉（形勢圖②）。後為確保馬尼拉安全而北上臺灣。","tb":"","era":"es","ch":2,"kind":"time","cat":"年代","y":1571},"t08":{"id":"t08","lb":"16世紀後期 明派兵澎湖","sb":"海商移臺","nt":"明朝政府派兵澎湖。原因：「海盜」威脅東南沿海安全。結果：漢人「海商」從澎湖移至臺灣活動。影響：海商與歐洲勢力維持一定的合作關係。","tb":"","era":"ming","ch":2,"kind":"time","cat":"年代","y":1550},"t09":{"id":"t09","lb":"約400年前 進入歷史時代","sb":"開始有文字記載","nt":"史前↔歷史的分界＝有無文字記載。約 400 年前（17 世紀，大航海時代 15–17 世紀）臺灣進入歷史時代。","tb":"","era":"hist","ch":0,"kind":"time","cat":"年代","y":1625},"t10":{"id":"t10","lb":"1604 荷占澎湖・沈有容諭退","sb":"第一次占澎湖","nt":"荷蘭占領澎湖，被明將沈有容諭退（「澎湖為明朝的土地，絕不容許外人侵占」）。","tb":"","era":"nl","ch":2,"kind":"time","cat":"年代","y":1604},"t11":{"id":"t11","lb":"1619 荷占巴達維亞","sb":"歐人東亞據點③","nt":"荷蘭成立「荷蘭聯合東印度公司」，以巴達維亞（今印尼雅加達）為據點（形勢圖③）。影響：全球經濟貿易網開始形成。","tb":"","era":"nl","ch":2,"kind":"time","cat":"年代","y":1619},"t12":{"id":"t12","lb":"1624 荷占臺灣南部Ⓚ","sb":"大員・38年統治開始","nt":"荷蘭再占澎湖被明軍圍攻、進攻澳門被葡萄牙人擊退→1624 年退出澎湖、轉往臺灣Ⓚ。①占臺灣南部（大員）②成為「首度占領臺灣的歐洲勢力」。統治 1624–1662 共 38 年。","tb":"","era":"nl","ch":2,"kind":"time","cat":"年代","y":1624},"t13":{"id":"t13","lb":"1626 西占北臺灣","sb":"雞籠・淡水・蛤仔難","nt":"西班牙人認為荷蘭人占領臺灣南部會影響其貿易與航運安全→1626 進占臺灣北部雞籠（今基隆）、淡水與蛤仔難（今宜蘭）等地。統治 1626–1642 共 16 年。","tb":"","era":"es","ch":2,"kind":"time","cat":"年代","y":1626},"t14":{"id":"t14","lb":"1633 日本鎖國","sb":"1633–1854","nt":"因徵稅問題荷日爆發衝突（日本曾關閉荷蘭商館報復、多次協商後恢復貿易）→1633 年日本宣布「鎖國政策」：只准荷蘭人與中國人來長崎貿易。日商退出東亞貿易，荷、日衝突不再。鎖國背景＝西方文化與日本傳統衝突；至 1854 年美國軍艦叩關（黑船事件）結束。","tb":"t6","era":"","ch":2,"kind":"time","cat":"年代","y":1633},"t15":{"id":"t15","lb":"1635 麻豆社之役","sb":"武力征服","nt":"荷蘭人聯合新港社，攻打反抗的麻豆社。結果：麻豆社被迫簽訂協定，接受荷蘭人統治。","tb":"","era":"nl","ch":2,"kind":"time","cat":"年代","y":1635},"t16":{"id":"t16","lb":"1642 荷逐西班牙","sb":"西在臺16年結束","nt":"背景：①西班牙欲驅逐荷蘭人計畫無法完成 ②日本鎖國後，西班牙人對日貿易、傳教受阻 ③減少在臺駐軍。經過：1642 年荷人出兵驅離西班牙人，結束西班牙人在臺 16 年統治。","tb":"","era":"nl","ch":2,"kind":"time","cat":"年代","y":1642},"t17":{"id":"t17","lb":"1652 郭懷一事件","sb":"漢人抗荷","nt":"原因：荷人對漢人控制過嚴（苛捐雜稅）。爆發：1652 年郭懷一抗荷事件。此事件造成臺灣漢人死傷三千多名。","tb":"","era":"nl","ch":2,"kind":"time","cat":"年代","y":1652},"t18":{"id":"t18","lb":"1661–1662 鄭成功攻臺","sb":"荷離臺・第一個漢人政權","nt":"1661 年：自鹿耳門登陸，圍攻熱蘭遮城。1662 年：荷蘭人被驅離臺灣（城主揆一開城投降）；荷蘭轉而與清帝國合作對付鄭氏政權。建立臺灣第一個漢人政權。","tb":"","era":"cheng","ch":2,"kind":"time","cat":"年代","y":1661},"t19":{"id":"t19","lb":"1662–1683 鄭經時期","sb":"建設・貿易・文教","nt":"鄭經在臺推動各項建設、推動海外貿易；陳永華輔佐推展文教。","tb":"","era":"cheng","ch":2,"kind":"time","cat":"年代","y":1662},"t20":{"id":"t20","lb":"1683/1684 施琅攻臺・清帝國統治","sb":"鄭氏降清・臺入清版圖","nt":"1683 年清帝國派將施琅攻取臺灣，鄭克塽降清，結束鄭氏在臺約 20 年統治；1684 年臺灣首度納入中國版圖（隸福建省），清帝國統治開始。同年頒布渡臺禁令、鹿耳門設正港。清對原住民依「是否納稅、服勞役」分熟番／生番。","tb":"t18","era":"hist","ch":0,"kind":"time","cat":"年代","y":1683},"t21":{"id":"t21","lb":"1895 乙未割臺・日治開始","sb":"馬關條約","nt":"甲午戰敗→1895 馬關條約割讓臺灣（末代巡撫唐景崧；乙未年臺人抗日＝乙未割臺）。日治時期將原住民改稱：熟番→平埔族、生番→高砂族。","tb":"j3","era":"hist","ch":0,"kind":"time","cat":"年代","y":1895},"t3i":{"id":"t3i","lb":"1945 中華民國","sb":"高山族（山地同胞）","nt":"中華民國時期：高山族（山地同胞）＋部分平埔族。","tb":"","era":"hist","ch":1,"kind":"time","cat":"年代","y":1945},"t3j":{"id":"t3j","lb":"民國83年 修憲正名","sb":"統稱「原住民族」","nt":"民國 83 年（1994）修憲正名，統稱「原住民族」。目前經政府認定的有 16 族（跨科：公民）。","tb":"","era":"hist","ch":1,"kind":"time","cat":"年代","y":1994},"mPal":{"id":"mPal","lb":"舊石器時代","sb":"史前臺灣・★常考","nt":"距今 5 萬～5 千年前。生活型態：已知用火、打製石器，以採集、漁獵維生。代表遺址：長濱文化。","tb":"t1","era":"pal","ch":1,"kind":"theme","cat":"主題","y":-50000},"mNeo":{"id":"mNeo","lb":"新石器時代","sb":"史前臺灣・★常考","nt":"距今 7 千～2 千年前。磨製石器、燒製陶器、飼養家畜、農耕（稻米為主食）。「從採食到產食，文化快速發展」。代表遺址：大坌坑（早期）、圓山、卑南（晚期）＋南關里最早農耕證據。","tb":"t1","era":"neo","ch":1,"kind":"theme","cat":"主題","y":-7000},"mMet":{"id":"mMet","lb":"金屬器時代","sb":"史前臺灣・★常考","nt":"距今 2 千～4 百年前。鐵製工具（出土煉鐵爐、鐵渣）；貿易頻繁：玻璃手環、瑪瑙珠飾、銅錢等外來文物。代表遺址：十三行文化。","tb":"t1","era":"metal","ch":1,"kind":"theme","cat":"主題","y":-2000},"mOri":{"id":"mOri","lb":"原住民起源","sb":"南島語族","nt":"臺灣原住民各族群屬於南島語族，可能在數千年前移入臺灣，再向外擴散到其他地區。","tb":"","era":"","ch":1,"kind":"theme","cat":"主題","y":null},"mLeg":{"id":"mLeg","lb":"原住民傳說","sb":"口語傳說","nt":"原住民沒有創制文字，透過口語傳說傳承族群歷史與文化記憶。分「族群起源」與「族群遷徙」兩類傳說。","tb":"","era":"","ch":1,"kind":"theme","cat":"主題","y":null},"mDis":{"id":"mDis","lb":"原住民分布","sb":"平埔族群 vs 高山各族","nt":"以與漢人接觸早晚、分布位置區分：平埔族群（西部・東北部平原丘陵）與高山各族（山區與東部）。","tb":"t3","era":"","ch":1,"kind":"theme","cat":"主題","y":null},"mName":{"id":"mName","lb":"稱呼演變","sb":"清→日治→民國","nt":"清帝國「熟番／生番」→日治「平埔族／高砂族」→中華民國「部分平埔族／高山族（山地同胞）」→民國83年修憲正名，統稱「原住民族」，現認定16族。","tb":"t4","era":"","ch":1,"kind":"theme","cat":"主題","y":1625},"mSea":{"id":"mSea","lb":"海商在臺澎Ⓚ","sb":"歐人東來前～17世紀","nt":"東亞海域的「海商」貿易活躍。時序：漢人至澎湖（12–13世紀）→明海禁・走私（14世紀後期）→明派兵澎湖・海商移臺（16世紀後期）→顏思齊、鄭芝龍據臺（17世紀）。","tb":"","era":"ming","ch":2,"kind":"theme","cat":"主題","y":1250},"mEu":{"id":"mEu","lb":"歐人東來","sb":"背景15世紀末・發展16–17世紀","nt":"背景（15世紀末）：①動機：歐洲人對東南亞、中國、印度的香料、絲綢等需求大增 ②想法：尋求前往東方的道路 ③行動：發現來亞洲的新航路 ④意義：進入「大航海時代」。","tb":"","era":"","ch":2,"kind":"theme","cat":"主題","y":1557},"mNl":{"id":"mNl","lb":"荷蘭統治臺灣","sb":"1624–1662（38年）","nt":"1624 退出澎湖轉占臺灣南部，首度占領臺灣的歐洲勢力。統治工具：築城、貿易轉運站、招募漢人、控制原住民、宗教教化。1662 被鄭成功驅離。","tb":"t5","era":"nl","ch":2,"kind":"theme","cat":"主題","y":1604},"mEs":{"id":"mEs","lb":"西班牙在北臺","sb":"1626–1642（16年）","nt":"為確保貿易航運安全（及馬尼拉安全）進占北臺灣，統治雞籠、淡水；傳天主教、向北部原住民徵稅引發反抗；1642 被荷蘭人驅離。","tb":"t5","era":"es","ch":2,"kind":"theme","cat":"主題","y":1571},"mJp":{"id":"mJp","lb":"日本因素","sb":"高山國・鎖國","nt":"荷入臺前：日本稱臺灣為「高山國」；1593 派使臣來臺要求朝貢（無果）；1616 派船攻臺，少數登陸臺灣北部被原住民擊敗；日商購買中國絲綢、臺灣鹿皮。荷入臺後：因徵稅問題與荷衝突→1633 鎖國。","tb":"","era":"","ch":2,"kind":"theme","cat":"主題","y":1633},"mCkg":{"id":"mCkg","lb":"鄭氏政權","sb":"1662–1683（約20年）・明末清初","nt":"三代總結（秒懂關鍵句）：盤據東南「謀復明」→東征攻臺「驅紅毛」→漢人社會始「紮根」→兵敗「薙髮」終降清。漢人典章制度移植臺灣、漢人文化在臺生根。","tb":"t7","era":"cheng","ch":2,"kind":"theme","cat":"主題","y":1661},"mAb":{"id":"mAb","lb":"原住民與外來者","sb":"主題4・對抗／合作／改變","nt":"面對荷、西、鄭：有對抗（麻豆社、大肚王）也有合作（新港社、馬賽人）。結果：①外來勢力入臺，原住民生活及宗教面臨改變 ②也有保有原來文化未受影響者。","tb":"t8","era":"","ch":2,"kind":"theme","cat":"主題","y":1661},"kArch":{"id":"kArch","lb":"考古發掘","sb":"★常考・分期依據","nt":"①史前時代沒有（缺乏）文字記載，須根據出土的遺物與遺跡，推測史前人類的生活情況。②分期依據：使用器具的「種類（材質）與製作技術」，分為舊石器、新石器、金屬器三階段。","tb":"t1","era":"","ch":1,"kind":"point","cat":"重點","y":-50000},"kPalL":{"id":"kPalL","lb":"打製石器・用火","sb":"採集漁獵・不定居居山洞","nt":"工具：用火、打製石器。食物：採集、漁獵。生活型態：不定居，居於山洞。（分期比較表三欄一起背：工具→食物→生活）","tb":"t1","era":"pal","ch":1,"kind":"point","cat":"重點","y":-50000},"kNeoL":{"id":"kNeoL","lb":"磨製石器・陶器・農業","sb":"定居修屋・從採食到產食","nt":"工具：磨製石器、燒製陶器。食物：飼養家畜、種植作物（以稻米為主食）。生活型態：定居，修築房屋。從採食到產食，文化快速發展。分早／晚期：早期＝大坌坑文化；晚期＝圓山、卑南文化。","tb":"t1","era":"neo","ch":1,"kind":"point","cat":"重點","y":-7000},"kMetL":{"id":"kMetL","lb":"煉鐵・對外貿易","sb":"種稻漁獵・外來文物多","nt":"工具：金屬器（鐵器）——出土煉鐵爐、鐵渣。食物：種稻、漁獵。生活型態：貿易頻繁、外來文物多（玻璃手環、瑪瑙珠飾、銅錢）——與東南亞或中國大陸已有貿易往來。","tb":"t1","era":"metal","ch":1,"kind":"point","cat":"重點","y":-2000},"kAus":{"id":"kAus","lb":"南島語族","sb":"臺灣位於分布最北端・讀圖A++","nt":"分布於太平洋和印度洋：西至馬達加斯加、東至復活節島（智利）、南至紐西蘭、北至臺灣。臺灣位於南島語族分布範圍的最北端（讀圖常考）。","tb":"","era":"","ch":1,"kind":"point","cat":"重點","y":null},"kOral":{"id":"kOral","lb":"口語傳說","sb":"沒有創制文字","nt":"原住民沒有創制文字，透過口語傳說傳承族群歷史與文化記憶。","tb":"","era":"","ch":1,"kind":"point","cat":"重點","y":null},"kPin":{"id":"kPin","lb":"平埔族群","sb":"漢化較深・西部東北部","nt":"①與漢人接觸早，漢化較深，逐漸融入漢人社會。②分布於西部、東北部的平原、丘陵。③稱呼：熟番→平埔族。④代表（比較表）：西拉雅、凱達格蘭、噶瑪蘭。17 世紀族群另有：道卡斯、巴則海、巴布拉、貓霧捒、和安雅。起源＝南島語族（與高山各族相同）。","tb":"t3","era":"","ch":1,"kind":"point","cat":"重點","y":1895},"kHi":{"id":"kHi","lb":"高山各族","sb":"漢化較淺・山區與東部","nt":"①與漢人接觸晚，漢化較淺，保有不少原有文化。②分布於山區與東部地區。③稱呼：生番→高砂族→高山族（山地同胞）。④代表（比較表）：邵、排灣、賽夏。其他如：泰雅、賽德克、太魯閣、撒奇萊雅、鄒、卡那卡那富、拉阿魯哇、布農、阿美、卑南、魯凱、達悟。起源＝南島語族（與平埔族群相同）。","tb":"t3","era":"","ch":1,"kind":"point","cat":"地點","y":1895},"kQ":{"id":"kQ","lb":"清帝國：熟番／生番","sb":"依納稅・服勞役","nt":"清帝國依據「是否納稅、服勞役」分為熟番（多為平埔族群）、生番（多為高山各族）。","tb":"t4","era":"hist","ch":1,"kind":"point","cat":"重點","y":1683},"kJ":{"id":"kJ","lb":"日治：平埔族／高砂族","sb":"熟番→平埔・生番→高砂","nt":"日治時期改稱：熟番→平埔族、生番→高砂族。","tb":"t4","era":"hist","ch":1,"kind":"point","cat":"重點","y":1895},"kR":{"id":"kR","lb":"民國：原住民族","sb":"民國83年正名・16族","nt":"中華民國時期：部分平埔族／高山族（山地同胞）→民國83年修憲正名統稱「原住民族」。跨科（公民）：法源《原住民族基本法》；部落＝特定區域＋血緣關係＋共同文化；重要性＝文化傳承＋共享互助＋部落自治。跨科（地理）：都市原住民人口漸增；辦理祭典維繫文化傳統。","tb":"t4","era":"hist","ch":1,"kind":"point","cat":"重點","y":1945},"kBan":{"id":"kBan","lb":"海禁→走私貿易","sb":"澎湖臺灣＝貿易據點","nt":"明朝海禁（14世紀後期起）：目標＝防範倭寇；限制人民私自出海→「海商」走私貿易。對臺影響：16世紀起，澎湖、臺灣位於南北航道及東亞貿易圈要地→成為海商根據地／重要貿易據點。（比較表：明海禁 vs 清海禁 vs 日鎖國）","tb":"t6","era":"ming","ch":2,"kind":"point","cat":"事件","y":1250},"kZhi":{"id":"kZhi","lb":"顏思齊・鄭芝龍據臺","sb":"17世紀・海上霸主","nt":"17 世紀「海商」來臺：顏思齊、鄭芝龍在雲林、嘉義一帶建立據點、招募漢人開墾。海上新霸主：後鄭芝龍併吞數個海上勢力，成為東南沿海的霸主。荷蘭曾聯合其他海商對付鄭芝龍為首的明軍但被擊敗→關係好轉後合作（貿易發展順利開展）。明亡後鄭芝龍投降清帝國→荷蘭轉口貿易急遽衰退。","tb":"","era":"ming","ch":2,"kind":"point","cat":"人物","y":1250},"kMot":{"id":"kMot","lb":"動機→新航路→大航海","sb":"香料・絲綢","nt":"歐洲人對東南亞、中國、印度的香料、絲綢等需求大增→尋求前往東方的道路→發現來亞洲的新航路→進入「大航海時代」（15世紀末）。","tb":"","era":"","ch":2,"kind":"point","cat":"重點","y":1557},"kBase":{"id":"kBase","lb":"歐人亞洲三據點","sb":"澳門・馬尼拉・巴達維亞","nt":"背形勢圖編號：①1557 葡萄牙占澳門 ②1571 西班牙占馬尼拉 ③1619 荷蘭占巴達維亞（荷蘭聯合東印度公司據點）。影響：全球經濟貿易網開始形成。","tb":"","era":"","ch":2,"kind":"point","cat":"重點","y":1557},"kCast":{"id":"kCast","lb":"荷蘭築城","sb":"熱蘭遮＋普羅民遮","nt":"①政治中心：占領初期在大員（今臺南安平區）建「熱蘭遮城」（今安平古堡）。②商業中心：後在今赤崁一帶興築「普羅民遮城」。③驅離西班牙後在淡水築城＝今淡水紅毛城。","tb":"t5","era":"nl","ch":2,"kind":"point","cat":"地點","y":1604},"kTrans":{"id":"kTrans","lb":"貿易轉運站","sb":"稻米蔗糖鹿皮／瓷器香料絲織品","nt":"以臺灣為中心，與中國、日本和巴達維亞貿易，透過公司船隻延伸貿易至全球。②吸引中、日等國商人前來貿易。③輸出：稻米、蔗糖、鹿皮。④轉運：瓷器、香料、絲織品。","tb":"t5","era":"nl","ch":2,"kind":"point","cat":"重點","y":1604},"kHan":{"id":"kHan","lb":"招募漢人開墾","sb":"→控制過嚴→郭懷一","nt":"為增加稻米、糖產量，招募漢人來臺開墾。漢人反抗：①原因：荷人對漢人控制過嚴 ②爆發：1652 年郭懷一抗荷事件。","tb":"","era":"nl","ch":2,"kind":"point","cat":"重點","y":1652},"kCtrl":{"id":"kCtrl","lb":"控制原住民","sb":"武力＋結盟＋地方會議","nt":"對抗：武力征服（聯合新港社攻打反抗的麻豆社→被迫簽約接受統治）。合作：部落藉荷人勢力提升地位、取得西式武器。行政控制：①地方會議（長老參與，推行政令；北部150、南部120、淡水18、卑南20村落）②司法：各社由授予手杖的長老統治、長老可行使司法權 ③行政：傳教士為統治原住民的行政官員。","tb":"","era":"nl","ch":2,"kind":"point","cat":"重點","y":1635},"kRel":{"id":"kRel","lb":"宗教教化・新港文","sb":"羅馬字母拼西拉雅語","nt":"①傳教：建教堂、設學校，由基督教傳教士擔任老師，教授青少年及婦女。②文字：傳教士利用羅馬字母拼寫西拉雅族的語言，翻譯《聖經》，形成「新港文」。影響：南部平埔族與漢人以新港文字與漢文簽訂土地契約＝「新港文書」（又稱「番仔契」）。","tb":"t5","era":"nl","ch":2,"kind":"point","cat":"地點","y":1604},"kEco":{"id":"kEco","lb":"經濟影響","sb":"耕牛↑・鹿隻↓・轉耕種","nt":"①引進耕牛：為增加稻米產量。②鹿隻減少：漢人以布匹、鹽、鐵向原住民收購鹿皮，轉賣東印度公司→大量捕鹿使梅花鹿數量大量減少；土地開墾也使鹿隻減少。③原住民生活改變：17 世紀減少狩獵、由游耕漁獵轉為定居耕種（漢人帶來水田耕作技術）。","tb":"t8","era":"nl","ch":2,"kind":"point","cat":"重點","y":1604},"kEsN":{"id":"kEsN","lb":"占雞籠淡水・築城傳教","sb":"天主教・西班牙語彙","nt":"對原住民：武力降服、安撫（比較：荷蘭是結盟新港社＋武力麻豆社）。築城：聖薩爾瓦多城（基隆／雞籠）、聖多明哥城（淡水）。傳教：在北臺灣建立教堂傳播天主教、使用西班牙文（比較：荷蘭傳基督教、創新港文）。影響：北部原住民話語留下西班牙語彙。","tb":"t5","era":"es","ch":2,"kind":"point","cat":"地點","y":1571},"kBasay":{"id":"kBasay","lb":"馬賽人與外人合作","sb":"操舟・貿易・採金","nt":"①航行：善於操舟航行 ②學習語言：與漢人溝通 ③與漢人貿易：提供鹿皮、硫磺，交換布匹、鹽、鐵 ④協助西班牙人：至東部採黃金。","tb":"","era":"es","ch":2,"kind":"point","cat":"重點","y":1571},"kJpConf":{"id":"kJpConf","lb":"荷日貿易衝突","sb":"徵稅問題→鎖國","nt":"原因：因徵稅問題，荷蘭與來臺日商發生爭執。經過：日本曾關閉荷蘭商館報復、多次協商後恢復貿易。結束：1633 年日本宣布「鎖國政策」（17世紀前期起；目標＝減少西方文化傳入後的衝突），日商退出東亞貿易，荷、日衝突不再；西班牙因而減少駐軍。（鎖國時期荷蘭獲准與日本貿易。）","tb":"t6","era":"","ch":2,"kind":"point","cat":"重點","y":1633},"kAtk":{"id":"kAtk","lb":"鄭成功攻臺","sb":"反清復明・鹿耳門","nt":"反清復明：1646 鄭芝龍降清，其子鄭成功接續勢力，以金門、廈門為根據地持續反清。攻臺原因：為取得抗清所需的糧食與裝備，決定攻取「資源豐富且有戰略價值」的臺灣。經過：1661 自鹿耳門登陸、圍攻熱蘭遮城→1662 荷蘭人被驅離。","tb":"t7","era":"cheng","ch":2,"kind":"point","cat":"事件","y":1661},"kGov":{"id":"kGov","lb":"政經初建","sb":"承天府・軍屯・科舉","nt":"①行政：設承天府（今臺南市）為行政中心。②面臨海禁：清帝國為打擊鄭氏實施海禁。土地拓墾：為解決糧食問題積極開墾，採「寓兵於農」軍屯。漢人典章制度開始移植臺灣、舉行科舉、實施屯田軍屯、漢人文化從此在臺生根。","tb":"t5","era":"cheng","ch":2,"kind":"point","cat":"重點","y":1661},"kTrade":{"id":"kTrade","lb":"鄭經貿易","sb":"走私＋國際轉運","nt":"①中國走私貿易：清朝實施海禁→與當時英、日等合作取得中國商品；輸出蔗糖、鹿皮，輸入絲織品、瓷器、茶葉及日用品。②國際貿易：對象＝英國東印度公司、日本、東南亞；轉賣中國物品、取得軍火等物資；臺灣成為連結中國大陸、日本及東南亞各地的貿易轉運站。與英國簽訂通商條約的原因＝突破清廷經濟封鎖。","tb":"t5","era":"cheng","ch":2,"kind":"point","cat":"人物","y":1661},"kBlock":{"id":"kBlock","lb":"清廷圍堵鄭氏","sb":"海禁遷界・片板不許下海","nt":"清朝海禁（17世紀中期）：目標＝封鎖鄭氏政權。清順治至康熙年間：沿海居民向內地撤遷、「片板不許下海，粒貨不許越疆」；國姓爺使者在廈門遭逮捕（新政權清朝與鄭氏政權敵對）。對臺影響：鄭氏政權與中國進行走私貿易。統計圖：因實施海禁，造成（中國海外）貿易額減少。","tb":"t6","era":"","ch":2,"kind":"point","cat":"重點","y":1661},"kEdu":{"id":"kEdu","lb":"文教發展","sb":"孔廟・典章制度","nt":"協助者：陳永華（在陳永華的協助下提倡文教）。①在今臺南市內興建首座孔廟——全臺首學 ②廟旁設明倫堂培育人才 ③在原住民部落設學校，原住民逐漸接受儒家文化。將漢人典章制度移植臺灣。觀念提示：流亡臺灣的知識分子沈光文（字文開）等人在民間講學、教授原住民。","tb":"t7","era":"cheng","ch":2,"kind":"point","cat":"重點","y":1662},"kFall":{"id":"kFall","lb":"鄭克塽降清","sb":"政務廢弛→1683","nt":"①繼位：鄭經病逝後，幼子鄭克塽繼位（政務廢弛）。②衰亡：1683 年清帝國派將施琅攻取臺灣。③結束：鄭氏在臺約 20 年的統治；兵敗「薙髮」終降清。","tb":"","era":"cheng","ch":2,"kind":"point","cat":"重點","y":1683},"kAbCh":{"id":"kAbCh","lb":"原住民的改變","sb":"宗教・文字・耕種","nt":"外來勢力入臺：宗教（荷＝基督新教、西＝天主教、鄭＝漢人信仰如媽祖與儒家文化）、文字（新港文）、經濟（游耕漁獵→定居耕種、梅花鹿銳減）面臨改變。例外：管轄之外的原住民（多為高山族群）仍維持原有生活，不受外來者影響。","tb":"t8","era":"","ch":2,"kind":"point","cat":"重點","y":1661},"kDadu":{"id":"kDadu","lb":"中部大肚王","sb":"荷攻→受管轄；鄭時抗官","nt":"「大肚王」＝統轄中部平埔族群多個部落的共主。荷治：被荷人攻擊後，與一些部落接受荷人管轄，頭目受封賜，失去獨立性。鄭氏：因漢人侵墾壓縮生活空間、侵占土地、負擔沉重勞役→大肚王反抗／抗官（造成原住民嚴重傷亡）。","tb":"jF","era":"","ch":2,"kind":"point","cat":"重點","y":1661},"eCh":{"id":"eCh","lb":"長濱文化","sb":"臺東縣長濱鄉・舊石器晚期","nt":"臺灣目前發現最早的史前文化（★常考）。舊石器時代「晚期」。關鍵字：採集、漁獵生活、已知用火、打製石器。","tb":"t2","era":"pal","ch":1,"kind":"ex","cat":"重點","y":-50000},"eDb":{"id":"eDb","lb":"大坌坑文化","sb":"新北市八里區・新石器早期","nt":"又稱「粗繩紋陶文化」；種植根莖類作物（初級農業）。中國東南沿海也有相似的文化。新石器時代「早期」代表（打製到磨製石器的過渡）。","tb":"t2","era":"neo","ch":1,"kind":"ex","cat":"重點","y":-7000},"eYs":{"id":"eYs","lb":"圓山文化","sb":"臺北市（臺北盆地）・新石器晚期","nt":"貝塚遺跡→臺北湖存在的證據。新石器時代「晚期」。","tb":"t2","era":"neo","ch":1,"kind":"ex","cat":"地點","y":-7000},"eBn":{"id":"eBn","lb":"卑南文化","sb":"臺灣東部（臺東縣）・新石器晚期","nt":"出土大量石器、陶器；以石板屋、石板棺著稱；玉器陪葬品。注意！人獸形玉器在臺灣其他史前文化（如圓山文化）、東南亞也有發現→反映不同區域的互動。新石器時代「晚期」。","tb":"t2","era":"neo","ch":1,"kind":"ex","cat":"重點","y":-7000},"eNg":{"id":"eNg","lb":"南關里遺址","sb":"臺南（南科）","nt":"南科南關里遺址出土碳（炭）化稻米——農耕的證據；南關里遺址最早。新石器時代。","tb":"t2","era":"neo","ch":1,"kind":"ex","cat":"重點","y":-7000},"eSs":{"id":"eSs","lb":"十三行文化","sb":"新北市八里區","nt":"煉鐵作坊遺跡（煉鐵爐、鐵渣）、鐵製工具、砥石（磨利生產的鐵器）；以農業為主、種植穀物；干欄式住屋（建築）。出土玻璃珠、玻璃手環、瑪瑙珠飾、中國銅錢等外來器物——顯示與島外其他地區貿易頻繁。金屬器時代。","tb":"t2","era":"metal","ch":1,"kind":"ex","cat":"重點","y":-2000},"eL1":{"id":"eL1","lb":"排灣族：蛇生始 分界。","tb":"tOC","era":"qpost","ch":3,"kind":"time","cat":"年代","y":1858},"t20f":{"id":"t20f","lb":"1862 戴潮春事件","sb":"三大民變③・歷時最久","nt":"同治元年（1862）戴潮春抗清事件，三大民變中歷時最久。官逼民反。","tb":"t12","era":"qpost","ch":3,"kind":"time","cat":"年代","y":1862},"t20f5":{"id":"t20f5","lb":"1871 琉球漂民事件","sb":"牡丹社事件的導火線","nt":"同治10年（1871）琉球船隻遭遇暴風，漂流至恆春；船員因語言不通與原住民發生衝突而遇害。這是三年後日本出兵的藉口。","tb":"t19","era":"qpost","ch":3,"kind":"time","cat":"年代","y":1871},"t20g":{"id":"t20g","lb":"1874 牡丹社事件","sb":"沈葆楨來臺・轉趨積極","nt":"同治13年（1874）日本以「懲辦凶手」為藉口出兵臺灣南部，攻打牡丹社等部落。結果：雙方簽訂和約，清廷承認日本出兵為「保民義舉」→1879（光緒5年）日本正式併吞琉球。影響：①清廷派沈葆楨來臺加強防務，並從事各項改革 ②清廷治臺政策轉趨積極。","tb":"t19","era":"qpost","ch":3,"kind":"time","cat":"年代","y":1874},"t20g5":{"id":"t20g5","lb":"1875 沈葆楨改制","sb":"二府八縣四廳・增臺北府","nt":"光緒元年（1875）沈葆楨調整為「二府八縣四廳」。兩個方向：①北部崛起→增設臺北府（下轄淡水縣、新竹縣、宜蘭縣、基隆廳）——反映政經重心北移 ②牡丹社事件後為經營後山、鞏固主權→增設恆春縣、卑南廳、埔里社廳。","tb":"t9","era":"qpost","ch":3,"kind":"time","cat":"年代","y":1875},"t20h":{"id":"t20h","lb":"1878 對外貿易出超","sb":"入超轉出超","nt":"開港後對外貿易大幅成長，茶、糖、樟腦出口暢旺（占出口值約94%），1878 年起臺灣對外貿易由入超轉為出超。","tb":"t16","era":"qpost","ch":3,"kind":"time","cat":"年代","y":1878},"t20i":{"id":"t20i","lb":"1884 清法戰爭","sb":"劉銘傳來臺・「西仔反」","nt":"光緒10年（1884）清廷與法國因越南問題爆發戰爭，戰火波及基隆、淡水、澎湖。臺灣人稱這場戰爭為「西仔反」（「西仔」＝法蘭西，「反」＝戰爭）。影響：清廷更加重視臺灣地位→1885 建省、劉銘傳為首任巡撫。","tb":"t19","era":"qpost","ch":3,"kind":"time","cat":"年代","y":1884},"t20j":{"id":"t20j","lb":"1885 臺灣建省","sb":"首任巡撫劉銘傳","nt":"光緒11年（1885）清法戰爭後宣布臺灣建省，劉銘傳為首任巡撫。意義＝提升行政層級、增加自主權（不再隸屬福建省），並展開各項現代化建設。","tb":"t19","era":"qpost","ch":3,"kind":"time","cat":"年代","y":1885},"t20j5":{"id":"t20j5","lb":"1887 劉銘傳改制","sb":"三府一州十一縣三廳","nt":"光緒13年（1887）臺灣建省後，劉銘傳調整為「三府一州十一縣三廳」：中部增設臺灣府（省城所在，新設雲林縣、苗栗縣等），原臺灣府（南部）改稱臺南府，東部增設臺東直隸州——清代臺灣行政區劃的最終樣貌。三府＝臺北府、臺灣府、臺南府。","tb":"t9","era":"qpost","ch":3,"kind":"time","cat":"年代","y":1887},"t20k":{"id":"t20k","lb":"1894 甲午戰爭","sb":"→1895 乙未割臺","nt":"清日甲午戰爭清敗→1895 馬關條約割讓臺灣。末代巡撫唐景崧。","tb":"t19","era":"qpost","ch":3,"kind":"time","cat":"年代","y":1894},"m3Gov":{"id":"m3Gov","lb":"開港前消極治臺","sb":"為防臺而治臺・★常考","nt":"與「開港後積極治臺」對稱的另一半：1684 納入版圖～1860 年代開港前，清廷治臺消極。棄留論→施琅建議留臺（戰略考量）。清帝國在西部陸疆積極進取，但海疆政策始終圍繞「禁」與「防」：渡臺禁令（對漢人，目的＝限制移民、防止動亂）＋劃界封山（對原住民，目的＝避免漢原衝突）——合稱「為防臺而治臺」。兩者都在牡丹社事件後由沈葆楨奏請廢除。","tb":"t14","era":"qpre","ch":3,"kind":"theme","cat":"主題","y":1683},"m3Late":{"id":"m3Late","lb":"開港後積極治臺","sb":"外力入侵→建設・★常考","nt":"用「年代＋事件＋人物」成串背：1860年代英法聯軍→臺灣開港；1870年代牡丹社事件→沈葆楨；1880年代清法戰爭→劉銘傳、臺灣建省；1890年代甲午戰爭→乙未割臺。","tb":"t19","era":"qpost","ch":3,"kind":"theme","cat":"主題","y":1858},"m3Adm":{"id":"m3Adm","lb":"行政區劃","sb":"一府三縣→…→建省三府","nt":"隸屬福建省（1885 建省後獨立為臺灣省）。五階段：康熙 一府三縣→雍正～乾隆 一府四縣二廳（朱一貴事件後增彰化縣、淡水廳；諸羅改嘉義）→嘉慶～同治 一府四縣三廳（噶瑪蘭廳）→1875 沈葆楨 二府八縣四廳（增臺北府、恆春縣等）→1887 劉銘傳 三府一州十一縣三廳（中部增臺灣府為省城）。","tb":"t9","era":"","ch":3,"kind":"theme","cat":"主題","y":1721},"m3Eco":{"id":"m3Eco","lb":"經濟發展","sb":"開港前 vs 開港後・★常考","nt":"前期＝農業拓墾＋對渡貿易（郊商）；開港後＝國際貿易（洋行）、經濟重心北移、入超轉出超。","tb":"t10","era":"","ch":3,"kind":"theme","cat":"主題","y":1858},"m3Soc":{"id":"m3Soc","lb":"社會文化","sb":"移民社會的演變","nt":"來臺移民以福建（閩）＋廣東（粵）為主。性別失衡→械鬥民變多；信仰與宗族逐步在地化；文風漸興（舉人、進士漸多）；開港後西方文化傳入。","tb":"t18","era":"","ch":3,"kind":"theme","cat":"主題","y":1858},"m3Ab":{"id":"m3Ab","lb":"原住民政策與社會","sb":"劃界封山→開山撫番","nt":"政策：前期劃界封山→牡丹社後沈葆楨開山撫番→劉銘傳擴大開山撫番、剿番。社會：平埔族土地文化流失→反抗、四次大遷移；高山族前期衝突不大、開山撫番後反抗或遷徙。","tb":"t17","era":"","ch":3,"kind":"theme","cat":"主題","y":1858},"k3Aband":{"id":"k3Aband","lb":"棄留爭議→留臺","sb":"施琅建議・戰略考量","nt":"放棄派（許多大臣）理由：①臺灣小而無用、又是海盜聚集地，管理不易 ②非中國固有領土 ③增加政府財政負擔。保留派（施琅）理由：①物產豐富 ②戰略地位重要——可保東南沿海（屏障大陸東南沿海四省的門戶）。結果：康熙同意留下→納入版圖→隸福建省管轄；但因經費不足無法全力治理，只能「為防臺而治臺」。","tb":"","era":"qpre","ch":3,"kind":"point","cat":"重點","y":1683},"k3Ban":{"id":"k3Ban","lb":"渡臺禁令＋劃界封山","sb":"消極治臺・★常考","nt":"三大禁令一起記：①海禁（清初～1684，打擊鄭氏→走私興起，納臺後廢止）②渡臺禁令（1684～1875，限制移民：男子須先申請渡臺證照、不得攜眷→偷渡興盛、性別比例失衡）③劃界封山（1722～1875，避免漢原衝突：劃番界＝土牛、土牛溝、立碑，隔離漢原→侵墾興盛、番界往山區移動）。②③都在沈葆楨來臺後奏請放寬或廢止。合稱「為防臺而治臺」。","tb":"t14","era":"qpre","ch":3,"kind":"point","cat":"事件","y":1683},"k3Adm1":{"id":"k3Adm1","lb":"行政區劃演變","sb":"事件驅動・★常考","nt":"原則：①以社會、經濟發展需求來設置和調整 ②在治安（發生民變）、國防（外力入侵）需要時才陸續增設。所以每次調整幾乎都由事件觸發：朱一貴事件→增彰化縣、淡水廳＝一府四縣二廳（雍正元年1723，1727 再增澎湖廳；乾隆52年林爽文事件後諸羅縣改名嘉義縣）；漢人移民漸增（吳沙開墾）＋海盜侵擾→噶瑪蘭廳（嘉慶17年／1812，前期最晚設立的行政區）；牡丹社事件＋北部崛起→1875 二府八縣四廳（增臺北府、恆春縣、卑南廳、埔里社廳）；清法戰爭→1885 建省、1887 三府一州十一縣三廳（中部增臺灣府＝省城，原臺灣府改臺南府，增臺東直隸州）。","tb":"t9","era":"","ch":3,"kind":"point","cat":"重點","y":1721},"k3OC":{"id":"k3OC","lb":"開港前 vs 開港後","sb":"清帝國時期的分水嶺・★常考","nt":"分界＝英法聯軍之役（1857）→天津條約（1858）→1860 年代正式開港通商。一句話：開港前「向內、向中國、消極防臺」，開港後「向外、向世界、積極治臺」。分三大領域記：①治臺政策——為防臺而治臺（渡臺禁令對漢人／劃界封山對原住民）、區劃由民變驅動 ⇒ 外力入侵轉趨積極（牡丹社→沈葆楨、清法→劉銘傳與建省）、區劃由國防驅動、政治軍事交通教育全面建設 ②農商發展與對外貿易——合資拓墾與水圳、對渡貿易（行郊、出口米糖、一府二鹿三艋舺）⇒ 國際貿易（洋行與買辦、出口茶糖樟腦、四口岸、1878 出超、經濟重心北移） ③社會文化變遷——械鬥民變、原鄉信仰與唐山祖、平埔土地流失與四次大遷移 ⇒ 定居社會與階層變動、西方醫療教育傳教（馬偕北／馬雅各南）、開山撫番後原漢關係更緊張。","tb":"tOC","era":"","ch":3,"kind":"point","cat":"地點","y":1858},"k3Mudan":{"id":"k3Mudan","lb":"牡丹社事件","sb":"琉球問題・1874","nt":"日本藉琉球漂民事件出兵攻打牡丹社。影響：沈葆楨來臺建設、治臺轉趨積極、增臺北府、開山撫番。","tb":"t11","era":"qpost","ch":3,"kind":"point","cat":"事件","y":1871},"k3War":{"id":"k3War","lb":"清法戰爭","sb":"越南問題・1884","nt":"起因＝越南問題。劉銘傳來臺督辦防務→1885 臺灣建省。","tb":"t11","era":"qpost","ch":3,"kind":"point","cat":"事件","y":1884},"k3Agr":{"id":"k3Agr","lb":"農業拓墾","sb":"合資開墾＋水圳","nt":"土地來源：①自行占領無主地 ②向原住民承租 ③向政府申請墾照。拓墾方式：民間開墾為主，向官府申請墾照後開墾，因需龐大資金而多採「合資」共同拓墾（合資墾號以「金廣福」為代表）；墾戶按股份分配土地，留下臺南七股、苗栗頭份等地名。原漢衝突：漢人巧取強占原住民土地、違禁越過番界開墾（例證＝18世紀末吳沙越界開墾蛤仔難）→清廷數次重定番界，成效有限。水利：開墾者為求水源常合資興建水圳，擴大拓墾範圍、提高米糖產量，不僅自足還能銷往中國。","tb":"t15","era":"qpre","ch":3,"kind":"point","cat":"重點","y":1858},"k3Guo":{"id":"k3Guo","lb":"兩岸對渡貿易（開港前）","sb":"郊商主導・★常考","nt":"型態＝兩岸（對渡）貿易，對象以中國大陸為主。區域分工：輸出米、糖（長年豐收、足以外銷中國），輸入紡織品、藥材等日用品。商業組織＝「郊」（行郊）：商人為維護利益、避免惡性競爭而成立，並參與地方公共事務——依貿易區域分泉郊、廈郊，依商品分米郊、糖郊、布郊。","tb":"t10","era":"qpre","ch":3,"kind":"point","cat":"地點","y":1683},"k3Intl":{"id":"k3Intl","lb":"國際貿易（開港後）","sb":"洋行主導・★常考","nt":"英法聯軍→清廷戰敗→臺灣開港通商，重新進入國際貿易市場。主導者＝外國商人在通商口岸設立的「洋行」，掌握臺灣進出口貿易（淡水有寶順、美利士、公泰等洋行）。洋行僱用漢人「買辦」處理商務，部分買辦成為新興商人——代表人物李春生。輸入：鴉片、紡織品；輸出：茶葉（第一）、蔗糖（第二）、樟腦（第三）。貿易對象擴及世界各國。","tb":"t10","era":"qpost","ch":3,"kind":"point","cat":"地點","y":1858},"k3Shift":{"id":"k3Shift","lb":"政經重心北移","sb":"入超轉出超・大稻埕","nt":"茶、樟腦產地在中北部近山→帶動中北部市鎮興起（大嵙崁＝今桃園大溪、鹹菜甕＝今新竹關西）；淡水河岸的大稻埕成為茶葉加工與集散地，取代艋舺的商業地位；1878 入超轉出超（茶、糖、樟腦占出口值約94%）；連帶政治重心也北移（增臺北府）。","tb":"t10","era":"qpost","ch":3,"kind":"point","cat":"重點","y":1878},"k3Mig":{"id":"k3Mig","lb":"移民與性別失衡","sb":"閩粵為主・羅漢腳","nt":"福建（閩）、廣東（粵）人多耕地少→人口外移來臺。渡臺禁令不准攜眷→男多女少、人口比例失衡（俗諺「一個某，較贏三個天公祖」）。→部分男子與原住民女子通婚（「有唐山公，無唐山媽」）、入贅女方家、收養子女；部分男子無固定職業又沒結婚，被稱為「羅漢腳」，成為社會亂源。解決：沈葆楨來臺後取消渡臺禁令。","tb":"t14","era":"qpre","ch":3,"kind":"point","cat":"重點","y":1683},"k3Hakka":{"id":"k3Hakka","lb":"閩南人 vs 客家人","sb":"分布不同・同鄉聚居","nt":"閩南人：主要來自福建泉州及漳州，大多分布在平原。客家人：主要來自福建西部、廣東，北部客家人多分布丘陵（近山、不利水稻，多種甘蔗茶葉），南部客家人多分布平原；約占臺灣人口1/6，唱山歌、刻苦耐勞。地緣：為了互相照應，移民往往同鄉聚居——這也是後來械鬥依「祖籍別」爆發的原因。","tb":"t12","era":"qpre","ch":3,"kind":"point","cat":"重點","y":1858},"k3Fight":{"id":"k3Fight","lb":"械鬥與民變","sb":"三大民變・★常考","nt":"械鬥原因：①結盟盛行（移民多為單身、缺乏家族依靠，同鄉同姓結盟結社）②利益衝突（爭奪水源、田地、商業利益）③依祖籍、姓氏集結→最頻繁的是閩粵械鬥與漳泉械鬥（漳州人有時聯合客家人抵抗泉州人）。民變＝民眾以武力反抗政府（抗官民變），原因：秘密結社盛行、官員良莠不齊、男女比例失衡社會浮動、官民利益摩擦。三大民變：朱一貴（1721）→林爽文（1786，規模最大）→戴潮春（1862，歷時最久）。俗諺「三年一小反，五年一大亂」。","tb":"t12","era":"qpre","ch":3,"kind":"point","cat":"重點","y":1721},"k3Rel":{"id":"k3Rel","lb":"神明信仰","sb":"原鄉＋共同","nt":"背景：早期閩粵移民拓墾過程充滿危機，常在原鄉聚居的村莊建廟，供奉原鄉神明為守護神。原鄉神明（依祖籍）：漳州人＝開漳聖王；泉州人＝保生大帝、清水祖師；潮州人＝三山國王。共同信仰：媽祖、王爺、土地公；有應公廟＝祭祀孤魂野鬼。","tb":"t13","era":"qpre","ch":3,"kind":"point","cat":"重點","y":1858},"k3Clan":{"id":"k3Clan","lb":"宗族組織・文風","sb":"唐山祖 vs 開臺祖","nt":"唐山祖（初期）＝同姓、不一定有血緣關係，共同祭祀中國大陸原鄉的祖先，費用靠集資；開臺祖（後期）＝同姓且有血緣關係，祭祀來臺開發的祖先，修族譜、建祠堂並以部分祖產作公費。文教風氣：早期移民忙於墾殖而不盛→後來興盛（人民經濟生活改善、官方及民間教育機構增設、官方與地方人士倡導）→通過科舉的人數逐年增加，18～19世紀文風日益興盛。","tb":"t13","era":"qpre","ch":3,"kind":"point","cat":"重點","y":1858},"k3West":{"id":"k3West","lb":"西方文化再傳入","sb":"開港後・傳教士","nt":"傳播者＝傳教士，在臺建教堂傳福音，並以「醫療」與「教育」作為傳教方式，以基督教長老教會為主。（稱「再」傳入，是因為荷西時期已傳入一次，鄭氏、清前期中斷。）","tb":"tSoc","era":"qpost","ch":3,"kind":"point","cat":"重點","y":1858},"k3Hao":{"id":"k3Hao","lb":"社會階層變動","sb":"豪族形成・客家提升","nt":"豪族形成：部分地主、郊商與政府合作，取得樟腦經營權致富，成為豪族。客家人地位提升：原本北部客家人多居丘陵、近山，不利水稻與甘蔗生產；開港後因茶葉、樟腦生產而致富，社會地位逐漸上升。","tb":"tSoc","era":"qpost","ch":3,"kind":"point","cat":"重點","y":1858},"k3AbPol":{"id":"k3AbPol","lb":"原住民政策演變","sb":"劃界封山→開山撫番→剿番","nt":"前期＝劃界封山（隔離漢人與生番，清中期以前衝突不大；但隨漢人墾殖面積擴大，番界逐漸內移，高山族生存空間縮小）。轉捩點＝牡丹社事件（清廷為證明能在「番地」行使主權、阻止外人覬覦）→沈葆楨「開山撫番」：解除劃界封山、開闢通往後山（中央山脈以東）的北中南三條道路、鼓勵漢人開墾、東部設行政區→劉銘傳擴大開山撫番、設「番學堂」教化原住民，「撫番」變「剿番」。","tb":"t11","era":"","ch":3,"kind":"point","cat":"重點","y":1874},"k3AbSoc":{"id":"k3AbSoc","lb":"原住民社會變遷","sb":"平埔四次大遷移","nt":"平埔族（熟番）：生活受漢俗影響、亦接受官方管理；政府壓迫＝賦役繁重（除納稅還要服勞役）→多次抗官兵變（如1731大甲西社事件）；土地流失＝漢人透過買賣、交換、婚姻甚至欺騙取得，政府18世紀中葉下令禁止漢人承租買賣但成效有限；文化變遷＝被迫改漢姓、學漢字，學會水田耕作與合作開圳（如貓霧捒圳）；族群遷徙＝19世紀逐漸遷往宜蘭、埔里盆地和東部（四次大遷移）→傳統生活方式、語言與宗教信仰逐漸式微，多數融入漢人社會。高山族（生番）：生活區域不易進入、保留較多傳統文化，官府相對無法有效管治；開山撫番後受漢人入侵而遷往他處或更高山區，傳統文化面臨挑戰。","tb":"t17","era":"","ch":3,"kind":"point","cat":"重點","y":1731},"e3Jin":{"id":"e3Jin","lb":"金廣福墾號","sb":"合資墾號的代表・★常考","nt":"開墾需龐大資金，多由多人「合資」組成墾號向官府申請墾照，代表＝金廣福（閩粵合資，「金」取吉利、「廣」指廣東客家、「福」指福建閩南，共同開墾竹塹（今新竹）東南山區）。墾戶按出資股份分配土地，因此留下臺南七股、苗栗頭份這類以股份命名的地名。","tb":"t15","era":"qpre","ch":3,"kind":"ex","cat":"重點","y":1858},"e3ExpSeq":{"id":"e3ExpSeq","lb":"出口商品演變","sb":"荷→鄭→清前→清後・★常考","nt":"大航海時代至清代的出口貿易一路演變：荷蘭時代＝稻米、蔗糖、鹿皮；鄭氏政權＝蔗糖、鹿皮（稻米改為軍需自用）；清代開港前＝稻米、蔗糖（兩岸對渡）；清代開港後＝茶、糖、樟腦（國際貿易）。記法：鹿皮在鄭氏後消失（鹿群枯竭），稻米在開港後被茶與樟腦取代，只有「糖」四個時期都在。","tb":"tExp","era":"","ch":3,"kind":"ex","cat":"重點","y":1858},"e3AdmSeq":{"id":"e3AdmSeq","lb":"區劃五階段口訣","sb":"3縣→4縣2廳→4縣3廳→2府8縣4廳→3府1州11縣3廳","nt":"只背數字與觸發事件：①康熙 一府三縣（1684 納入版圖）②雍正～乾隆 一府四縣二廳（朱一貴→彰化縣、淡水廳；1727 澎湖廳；林爽文→諸羅改嘉義）③嘉慶 一府四縣三廳（吳沙開墾＋海盜→噶瑪蘭廳）④1875 沈葆楨 二府八縣四廳（北部崛起→臺北府；牡丹社後→恆春縣、卑南廳、埔里社廳）⑤1887 劉銘傳 三府一州十一縣三廳（建省後中部增臺灣府＝省城、原臺灣府改臺南府、東部增臺東直隸州）。府數只增不減：1→1→1→2→3。","tb":"t9","era":"","ch":3,"kind":"ex","cat":"重點","y":1721},"e3Shen":{"id":"e3Shen","lb":"沈葆楨","sb":"牡丹社事件後來臺（同治・光緒）","nt":"牡丹社事件後以欽差大臣身分來臺加強防務。事蹟：①加強海防＝在安平（二鯤鯓炮臺＝億載金城）、旗後架設新式炮臺，並修築恆春城 ②廢除渡臺禁令與劃界封山，免費乘船前往臺灣、發給口糧耕具及種子 ③交通＝興築北、中、南三條通往山區與東部的道路：北路 蘇澳→花蓮（蘇花公路前身）、中路 林圯埔（今南投竹山）→八通關→璞石閣（今花蓮玉里）、南路 射寮（今屏東枋寮）→赤山→卑南（今臺東），並開山撫番、東部設行政區 ④1875 調整行政區劃為二府八縣四廳、增臺北府、在恆春設縣 ⑤基隆採煤。","tb":"t11","era":"qpost","ch":3,"kind":"ex","cat":"人物","y":1875},"e3Liu":{"id":"e3Liu","lb":"劉銘傳","sb":"清法戰爭後・首任巡撫（光緒）","nt":"清法戰爭時來臺督辦防務，臺灣建省後任首任巡撫。事蹟：①軍事＝基隆「海門天險」、旗後「威震天南」等新式炮臺，設製造槍炮的工廠 ②交通＝購買輪船（航行於臺灣・中國大陸與東南亞之間）、架設電報線（遠達福州）、設郵政總局、修築基隆—臺北—新竹的鐵路（1891 光緒17年基隆↔臺北通車，1893 光緒19年臺北↔新竹通車，全線在後任巡撫邵友濂任內完成）③教育＝創立西式學堂、電報學堂，臺北市街裝設電燈 ④原住民＝擴大開山撫番、設番學堂，「撫番」變「剿番」⑤1887 三府一州十一縣三廳。經沈、劉建設後，臺灣已成當時中國相當進步的省分。","tb":"t11","era":"qpost","ch":3,"kind":"ex","cat":"人物","y":1885},"e3Fort":{"id":"e3Fort","lb":"億載金城・海門天險","sb":"新式炮臺（防日／防法）","nt":"沈葆楨（牡丹社事件後・防日）：在安平、旗後架設新式炮臺——安平「二鯤鯓炮臺」即今臺南「億載金城」，旗後炮臺在今高雄旗津。劉銘傳（清法戰爭後・防法與列強）：在基隆等地修建西式炮臺——基隆「二沙灣炮臺」即今「海門天險」。用「防日／防法」記誰建哪座：億載金城＝沈葆楨、海門天險＝劉銘傳。","tb":"t11","era":"qpost","ch":3,"kind":"ex","cat":"地點","y":1871},"e3Rail":{"id":"e3Rail","lb":"鐵路・電報・郵政","sb":"劉銘傳的現代化建設","nt":"基隆↔新竹鐵路（加強島內聯繫）、電報線（發展對外交通、延伸至福州）、郵政總局、輪船航行於中國・臺灣與東南亞之間。","tb":"t11","era":"qpost","ch":3,"kind":"ex","cat":"重點","y":1884},"e3School":{"id":"e3School","lb":"西式學堂・番學堂","sb":"劉銘傳・培養人才／教化","nt":"創立西式學堂、電報學堂培養相關人才；另設「番學堂」試圖讓原住民接受漢文化。","tb":"t11","era":"qpost","ch":3,"kind":"ex","cat":"重點","y":1884},"e3Makai":{"id":"e3Makai","lb":"馬偕・馬雅各","sb":"北馬偕・南馬雅各・★常考","nt":"開港後西方宗教與文化再度傳入，以基督教「長老教會」最重要；影響＝現代醫學知識與新式教育傳入臺灣。馬偕（1844–1901，加拿大籍，北部，1872 年抵淡水傳教）：在淡水設醫館、建「理學堂大書院」（又稱牛津學堂，在今淡水真理大學內）、設「淡水女學堂」倡導女子教育（今淡江中學前身）。馬雅各（1836–1921，英國籍，南部，1865 年抵臺南傳教）：在府城看西街設立醫館，並成立臺灣第一間西醫醫院（新樓醫院，今臺南新樓醫院前身）。北馬偕、南馬雅各。","tb":"tSoc","era":"qpost","ch":3,"kind":"ex","cat":"人物","y":1858},"e3Liugong":{"id":"e3Liugong","lb":"四大水圳","sb":"瑠公・八堡・貓霧捒・曹公","nt":"依時間順序記：①八堡圳——施世榜，1709 年興築、1719 年完工（康熙），濁水溪，彰化平原＝清代灌溉規模最大 ②貓霧捒圳——張達京，1733（雍正），大甲溪，臺中盆地＝原漢合作修築 ③瑠公圳——郭錫瑠父子，1740（乾隆），新店溪，臺北盆地＝臺北最重要的灌溉渠道 ④曹公圳——鳳山知縣曹謹，1837（道光），高屏溪，高雄地區＝官方主導興建。由南往北再往南，時間則是康熙→雍正→乾隆→道光。","tb":"t15","era":"qpre","ch":3,"kind":"ex","cat":"地點","y":1731},"e3Wusha":{"id":"e3Wusha","lb":"吳沙開墾蛤仔難","sb":"18世紀末・越界開墾（宜蘭）","nt":"18世紀末吳沙越過番界開墾蛤仔難（今宜蘭）——原漢衝突的例證，也促成 1812 嘉慶年間增設噶瑪蘭廳。","tb":"t15","era":"qpre","ch":3,"kind":"ex","cat":"人物","y":1812},"e3Border":{"id":"e3Border","lb":"番界（土牛・土牛溝）","sb":"劃界封山的界線","nt":"在靠近山區地帶設「番界」，以土牛、土牛溝或立碑為界：嚴禁漢人入侵番界、不許漢人與原住民通婚、交易。實際上漢人越界開墾日益嚴重，番界一再往山區內移。","tb" 危機，移民在原鄉聚居的村莊建廟，供奉原鄉神明為守護神。","tb":"t13","era":"qpre","ch":3,"kind":"ex","cat":"地點","y":1858},"e3Common":{"id":"e3Common","lb":"媽祖・王爺・土地公","sb":"共同信仰","nt":"不分祖籍的共同信仰：媽祖、王爺、土地公；另有「有應公廟」祭祀無主的孤魂野鬼。由「原鄉信仰（依祖籍）」轉向「共同信仰」，是移墾社會走向定居社會的指標。","tb":"t13","era":"qpre","ch":3,"kind":"ex","cat":"重點","y":1858},"t30":{"id":"t30","lb":"1896 六三法","sb":"總督專制的法源・★常考","nt":"日本頒布「法律第六十三號」（簡稱六三法），授予臺灣總督頒布具有法律效力的命令（律令）之權——總督因此集行政、立法、司法及軍事大權於一身。","tb":"j2","era":"jp1","ch":4,"kind":"time","cat":"年代","y":1896},"t31":{"id":"t31","lb":"1899 成立臺灣銀行","sb":"統一發行貨幣","nt":"清帝國時期各國貨幣都可在臺流通、幣制混亂。1899 成立臺灣銀行統一發行貨幣，解決幣制問題，也提供日商前進南洋的資金。","tb":"j5","era":"jp1","ch":4,"kind":"time","cat":"年代","y":1899},"t32":{"id":"t32","lb":"1905 首次人口普查","sb":"臺灣第一次戶口普查","nt":"1905 年總督府在臺實施第一次人口普查，之後定期舉辦；作法＝利用警察深入調查，建立詳實的人口資料（出現「戶口調查簿」＝戶口名簿），有助統治與人力運用。","tb":"j5","era":"jp1","ch":4,"kind":"time","cat":"年代","y":1905},"t33":{"id":"t33","lb":"1908 西部縱貫鐵路通車","sb":"基隆↔高雄","nt":"1908 年完成基隆到高雄的西部縱貫鐵路，強化西半部的連結；另興建阿里山森林鐵路。海運整建基隆港與高雄港（有利南進政策），通訊普設郵局、電報、電話。","tb":"j5","era":"jp1","ch":4,"kind":"time","cat":"年代","y":1908},"t34":{"id":"t34","lb":"1910–1915 五年理蕃計畫","sb":"武力征討・開發山林","nt":"1910 年代日本已大致控制臺灣社會，第五任總督佐久間左馬太開始「五年理蕃計畫」。目的：①讓全臺原住民歸順 ②開發山林資源。作法：土地公有、沒收槍械、武力鎮壓、強制勞役、驅離傳統領域、警察介入部落。","tb":"j4","era":"jp1","ch":4,"kind":"time","cat":"年代","y":1910},"t35":{"id":"t35","lb":"1915 西來庵事件","sb":"漢人最後一次大規模武裝抗日","nt":"余清芳以宗教為名，在噍吧哖（今臺南市玉井區）組織群眾武裝抗日。結果：因缺乏訓練無法與日軍抗衡，多人失敗被捕。影響：臺人有鑑於武裝抗日犧牲慘重，轉以非武裝的政治、社會運動爭取權益。","tb":"jA","era":"jp1","ch":4,"kind":"time","cat":"年代","y":1915},"t36":{"id":"t36","lb":"1918 一戰結束→1919 內地延長主義","sb":"民族自決・改派文官總督","nt":"第一次世界大戰（1914–1918）於 1918 年結束，美國總統威爾遜提出的「民族自決」思潮風行全球；日本自 1919 年起改採內地延長主義。日本改採「內地延長主義」：將臺灣視為日本「內地」的一部分、標榜「日臺合一」、改派文官總督（1919–1937）。目的＝避免臺灣人受風潮影響而追求自治、獨立。","tb":"j1","era":"jp2","ch":4,"kind":"time","cat":"年代","y":1918},"t37":{"id":"t37","lb":"1921 臺灣文化協會・議會請願","sb":"非武裝抗日的起點・★常考","nt":"1921 年林獻堂、蔣渭水等人成立「臺灣文化協會」（宗旨＝「謀臺灣文化之向上」）；同年展開「臺灣議會設置請願運動」（1921–1934，共請願15次，要求設立民選的臺灣議會、爭取立法權）。","tb":"j8","era":"jp2","ch":4,"kind":"time","cat":"年代","y":1921},"t38":{"id":"t38","lb":"1922 蓬萊米問世","sb":"磯永吉・稻米外銷日本","nt":"磯永吉培育並種出符合日本人口味的「蓬萊米」，1922 年改良成功。結果：稻米產量增加，可大量銷往日本。","tb":"j6","era":"jp2","ch":4,"kind":"time","cat":"年代","y":1922},"t38a":{"id":"t38a","lb":"1925 二林事件","sb":"全島性農民運動的開端","nt":"彰化二林的蔗農爭取權益時與警察爆發衝突，多人遭逮捕判刑。影響：此後開啟全島性的農民運動，是「第一憨，種甘蔗予會社磅」這句俗諺最具體的事件。","tb":"","era":"jp2","ch":4,"kind":"time","cat":"年代","y":1925},"t39":{"id":"t39","lb":"1927 臺灣民眾黨","sb":"臺灣史上第一個合法政黨","nt":"蔣渭水成立臺灣民眾黨（1927–1931）——臺灣第一個合法政黨。他原是臺灣文化協會的專務理事，因文協左傾、理念不合而另組。主張：提倡自由民權、破除社會惡習與迷信、反對吸食鴉片、積極支持農工運動。","tb":"j8","era":"jp2","ch":4,"kind":"time","cat":"年代","y":1927},"t3a":{"id":"t3a","lb":"1928 臺北帝國大學","sb":"日治時期臺灣最高學府","nt":"1928 年總督府設立「臺北帝國大學」（今臺灣大學前身），是日治時期臺灣最高學府、高等教育最具代表性者。但高等教育機構不足，有志升學者多前往日本留學。","tb":"j7","era":"jp2","ch":4,"kind":"time","cat":"年代","y":1928},"t3b":{"id":"t3b","lb":"1930 霧社事件・嘉南大圳完工","sb":"原住民最大抗日・水利工程","nt":"1930 年賽德克族頭目莫那魯道率領族人在霧社起事，日方調動軍警並使用毒氣、飛機轟炸，原住民死傷慘重。同年八田與一設計建造的嘉南大圳完工，大幅增加嘉南平原的灌溉面積。","tb":"jA","era":"jp2","ch":4,"kind":"time","cat":"年代","y":1930},"t3c":{"id":"t3c","lb":"1934 日月潭水力發電所完工","sb":"工業化的電力基礎","nt":"1934 年日月潭水力發電所完工，提供工業發展所需電力，是「工業臺灣、農業南洋」與南進基地化的關鍵建設；臺灣輕工業生產指數自此明顯上揚。","tb":"j6","era":"jp2","ch":4,"kind":"time","cat":"年代","y":1934},"t3d":{"id":"t3d","lb":"1935 首次地方議員選舉","sb":"臺人第一次行使參政權・★常考","nt":"受臺灣地方自治聯盟推動，1935 年總督府首次開放（有限度的）地方議員選舉——臺灣民眾第一次行使投票權。限制：僅少數男性有投票權、半數席次仍由官派，並未落實真正的地方自治。","tb":"j8","era":"jp2","ch":4,"kind":"time","cat":"年代","y":1935},"t3e":{"id":"t3e","lb":"1937 中日戰爭爆發・皇民化","sb":"社會運動全面被禁・★常考","nt":"1937 中日戰爭爆發（盧溝橋事變），日本推行皇民化運動（1937–1945），並配合南進政策。臺灣的政治社會運動受到打壓而被迫終止，總督改回武官。","tb":"j1","era":"jp3","ch":4,"kind":"time","cat":"年代","y":1937},"t3f":{"id":"t3f","lb":"1941 太平洋戰爭・國民學校","sb":"戰爭動員・取消小公學校差別","nt":"1941 年太平洋戰爭爆發（珍珠港事變）；美軍此後轟炸臺灣，西部縱貫公路與鐵路受損。同年配合皇民化運動，將小學校、公學校一律改稱「國民學校」，取消名稱上的差別（實質差別待遇仍在）。戰爭後期徵召臺人從軍、赴南洋作戰。","tb":"j7","era":"jp3","ch":4,"kind":"time","cat":"年代","y":1941},"t3g":{"id":"t3g","lb":"1943 六年國民義務教育","sb":"臺灣最早的義務教育","nt":"1943 年開始實施六年國民義務教育——臺灣最早的義務教育，學齡兒童就學率大幅提升。","tb":"j7","era":"jp3","ch":4,"kind":"time","cat":"年代","y":1943},"t3h":{"id":"t3h","lb":"1945 日本投降","sb":"日治結束・中華民國接收","nt":"1945 年日本戰敗投降，第二次世界大戰結束，臺灣結束日本 50 年的殖民統治，由中華民國接收。","tb":"","era":"jp3","ch":4,"kind":"time","cat":"年代","y":1945},"m4Pol":{"id":"m4Pol","lb":"日治政治發展","sb":"抗日→治臺三階段・★常考","nt":"兩條線一起看：①臺人的反抗——武裝抗日（臺灣民主國、西來庵事件）→非武裝的政治社會運動→1937 後全面被禁 ②日本的統治——無方針主義（1895–1919，武官）→內地延長主義（1919–1937，文官）→皇民化運動（1937–1945，武官）。兩個轉折點：1919 一戰結束、1937 中日戰爭爆發。","tb":"jZ","era":"","ch":4,"kind":"theme","cat":"主題","y":1895},"m4Rule":{"id":"m4Rule","lb":"殖民統治體制","sb":"總督專制＋警察保甲","nt":"以臺灣總督府為最高統治機構，《六三法》授權總督頒布具法律效力的命令，總督集行政、立法、司法、軍事大權於一身。地方控制靠「警察制度」（各地廣設派出所，民眾稱之為「大人」）與「保甲制度」（10戶1甲設甲長、10甲1保設保正，青壯年男子組壯丁團），兩者相互配合，有效監控臺灣社會、穩固統治基礎。","tb":"jD","era":"jp1","ch":4,"kind":"theme","cat":"主題","y":1896},"m4Ab":{"id":"m4Ab","lb":"理蕃政策與原住民","sb":"安撫圍堵→武力征討→教化","nt":"三階段：①日治初期＝安撫＋圍堵（設隘勇線限制活動、招待頭目赴日參觀、設蕃童教育所）②1910 起＝五年理蕃計畫，武力征討、開發山林資源 ③霧社事件後＝改採較溫和手段，加強教育與同化、將山區原住民「集團移住」遷往山下集中管理。","tb":"jB","era":"","ch":4,"kind":"theme","cat":"主題","y":1910},"m4Eco":{"id":"m4Eco","lb":"殖民經濟發展","sb":"農業臺灣→工業臺灣・★常考","nt":"先打基礎（後藤新平：專賣、戶口／土地／林野調查、統一貨幣與度量衡、交通建設），再分兩期：日治前期「農業臺灣、工業日本」（新式製糖、蓬萊米、嘉南大圳，供應日本國內民生需求）；1930 年代起「工業臺灣、農業南洋」（配合南進政策，日月潭電力、軍需工業、輕工業，臺灣轉為半農半工社會）。","tb":"jC","era":"","ch":4,"kind":"theme","cat":"主題","y":1899},"m4Soc":{"id":"m4Soc","lb":"日治社會與文化","sb":"差別教育・移風易俗・都市","nt":"教育＝差別待遇與隔離政策（小學校／公學校／蕃童教育所），但也建立西式教育制度、培養新的社會菁英。移風易俗＝放足斷髮、漸禁鴉片、公共衛生與醫療、守時守法觀念。都市＝1920年代起引進現代都市計畫，1940年代形成臺北、高雄、臺南等大都市，休閒生活公共化。","tb":"jE","era":"","ch":4,"kind":"theme","cat":"主題","y":1928},"m4Mov":{"id":"m4Mov","lb":"政治社會運動","sb":"民族自決→四大組織・★常考","nt":"背景：1920 年代臺籍知識分子受國際「民族自決」風潮鼓舞，爭取臺人權益。四大組織按時間背：臺灣文化協會（1921–1931，文化啟蒙）→臺灣議會設置請願運動（1921–1934）→臺灣民眾黨（1927–1931，第一個合法政黨）→臺灣地方自治聯盟（1930–1937）。結束：1937 中日戰爭爆發後被迫終止。","tb":"j8","era":"jp2","ch":4,"kind":"theme","cat":"主題","y":1921},"k4Rep":{"id":"k4Rep","lb":"臺灣民主國","sb":"抗拒接收・非追求獨立・★常考","nt":"背景：1894 清、日因朝鮮問題爆發甲午戰爭，1895 清帝國戰敗簽訂《馬關條約》，割讓臺灣、澎湖給日本；消息傳回臺灣後，官紳倡組「臺灣民主國」。目的＝效忠清朝、抗拒日本接收（並非追求獨立建國）。領導：推唐景崧為總統、丘逢甲為義軍統領、劉永福為大將軍。結果：兵力與武器不如日本，領導者先後離臺，民主國瓦解→臺灣進入日本 50 年的殖民統治。象徵物：「藍地黃虎旗」。","tb":"jA","era":"jp1","ch":4,"kind":"point","cat":"重點","y":1894},"k4Armed":{"id":"k4Armed","lb":"漢人武裝抗日","sb":"終點＝1915 西來庵事件","nt":"日本接收臺灣後，臺灣漢人在各地發動抗日行動；最後一次大規模武裝抗日＝1915 年西來庵事件（余清芳，噍吧哖／今臺南玉井）。影響：武裝抗日犧牲慘重→臺人轉向非武裝的政治、社會運動爭取權益。","tb":"jA","era":"jp1","ch":4,"kind":"point","cat":"事件","y":1915},"k4Gov":{"id":"k4Gov","lb":"總督專制（六三法）","sb":"集四大權於一身・★常考","nt":"1895 年日人在臺設立臺灣總督府，是日本在臺最高統治機構，以臺灣總督為首長。1896 年頒布「法律第六十三號」（六三法），授予總督頒布具法律效力命令的權力→總督集行政、立法、司法及軍事大權於一身。","tb":"j2","era":"jp1","ch":4,"kind":"point","cat":"重點","y":1896},"k4Ctrl":{"id":"k4Ctrl","lb":"警察與保甲制度","sb":"「警察政治」・★常考","nt":"總督專制之外，地方靠「警察政治」＝警察制度＋保甲制度兩隻手。警察制度：目的＝鎮壓臺人反抗、加強地方控制；在各地廣設派出所；職務無所不管（鎮壓抗日分子、檢查衛生、宣傳政令），權力很大使人民畏懼，被稱為「大人」。保甲制度：目的＝配合警察；10戶1甲設甲長（類似鄰長）、10甲1保設保正（類似里長）；工作＝維護治安、嚴密監控社會、推動政務（調查戶口、宣達政令）；保甲中的青壯年男子組成「壯丁團」，協助救災與鎮壓抗日分子。成效：警察與保甲相互配合，建立堅實的統治基礎。","tb":"j2","era":"jp1","ch":4,"kind":"point","cat":"重點","y":1896},"k4S1":{"id":"k4S1","lb":"無方針主義","sb":"1895–1919・武官・殖民地特殊統治","nt":"又稱「殖民地特殊統治時期」。時間 1895–1919（總督為武官）。背景＝日本剛領有臺灣，抗日事件頻繁。目的＝漸進式統治、鎮壓反抗鞏固統治，採非同化政策。方式：①鎮壓各地武裝抗日 ②安撫——尊重臺灣人民的風俗習慣、籠絡人心以消除反抗意識。抗日代表＝1915 西來庵事件。結果：一次大戰後轉向同化政策。","tb":"j1","era":"jp1","ch":4,"kind":"point","cat":"重點","y":1895},"k4S2":{"id":"k4S2","lb":"內地延長主義","sb":"1919–1937・文官・日臺合一","nt":"時間 1919–1937（改派文官總督）。背景＝一次大戰於 1918 年結束、「民族自決」思潮風行（各民族有權決定自身事務、不受他人干涉）。目的＝避免臺灣人受風潮影響而追求自治、獨立，改採同化政策。方式：①將殖民地視為「內地」（日本）的一部分 ②標榜「日臺合一」 ③日本部分國內法可施行於臺灣。抗日：漢人轉向非武裝的社會運動；原住民 1930 霧社事件。結果：臺灣人並未獲得與日本人相同的待遇——實際上仍存在差別待遇。","tb":"j1","era":"jp2","ch":4,"kind":"point","cat":"重點","y":1918},"k4S3":{"id":"k4S3","lb":"皇民化運動","sb":"1937–1945・武官・徹底同化","nt":"時間 1937–1945（總督改回武官）。背景：①1937 中日戰爭爆發（起於盧溝橋事變）②配合日本南進政策，1941 太平洋戰爭（起於珍珠港事變）。1936 年小林躋造總督來臺執行皇民化運動，臺灣進入戰時體制。目的＝戰爭需要充分動員人力物資，強化臺灣人對日本的愛國心，成為效忠天皇的子民。方式（七項）：說日語、改日姓、穿和服、拜神社、實行日本風俗與禮儀、徵召臺人從軍、部分臺籍婦女被迫充當「慰安婦」。抗日：社會運動均被禁止。戰爭實況：1941 年後美軍轟炸臺灣，西部縱貫公路、鐵路受損；學生的旅遊行程也改為參拜神社和到醫院慰問士兵。結果：日本戰敗投降（天皇「玉音放送」宣布終戰），中華民國接收臺灣。","tb":"j1","era":"jp3","ch":4,"kind":"point","cat":"事件","y":1937},"k4AbEarly":{"id":"k4AbEarly","lb":"初期安撫與圍堵","sb":"隘勇線・蕃童教育所","nt":"背景：總督府疲於壓制平地武裝抗日事件，對原住民先採防堵、安撫。作法：①安撫＝設置「隘勇線」限制原住民活動範圍 ②教化＝設學校（如「蕃童教育所」）教化原住民、引進現代文明 ③宣威＝集合部落首領赴日參觀，見識現代文明與武力，宣揚日本國力也攏絡原住民 ④圍堵＝運用軍警深入山區迫原住民降服，用鐵絲電網圍堵，藉以取得山地資源。結果：①文化衝擊——原住民傳統文化受到衝擊 ②部落衝突——部分接受教化的原住民幫助日本統治，引發部落內部摩擦與衝突。","tb":"j4","era":"jp1","ch":4,"kind":"point","cat":"重點","y":1896},"k4AbFive":{"id":"k4AbFive","lb":"五年理蕃計畫","sb":"1910起・武力征討・★常考","nt":"背景：1910 年代日本已大致控制臺灣社會（第五任總督佐久間左馬太）。目的：①企圖讓全臺原住民歸順 ②開發山林資源。作法：①土地公有——總督府將大部分土地收歸公有，限縮原住民生活空間 ②壓迫原住民——沒收槍械、武力鎮壓、強制勞役、驅離傳統領域 ③打通東西橫貫道路，建立開發東部的運輸幹線 ④透過教育同化使原住民歸順 ⑤警察介入——以權威統治介入原住民社會，並延續清末以來的制度，將部落領袖稱為「頭目」以方便管理。結果：山林資源被開發、林木與樟腦被掠奪；原住民被迫改變生活方式、以勞力換取生活物資；受山地警察欺凌、負擔過重勞役→引發對日統治的不滿（霧社事件的遠因）。","tb":"j4","era":"jp1","ch":4,"kind":"point","cat":"重點","y":1910},"k4Wushe":{"id":"k4Wushe","lb":"霧社事件","sb":"1930・莫那魯道・★常考","nt":"時間 1930 年。原因：①日本開發山林資源並侵擾原住民部落 ②日軍強迫族人服勞役，又不尊重原住民文化。經過：賽德克族頭目莫那魯道率領族人襲殺日人；總督府出動軍警，使用大炮、飛機、毒氣鎮壓。結果：原住民死傷慘重；日本國內及國際輿論譴責（臺灣民眾黨曾致電國際聯盟，抗議「日本使用毒瓦斯屠殺霧社人民」），臺灣總督下臺。影響：①溫和手段——總督府改變統治手段，強調警察應善待原住民、注意教化山區的風俗文化 ②集團移住——將山區原住民集體遷往山下，影響部落組織型態。原民調適：知難以武力抗日，逐漸調適並接受教化；二戰後期部分原住民組成高砂義勇隊赴南洋作戰。","tb":"j4","era":"jp2","ch":4,"kind":"point","cat":"事件","y":1930},"k4Base":{"id":"k4Base","lb":"基礎建設","sb":"後藤新平・專賣與三大調查・★常考","nt":"主導＝民政長官後藤新平等人。①拓展財源：日治初期臺灣財政依賴日本國庫補助，總督府將鴉片、樟腦等列為專賣、獨占經營→財政收入大增（1898 年後財政逐漸獨立）②調查工作：1905 起定期舉辦人口普查（出現戶口調查簿）、土地調查（確定土地所有權以利徵稅，田賦收入增加）、林野調查（無主山林收歸國有，賣給資本家開發山林資源）③統一貨幣及度量衡：1899 成立臺灣銀行統一發行貨幣，並統一度量衡與日本一致，減少市場交易爭議 ④交通建設：1908 完成基隆到高雄的西部縱貫鐵路、興建阿里山森林鐵路，整建基隆港與高雄港（有利南進），普設郵局、電報、電話。結果：奠定臺灣日後工業化的發展基礎，提高日本企業的投資意願。","tb":"jC","era":"jp1","ch":4,"kind":"point","cat":"重點","y":1899},"k4Agr":{"id":"k4Agr","lb":"農業臺灣・工業日本","sb":"糖業王國・蓬萊米・嘉南大圳","nt":"日治初期採「農業臺灣、工業日本」的分工體系：改善臺灣的農業生產環境，供應日本工業化後的民生需求。①新式製糖業＝總督府扶持日本資本家設立新式製糖廠（以機械動力取代舊式糖廍），設糖業試驗所培育新品種、擴大蔗園面積→有「糖業王國」美譽；蔗農備受剝削，出現「第一憨，種甘蔗予會社磅」的俗諺 ②稻作改良＝磯永吉培育「蓬萊米」（1922 改良成功），稻米大量銷往日本 ③水利設施＝八田與一設計建造嘉南大圳（1930 完工），增加嘉南平原灌溉面積，稻米與甘蔗產量大增。","tb":"j6","era":"jp1","ch":4,"kind":"point","cat":"重點","y":1922},"k4Ind":{"id":"k4Ind","lb":"工業臺灣・農業南洋","sb":"1930年代・南進基地化","nt":"背景：1930 年代日本向外擴張，把臺灣設為南洋補給基地，在臺推動工業化。目標＝「工業臺灣、農業南洋」＝南進基地化。重大建設：①電力＝1934 日月潭水力發電所完工，提供工業發展的電力 ②軍需工業＝發展機械、石化、金屬、造船 ③輕工業＝紡織、食品加工（鳳梨罐頭）也顯著成長。影響：①奠定臺灣日後工業基礎，提供充足電力 ②臺灣逐漸從農業社會走向工業社會（轉成半農、半工的社會）。","tb":"j6","era":"jp2","ch":4,"kind":"point","cat":"重點","y":1934},"k4Edu":{"id":"k4Edu","lb":"差別待遇的殖民教育","sb":"小學校／公學校／蕃童教育所・★常考","nt":"原則＝差別待遇、隔離政策，同時建立西式教育制度。目的：①同化——作為同化臺灣人民及推動產業政策的工具 ②新知——讓臺灣人從教育中獲得現代知識。初等教育：小學校（日本人就讀，課程比照日本內地）／公學校（臺灣人就讀，以教授日語為主）／蕃童教育所（原住民就讀）——無論師資、設備均比不上小學校，有種種限制與不公平待遇；1941 年配合皇民化一律改稱「國民學校」，1943 年開始實施六年國民義務教育。中等教育：初期以招收日人為主；1915 年成立第一所專收臺人子弟的臺中中學校；職業學校培養醫師（醫學校）、公學校教師（師範學校）、初級技術人才。高等教育：1928 臺北帝國大學（今臺灣大學）最具代表性；因高等教育不足，臺人多前往日本留學。影響：1920 年代以後新的社會菁英階層逐漸崛起，成為日後政治、社會與文化運動的推手。","tb":"j7","era":"","ch":4,"kind":"point","cat":"重點","y":1928},"k4Mov":{"id":"k4Mov","lb":"文化啟蒙與政治社會運動","sb":"四大組織・1937 終止・★常考","nt":"背景：①世界潮流——第一次世界大戰後全世界流行「民族自決」思潮（美國總統威爾遜提出）②日本國內要求民主呼聲高漲，衝擊臺灣知識分子。四大組織：①臺灣文化協會（1921–1931，林獻堂、蔣渭水；發行《臺灣民報》、設讀報社、舉辦演講會與夏季學校；喚起臺人民族意識）②臺灣議會設置請願運動（1921–1934，林獻堂；共請願15次，要求設立民選的臺灣議會、爭取立法權；日本政府雖未採納，但激起臺人追求自治的想法）③臺灣民眾黨（1927–1931，蔣渭水；臺灣史上第一個合法政黨）④臺灣地方自治聯盟（1930–1937，林獻堂等人離開民眾黨另組；宣傳民權與地方自治→促成 1935 年總督府首次開放地方議員選舉）。結束：1937 中日戰爭爆發後被迫終止。","tb":"j8","era":"jp2","ch":4,"kind":"point","cat":"事件","y":1921},"k4Custom":{"id":"k4Custom","lb":"移風易俗與現代觀念","sb":"放足斷髮・公共衛生・守時守法","nt":"臺灣三大陋習＝吸食鴉片、辮髮、纏足，總督府逐一「改革」。①放足斷髮、禁吸鴉片：放足斷髮最初消極（為避免臺人抗爭而未積極禁止），後來透過保甲制度與多方宣導、由士紳倡導放足剪辮，帶動「易服改裝」風氣；影響＝改變服飾風潮（衣服帽子變成歐美或日式，但漢日洋並存）、婦女得到解放（走出家庭，從事教師、護士、車掌等工作）；鴉片自 1897 年起施行專賣，初採消極的漸禁態度（吸食者持有許可證即可購買，未嚴加禁止），總督府藉專賣獲利，因而被批評「無根絕誠意」，後因知識分子反對而被迫改變作法（臺灣民眾黨曾致電國際聯盟，力陳鴉片之害、請臺人重視基本人權），但效果有限、鴉片並沒有絕跡。②建立公共衛生及醫療制度：原因＝有效防止臺灣傳染病肆虐；作法＝醫療建立西式醫院、辦理預防注射和接種（推廣疫苗對抗霍亂等傳染病），公共建造自來水與下水道等公共衛生設施；影響＝改善傳染病肆虐的環境、防疫保健衛生觀念逐漸普及、傳染病逐漸得到控制、死亡率大幅下降→人口快速成長，臺灣人的壽命獲得提升。③養成守法守時的觀念：守法＝將現代司法制度引進臺灣、各級地方法院設立，確立臺灣的司法制度；守時＝改用西曆，並為符合工業生產需要引進標準時間制（一天24小時）與一週七天的星期制，舉辦守時宣傳活動→民眾養成守時習慣、行政機關與交通逐漸遵守時間、開始重視放假與休閒活動（除政府機關與學校外，民間仍沿用農曆）。","tb":"j9","era":"jp2","ch":4,"kind":"point","cat":"重點","y":1928},"k4City":{"id":"k4City","lb":"現代都市與休閒生活","sb":"都市計畫・百貨公司・棒球","nt":"都市出現：原因＝1920 年代以後人口增加與集中，總督府引進現代化都市計畫（建設道路、自來水、下水道等公共設施）→1940 年代臺灣形成臺北、高雄、臺南等大都市。休閒生活公共化：①總督府在各地建造公園、博物館 ②1930 年代臺北的菊元百貨與臺南的林百貨相繼落成，開臺灣百貨公司之先河——前往百貨公司「搭電梯」是當時民眾最時髦的活動；另有咖啡館、新式餐廳、博物館等休閒場所 ③總督府推廣棒球運動 ④媒體與休閒地點＝報紙、廣播、咖啡廳與劇院出現 ⑤日本文化流行（溫泉、料理、歌曲）⑥搭乘鐵路的長程旅遊觀光盛行——都市中各類休閒娛樂場所日漸普及：百貨公司、咖啡廳、泡溫泉、西餐廳。新舊文化的調適：日治時期引進現代文明，但並未使臺灣原有傳統風俗消失，總督府推行的新制度不完全落實於民間，使臺灣社會中漢人、日本與西洋文化並存。城鄉差距：現代化均出現於都市，鄉村和原住民部落則大致保留原來的生活型態。","tb":"j9","era":"jp2","ch":4,"kind":"point","cat":"重點","y":1928},"k4AbId":{"id":"k4AbId","lb":"原住民社會演變與身分認同","sb":"以「族」區分・高砂義勇隊","nt":"①族群觀念改變：原先原住民只有部落意識；總督府派學者根據習俗、語言、分布等要素進行調查，以「族」來區分原住民→促使族群觀念發生變化。②傳統文化改變：透過「蕃童教育所」與警察，教育原住民接受現代禮儀與醫療等知識，強迫停止出草、文面與室內葬等習俗→改變原住民傳統的社會文化。③語言姓氏改變：原住民被要求改日姓、說日語；族群語言混雜日語，甚至姓名以日語發音；平埔族語言快速流失，只剩噶瑪蘭族等語言可在族內流通。④身分上的矛盾：原住民以部落為中心、無國族意識；太平洋戰爭時參加「高砂義勇隊」至南洋作戰，產生新的身分（日本兵）——對參戰有不同態度，有志願的，也有被迫的。","tb":"jB","era":"jp3","ch":4,"kind":"point","cat":"重點","y":1930},"e3Yingfa":{"id":"e3Yingfa","lb":"通商問題→英法聯軍之役","sb":"1857・開港的起點","nt":"清帝國與英、法因通商問題（外國要求擴大通商、公使駐京等）交惡，1857 年爆發英法聯軍之役，清廷戰敗。這是臺灣被迫開港通商的起點——外力入侵四部曲的第一部。","tb":"t19","era":"qpost","ch":3,"kind":"ex","cat":"事件","y":1858},"e3Tianjin":{"id":"e3Tianjin","lb":"天津條約","sb":"1858・開港的法源","nt":"1857 英法聯軍之役後，清廷於 1858（咸豐8年）簽訂《天津條約》，先開放淡水、安平，後又增開雞籠、打狗。1860 年代臺灣正式開港通商，重新進入國際貿易市場。","tb":"t19","era":"qpost","ch":3,"kind":"ex","cat":"事件","y":1858},"e3Viet":{"id":"e3Viet","lb":"越南問題","sb":"清法戰爭的起因","nt":"清帝國與法國因越南的宗主權問題爆發衝突，1884 年清法戰爭開打，戰火波及基隆、淡水、澎湖（臺灣人稱「西仔反」）。結果促使清廷更重視臺灣→1885 建省。","tb":"t19","era":"qpost","ch":3,"kind":"ex","cat":"重點","y":1884},"e4Korea":{"id":"e4Korea","lb":"朝鮮問題","sb":"甲午戰爭的起因・★常考","nt":"清帝國與日本因朝鮮的宗主權問題衝突，1894 年爆發甲午戰爭。這是「朝鮮問題→甲午戰爭→馬關條約→割讓臺澎→臺灣民主國」這條因果鏈的起點。","tb":"t19","era":"jp1","ch":4,"kind":"ex","cat":"重點","y":1894},"e4Maguan":{"id":"e4Maguan","lb":"馬關條約","sb":"1895・割讓臺灣澎湖","nt":"1895 年清帝國於甲午戰爭戰敗，與日本簽訂《馬關條約》，割讓臺灣、澎湖給日本。消息傳回臺灣後，官紳倡組臺灣民主國抗拒接收；同年日本展開統治，臺灣進入 50 年的殖民時期。","tb":"j3","era":"jp1","ch":4,"kind":"ex","cat":"事件","y":1894},"e4Tang":{"id":"e4Tang","lb":"唐景崧・丘逢甲・劉永福","sb":"臺灣民主國三人組","nt":"唐景崧＝總統（清末代臺灣巡撫）；丘逢甲＝義軍統領；劉永福＝大將軍，抗拒日本接收臺灣。結果：三人先後離臺，民主國瓦解。象徵：「藍地黃虎旗」。","tb":"jA","era":"jp1","ch":4,"kind":"ex","cat":"人物","y":1894},"e4Yu":{"id":"e4Yu","lb":"余清芳・噍吧哖","sb":"西來庵事件・1915","nt":"余清芳以宗教（西來庵）為名組織群眾武裝抗日，地點在噍吧哖（今臺南市玉井區）。因缺乏訓練無法與日軍抗衡，多人失敗被捕。這是漢人最後一次大規模武裝抗日，之後轉向非武裝的政治社會運動。臺南有余清芳紀念碑。","tb":"jA","era":"jp1","ch":4,"kind":"ex","cat":"人物","y":1915},"e4Law":{"id":"e4Law","lb":"六三法","sb":"法律第六十三號・1896","nt":"1896 年日本頒布「法律第六十三號」，授權臺灣總督頒布具有法律效力的命令（律令）→總督集行政、立法、司法及軍事大權於一身，是總督專制的法源。為什麼特殊：日本國內的立法權由帝國議會掌握，僅天皇能發布緊急命令代替法律；《六三法》等於把「立法權」下放給臺灣總督，因此賦予總督極大的權力。","tb":"j2","era":"jp1","ch":4,"kind":"ex","cat":"重點","y":1896},"e4Bao":{"id":"e4Bao","lb":"保甲・壯丁團","sb":"10戶1甲・10甲1保","nt":"來源：保甲是清代既有的地方自衛組織，日本沿用來輔佐警察與地方機構執行公共事務。編制：10 戶為 1 甲設甲長（類似鄰長）；10 甲為 1 保設保正（類似里長），並採「連坐法」——一人違法全甲同罰，因此監控特別嚴密。運作：保甲輔助警察執行地方行政事務（調查戶口、宣達政令）；保甲中的青壯年男子組成「壯丁團」，協助警察維護治安、救災與鎮壓抗日分子。","tb":"j2","era":"jp1","ch":4,"kind":"ex","cat":"重點","y":1896},"e4Cop":{"id":"e4Cop","lb":"警察「大人」","sb":"派出所・無所不管","nt":"總督府在各地廣設派出所。警察是地方行政的重要角色，職務無所不管：鎮壓抗日分子、檢查衛生、宣傳政令、調查戶口。權力很大使人民相當畏懼，被稱為「大人」。日治時期臺灣每萬人配置的警察人數比例在當時各地中最高。","tb":"j2","era":"jp1","ch":4,"kind":"ex","cat":"重點","y":1896},"e4Line":{"id":"e4Line","lb":"隘勇線・蕃童教育所","sb":"圍堵＋教化","nt":"隘勇線＝在山區設置，限制原住民活動範圍，並以鐵絲電網圍堵，藉以取得山地資源。蕃童教育所＝設在部落的學校，教化原住民、引進現代文明，也是後來改變原住民傳統習俗（出草、文面、室內葬）的推手。另有招待部落首領赴日參觀以宣揚國力。","tb":"j4","era":"jp1","ch":4,"kind":"ex","cat":"地點","y":1896},"e4Mona":{"id":"e4Mona","lb":"莫那魯道・賽德克族","sb":"霧社事件領導者","nt":"1930 年賽德克族頭目莫那魯道率領族人在霧社襲殺日人。總督府以軍警、大炮、飛機與毒氣鎮壓，原住民死傷慘重；國際輿論譴責日本使用毒瓦斯，臺灣總督因此下臺。","tb":"jF","era":"jp2","ch":4,"kind":"ex","cat":"人物","y":1930},"e4Gaosha":{"id":"e4Gaosha","lb":"高砂義勇隊","sb":"太平洋戰爭・赴南洋作戰","nt":"第二次世界大戰後期，部分原住民自願或受徵調組成「高砂義勇隊」前往南洋作戰，產生新的身分（日本兵）。這是原住民在霧社事件後「知難以武力抗日、逐漸調適並接受教化」的延伸結果。對參戰有不同態度：有志願的，也有被迫的。","tb":"j10","era":"jp3","ch":4,"kind":"ex","cat":"重點","y":1930},"e4Goto":{"id":"e4Goto","lb":"後藤新平","sb":"民政長官・基礎建設主導者","nt":"日治初期的民政長官，主導臺灣的基礎建設：專賣制度拓展財源、戶口／土地／林野三大調查、統一貨幣與度量衡、交通建設。1898 年後臺灣財政逐漸獨立，不再依賴日本國庫補助。","tb":"j5","era":"jp1","ch":4,"kind":"ex","cat":"人物","y":1899},"e4Mono":{"id":"e4Mono","lb":"專賣制度（鴉片・樟腦）","sb":"財政收入大增","nt":"1897 年起對鴉片施行專賣，之後陸續納入樟腦、菸、酒、鹽等物資，由總督府獨占經營，是日治初期最重要的財源，使臺灣財政收入大增、有助推動各項建設。注意：鴉片專賣與「漸禁」政策並行，這也是禁鴉片效果有限的原因之一。","tb":"j5","era":"jp1","ch":4,"kind":"ex","cat":"重點","y":1899},"e4Bank":{"id":"e4Bank","lb":"臺灣銀行","sb":"1899・統一發行貨幣","nt":"1899 年成立，發行統一貨幣「臺灣銀行券」，解決清帝國時期各國貨幣都可流通的幣制混亂問題，方便臺日之間資金流通，也提供日商前進南洋的資金。與統一度量衡並列為「統一貨幣及度量衡」的兩大措施。","tb":"j5","era":"jp1","ch":4,"kind":"ex","cat":"重點","y":1899},"e4Survey":{"id":"e4Survey","lb":"戶口・土地・林野調查","sb":"三大調查・★常考","nt":"①戶口調查：1905 年第一次人口普查，之後定期舉辦，利用警察深入調查，建立詳實人口資料（戶口調查簿）→有助統治與人力運用 ②土地調查：確定土地所有權以利徵稅，使田賦收入增加——但原住民無法證明土地產權，生活空間因此被壓縮 ③林野調查：無主山林收歸國有，部分賣給資本家開發森林資源。","tb":"j5","era":"jp1","ch":4,"kind":"ex","cat":"重點","y":1899},"e4Rail":{"id":"e4Rail","lb":"西部縱貫鐵路・基隆高雄港","sb":"1908 通車","nt":"陸運：1908 年完成基隆到高雄的西部縱貫鐵路——突破西部河川東西向、不利南北往來的地形限制，連結西部重要城鎮，成為南北交通動脈；另興建阿里山森林鐵路，是臺灣林業開發的見證。海運：整建基隆港（臺灣與日本聯絡的門戶）與高雄港（南部貨物主要進出港），有利南進政策。通訊：普設郵局（郵便局）、電報、電話。目的是便於殖民統治及獲取臺灣資源。","tb":"jC","era":"jp1","ch":4,"kind":"ex","cat":"地點","y":1899},"e4Sugar":{"id":"e4Sugar","lb":"新式製糖業・糖業王國","sb":"第一憨種甘蔗予會社磅","nt":"總督府為提高蔗糖產量，扶持日本資本家設立新式製糖廠（以機械動力取代舊式糖廍），並設糖業試驗所培育新品種、擴大蔗園面積。結果：臺灣製糖蓬勃發展，有「糖業王國」美譽；但蔗農權益備受壓榨——被限制販售對象（只能賣給指定會社）、又遭偷斤減兩，出現「第一憨，種甘蔗予會社磅」的俗諺，並在 1925 年引發二林事件。","tb":"jC","era":"jp1","ch":4,"kind":"ex","cat":"重點","y":1922},"e4Erlin":{"id":"e4Erlin","lb":"二林事件","sb":"1925・蔗農抗爭・★常考","nt":"1925 年彰化二林的蔗農，為爭取甘蔗收購權益而與警察爆發衝突，多人遭逮捕判刑。背景：新式製糖會社限制蔗農的販售對象、又偷斤減兩壓低收購價。影響：此後開啟全島性的農民運動，也是臺灣農民組合成立的契機。","tb":"","era":"jp2","ch":4,"kind":"ex","cat":"事件","y":1922},"e4Rice":{"id":"e4Rice","lb":"蓬萊米・磯永吉","sb":"1922 改良成功","nt":"磯永吉培育並種出符合日本人口味的「蓬萊米」，1922 年改良成功。結果：稻米產量增加，可大量銷往日本。與新式製糖合稱日治前期「農業臺灣、工業日本」的兩大主力：米與糖。","tb":"j6","era":"jp2","ch":4,"kind":"ex","cat":"人物","y":1922},"e4Canal":{"id":"e4Canal","lb":"嘉南大圳・八田與一","sb":"1930 完工","nt":"八田與一設計建造，1930 年完工，是日治時期規模最大的水利工程。目的＝提升農業生產力。結果：增加嘉南平原的灌溉面積，使稻米、甘蔗產量增加，米、糖產量有助於供應日本的需求。與清代四大水圳對照：從民間合資走向殖民政府主導的大型工程。","tb":"jC","era":"jp2","ch":4,"kind":"ex","cat":"地點","y":1930},"e4Power":{"id":"e4Power","lb":"日月潭水力發電所","sb":"1934 完工・工業化關鍵","nt":"1934 年完工，提供工業發展所需的電力，是「工業臺灣、農業南洋」與南進基地化最重要的建設。臺灣輕工業生產指數在 1934 年後明顯上揚——生產指數反映產業發展速度，指數愈高發展愈快。","tb":"jC","era":"jp2","ch":4,"kind":"ex","cat":"地點","y":1934},"e4Sch":{"id":"e4Sch","lb":"小學校・公學校・蕃童教育所","sb":"初等教育三軌・★常考","nt":"小學校＝日本人就讀，課程與日本內地一致；公學校＝臺灣人就讀，以教授日語為主；蕃人公學校與蕃童教育所＝原住民就讀（教師多由日本警察擔任）。無論師資、設備均比不上小學校，有種種限制與不公平待遇。1941 年配合皇民化一律改稱「國民學校」，1943 年實施六年國民義務教育。","tb":"j7","era":"","ch":4,"kind":"ex","cat":"地點","y":1928},"e4TC":{"id":"e4TC","lb":"臺中中學校","sb":"1915・第一所專收臺人子弟","nt":"1915 年林獻堂等臺灣士紳集資成立，是第一所專收臺灣人子弟的中學（今臺中一中）。中等教育初期以招收日人為主；職業學校則培養醫師（醫學校）、公學校教師（師範學校）與初級技術人才。","tb":"j7","era":"jp2","ch":4,"kind":"ex","cat":"地點","y":1928},"e4Univ":{"id":"e4Univ","lb":"臺北帝國大學","sb":"1928・今臺灣大學","nt":"1928 年總督府設立，是日治時期臺灣最高學府（今臺灣大學前身）。因高等教育資源與名額不足、臺灣人升學不易（1928 年臺灣人就學率仍只有20%左右），經濟條件較優渥的臺灣人大多前往日本留學；這些留學生回臺後，扮演推動政治社會運動的主要角色。統計對照：高等學校學生日本人 220 人、臺灣人僅 28 人。","tb":"j7","era":"jp2","ch":4,"kind":"ex","cat":"地點","y":1928},"e4Assoc":{"id":"e4Assoc","lb":"臺灣文化協會・臺灣民報","sb":"1921–1931・文化啟蒙","nt":"1921 年林獻堂、蔣渭水等人成立，宗旨＝「謀臺灣文化之向上」，推行啟迪民智的工作、喚醒臺人民族意識。內容：發行《臺灣民報》、設讀報社、舉辦演講會（文化演講）與夏季學校。1927 年因左傾分裂，蔣渭水另組臺灣民眾黨。","tb":"j8","era":"jp2","ch":4,"kind":"ex","cat":"重點","y":1921},"e4Pet":{"id":"e4Pet","lb":"議會設置請願運動","sb":"1921–1934・15次・林獻堂","nt":"由林獻堂、蔣渭水等人領導，1921–1934 年間共請願 15 次，訴求＝設立民選的「臺灣議會」、爭取立法權。結果：日本政府雖未採納，但激起臺人追求自治的想法、喚起政治意識。","tb":"j8","era":"jp2","ch":4,"kind":"ex","cat":"事件","y":1921},"e4Party":{"id":"e4Party","lb":"臺灣民眾黨","sb":"1927・第一個合法政黨・蔣渭水","nt":"1927 年蔣渭水成立，是臺灣史上第一個合法政黨（1927–1931）。理念與行動：提倡自由民權、破除社會惡習與迷信、反對吸食鴉片、積極支持農工運動。今日國道5號（蔣渭水高速公路）即以他的名字命名。霧社事件時曾致電國際聯盟，抗議日本使用毒瓦斯屠殺霧社人民。","tb":"j8","era":"jp2","ch":4,"kind":"ex","cat":"重點","y":1921},"e4League":{"id":"e4League","lb":"臺灣地方自治聯盟","sb":"1930–1937・促成1935選舉","nt":"1930 年林獻堂等人離開臺灣民眾黨後另組，主張宣傳民權與地方自治、爭取參政權。結果：促成 1935 年總督府首次開放（有限度的）地方議員選舉——臺灣民眾第一次行使投票權。意義：對自治、普選、參政權有了初步概念。","tb":"j8","era":"jp2","ch":4,"kind":"ex","cat":"重點","y":1921},"e4Lin":{"id":"e4Lin","lb":"林獻堂・蔣渭水","sb":"社會運動兩大推手・★常考","nt":"林獻堂：臺中霧峰士紳，臺中中學校、臺灣文化協會、議會設置請願運動、臺灣地方自治聯盟的核心人物。蔣渭水：醫師，臺灣文化協會創辦人之一，1927 年成立臺灣民眾黨（第一個合法政黨），支持農工運動。記法：請願與自治聯盟＝林獻堂；民眾黨＝蔣渭水；文協＝兩人共同。","tb":"j8","era":"jp2","ch":4,"kind":"ex","cat":"人物","y":1921},"e4Foot":{"id":"e4Foot","lb":"放足斷髮・漸禁鴉片","sb":"移風易俗・效果有限","nt":"放足斷髮：最初消極（為避免臺人抗爭而未積極禁止），後來由士紳倡導放足、剪辮。影響：①改變服飾風潮（漢、日、洋並存）②婦女得到解放，走出家庭從事教師、護士、車掌等工作。鴉片：初採消極的漸禁態度（管制吸食人口），後因知識分子反對而被迫改變作法，但效果有限、鴉片並沒有絕跡（總督府本身即以鴉片專賣為財源）。","tb":"j9","era":"jp2","ch":4,"kind":"ex","cat":"重點","y":1928},"e4Hyg":{"id":"e4Hyg","lb":"公共衛生・自來水・西式醫院","sb":"傳染病受控・壽命提升","nt":"原因＝有效防止臺灣傳染病肆虐。作法：醫療＝建立西式醫院、辦理預防注射和接種；公共＝建造自來水、廁所等公共衛生設施。影響：①將現代化的經驗引進臺灣，改善傳染病肆虐的環境 ②防疫、保健、衛生觀念逐漸普及 ③傳染病逐漸得到控制，臺灣人的壽命獲得提升。","tb":"j9","era":"jp2","ch":4,"kind":"ex","cat":"重點","y":1928},"e4Time":{"id":"e4Time","lb":"標準時間・星期制・司法制度","sb":"守時守法觀念","nt":"守時：為符合工業生產需要，引進標準時間制（一天24小時）與一週七天的星期制，並舉辦各種守時宣傳活動→民眾養成守時習慣、行政機關與交通逐漸遵守時間、開始重視放假與休閒；但除政府機關與學校外，民間仍沿用農曆。守法：將現代司法制度引進臺灣，各級地方法院設立，確立臺灣的司法制度，臺人養成守法觀念。","tb":"j9","era":"jp2","ch":4,"kind":"ex","cat":"重點","y":1928}},"REL":{"t01":[{"id":"mPal","lab":"時代起點","dash":false,"cause":false,"dir":"in"}],"t02":[{"id":"mNeo","lab":"時代起點","dash":false,"cause":false,"dir":"in"}],"t03":[{"id":"mMet","lab":"時代起點","dash":false,"cause":false,"dir":"in"}],"t04":[{"id":"t05","lab":"明海禁→海商據澎湖轉臺","dash":false,"cause":true,"dir":"in"},{"id":"mSea","lab":"漢人至澎湖","dash":false,"cause":false,"dir":"in"}],"t05":[{"id":"t04","lab":"明海禁→海商據澎湖轉臺","dash":false,"cause":true,"dir":"out"},{"id":"mSea","lab":"海禁・走私","dash":false,"cause":false,"dir":"in"}],"t06":[{"id":"kBase","lab":"據點①","dash":false,"cause":false,"dir":"in"}],"t07":[{"id":"kBase","lab":"據點②","dash":false,"cause":false,"dir":"in"},{"id":"mEs","lab":"為保馬尼拉北上","dash":true,"cause":false,"dir":"out"}],"t08":[{"id":"mSea","lab":"派兵澎湖→移臺","dash":false,"cause":false,"dir":"in"}],"t09":[{"id":"mName","lab":"進入歷史時代後才有官方稱呼","dash":true,"cause":false,"dir":"out"}],"t10":[{"id":"t12","lab":"澎湖被逐→1624 轉占大員
