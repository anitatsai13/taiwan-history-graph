/* ---- 年代 → 政權／年號 ---- */
function pick(tier,y,ch){
  const hits=(REIGN_DATA||[]).filter(r=>r.tier===tier && y>=r.from && y<=r.to);
  if(!hits.length) return null;
  if(hits.length>1){
    const same=hits.filter(r=>r.ch===ch);
    if(same.length) return same[same.length-1];
    const shared=hits.filter(r=>!r.ch);
    if(shared.length) return shared[shared.length-1];
  }
  return hits[hits.length-1];
}
function preEra(y){
  if(y<0) return "史前時代";
  if(y<1624) return "歐人東來・大航海初期";
  return null;
}
function eraOf(y,ch){
  const a=pick(1,y,ch);
  let b=pick(2,y,ch);
  if(a&&b&&(b.from<a.from||b.to>a.to)){
    const inside=(REIGN_DATA||[]).filter(r=>r.tier===2&&y>=r.from&&y<=r.to&&r.from>=a.from&&r.to<=a.to);
    b = inside.length ? inside[inside.length-1] : null;
  }
  if(!a&&!b){
    const pe=preEra(y);
    return pe ? {e1:pe,e2:"",from:null,to:null,c:"muted"} : {e1:"",e2:"",from:null,to:null,c:"muted"};
  }
  return {e1:a?a.label:"", e2:b?b.label:"", from:b?b.from:(a?a.from:null),
          to:b?b.to:(a?a.to:null), c:(b?b.c:a.c)};
}

const tint = (c,pct) => "color-mix(in srgb, "+cvar(c)+" "+pct+"%, transparent)";

  }else{
    parts=t.split(/(?<=。)(?![」』）)])/).map(x=>x.trim()).filter(Boolean);
    if(parts.length<2) parts=t.split(/(?<=；)(?![」』）)])/).map(x=>x.trim()).filter(Boolean);
  }
  if(parts.length<2) return "<p>"+t+"</p>";
  return "<ol>"+parts.map(p=>"<li>"+p+"</li>").join("")+"</ol>";
}

/* ---- 精華摘要 ---- */
function renderEssenceBlock(keys,label){
  if(!keys||!keys.length) return null;
  const det=document.createElement("details"); det.className="essence"; det.open=true;
  const sum=document.createElement("summary"); sum.textContent=label; det.appendChild(sum);
  const body=document.createElement("div");
  body.innerHTML=keys.filter(k=>TABLES[k]).map(k=>'<div class="etbl">'+TABLES[k].html+"</div>").join("");
  det.appendChild(body);
  return det;
}

/* ---- 詳情面板 ---- */
const pnl=document.getElementById("pnl"), pb=document.getElementById("pb");
document.getElementById("cl").onclick=()=>pnl.classList.remove("show");
const ovl=document.getElementById("ovl"), ovb=document.getElementById("ovb");
ovl.onclick=()=>ovl.classList.remove("show");
addEventListener("keydown",e=>{ if(e.key==="Escape"){ovl.classList.remove("show");pnl.classList.remove("show");} });
const CATV={事件:"--c-event",人物:"--c-person",地點:"--c-place",重點:"--c-key",主題:"--c-theme",年代:"--muted"};
let trail=[];
function relHtml(id){
  const list=(REL&&REL[id])||[];
  if(!list.length) return "";
  const seen=new Set();
  const cause=[], sub=[], cmp=[];
  list.forEach(r=>{
    const key=r.id+r.dir+r.lab; if(seen.has(key)) return; seen.add(key);
    (r.cause?cause:r.dash?cmp:sub).push(r);
  });
  const grp=(arr,label)=>{
    if(!arr.length) return "";
    const chips=arr.map(r=>{
      const n=NODES[r.id]; if(!n) return "";
      const arrow=r.cause?(r.dir==="out"?"➜ ":"⬅ "):"";
      return '<span class="rel" data-id="'+r.id+'" style="--k:var('+(CATV[n.cat]||"--c-key")+')">'+
             arrow+n.lb+(r.lab?'<span class="rl2">'+r.lab+"</span>":"")+"</span>";
    }).join("");
    return '<div class="relgrp"><div class="gl">'+label+"</div>"+chips+"</div>";
  };
  return '<div class="relbox"><h4>延伸關聯（點任一項可繼續往下看）</h4>'+
         grp(cause,"因果（➜ 果／⬅ 因）")+grp(sub,"從屬・相關")+grp(cmp,"對照・比較")+"</div>";
}
function open(o,catName){
  if(o&&o.id){
    const last=trail[trail.length-1];
    if(!last||last.id!==o.id) trail.push({id:o.id,cat:catName});
    if(trail.length>12) trail.shift();
  }
  const k=[catName]; if(o.sb) k.push(o.sb); if(o.era&&ERA_LABEL[o.era]) k.push(ERA_LABEL[o.era]);
  let h="";
  if(trail.length>1){
    const prev=trail[trail.length-2];
    const pn=NODES[prev.id];
    h+='<div id="nav"><span class="bk" id="bk">← 回 '+(pn?pn.lb:"上一個")+"</span></div>";
  }
  h+="<h3>"+o.lb+"</h3><div class=\"k\">"+k.join("　│　")+"</div>"+noteList(o.nt);
  if(o.tb&&TABLES[o.tb])
    h+='<div class="tw" data-t="'+o.tb+'"><h4>▦ '+TABLES[o.tb].title+'　<span style="float:right">點表格可放大</span></h4>'+TABLES[o.tb].html+"</div>";
  h+=relHtml(o.id);
  pb.innerHTML=h; pnl.classList.add("show"); pnl.scrollTop=0;
  const tw=pb.querySelector(".tw");
  if(tw) tw.onclick=()=>{ ovb.innerHTML="<h3 style='margin:0 0 12px'>"+TABLES[tw.dataset.t].title+"</h3>"+TABLES[tw.dataset.t].html; ovl.classList.add("show"); };
  const bk=document.getElementById("bk");
  if(bk) bk.onclick=()=>{ trail.pop(); const p=trail.pop(); if(p&&NODES[p.id]) open(NODES[p.id],p.cat||NODES[p.id].cat); };
  pb.querySelectorAll(".rel").forEach(el=>{
    el.onclick=()=>{ const n=NODES[el.dataset.id]; if(n) open(n,n.cat); };
  });
}

/* ---- 繪製（橫式格線） ---- */
const yTxt = y => y===null||y===undefined ? "" :
  (y<0 ? (Math.abs(y)>=10000 ? "距今"+Math.abs(y)/10000+"萬年" : "距今"+Math.abs(y)/1000+"千年") : String(y));
const hit = o => !q || (o.lb+o.sb+o.nt).includes(q);

function render(){
  const main=document.getElementById("main");
  main.innerHTML="";
  const gEss=renderEssenceBlock(essenceGlobal,"跨章精華摘要（跨章總表／跨冊比較）");
  if(gEss) main.appendChild(gEss);
  let shown=0;

  MIND.forEach(c=>{
    if(!chOn[c.ch]) return;

    /* 篩選後仍有內容的年代 */
    const cols=[];
    c.years.forEach(Y=>{
      const groups={};
      let cnt=0;
      CATS.forEach(([k])=>{
        if(!catOn[k]) return;
        const arr=(Y.grp[k]||[]).filter(hit);
        if(arr.length){ groups[k]=arr; cnt+=arr.length; }
      });
      if(!cnt && !hit(Y)) return;
      cols.push({Y, groups, cnt, era:eraOf(Y.y,c.ch)});
    });
    const orph=(c.orphan||[]).filter(o=>catOn[o.cat]&&hit(o));
    if(orph.length){
      const groups={};
      orph.forEach(o=>{ (groups[o.cat]=groups[o.cat]||[]).push(o); });
      cols.push({Y:{y:null,lb:"通論",sb:"無特定年代",nt:"",tb:"",era:""},groups,cnt:orph.length,
                 era:{e1:"通論",e2:"",from:null,to:null,c:"muted"}});
    }
    if(!cols.length) return;
    shown++;

    const box=document.createElement("section"); box.className="ch";
    const h=document.createElement("h2");
    const total=cols.reduce((s,x)=>s+x.cnt,0);
    h.innerHTML='<span>'+"①②③④"[c.ch-1]+" "+c.name+'</span><span class="n">'+cols.length+' 個年代・'+total+' 項</span>';
    h.onclick=()=>box.classList.toggle("collapsed");
    box.appendChild(h);

    const chEss=renderEssenceBlock(essenceByCh[c.ch], c.name+" 精華摘要");
    if(chEss) box.appendChild(chEss);

    /* 使用中的類別列 */
    const rows=CATS.filter(([k])=>catOn[k] && cols.some(x=>x.groups[k]));

    const wrap=document.createElement("div"); wrap.className="hwrap";
    const grid=document.createElement("div"); grid.className="hgrid";
    grid.style.gridTemplateColumns="52px repeat("+cols.length+", minmax(158px, 1fr))";
    grid.style.gridTemplateRows="auto auto auto repeat("+rows.length+", auto)";

    /* 政權／年號帶：把連續同段的欄合併 */
    const bandRow=(tier,cls,label)=>{
      const rl=document.createElement("div"); rl.className="rl"; rl.textContent=label; grid.appendChild(rl);
      let i=0;
      while(i<cols.length){
        const key=tier===1?cols[i].era.e1:cols[i].era.e2;
        let j=i+1;
        while(j<cols.length && (tier===1?cols[j].era.e1:cols[j].era.e2)===key) j++;
        const d=document.createElement("div"); d.className=cls+" eend";
        d.style.gridColumn="span "+(j-i);
        d.style.setProperty("--k",cvar(cols[i].era.c));
        d.style.background=tint(cols[i].era.c, tier===1?26:14);
        if(key){
          d.textContent=key+(tier===2&&cols[i].era.from!==null?"　"+cols[i].era.from+"–"+cols[i].era.to:"");
          d.title=key;
        }
        grid.appendChild(d);
        i=j;
      }
    };
    bandRow(1,"b1","政權");
    bandRow(2,"b2","年號");

    /* 年代列 */
    const rlY=document.createElement("div"); rlY.className="rl"; rlY.textContent="年代"; grid.appendChild(rlY);
    cols.forEach(x=>{
      const d=document.createElement("div"); d.className="yh"+(q&&hit(x.Y)?" hit":"");
      d.style.background=tint(x.era.c,10);
      const lab=x.Y.lb.replace(/^[^\s]*\s/,"") || x.Y.lb;
      d.innerHTML='<span class="yn">'+(yTxt(x.Y.y)||"—")+'</span><span class="yl">'+lab+
                  '</span><span class="ys">'+(x.Y.sb||"")+"</span>";
      const yl=d.querySelector?null:null;
      d.onclick=()=>{ if(x.Y.nt||x.Y.tb) open(x.Y,"年代"); };
      grid.appendChild(d);
    });

    /* 類別列 */
    rows.forEach(([k,v])=>{
      const rl=document.createElement("div"); rl.className="rl";
      rl.textContent=k; rl.style.color="var("+v+")";
      grid.appendChild(rl);
      cols.forEach(x=>{
        const d=document.createElement("div"); d.className="cell";
        d.style.background=tint(x.era.c,4);
        (x.groups[k]||[]).forEach(o=>{
          const e=document.createElement("div"); e.className="it"+(q&&hit(o)?" hit":"");
          e.style.setProperty("--k","var("+v+")");
          e.innerHTML=o.lb+(o.sb?'<span class="s">'+o.sb+"</span>":"");
          e.onclick=()=>open(o,k);
          d.appendChild(e);
        });
        grid.appendChild(d);
      });
    });

    wrap.appendChild(grid);
    box.appendChild(wrap);
    main.appendChild(box);
  });

  if(!shown){
    const p=document.createElement("p");
    p.style.cssText="color:var(--muted);padding:24px 0";
    p.textContent="找不到符合的內容。";
    main.appendChild(p);
  }
}
render();
</script>
</body>
</html>
