<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>臺灣史心智圖</title>
<style>
:root{
  --bg:#ffffff; --panel:#f5f5f7; --card:#ffffff; --ink:#1d1d1f; --muted:#7a7a7a;
  --line:#e3e3e6; --line2:#cfcfd4;
  --c-event:#ff3b30; --c-person:#0066cc; --c-place:#34c759; --c-key:#ff9f0a; --c-theme:#af52de;
  --blue:#0066cc; --red:#ff3b30; --green:#34c759; --orange:#ff9f0a;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#141416; --panel:#1e1e21; --card:#1a1a1d; --ink:#f2f2f4; --muted:#9a9aa0;
         --line:#2e2e33; --line2:#3d3d44;
         --c-event:#ff6b61; --c-person:#4a9eff; --c-place:#4cd97b; --c-key:#ffb340; --c-theme:#c77dff;
         --blue:#4a9eff; --red:#ff6b61; --green:#4cd97b; --orange:#ffb340; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.55 system-ui,-apple-system,"Microsoft JhengHei",sans-serif}
header{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px 8px}
h1{margin:0 0 8px;font-size:17px;letter-spacing:-.3px}
h1 small{font-weight:400;color:var(--muted);font-size:12px;margin-left:8px}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px solid var(--line2);background:var(--panel);border-radius:999px;
  padding:3px 11px;font-size:12.5px;cursor:pointer;user-select:none;white-space:nowrap}
.chip.off{opacity:.35}
.chip.cat::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;
  margin-right:6px;vertical-align:1px;background:var(--k)}
.sp{flex:1}
input[type=search]{border:1px solid var(--line2);background:var(--panel);color:var(--ink);
  border-radius:999px;padding:4px 12px;font-size:12.5px;width:200px;outline:none}
main{padding:14px 16px 90px}
.ch{margin:0 0 22px}
.ch>h2{font-size:15px;margin:0 0 8px;padding:5px 12px;border-radius:8px;background:var(--panel);
  cursor:pointer;display:flex;gap:8px;align-items:center}
.ch>h2 .n{color:var(--muted);font-weight:400;font-size:12px}
.collapsed .hwrap,.collapsed .essence{display:none}

/* ---- 橫式格線：欄＝年代，列＝政權／年號／年代／類別 ---- */
.hwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.hgrid{display:grid;align-items:stretch;min-width:max-content}
.hgrid>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  padding:4px 6px;min-width:0}
.rl{position:sticky;left:0;z-index:2;background:var(--panel);border-right:2px solid var(--line2);
  font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.5px;display:flex;align-items:center}
.b1,.b2{text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  border-right:2px solid var(--bg)}
.b1{font-weight:800;font-size:12.5px;padding:6px 6px}
.b2{font-weight:700;font-size:11.5px;color:var(--k)}
.yh{background:var(--panel)}
.yh .yn{font-variant-numeric:tabular-nums;font-weight:800;font-size:13.5px;display:block}
.yh .yl{font-weight:600;font-size:12px;display:block;cursor:pointer}
.yh .ys{color:var(--muted);font-size:10.5px;display:block}
.cell{display:flex;flex-direction:column;gap:4px}
.it{border:1px solid var(--line);border-left:3px solid var(--k);border-radius:6px;
  background:var(--card);padding:2px 6px;font-size:11.5px;cursor:pointer;line-height:1.35}
.it:hover{border-color:var(--k)}
.it .s{color:var(--muted);font-size:10px;display:block}
.it.hit{outline:2px solid var(--c-key)}
.eend{border-right:2px solid var(--line2)!important}

/* ---- 精華摘要 ---- */
.essence{margin:8px 0 10px}
.essence summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--c-theme);
  padding:6px 10px;background:var(--panel);border-radius:8px;list-style:none}
.essence summary::-webkit-details-marker{display:none}
.essence summary::before{content:"▦ "}
.essence[open] summary{margin-bottom:8px}
.essence .etbl{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;overflow-x:auto}

/* ---- 詳情面板 ---- */
#pnl{position:fixed;right:0;top:0;bottom:0;width:min(430px,92vw);background:var(--card);
  border-left:1px solid var(--line);padding:16px 18px;overflow:auto;transform:translateX(103%);
  transition:transform .18s;z-index:50;box-shadow:-8px 0 30px rgba(0,0,0,.18)}
#pnl.show{transform:none}
#pnl h3{margin:0 0 2px;font-size:17px}
#pnl .k{font-size:11.5px;color:var(--muted);margin-bottom:12px}
#pnl ol{margin:0 0 14px;padding-left:1.25em}
#pnl li{margin:3px 0}
#cl{position:absolute;right:12px;top:10px;border:none;background:none;color:var(--muted);
  font-size:20px;cursor:pointer;line-height:1}
.tw{border:1px solid var(--line);border-radius:10px;padding:10px;cursor:zoom-in;overflow-x:auto}
.tw h4{margin:0 0 8px;font-size:12.5px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:11.5px;line-height:1.45}
th,td{border:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
th{background:var(--panel);font-weight:600}
.hl{color:var(--c-event);font-weight:600}
.hb{color:var(--c-person);font-weight:600}
.grp{background:var(--c-theme);color:#fff;font-weight:700;text-align:center}
#ovl{position:fixed;inset:0;z-index:70;display:none;background:rgba(0,0,0,.55);
  backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:38px;cursor:zoom-out}
#ovl.show{display:flex}
#ovb{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 26px;
  max-width:min(94vw,980px);max-height:86vh;overflow:auto}
#ovb table{font-size:15px;line-height:1.6}
#ovb th,#ovb td{padding:8px 12px}
/* 面板：延伸關聯 */
.relbox{margin:4px 0 14px}
.relbox h4{margin:0 0 6px;font-size:12px;color:var(--muted)}
.relgrp{margin-bottom:8px}
.relgrp .gl{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:3px}
.rel{display:inline-block;border:1px solid var(--line2);border-left:3px solid var(--k);
  border-radius:6px;background:var(--panel);padding:2px 8px;margin:0 4px 4px 0;
  font-size:11.5px;cursor:pointer}
.rel:hover{border-color:var(--k)}
.rel .rl2{color:var(--muted);font-size:10px;margin-left:4px}
#nav{display:flex;gap:6px;align-items:center;margin:0 0 8px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
#nav .bk{border:1px solid var(--line2);background:var(--panel);border-radius:999px;
  padding:1px 9px;cursor:pointer}
</style>
</head>
<body>
<header>
  <h1>臺灣史心智圖<small>橫式：欄＝年代　列＝事件・人物・地點・重點　色塊＝時期</small></h1>
  <div class="bar" id="bar"></div>
</header>
<main id="main"></main>
<div id="pnl"><button id="cl">×</button><div id="pb"></div></div>
<div id="ovl"><div id="ovb"></div></div>
<script>
const DATA = {"MIND":[{"ch":1,"name":"史前與原住民","years":[{"id":"t01","y":-50000,"lb":"距今5萬年前","sb":"舊石器時代開始","nt":"臺灣最早的人類活動。舊石器時代：距今 5 萬～5 千年前。","tb":"","era":"pal","grp":{"事件":[],"人物":[],"地點":[],"重點":[{"id":"kArch","lb":"考古發掘","sb":"★常考・分期依據","nt":"①史前時代沒有（缺乏）文字記載，須根據出土的遺物與遺跡，推測史前人類的生活情況。②分期依據：使用器具的「種類（材質）與製作技術」，分為舊石器、新石器、金屬器三階段。","cat":"重點","tb":"t1","era":""},{"id":"kPalL","lb":"打製石器・用火","sb":"採集漁獵・不定居居山洞","nt":"工具：用火、打製石器。食物：採集、漁獵。生活型態：不定居，居於山洞。（分期比較表三欄一起背：工具→食物→生活）","cat":"重點","tb":"t1","era":"pal"},{"id":"eCh","lb":"長濱文化","sb":"臺東縣長濱鄉・舊石器晚期","nt":"臺灣目前發現最早的史前文化（★常考）。舊石器時代「晚期」。關鍵字：採集、漁獵生活、已知用火、打製石器。","cat":"重點","tb":"t2","era":"pal"}],"主題":[{"id":"mPal","lb":"舊石器時代","sb":"史前臺灣・★常考","nt":"距今 5 萬～5 千年前。生活型態：已知用火、打製石器，以採集、漁獵維生。代表遺址：長濱文化。","cat":"主題","tb":"t1","era":"pal"}]}},{"id":"t02","y":-7000,"lb":"距今7千年前","sb":"新石器時代開始","nt":"新石器時代：距今 7 千～2 千年前。關鍵轉變：從「採食」到「產食」，文化快速發展。","tb":"","era":"neo","grp":{"事件":[],"人物":[],"地點":[{"id":"eYs","lb":"圓山文化","sb":"臺北市（臺北盆地）・新石器晚期","nt":"貝塚遺跡→臺北湖存在的證據。新石器時代「晚期」。","cat":"地點","tb":"t2","era":"neo"}],"重點":[{"id":"kNeoL","lb":"磨製石器・陶器・農業","sb":"定居修屋・從採食到產食","nt":"工具：磨製石器、燒製陶器。食物：飼養家畜、種植作物（以稻米為主食）。生活型態：定居，修築房屋。從採食到產食，文化快速發展。分早／晚期：早期＝大坌坑文化；晚期＝圓山、卑南文化。","cat":"重點","tb":"t1","era":"neo"},{"id":"eDb","lb":"大坌坑文化","sb":"新北市八里區・新石器早期","nt":"又稱「粗繩紋陶文化」；種植根莖類作物（初級農業）。中國東南沿海也有相似的文化。新石器時代「早期」代表（打製到磨製石器的過渡）。","cat":"重點","tb":"t2","era":"neo"},{"id":"eBn","lb":"卑南文化","sb":"臺灣東部（臺東縣）・新石器晚期","nt":"出土大量石器、陶器；以石板屋、石板棺著稱；玉器陪葬品。注意！人獸形玉器在臺灣其他史前文化（如圓山文化）、東南亞也有發現→反映不同區域的互動。新石器時代「晚期」。","cat":"重點","tb":"t2","era":"neo"},{"id":"eNg","lb":"南關里遺址","sb":"臺南（南科）","nt":"南科南關里遺址出土碳（炭）化稻米——農耕的證據；南關里遺址最早。新石器時代。","cat":"重點","tb":"t2","era":"neo"}],"主題":[{"id":"mNeo","lb":"新石器時代","sb":"史前臺灣・★常考","nt":"距今 7 千～2 千年前。磨製石器、燒製陶器、飼養家畜、農耕（稻米為主食）。「從採食到產食，文化快速發展」。代表遺址：大坌坑（早期）、圓山、卑南（晚期）＋南關里最早農耕證據。","cat":"主題","tb":"t1","era":"neo"}]}},{"id":"t03","y":-2000,"lb":"距今2千年前","sb":"金屬器時代開始","nt":"金屬器時代：距今 2 千～4 百年前。","tb":"","era":"metal","grp":{"事件":[],"人物":[],"地點":[],"重點":[{"id":"kMetL","lb":"煉鐵・對外貿易","sb":"種稻漁獵・外來文物多","nt":"工具：金屬器（鐵器）——出土煉鐵爐、鐵渣。食物：種稻、漁獵。生活型態：貿易頻繁、外來文物多（玻璃手環、瑪瑙珠飾、銅錢）——與東南亞或中國大陸已有貿易往來。","cat":"重點","tb":"t1","era":"metal"},{"id":"eSs","lb":"十三行文化","sb":"新北市八里區","nt":"煉鐵作坊遺跡（煉鐵爐、鐵渣）、鐵製工具、砥石（磨利生產的鐵器）；以農業為主、種植穀物；干欄式住屋（建築）。出土玻璃珠、玻璃手環、瑪瑙珠飾、中國銅錢等外來器物——顯示與島外其他地區貿易頻繁。金屬器時代。","cat":"重點","tb":"t2","era":"metal"}],"主題":[{"id":"mMet","lb":"金屬器時代","sb":"史前臺灣・★常考","nt":"距今 2 千～4 百年前。鐵製工具（出土煉鐵爐、鐵渣）；貿易頻繁：玻璃手環、瑪瑙珠飾、銅錢等外來文物。代表遺址：十三行文化。","cat":"主題","tb":"t1","era":"metal"}]}},{"id":"t09","y":1625,"lb":"約400年前 進入歷史時代","sb":"開始有文字記載","nt":"史前↔歷史的分界＝有無文字記載。約 400 年前（17 世紀，大航海時代 15–17 世紀）臺灣進入歷史時代。","tb":"","era":"hist","grp":{"事件":[],"人物":[],"地點":[],"重點":[],"主題":[{"id":"mName","lb":"稱呼演變","sb":"清→日治→民國","nt":"清帝國「熟番／生番」→日治「平埔族／高砂族」→中華民國「部分平埔族／高山族（山地同胞）」→民國83年修憲正名，統稱「原住民族」，現認定16族。","cat":"主題","tb":"t4","era":""}]}},{"id":"t20","y":1683,"lb":"1683/1684 施琅攻臺・清帝國統治","sb":"鄭氏降清・臺入清版圖","nt":"1683 年清帝國派將施琅攻取臺灣，鄭克塽降清，結束鄭氏在臺約 20 年統治；1684 年臺灣首度納入中國版圖（隸福建省），清帝國統治開始。同年頒布渡臺禁令、鹿耳門設正港。清對原住民依「是否納稅、服勞役」分熟番／生番。","tb":"t18","era":"hist","grp":{"事件":[],"人物":[{"id":"eShi","lb":"施琅","sb":"1683 攻臺滅鄭・建議留臺","nt":"1683 年清帝國派將施琅攻取臺灣→鄭克塽降清；1684 年臺灣首度納入中國版圖。「棄留論」爭議中，施琅以戰略考量建議「留臺」，清廷採納。","cat":"人物","tb":"t18","era":""}],"地點":[],"重點":[{"id":"kQ","lb":"清帝國：熟番／生番","sb":"依納稅・服勞役","nt":"清帝國依據「是否納稅、服勞役」分為熟番（多為平埔族群）、生番（多為高山各族）。","cat":"重點","tb":"t4","era":"hist"}],"主題":[]}},{"id":"t21","y":1895,"lb":"1895 乙未割臺・日治開始","sb":"馬關條約","nt":"甲午戰敗→1895 馬關條約割讓臺灣（末代巡撫唐景崧；乙未年臺人抗日＝乙未割臺）。日治時期將原住民改稱：熟番→平埔族、生番→高砂族。","tb":"j3","era":"hist","grp":{"事件":[],"人物":[],"地點":[{"id":"kHi","lb":"高山各族","sb":"漢化較淺・山區與東部","nt":"①與漢人接觸晚，漢化較淺，保有不少原有文化。②分布於山區與東部地區。③稱呼：生番→高砂族→高山族（山地同胞）。④代表（比較表）：邵、排灣、賽夏。其他如：泰雅、賽德克、太魯閣、撒奇萊雅、鄒、卡那卡那富、拉阿魯哇、布農、阿美、卑南、魯凱、達悟。起源＝南島語族（與平埔族群相同）。","cat":"地點","tb":"t3","era":""}],"重點":[{"id":"kPin","lb":"平埔族群","sb":"漢化較深・西部東北部","nt":"①與漢人接觸早，漢化較深，逐漸融入漢人社會。②分布於西部、東北部的平原、丘陵。③稱呼：熟番→平埔族。④代表（比較表）：西拉雅、凱達格蘭、噶瑪蘭。17 世紀族群另有：道卡斯、巴則海、巴布拉、貓霧捒、和安雅。起源＝南島語族（與高山各族相同）。","cat":"重點","tb":"t3","era":""},{"id":"kJ","lb":"日治：平埔族／高砂族","sb":"熟番→平埔・生番→高砂","nt":"日治時期改稱：熟番→平埔族、生番→高砂族。","cat":"重點","tb":"t4","era":"hist"}],"主題":[]}},{"id":"t3i","y":1945,"lb":"1945 中華民國","sb":"高山族（山地同胞）","nt":"中華民國時期：高山族（山地同胞）＋部分平埔族。","tb":"","era":"hist","grp":{"事件":[],"人物":[],"地點":[],"重點":[{"id":"kR","lb":"民國：原住民族","sb":"民國83年正名・16族","nt":"中華民國時期：部分平埔族／高山族（山地同胞）→民國83年修憲正名統稱「原住民族」。跨科（公民）：法源《原住民族基本法》；部落＝特定區域＋血緣關係＋共同文化；重要性＝文化傳承＋共享互助＋部落自治。跨科（地理）：都市原住民人口漸增；辦理祭典維繫文化傳統。","cat":"重點","tb":"t4","era":"hist"}],"主題":[]}},{"id":"t3j","y":1994,"lb":"民國83年 修憲正名","sb":"統稱「原住民族」","nt":"民國 83 年（1994）修憲正名，統稱「原住民族」。目前經政府認定的有 16 族（跨科：公民）。","tb":"","era":"hist","grp":{"事件":[],"人物":[],"地點":[],"重點":[],"主題":[]}}],"orphan":[{"id":"mOri","lb":"原住民起源","sb":"南島語族","nt":"臺灣原住民各族群屬於南島語族，可能在數千年前移入臺灣，再向外擴散到其他地區。","cat":"主題","tb":"","era":""},{"id":"mLeg","lb":"原住民傳說","sb":"口語傳說","nt":"原住民沒有創制文字，透過口語傳說傳承族群歷史與文化記憶。分「族群起源」與「族群遷徙」兩類傳說。","cat":"主題","tb":"","era":""},{"id":"mDis","lb":"原住民分布","sb":"平埔族群 vs 高山各族","nt":"以與漢人接觸早晚、分布位置區分：平埔族群（西部・東北部平原丘陵）與高山各族（山區與東部）。","cat":"主題","tb":"t3","era":""},{"id":"kAus","lb":"南島語族","sb":"臺灣位於分布最北端・讀圖A++","nt":"分布於太平洋和印度洋：西至馬達加斯加、東至復活節島（智利）、南至紐西蘭、北至臺灣。臺灣位於南島語族分布範圍的最北端（讀圖常考）。","cat":"重點","tb":"","era":""},{"id":"kOral","lb":"口語傳說","sb":"沒有創制文字","nt":"原住民沒有創制文字，透過口語傳說傳承族群歷史與文化記憶。","cat":"重點","tb":"","era":""},{"id":"eL1","lb":"排灣族：蛇生始祖","sb":"族群起源傳說","nt":"族群起源傳說：排灣族——蛇生始祖。","cat":"重點","tb":"","era":""},{"id":"eL2","lb":"泰雅族：岩石始祖","sb":"族群起源傳說","nt":"族群起源傳說：泰雅族——岩石始祖。","cat":"重點","tb":"","era":""},{"id":"eL3","lb":"邵族：白鹿傳說","sb":"族群遷徙傳說","nt":"族群遷徙傳說：邵族——白鹿傳說。","cat":"重點","tb":"","era":""},{"id":"eL4","lb":"布農・西拉雅：洪水避難","sb":"族群遷徙傳說","nt":"族群遷徙傳說：布農族、西拉雅族——洪水避難傳說。","cat":"重點","tb":"","era":""}]},{"ch":2,"name":"大航海時期","years":[{"id":"t04","y":1250,"lb":"12–13世紀 漢人至澎湖","sb":"歐洲人東來前","nt":"歐洲人東來前，「海商」在東亞海域貿易已相當活躍；12、13 世紀開始，漢人已在澎湖往來活動。","tb":"","era":"ming","grp":{"事件":[{"id":"kBan","lb":"海禁→走私貿易","sb":"澎湖臺灣＝貿易據點","nt":"明朝海禁（14世紀後期起）：目標＝防範倭寇；限制人民私自出海→「海商」走私貿易。對臺影響：16世紀起，澎湖、臺灣位於南北航道及東亞貿易圈要地→成為海商根據地／重要貿易據點。（比較表：明海禁 vs 清海禁 vs 日鎖國）","cat":"事件","tb":"t6","era":"ming"}],"人物":[{"id":"kZhi","lb":"顏思齊・鄭芝龍據臺","sb":"17世紀・海上霸主","nt":"17 世紀「海商」來臺：顏思齊、鄭芝龍在雲林、嘉義一帶建立據點、招募漢人開墾。海上新霸主：後鄭芝龍併吞數個海上勢力，成為東南沿海的霸主。荷蘭曾聯合其他海商對付鄭芝龍為首的明軍但被擊敗→關係好轉後合作（貿易發展順利開展）。明亡後鄭芝龍投降清帝國→荷蘭轉口貿易急遽衰退。","cat":"人物","tb":"","era":"ming"},{"id":"eYan","lb":"顏思齊登臺紀念碑","sb":"雲林・嘉義","nt":"顏思齊、鄭芝龍在雲林、嘉義一帶建立據點、招募漢人開墾（顏思齊登臺紀念碑）。","cat":"人物","tb":"","era":"ming"}],"地點":[],"重點":[],"主題":[{"id":"mSea","lb":"海商在臺澎Ⓚ","sb":"歐人東來前～17世紀","nt":"東亞海域的「海商」貿易活躍。時序：漢人至澎湖（12–13世紀）→明海禁・走私（14世紀後期）→明派兵澎湖・海商移臺（16世紀後期）→顏思齊、鄭芝龍據臺（17世紀）。","cat":"主題","tb":"","era":"ming"}]}},{"id":"t05","y":1350,"lb":"14世紀後期 明海禁","sb":"海商走私貿易","nt":"①明朝實施海禁：限制人民私自出海。②「海商」走私貿易：澎湖與臺灣位於南北航道及東亞貿易圈的要地，因而成為重要貿易據點。","tb":"","era":"ming","grp":{"事件":[],"人物":[],"地點":[],"重點":[],"主題":[]}},{"id":"t08","y":1550,"lb":"16世紀後期 明派兵澎湖","sb":"海商移臺","nt":"明朝政府派兵澎湖。原因：「海盜」威脅東南沿海安全。結果：漢人「海商」從澎湖移至臺灣活動。影響：海商與歐洲勢力維持一定的合作關係。","tb":"","era":"ming","grp":{"事件":[],"人物":[],"地點":[],"重點":[],"主題":[]}},{"id":"t06","y":1557,"lb":"1557 葡占澳門","sb":"歐人東亞據點①","nt":"葡萄牙占領中國澳門——葡萄牙在東亞的貿易據點（形勢圖①）。","tb":"","era":"","grp":{"事件":[],"人物":[],"地點":[],"重點":[{"id":"kMot","lb":"動機→新航路→大航海","sb":"香料・絲綢","nt":"歐洲人對東南亞、中國、印度的香料、絲綢等需求大增→尋求前往東方的道路→發現來亞洲的新航路→進入「大航海時代」（15世紀末）。","cat":"重點","tb":"","era":""},{"id":"kBase","lb":"歐人亞洲三據點","sb":"澳門・馬尼拉・巴達維亞","nt":"背形勢圖編號：①1557 葡萄牙占澳門 ②1571 西班牙占馬尼拉 ③1619 荷蘭占巴達維亞（荷蘭聯合東印度公司據點）。影響：全球經濟貿易網開始形成。","cat":"重點","tb":"","era":""}],"主題":[{"id":"mEu","lb":"歐人東來","sb":"背景15世紀末・發展16–17世紀","nt":"背景（15世紀末）：①動機：歐洲人對東南亞、中國、印度的香料、絲綢等需求大增 ②想法：尋求前往東方的道路 ③行動：發現來亞洲的新航路 ④意義：進入「大航海時代」。","cat":"主題","tb":"","era":""}]}},{"id":"t07","y":1571,"lb":"1571 西占馬尼拉","sb":"歐人東亞據點②","nt":"西班牙占領菲律賓馬尼拉（形勢圖②）。後為確保馬尼拉安全而北上臺灣。","tb":"","era":"es","grp":{"事件":[],"人物":[],"地點":[{"id":"kEsN","lb":"占雞籠淡水・築城傳教","sb":"天主教・西班牙語彙","nt":"對原住民：武力降服、安撫（比較：荷蘭是結盟新港社＋武力麻豆社）。築城：聖薩爾瓦多城（基隆／雞籠）、聖多明哥城（淡水）。傳教：在北臺灣建立教堂傳播天主教、使用西班牙文（比較：荷蘭傳基督教、創新港文）。影響：北部原住民話語留下西班牙語彙。","cat":"地點","tb":"t5","era":"es"},{"id":"eSant","lb":"聖多明哥城・聖薩爾瓦多城","sb":"淡水・雞籠","nt":"西班牙在北臺灣的築城（觀念提示：在雞籠建聖薩爾瓦多城、淡水建聖多明哥城）。北部留下遺跡。","cat":"地點","tb":"","era":"es"}],"重點":[{"id":"kBasay","lb":"馬賽人與外人合作","sb":"操舟・貿易・採金","nt":"①航行：善於操舟航行 ②學習語言：與漢人溝通 ③與漢人貿易：提供鹿皮、硫磺，交換布匹、鹽、鐵 ④協助西班牙人：至東部採黃金。","cat":"重點","tb":"","era":"es"},{"id":"eBasay","lb":"馬賽人","sb":"北部原住民","nt":"北臺灣原住民，善操舟航行、與漢人貿易（鹿皮硫磺換布鹽鐵）、協助西班牙人至東部採黃金。","cat":"重點","tb":"t8","era":"es"}],"主題":[{"id":"mEs","lb":"西班牙在北臺","sb":"1626–1642（16年）","nt":"為確保貿易航運安全（及馬尼拉安全）進占北臺灣，統治雞籠、淡水；傳天主教、向北部原住民徵稅引發反抗；1642 被荷蘭人驅離。","cat":"主題","tb":"t5","era":"es"}]}},{"id":"t10","y":1604,"lb":"1604 荷占澎湖・沈有容諭退","sb":"第一次占澎湖","nt":"荷蘭占領澎湖，被明將沈有容諭退（「澎湖為明朝的土地，絕不容許外人侵占」）。","tb":"","era":"nl","grp":{"事件":[],"人物":[{"id":"eShen","lb":"沈有容","sb":"1604 諭退荷蘭","nt":"明將沈有容於 1604 年諭退占領澎湖的荷蘭人。","cat":"人物","tb":"","era":"ming"}],"地點":[{"id":"kCast","lb":"荷蘭築城","sb":"熱蘭遮＋普羅民遮","nt":"①政治中心：占領初期在大員（今臺南安平區）建「熱蘭遮城」（今安平古堡）。②商業中心：後在今赤崁一帶興築「普羅民遮城」。③驅離西班牙後在淡水築城＝今淡水紅毛城。","cat":"地點","tb":"t5","era":"nl"},{"id":"kRel","lb":"宗教教化・新港文","sb":"羅馬字母拼西拉雅語","nt":"①傳教：建教堂、設學校，由基督教傳教士擔任老師，教授青少年及婦女。②文字：傳教士利用羅馬字母拼寫西拉雅族的語言，翻譯《聖經》，形成「新港文」。影響：南部平埔族與漢人以新港文字與漢文簽訂土地契約＝「新港文書」（又稱「番仔契」）。","cat":"地點","tb":"t5","era":"nl"},{"id":"eZeel","lb":"熱蘭遮城","sb":"大員（今安平古堡）","nt":"荷蘭政治中心，占領初期建於大員（今臺南安平區），今安平古堡。留有《熱蘭遮城日誌》、《聯合東印度公司檔案》等史料。","cat":"地點","tb":"","era":"nl"},{"id":"eProv","lb":"普羅民遮城","sb":"今赤崁","nt":"荷蘭商業中心，後在今赤崁一帶興築。","cat":"地點","tb":"","era":"nl"},{"id":"eSin","lb":"新港文書（番仔契）","sb":"新港文＋漢文契約","nt":"南部平埔族與漢人以新港文字與漢文簽訂的土地契約，稱「新港文書」，又稱「番仔契」。","cat":"地點","tb":"","era":"nl"}],"重點":[{"id":"kTrans","lb":"貿易轉運站","sb":"稻米蔗糖鹿皮／瓷器香料絲織品","nt":"以臺灣為中心，與中國、日本和巴達維亞貿易，透過公司船隻延伸貿易至全球。②吸引中、日等國商人前來貿易。③輸出：稻米、蔗糖、鹿皮。④轉運：瓷器、香料、絲織品。","cat":"重點","tb":"t5","era":"nl"},{"id":"kEco","lb":"經濟影響","sb":"耕牛↑・鹿隻↓・轉耕種","nt":"①引進耕牛：為增加稻米產量。②鹿隻減少：漢人以布匹、鹽、鐵向原住民收購鹿皮，轉賣東印度公司→大量捕鹿使梅花鹿數量大量減少；土地開墾也使鹿隻減少。③原住民生活改變：17 世紀減少狩獵、由游耕漁獵轉為定居耕種（漢人帶來水田耕作技術）。","cat":"重點","tb":"t8","era":"nl"}],"主題":[{"id":"mNl","lb":"荷蘭統治臺灣","sb":"1624–1662（38年）","nt":"1624 退出澎湖轉占臺灣南部，首度占領臺灣的歐洲勢力。統治工具：築城、貿易轉運站、招募漢人、控制原住民、宗教教化。1662 被鄭成功驅離。","cat":"主題","tb":"t5","era":"nl"}]}},{"id":"t11","y":1619,"lb":"1619 荷占巴達維亞","sb":"歐人東亞據點③","nt":"荷蘭成立「荷蘭聯合東印度公司」，以巴達維亞（今印尼雅加達）為據點（形勢圖③）。影響：全球經濟貿易網開始形成。","tb":"","era":"nl","grp":{"事件":[],"人物":[],"地點":[],"重點":[],"主題":[]}},{"id":"t12","y":1624,"lb":"1624 荷占臺灣南部Ⓚ","sb":"大員・38年統治開始","nt":"荷蘭再占澎湖被明軍圍攻、進攻澳門被葡萄牙人擊退→1624 年退出澎湖、轉往臺灣Ⓚ。①占臺灣南部（大員）②成為「首度占領臺灣的歐洲勢力」。統治 1624–1662 共 38 年。","tb":"","era":"nl","grp":{"事件":[],"人物":[],"地點":[],"重點":[],"主題":[]}},{"id":"t13","y":1626,"lb":"1626 西占北臺灣","sb":"雞籠・淡水・蛤仔難","nt":"西班牙人認為荷蘭人占領臺灣南部會影響其貿易與航運安全→1626 進占臺灣北部雞籠（今基隆）、淡水與蛤仔難（今宜蘭）等地。統治 1626–1642 共 16 年。","tb":"","era":"es","grp":{"事件":[],"人物":[],"地點":[],"重點":[],"主題":[]}},{"id":"t14","y":1633,"lb":"1633 日本鎖國","sb":"1633–1854","nt":"因徵稅問題荷日爆發衝突（日本曾關閉荷蘭商館報復、多次協商後恢復貿易）→1633 年日本宣布「鎖國政策」：只准荷蘭人與中國人來長崎貿易。日商退出東亞貿易，荷、日衝突不再。鎖國背景＝西方文化與日本傳統衝突；至 1854 年美國軍艦叩關（黑船事件）結束。","tb":"t6","era":"","grp":{"事件":[],"人物":[],"地點":[],"重點":[{"id":"kJpConf","lb":"荷日貿易衝突","sb":"徵稅問題→鎖國","nt":"原因：因徵稅問題，荷蘭與來臺日商發生爭執。經過：日本曾關閉荷蘭商館報復、多次協商後恢復貿易。結束：1633 年日本宣布「鎖國政策」（17世紀前期起；目標＝減少西方文化傳入後的衝突），日商退出東亞貿易，荷、日衝突不再；西班牙因而減少駐軍。（鎖國時期荷蘭獲准與日本貿易。）","cat":"重點","tb":"t6","era":""}],"主題":[{"id":"mJp","lb":"日本因素","sb":"高山國・鎖國","nt":"荷入臺前：日本稱臺灣為「高山國」；1593 派使臣來臺要求朝貢（無果）；1616 派船攻臺，少數登陸臺灣北部被原住民擊敗；日商購買中國絲綢、臺灣鹿皮。荷入臺後：因徵稅問題與荷衝突→1633 鎖國。","cat":"主題","tb":"","era":""}]}},{"id":"t15","y":1635,"lb":"1635 麻豆社之役","sb":"武力征服","nt":"荷蘭人聯合新港社，攻打反抗的麻豆社。結果：麻豆社被迫簽訂協定，接受荷蘭人統治。","tb":"","era":"nl","grp":{"事件":[],"人物":[],"地點":[{"id":"eMatou","lb":"麻豆社","sb":"武力征服的例子","nt":"反抗荷蘭人→1635 麻豆社之役被荷蘭人聯合新港社攻打→被迫簽訂協定，接受荷蘭人統治。","cat":"地點","tb":"jF","era":"nl"},{"id":"eSinkan","lb":"新港社","sb":"與荷結盟","nt":"新港社與荷人結盟，協助鎮壓其他部落和平定郭懷一事件（合作目的：藉荷蘭勢力提升自己地位、取得西式武器對付敵對部落）。","cat":"地點","tb":"","era":"nl"}],"重點":[{"id":"kCtrl","lb":"控制原住民","sb":"武力＋結盟＋地方會議","nt":"對抗：武力征服（聯合新港社攻打反抗的麻豆社→被迫簽約接受統治）。合作：部落藉荷人勢力提升地位、取得西式武器。行政控制：①地方會議（長老參與，推行政令；北部150、南部120、淡水18、卑南20村落）②司法：各社由授予手杖的長老統治、長老可行使司法權 ③行政：傳教士為統治原住民的行政官員。","cat":"重點","tb":"","era":"nl"}],"主題":[]}},{"id":"t16","y":1642,"lb":"1642 荷逐西班牙","sb":"西在臺16年結束","nt":"背景：①西班牙欲驅逐荷蘭人計畫無法完成 ②日本鎖國後，西班牙人對日貿易、傳教受阻 ③減少在臺駐軍。經過：1642 年荷人出兵驅離西班牙人，結束西班牙人在臺 16 年統治。","tb":"","era":"nl","grp":{"事件":[],"人物":[],"地點":[],"重點":[],"主題":[]}},{"id":"t17","y":1652,"lb":"1652 郭懷一事件","sb":"漢人抗荷","nt":"原因：荷人對漢人控制過嚴（苛捐雜稅）。爆發：1652 年郭懷一抗荷事件。此事件造成臺灣漢人死傷三千多名。","tb":"","era":"nl","grp":{"事件":[],"人物":[{"id":"eGuo","lb":"郭懷一","sb":"1652 抗荷","nt":"「荷蘭人的苛捐雜稅，實在不合理。讓我們一起來反抗荷蘭人的統治吧！」——1652 年郭懷一抗荷事件，臺灣漢人死傷三千多名。","cat":"人物","tb":"","era":"nl"}],"地點":[],"重點":[{"id":"kHan","lb":"招募漢人開墾","sb":"→控制過嚴→郭懷一","nt":"為增加稻米、糖產量，招募漢人來臺開墾。漢人反抗：①原因：荷人對漢人控制過嚴 ②爆發：1652 年郭懷一抗荷事件。","cat":"重點","tb":"","era":"nl"}],"主題":[]}},{"id":"t18","y":1661,"lb":"1661–1662 鄭成功攻臺","sb":"荷離臺・第一個漢人政權","nt":"1661 年：自鹿耳門登陸，圍攻熱蘭遮城。1662 年：荷蘭人被驅離臺灣（城主揆一開城投降）；荷蘭轉而與清帝國合作對付鄭氏政權。建立臺灣第一個漢人政權。","tb":"","era":"cheng","grp":{"事件":[{"id":"kAtk","lb":"鄭成功攻臺","sb":"反清復明・鹿耳門","nt":"反清復明：1646 鄭芝龍降清，其子鄭成功接續勢力，以金門、廈門為根據地持續反清。攻臺原因：為取得抗清所需的糧食與裝備，決定攻取「資源豐富且有戰略價值」的臺灣。經過：1661 自鹿耳門登陸、圍攻熱蘭遮城→1662 荷蘭人被驅離。","cat":"事件","tb":"t7","era":"cheng"}],"人物":[{"id":"kTrade","lb":"鄭經貿易","sb":"走私＋國際轉運","nt":"①中國走私貿易：清朝實施海禁→與當時英、日等合作取得中國商品；輸出蔗糖、鹿皮，輸入絲織品、瓷器、茶葉及日用品。②國際貿易：對象＝英國東印度公司、日本、東南亞；轉賣中國物品、取得軍火等物資；臺灣成為連結中國大陸、日本及東南亞各地的貿易轉運站。與英國簽訂通商條約的原因＝突破清廷經濟封鎖。","cat":"人物","tb":"t5","era":"cheng"},{"id":"eKox","lb":"鄭成功（父）","sb":"驅紅毛・國姓爺","nt":"攻下熱蘭遮城、城主「揆一」開城投降、驅離入侵福爾摩沙的荷蘭人。明末清初：銅銃鑄有「國姓爺」的「國」字、鑄有「永曆通寶」的銅錢在東南沿海流通。","cat":"人物","tb":"t7","era":"cheng"}],"地點":[],"重點":[{"id":"kGov","lb":"政經初建","sb":"承天府・軍屯・科舉","nt":"①行政：設承天府（今臺南市）為行政中心。②面臨海禁：清帝國為打擊鄭氏實施海禁。土地拓墾：為解決糧食問題積極開墾，採「寓兵於農」軍屯。漢人典章制度開始移植臺灣、舉行科舉、實施屯田軍屯、漢人文化從此在臺生根。","cat":"重點","tb":"t5","era":"cheng"},{"id":"kBlock","lb":"清廷圍堵鄭氏","sb":"海禁遷界・片板不許下海","nt":"清朝海禁（17世紀中期）：目標＝封鎖鄭氏政權。清順治至康熙年間：沿海居民向內地撤遷、「片板不許下海，粒貨不許越疆」；國姓爺使者在廈門遭逮捕（新政權清朝與鄭氏政權敵對）。對臺影響：鄭氏政權與中國進行走私貿易。統計圖：因實施海禁，造成（中國海外）貿易額減少。","cat":"重點","tb":"t6","era":""},{"id":"kAbCh","lb":"原住民的改變","sb":"宗教・文字・耕種","nt":"外來勢力入臺：宗教（荷＝基督新教、西＝天主教、鄭＝漢人信仰如媽祖與儒家文化）、文字（新港文）、經濟（游耕漁獵→定居耕種、梅花鹿銳減）面臨改變。例外：管轄之外的原住民（多為高山族群）仍維持原有生活，不受外來者影響。","cat":"重點","tb":"t8","era":""},{"id":"kDadu","lb":"中部大肚王","sb":"荷攻→受管轄；鄭時抗官","nt":"「大肚王」＝統轄中部平埔族群多個部落的共主。荷治：被荷人攻擊後，與一些部落接受荷人管轄，頭目受封賜，失去獨立性。鄭氏：因漢人侵墾壓縮生活空間、侵占土地、負擔沉重勞役→大肚王反抗／抗官（造成原住民嚴重傷亡）。","cat":"重點","tb":"jF","era":""},{"id":"eTun","lb":"軍屯地名","sb":"新營林鳳營・左營前鎮","nt":"寓兵於農的軍屯地名：①臺南市的新營、林鳳營 ②高雄市的左營、前鎮。","cat":"重點","tb":"","era":"cheng"}],"主題":[{"id":"mCkg","lb":"鄭氏政權","sb":"1662–1683（約20年）・明末清初","nt":"三代總結（秒懂關鍵句）：盤據東南「謀復明」→東征攻臺「驅紅毛」→漢人社會始「紮根」→兵敗「薙髮」終降清。漢人典章制度移植臺灣、漢人文化在臺生根。","cat":"主題","tb":"t7","era":"cheng"},{"id":"mAb","lb":"原住民與外來者","sb":"主題4・對抗／合作／改變","nt":"面對荷、西、鄭：有對抗（麻豆社、大肚王）也有合作（新港社、馬賽人）。結果：①外來勢力入臺，原住民生活及宗教面臨改變 ②也有保有原來文化未受影響者。","cat":"主題","tb":"t8","era":""}]}},{"id":"t19","y":1662,"lb":"1662–1683 鄭經時期","sb":"建設・貿易・文教","nt":"鄭經在臺推動各項建設、推動海外貿易；陳永華輔佐推展文教。","tb":"","era":"cheng","grp":{"事件":[],"人物":[{"id":"eJing","lb":"鄭經（子）","sb":"與清對抗・興孔廟・英國貿易","nt":"「中原王朝氣數已盡、文化傳承保留在海外、謀恢復故土」；長期與清朝對抗、接受建議興建孔廟、與英國貿易。","cat":"人物","tb":"t7","era":"cheng"},{"id":"eChen","lb":"陳永華（臣）","sb":"鄭家諸葛","nt":"「鄭家諸葛」——輔佐君王、推廣文化事業、內課農桑、外興貿易。鄭經時首建孔廟，推展文教。","cat":"人物","tb":"t7","era":"cheng"}],"地點":[],"重點":[{"id":"kEdu","lb":"文教發展","sb":"孔廟・典章制度","nt":"協助者：陳永華（在陳永華的協助下提倡文教）。①在今臺南市內興建首座孔廟——全臺首學 ②廟旁設明倫堂培育人才 ③在原住民部落設學校，原住民逐漸接受儒家文化。將漢人典章制度移植臺灣。觀念提示：流亡臺灣的知識分子沈光文（字文開）等人在民間講學、教授原住民。","cat":"重點","tb":"t7","era":"cheng"},{"id":"eKong","lb":"全臺首學（孔廟）","sb":"今臺南市","nt":"在今臺南市內興建的首座孔廟——「全臺首學」；廟旁設明倫堂培育人才。","cat":"重點","tb":"","era":"cheng"}],"主題":[]}},{"id":"t20","y":1683,"lb":"1683/1684 施琅攻臺・清帝國統治","sb":"鄭氏降清・臺入清版圖","nt":"1683 年清帝國派將施琅攻取臺灣，鄭克塽降清，結束鄭氏在臺約 20 年統治；1684 年臺灣首度納入中國版圖（隸福建省），清帝國統治開始。同年頒布渡臺禁令、鹿耳門設正港。清對原住民依「是否納稅、服勞役」分熟番／生番。","tb":"t18","era":"hist","grp":{"事件":[],"人物":[{"id":"eShi","lb":"施琅","sb":"1683 攻臺滅鄭・建議留臺","nt":"1683 年清帝國派將施琅攻取臺灣→鄭克塽降清；1684 年臺灣首度納入中國版圖。「棄留論」爭議中，施琅以戰略考量建議「留臺」，清廷採納。","cat":"人物","tb":"t18","era":""}],"地點":[],"重點":[{"id":"kFall","lb":"鄭克塽降清","sb":"政務廢弛→1683","nt":"①繼位：鄭經病逝後，幼子鄭克塽繼位（政務廢弛）。②衰亡：1683 年清帝國派將施琅攻取臺灣。③結束：鄭氏在臺約 20 年的統治；兵敗「薙髮」終降清。","cat":"重點","tb":"","era":"cheng"}],"主題":[]}}],"orphan":[]},{"ch":3,"name":"清帝國時期","years":[{"id":"t20","y":1683,"lb":"1683/1684 施琅攻臺・清帝國統治","sb":"鄭氏降清・臺入清版圖","nt":"1683 年清帝國派將施琅攻取臺灣，鄭克塽降清，結束鄭氏在臺約 20 年統治；1684 年臺灣首度納入中國版圖（隸福建省），清帝國統治開始。同年頒布渡臺禁令、鹿耳門設正港。清對原住民依「是否納稅、服勞役」分熟番／生番。","tb":"t18","era":"hist","grp":{"事件":[{"id":"k3Ban","lb":"渡臺禁令＋劃界封山","sb":"消極治臺・★常考","nt":"三大禁令一起記：①海禁（清初～1684，打擊鄭氏→走私興起，納臺後廢止）②渡臺禁令（1684～1875，限制移民：男子須先申請渡臺證照、不得攜眷→偷渡興盛、性別比例失衡）③劃界封山（1722～1875，避免漢原衝突：劃番界＝土牛、土牛溝、立碑，隔離漢原→侵墾興盛、番界往山區移動）。②③都在沈葆楨來臺後奏請放寬或廢止。合稱「為防臺而治臺」。","cat":"事件","tb":"t14","era":"qpre"}],"人物":[{"id":"eShi","lb":"施琅","sb":"1683 攻臺滅鄭・建議留臺","nt":"1683 年清帝國派將施琅攻取臺灣→鄭克塽降清；1684 年臺灣首度納入中國版圖。「棄留論」爭議中，施琅以戰略考量建議「留臺」，清廷採納。","cat":"人物","tb":"t18","era":""}],"地點":[{"id":"k3Guo","lb":"兩岸對渡貿易（開港前）","sb":"郊商主導・★常考","nt":"型態＝兩岸（對渡）貿易，對象以中國大陸為主。區域分工：輸出米、糖（長年豐收、足以外銷中國），輸入紡織品、藥材等日用品。商業組織＝「郊」（行郊）：商人為維護利益、避免惡性競爭而成立，並參與地方公共事務——依貿易區域分泉郊、廈郊，依商品分米郊、糖郊、布郊。","cat":"地點","tb":"t10","era":"qpre"},{"id":"e3Border","lb":"番界（土牛・土牛溝）","sb":"劃界封山的界線","nt":"在靠近山區地帶設「番界」，以土牛、土牛溝或立碑為界：嚴禁漢人入侵番界、不許漢人與原住民通婚、交易。實際上漢人越界開墾日益嚴重，番界一再往山區內移。","cat":"地點","tb":"t14","era":"qpre"},{"id":"e3Ports1","lb":"一府二鹿三艋舺","sb":"開港前三大港（南→北）","nt":"初期以鹿耳門為唯一合法正港，與廈門對渡通航；隨貿易量與移民增加，續開鹿港、八里坌→形成三大對渡港口：府城（今臺南市）→鹿港→艋舺。意義：順序由南向北，反映臺灣「由南向北」的開發歷程，也出現「正港」一說。","cat":"地點","tb":"t10","era":"qpre"}],"重點":[{"id":"k3Aband","lb":"棄留爭議→留臺","sb":"施琅建議・戰略考量","nt":"放棄派（許多大臣）理由：①臺灣小而無用、又是海盜聚集地，管理不易 ②非中國固有領土 ③增加政府財政負擔。保留派（施琅）理由：①物產豐富 ②戰略地位重要——可保東南沿海（屏障大陸東南沿海四省的門戶）。結果：康熙同意留下→納入版圖→隸福建省管轄；但因經費不足無法全力治理，只能「為防臺而治臺」。","cat":"重點","tb":"","era":"qpre"},{"id":"k3Mig","lb":"移民與性別失衡","sb":"閩粵為主・羅漢腳","nt":"福建（閩）、廣東（粵）人多耕地少→人口外移來臺。渡臺禁令不准攜眷→男多女少、人口比例失衡（俗諺「一個某，較贏三個天公祖」）。→部分男子與原住民女子通婚（「有唐山公，無唐山媽」）、入贅女方家、收養子女；部分男子無固定職業又沒結婚，被稱為「羅漢腳」，成為社會亂源。解決：沈葆楨來臺後取消渡臺禁令。","cat":"重點","tb":"t14","era":"qpre"},{"id":"e3Ronin","lb":"羅漢腳","sb":"渡臺禁令的副作用","nt":"渡臺禁令不准攜眷→形成一批無家眷、又沒固定工作的男子「羅漢腳」；為爭奪資源與利益常發生衝突，成為社會亂源（械鬥、民變的溫床）。","cat":"重點","tb":"t14","era":"qpre"},{"id":"e3Jiao","lb":"郊（行郊）","sb":"泉郊・廈郊／糖郊・布郊","nt":"商人為維護利益、避免惡性競爭成立的商業組織，也參與地方公共事務、支持民間活動、回饋地方。功能＝配運貨物、維護利益、避免惡性競爭。分類：依貿易區域分泉郊、廈郊；依貿易商品分米郊、糖郊、布郊。對渡對岸港口有福州五虎門、泉州蚶江（晉江）、廈門、漳州等。（開港後主導者換成洋行）","cat":"重點","tb":"t10","era":"qpre"}],"主題":[{"id":"m3Gov","lb":"開港前消極治臺","sb":"為防臺而治臺・★常考","nt":"與「開港後積極治臺」對稱的另一半：1684 納入版圖～1860 年代開港前，清廷治臺消極。棄留論→施琅建議留臺（戰略考量）。清帝國在西部陸疆積極進取，但海疆政策始終圍繞「禁」與「防」：渡臺禁令（對漢人，目的＝限制移民、防止動亂）＋劃界封山（對原住民，目的＝避免漢原衝突）——合稱「為防臺而治臺」。兩者都在牡丹社事件後由沈葆楨奏請廢除。","cat":"主題","tb":"t14","era":"qpre"}]}},{"id":"t20a","y":1721,"lb":"1721 朱一貴事件","sb":"三大民變①","nt":"官逼民反（吏治不良、會黨問題多）。行政區劃連動：事件後增彰化縣、淡水廳→一府四縣二廳（雍正）。","tb":"t12","era":"qpre","grp":{"事件":[],"人物":[],"地點":[],"重點":[{"id":"k3Adm1","lb":"行政區劃演變","sb":"事件驅動・★常考","nt":"原則：①以社會、經濟發展需求來設置和調整 ②在治安（發生民變）、國防（外力入侵）需要時才陸續增設。所以每次調整幾乎都由事件觸發：朱一貴事件→增彰化縣、淡水廳＝一府四縣二廳（雍正元年1723，1727 再增澎湖廳；乾隆52年林爽文事件後諸羅縣改名嘉義縣）；漢人移民漸增（吳沙開墾）＋海盜侵擾→噶瑪蘭廳（嘉慶17年／1812，前期最晚設立的行政區）；牡丹社事件＋北部崛起→1875 二府八縣四廳（增臺北府、恆春縣、卑南廳、埔里社廳）；清法戰爭→1885 建省、1887 三府一州十一縣三廳（中部增臺灣府＝省城，原臺灣府改臺南府，增臺東直隸州）。","cat":"重點","tb":"t9","era":""},{"id":"k3Fight","lb":"械鬥與民變","sb":"三大民變・★常考","nt":"械鬥原因：①結盟盛行（移民多為單身、缺乏家族依靠，同鄉同姓結盟結社）②利益衝突（爭奪水源、田地、商業利益）③依祖籍、姓氏集結→最頻繁的是閩粵械鬥與漳泉械鬥（漳州人有時聯合客家人抵抗泉州人）。民變＝民眾以武力反抗政府（抗官民變），原因：秘密結社盛行、官員良莠不齊、男女比例失衡社會浮動、官民利益摩擦。三大民變：朱一貴（1721）→林爽文（1786，規模最大）→戴潮春（1862，歷時最久）。俗諺「三年一小反，五年一大亂」。","cat":"重點","tb":"t12","era":"qpre"},{"id":"e3AdmSeq","lb":"區劃五階段口訣","sb":"3縣→4縣2廳→4縣3廳→2府8縣4廳→3府1州11縣3廳","nt":"只背數字與觸發事件：①康熙 一府三縣（1684 納入版圖）②雍正～乾隆 一府四縣二廳（朱一貴→彰化縣、淡水廳；1727 澎湖廳；林爽文→諸羅改嘉義）③嘉慶 一府四縣三廳（吳沙開墾＋海盜→噶瑪蘭廳）④1875 沈葆楨 二府八縣四廳（北部崛起→臺北府；牡丹社後→恆春縣、卑南廳、埔里社廳）⑤1887 劉銘傳 三府一州十一縣三廳（建省後中部增臺灣府＝省城、原臺灣府改臺南府、東部增臺東直隸州）。府數只增不減：1→1→1→2→3。","cat":"重點","tb":"t9","era":""}],"主題":[{"id":"m3Adm","lb":"行政區劃","sb":"一府三縣→…→建省三府","nt":"隸屬福建省（1885 建省後獨立為臺灣省）。五階段：康熙 一府三縣→雍正～乾隆 一府四縣二廳（朱一貴事件後增彰化縣、淡水廳；諸羅改嘉義）→嘉慶～同治 一府四縣三廳（噶瑪蘭廳）→1875 沈葆楨 二府八縣四廳（增臺北府、恆春縣等）→1887 劉銘傳 三府一州十一縣三廳（中部增臺灣府為省城）。","cat":"主題","tb":"t9","era":""}]}},{"id":"t20b","y":1731,"lb":"1731 大甲西社事件","sb":"平埔族群反抗","nt":"中部平埔族群（大甲西社）因勞役過重起而反抗，為清代規模最大的平埔族抗官事件。","tb":"jF","era":"qpre","grp":{"事件":[{"id":"e3Move4","lb":"平埔四次大遷移","sb":"蘭陽→埔里→花東","nt":"①中部平埔族群進入蘭陽平原開墾 ②中部平埔族群移墾埔里盆地 ③噶瑪蘭族遷至花、東等地 ④西拉雅族遷往花、東等地。方向：19世紀逐漸遷往宜蘭縣、埔里盆地和東部。","cat":"事件","tb":"jB","era":""}],"人物":[],"地點":[{"id":"e3Liugong","lb":"四大水圳","sb":"瑠公・八堡・貓霧捒・曹公","nt":"依時間順序記：①八堡圳——施世榜，1709 年興築、1719 年完工（康熙），濁水溪，彰化平原＝清代灌溉規模最大 ②貓霧捒圳——張達京，1733（雍正），大甲溪，臺中盆地＝原漢合作修築 ③瑠公圳——郭錫瑠父子，1740（乾隆），新店溪，臺北盆地＝臺北最重要的灌溉渠道 ④曹公圳——鳳山知縣曹謹，1837（道光），高屏溪，高雄地區＝官方主導興建。由南往北再往南，時間則是康熙→雍正→乾隆→道光。","cat":"地點","tb":"t15","era":"qpre"}],"重點":[{"id":"k3AbSoc","lb":"原住民社會變遷","sb":"平埔四次大遷移","nt":"平埔族（熟番）：生活受漢俗影響、亦接受官方管理；政府壓迫＝賦役繁重（除納稅還要服勞役）→多次抗官兵變（如1731大甲西社事件）；土地流失＝漢人透過買賣、交換、婚姻甚至欺騙取得，政府18世紀中葉下令禁止漢人承租買賣但成效有限；文化變遷＝被迫改漢姓、學漢字，學會水田耕作與合作開圳（如貓霧捒圳）；族群遷徙＝19世紀逐漸遷往宜蘭、埔里盆地和東部（四次大遷移）→傳統生活方式、語言與宗教信仰逐漸式微，多數融入漢人社會。高山族（生番）：生活區域不易進入、保留較多傳統文化，官府相對無法有效管治；開山撫番後受漢人入侵而遷往他處或更高山區，傳統文化面臨挑戰。","cat":"重點","tb":"t17","era":""}],"主題":[]}},{"id":"t20c","y":1786,"lb":"1786 林爽文事件","sb":"三大民變②・規模最大","nt":"清代臺灣規模最大的民變。官逼民反。","tb":"t12","era":"qpre","grp":{"事件":[],"人物":[],"地點":[],"重點":[],"主題":[]}},{"id":"t20d","y":1812,"lb":"1812 增設噶瑪蘭廳","sb":"一府四縣三廳（嘉慶）","nt":"嘉慶17年（1812）。原因：①漢人移民漸增（吳沙越界開墾蛤仔難）②沿海受海盜侵擾 → 增設噶瑪蘭廳，成一府四縣三廳。這是清帝國前期最晚設立的行政區（嘉慶～同治期間再無變動，直到牡丹社事件）。","tb":"t9","era":"qpre","grp":{"事件":[],"人物":[{"id":"e3Wusha","lb":"吳沙開墾蛤仔難","sb":"18世紀末・越界開墾（宜蘭）","nt":"18世紀末吳沙越過番界開墾蛤仔難（今宜蘭）——原漢衝突的例證，也促成 1812 嘉慶年間增設噶瑪蘭廳。","cat":"人物","tb":"t15","era":"qpre"}],"地點":[],"重點":[],"主題":[]}},{"id":"t20e","y":1858,"lb":"1858–1860年代 開港通商","sb":"英法聯軍→天津條約・★常考","nt":"1857 英法聯軍之役、1858（咸豐8年）天津條約先開放淡水、安平，後又增開雞籠（基隆）、打狗（高雄）→1860 年代臺灣正式開港通商。四口順序：先淡水、安平，後雞籠、打狗。臺灣史「開港通商前／後」的分界。","tb":"tOC","era":"qpost","grp":{"事件":[{"id":"e3Yingfa","lb":"通商問題→英法聯軍之役","sb":"1857・開港的起點","nt":"清帝國與英、法因通商問題（外國要求擴大通商、公使駐京等）交惡，1857 年爆發英法聯軍之役，清廷戰敗。這是臺灣被迫開港通商的起點——外力入侵四部曲的第一部。","cat":"事件","tb":"t19","era":"qpost"},{"id":"e3Tianjin","lb":"天津條約","sb":"1858・開港的法源","nt":"1857 英法聯軍之役後，清廷於 1858（咸豐8年）簽訂《天津條約》，先開放淡水、安平，後又增開雞籠、打狗。1860 年代臺灣正式開港通商，重新進入國際貿易市場。","cat":"事件","tb":"t19","era":"qpost"}],"人物":[{"id":"e3Makai","lb":"馬偕・馬雅各","sb":"北馬偕・南馬雅各・★常考","nt":"開港後西方宗教與文化再度傳入，以基督教「長老教會」最重要；影響＝現代醫學知識與新式教育傳入臺灣。馬偕（1844–1901，加拿大籍，北部，1872 年抵淡水傳教）：在淡水設醫館、建「理學堂大書院」（又稱牛津學堂，在今淡水真理大學內）、設「淡水女學堂」倡導女子教育（今淡江中學前身）。馬雅各（1836–1921，英國籍，南部，1865 年抵臺南傳教）：在府城看西街設立醫館，並成立臺灣第一間西醫醫院（新樓醫院，今臺南新樓醫院前身）。北馬偕、南馬雅各。","cat":"人物","tb":"tSoc","era":"qpost"}],"地點":[{"id":"k3OC","lb":"開港前 vs 開港後","sb":"清帝國時期的分水嶺・★常考","nt":"分界＝英法聯軍之役（1857）→天津條約（1858）→1860 年代正式開港通商。一句話：開港前「向內、向中國、消極防臺」，開港後「向外、向世界、積極治臺」。分三大領域記：①治臺政策——為防臺而治臺（渡臺禁令對漢人／劃界封山對原住民）、區劃由民變驅動 ⇒ 外力入侵轉趨積極（牡丹社→沈葆楨、清法→劉銘傳與建省）、區劃由國防驅動、政治軍事交通教育全面建設 ②農商發展與對外貿易——合資拓墾與水圳、對渡貿易（行郊、出口米糖、一府二鹿三艋舺）⇒ 國際貿易（洋行與買辦、出口茶糖樟腦、四口岸、1878 出超、經濟重心北移） ③社會文化變遷——械鬥民變、原鄉信仰與唐山祖、平埔土地流失與四次大遷移 ⇒ 定居社會與階層變動、西方醫療教育傳教（馬偕北／馬雅各南）、開山撫番後原漢關係更緊張。","cat":"地點","tb":"tOC","era":""},{"id":"k3Intl","lb":"國際貿易（開港後）","sb":"洋行主導・★常考","nt":"英法聯軍→清廷戰敗→臺灣開港通商，重新進入國際貿易市場。主導者＝外國商人在通商口岸設立的「洋行」，掌握臺灣進出口貿易（淡水有寶順、美利士、公泰等洋行）。洋行僱用漢人「買辦」處理商務，部分買辦成為新興商人——代表人物李春生。輸入：鴉片、紡織品；輸出：茶葉（第一）、蔗糖（第二）、樟腦（第三）。貿易對象擴及世界各國。","cat":"地點","tb":"t10","era":"qpost"},{"id":"e3Ports2","lb":"雞籠・淡水・安平・打狗","sb":"四個通商口岸","nt":"1858（咸豐8年）天津條約先開放淡水、安平，後又增開雞籠（基隆）、打狗（高雄），共四口；外人在臺設洋行、領事館。北部淡水（茶、樟腦）、南部安平打狗（蔗糖）分工明顯。","cat":"地點","tb":"t10","era":"qpost"},{"id":"e3Gods","lb":"開漳聖王・保生大帝・三山國王","sb":"漳州／泉州／潮州・★常考","nt":"漳州人＝開漳聖王；泉州人＝保生大帝、清水祖師；潮州人（多為客家）＝三山國王——考題常用神明反推移民祖籍。背景：拓墾過程充滿危機，移民在原鄉聚居的村莊建廟，供奉原鄉神明為守護神。","cat":"地點","tb":"t13","era":"qpre"}],"重點":[{"id":"k3Agr","lb":"農業拓墾","sb":"合資開墾＋水圳","nt":"土地來源：①自行占領無主地 ②向原住民承租 ③向政府申請墾照。拓墾方式：民間開墾為主，向官府申請墾照後開墾，因需龐大資金而多採「合資」共同拓墾（合資墾號以「金廣福」為代表）；墾戶按股份分配土地，留下臺南七股、苗栗頭份等地名。原漢衝突：漢人巧取強占原住民土地、違禁越過番界開墾（例證＝18世紀末吳沙越界開墾蛤仔難）→清廷數次重定番界，成效有限。水利：開墾者為求水源常合資興建水圳，擴大拓墾範圍、提高米糖產量，不僅自足還能銷往中國。","cat":"重點","tb":"t15","era":"qpre"},{"id":"k3Hakka","lb":"閩南人 vs 客家人","sb":"分布不同・同鄉聚居","nt":"閩南人：主要來自福建泉州及漳州，大多分布在平原。客家人：主要來自福建西部、廣東，北部客家人多分布丘陵（近山、不利水稻，多種甘蔗茶葉），南部客家人多分布平原；約占臺灣人口1/6，唱山歌、刻苦耐勞。地緣：為了互相照應，移民往往同鄉聚居——這也是後來械鬥依「祖籍別」爆發的原因。","cat":"重點","tb":"t12","era":"qpre"},{"id":"k3Rel","lb":"神明信仰","sb":"原鄉＋共同","nt":"背景：早期閩粵移民拓墾過程充滿危機，常在原鄉聚居的村莊建廟，供奉原鄉神明為守護神。原鄉神明（依祖籍）：漳州人＝開漳聖王；泉州人＝保生大帝、清水祖師；潮州人＝三山國王。共同信仰：媽祖、王爺、土地公；有應公廟＝祭祀孤魂野鬼。","cat":"重點","tb":"t13","era":"qpre"},{"id":"k3Clan","lb":"宗族組織・文風","sb":"唐山祖 vs 開臺祖","nt":"唐山祖（初期）＝同姓、不一定有血緣關係，共同祭祀中國大陸原鄉的祖先，費用靠集資；開臺祖（後期）＝同姓且有血緣關係，祭祀來臺開發的祖先，修族譜、建祠堂並以部分祖產作公費。文教風氣：早期移民忙於墾殖而不盛→後來興盛（人民經濟生活改善、官方及民間教育機構增設、官方與地方人士倡導）→通過科舉的人數逐年增加，18～19世紀文風日益興盛。","cat":"重點","tb":"t13","era":"qpre"},{"id":"k3West","lb":"西方文化再傳入","sb":"開港後・傳教士","nt":"傳播者＝傳教士，在臺建教堂傳福音，並以「醫療」與「教育」作為傳教方式，以基督教長老教會為主。（稱「再」傳入，是因為荷西時期已傳入一次，鄭氏、清前期中斷。）","cat":"重點","tb":"tSoc","era":"qpost"},{"id":"k3Hao","lb":"社會階層變動","sb":"豪族形成・客家提升","nt":"豪族形成：部分地主、郊商與政府合作，取得樟腦經營權致富，成為豪族。客家人地位提升：原本北部客家人多居丘陵、近山，不利水稻與甘蔗生產；開港後因茶葉、樟腦生產而致富，社會地位逐漸上升。","cat":"重點","tb":"tSoc","era":"qpost"},{"id":"e3Jin","lb":"金廣福墾號","sb":"合資墾號的代表・★常考","nt":"開墾需龐大資金，多由多人「合資」組成墾號向官府申請墾照，代表＝金廣福（閩粵合資，「金」取吉利、「廣」指廣東客家、「福」指福建閩南，共同開墾竹塹（今新竹）東南山區）。墾戶按出資股份分配土地，因此留下臺南七股、苗栗頭份這類以股份命名的地名。","cat":"重點","tb":"t15","era":"qpre"},{"id":"e3ExpSeq","lb":"出口商品演變","sb":"荷→鄭→清前→清後・★常考","nt":"大航海時代至清代的出口貿易一路演變：荷蘭時代＝稻米、蔗糖、鹿皮；鄭氏政權＝蔗糖、鹿皮（稻米改為軍需自用）；清代開港前＝稻米、蔗糖（兩岸對渡）；清代開港後＝茶、糖、樟腦（國際貿易）。記法：鹿皮在鄭氏後消失（鹿群枯竭），稻米在開港後被茶與樟腦取代，只有「糖」四個時期都在。","cat":"重點","tb":"tExp","era":""},{"id":"e3Tea","lb":"茶・糖・樟腦","sb":"出口三寶・★必考順序","nt":"茶葉（第一）：北部產，淡水出口，銷美國與東南亞，當時臺灣最大輸出商品。蔗糖（第二）：南部產，安平、打狗出口，銷中國、日本，歷史悠久的外銷商品。樟腦（第三）：中北部產，淡水出口，銷歐美各國，產量曾居世界第一。","cat":"重點","tb":"t16","era":"qpost"},{"id":"e3Common","lb":"媽祖・王爺・土地公","sb":"共同信仰","nt":"不分祖籍的共同信仰：媽祖、王爺、土地公；另有「有應公廟」祭祀無主的孤魂野鬼。由「原鄉信仰（依祖籍）」轉向「共同信仰」，是移墾社會走向定居社會的指標。","cat":"重點","tb":"t13","era":"qpre"}],"主題":[{"id":"m3Late","lb":"開港後積極治臺","sb":"外力入侵→建設・★常考","nt":"用「年代＋事件＋人物」成串背：1860年代英法聯軍→臺灣開港；1870年代牡丹社事件→沈葆楨；1880年代清法戰爭→劉銘傳、臺灣建省；1890年代甲午戰爭→乙未割臺。","cat":"主題","tb":"t19","era":"qpost"},{"id":"m3Eco","lb":"經濟發展","sb":"開港前 vs 開港後・★常考","nt":"前期＝農業拓墾＋對渡貿易（郊商）；開港後＝國際貿易（洋行）、經濟重心北移、入超轉出超。","cat":"主題","tb":"t10","era":""},{"id":"m3Soc","lb":"社會文化","sb":"移民社會的演變","nt":"來臺移民以福建（閩）＋廣東（粵）為主。性別失衡→械鬥民變多；信仰與宗族逐步在地化；文風漸興（舉人、進士漸多）；開港後西方文化傳入。","cat":"主題","tb":"t18","era":""},{"id":"m3Ab","lb":"原住民政策與社會","sb":"劃界封山→開山撫番","nt":"政策：前期劃界封山→牡丹社後沈葆楨開山撫番→劉銘傳擴大開山撫番、剿番。社會：平埔族土地文化流失→反抗、四次大遷移；高山族前期衝突不大、開山撫番後反抗或遷徙。","cat":"主題","tb":"t17","era":""}]}},{"id":"t20f","y":1862,"lb":"1862 戴潮春事件","sb":"三大民變③・歷時最久","nt":"同治元年（1862）戴潮春抗清事件，三大民變中歷時最久。官逼民反。","tb":"t12","era":"qpost","grp":{"事件":[],"人物":[],"地點":[],"重點":[],"主題":[]}},{"id":"t20f5","y":1871,"lb":"1871 琉球漂民事件","sb":"牡丹社事件的導火線","nt":"同治10年（1871）琉球船隻遭遇暴風，漂流至恆春；船員因語言不通與原住民發生衝突而遇害。這是三年後日本出兵的藉口。","tb":"t19","era":"qpost","grp":{"事件":[{"id":"k3Mudan","lb":"牡丹社事件","sb":"琉球問題・1874","nt":"日本藉琉球漂民事件出兵攻打牡丹社。影響：沈葆楨來臺建設、治臺轉趨積極、增臺北府、開山撫番。","cat":"事件","tb":"t11","era":"qpost"}],"人物":[],"地點":[{"id":"e3Fort","lb":"億載金城・海門天險","sb":"新式炮臺（防日／防法）","nt":"沈葆楨（牡丹社事件後・防日）：在安平、旗後架設新式炮臺——安平「二鯤鯓炮臺」即今臺南「億載金城」，旗後炮臺在今高雄旗津。劉銘傳（清法戰爭後・防法與列強）：在基隆等地修建西式炮臺——基隆「二沙灣炮臺」即今「海門天險」。用「防日／防法」記誰建哪座：億載金城＝沈葆楨、海門天險＝劉銘傳。","cat":"地點","tb":"t11","era":"qpost"}],"重點":[],"主題":[]}},{"id":"t20g","y":1874,"lb":"1874 牡丹社事件","sb":"沈葆楨來臺・轉趨積極","nt":"同治13年（1874）日本以「懲辦凶手」為藉口出兵臺灣南部，攻打牡丹社等部落。結果：雙方簽訂和約，清廷承認日本出兵為「保民義舉」→1879（光緒5年）日本正式併吞琉球。影響：①清廷派沈葆楨來臺加強防務，並從事各項改革 ②清廷治臺政策轉趨積極。","tb":"t19","era":"qpost","grp":{"事件":[],"人物":[],"地點":[],"重點":[{"id":"k3AbPol","lb":"原住民政策演變","sb":"劃界封山→開山撫番→剿番","nt":"前期＝劃界封山（隔離漢人與生番，清中期以前衝突不大；但隨漢人墾殖面積擴大，番界逐漸內移，高山族生存空間縮小）。轉捩點＝牡丹社事件（清廷為證明能在「番地」行使主權、阻止外人覬覦）→沈葆楨「開山撫番」：解除劃界封山、開闢通往後山（中央山脈以東）的北中南三條道路、鼓勵漢人開墾、東部設行政區→劉銘傳擴大開山撫番、設「番學堂」教化原住民，「撫番」變「剿番」。","cat":"重點","tb":"t11","era":""}],"主題":[]}},{"id":"t20g5","y":1875,"lb":"1875 沈葆楨改制","sb":"二府八縣四廳・增臺北府","nt":"光緒元年（1875）沈葆楨調整為「二府八縣四廳」。兩個方向：①北部崛起→增設臺北府（下轄淡水縣、新竹縣、宜蘭縣、基隆廳）——反映政經重心北移 ②牡丹社事件後為經營後山、鞏固主權→增設恆春縣、卑南廳、埔里社廳。","tb":"t9","era":"qpost","grp":{"事件":[],"人物":[{"id":"e3Shen","lb":"沈葆楨","sb":"牡丹社事件後來臺（同治・光緒）","nt":"牡丹社事件後以欽差大臣身分來臺加強防務。事蹟：①加強海防＝在安平（二鯤鯓炮臺＝億載金城）、旗後架設新式炮臺，並修築恆春城 ②廢除渡臺禁令與劃界封山，免費乘船前往臺灣、發給口糧耕具及種子 ③交通＝興築北、中、南三條通往山區與東部的道路：北路 蘇澳→花蓮（蘇花公路前身）、中路 林圯埔（今南投竹山）→八通關→璞石閣（今花蓮玉里）、南路 射寮（今屏東枋寮）→赤山→卑南（今臺東），並開山撫番、東部設行政區 ④1875 調整行政區劃為二府八縣四廳、增臺北府、在恆春設縣 ⑤基隆採煤。","cat":"人物","tb":"t11","era":"qpost"}],"地點":[],"重點":[],"主題":[]}},{"id":"t20h","y":1878,"lb":"1878 對外貿易出超","sb":"入超轉出超","nt":"開港後對外貿易大幅成長，茶、糖、樟腦出口暢旺（占出口值約94%），1878 年起臺灣對外貿易由入超轉為出超。","tb":"t16","era":"qpost","grp":{"事件":[],"人物":[],"地點":[{"id":"e3Dadao","lb":"大稻埕・大嵙崁","sb":"新興市鎮（茶葉帶動）","nt":"大稻埕（淡水河岸）＝茶葉加工與集散地，取代艋舺的商業地位；中北部近山新市鎮還有大嵙崁（今桃園市大溪區）、鹹菜甕（今新竹縣關西鎮）。","cat":"地點","tb":"t16","era":"qpost"}],"重點":[{"id":"k3Shift","lb":"政經重心北移","sb":"入超轉出超・大稻埕","nt":"茶、樟腦產地在中北部近山→帶動中北部市鎮興起（大嵙崁＝今桃園大溪、鹹菜甕＝今新竹關西）；淡水河岸的大稻埕成為茶葉加工與集散地，取代艋舺的商業地位；1878 入超轉出超（茶、糖、樟腦占出口值約94%）；連帶政治重心也北移（增臺北府）。","cat":"重點","tb":"t10","era":"qpost"}],"主題":[]}},{"id":"t20i","y":1884,"lb":"1884 清法戰爭","sb":"劉銘傳來臺・「西仔反」","nt":"光緒10年（1884）清廷與法國因越南問題爆發戰爭，戰火波及基隆、淡水、澎湖。臺灣人稱這場戰爭為「西仔反」（「西仔」＝法蘭西，「反」＝戰爭）。影響：清廷更加重視臺灣地位→1885 建省、劉銘傳為首任巡撫。","tb":"t19","era":"qpost","grp":{"事件":[{"id":"k3War","lb":"清法戰爭","sb":"越南問題・1884","nt":"起因＝越南問題。劉銘傳來臺督辦防務→1885 臺灣建省。","cat":"事件","tb":"t11","era":"qpost"}],"人物":[],"地點":[],"重點":[{"id":"e3Rail","lb":"鐵路・電報・郵政","sb":"劉銘傳的現代化建設","nt":"基隆↔新竹鐵路（加強島內聯繫）、電報線（發展對外交通、延伸至福州）、郵政總局、輪船航行於中國・臺灣與東南亞之間。","cat":"重點","tb":"t11","era":"qpost"},{"id":"e3School","lb":"西式學堂・番學堂","sb":"劉銘傳・培養人才／教化","nt":"創立西式學堂、電報學堂培養相關人才；另設「番學堂」試圖讓原住民接受漢文化。","cat":"重點","tb":"t11","era":"qpost"},{"id":"e3Viet","lb":"越南問題","sb":"清法戰爭的起因","nt":"清帝國與法國因越南的宗主權問題爆發衝突，1884 年清法戰爭開打，戰火波及基隆、淡水、澎湖（臺灣人稱「西仔反」）。結果促使清廷更重視臺灣→1885 建省。","cat":"重點","tb":"t19","era":"qpost"}],"主題":[]}},{"id":"t20j","y":1885,"lb":"1885 臺灣建省","sb":"首任巡撫劉銘傳","nt":"光緒11年（1885）清法戰爭後宣布臺灣建省，劉銘傳為首任巡撫。意義＝提升行政層級、增加自主權（不再隸屬福建省），並展開各項現代化建設。","tb":"t19","era":"qpost","grp":{"事件":[],"人物":[{"id":"e3Liu","lb":"劉銘傳","sb":"清法戰爭後・首任巡撫（光緒）","nt":"清法戰爭時來臺督辦防務，臺灣建省後任首任巡撫。事蹟：①軍事＝基隆「海門天險」、旗後「威震天南」等新式炮臺，設製造槍炮的工廠 ②交通＝購買輪船（航行於臺灣・中國大陸與東南亞之間）、架設電報線（遠達福州）、設郵政總局、修築基隆—臺北—新竹的鐵路（1891 光緒17年基隆↔臺北通車，1893 光緒19年臺北↔新竹通車，全線在後任巡撫邵友濂任內完成）③教育＝創立西式學堂、電報學堂，臺北市街裝設電燈 ④原住民＝擴大開山撫番、設番學堂，「撫番」變「剿番」⑤1887 三府一州十一縣三廳。經沈、劉建設後，臺灣已成當時中國相當進步的省分。","cat":"人物","tb":"t11","era":"qpost"}],"地點":[],"重點":[],"主題":[]}},{"id":"t20j5","y":1887,"lb":"1887 劉銘傳改制","sb":"三府一州十一縣三廳","nt":"光緒13年（1887）臺灣建省後，劉銘傳調整為「三府一州十一縣三廳」：中部增設臺灣府（省城所在，新設雲林縣、苗栗縣等），原臺灣府（南部）改稱臺南府，東部增設臺東直隸州——清代臺灣行政區劃的最終樣貌。三府＝臺北府、臺灣府、臺南府。","tb":"t9","era":"qpost","grp":{"事件":[],"人物":[],"地點":[],"重點":[],"主題":[]}},{"id":"t20k","y":1894,"lb":"1894 甲午戰爭","sb":"→1895 乙未割臺","nt":"清日甲午戰爭清敗→1895 馬關條約割讓臺灣。末代巡撫唐景崧。","tb":"t19","era":"qpost","grp":{"事件":[],"人物":[],"地點":[],"重點":[],"主題":[]}},{"id":"t21","y":1895,"lb":"1895 乙未割臺・日治開始","sb":"馬關條約","nt":"甲午戰敗→1895 馬關條約割讓臺灣（末代巡撫唐景崧；乙未年臺人抗日＝乙未割臺）。日治時期將原住民改稱：熟番→平埔族、生番→高砂族。","tb":"j3","era":"hist","grp":{"事件":[],"人物":[],"地點":[],"重點":[],"主題":[]}}],"orphan":[{"id":"e3Exam","lb":"鄭用錫・黃纘緒","sb":"新竹進士・宜蘭舉人","nt":"科舉制度下的臺灣文風實例：新竹進士鄭用錫宅第的「進士第」匾額、宜蘭舉人黃纘緒宅第的「文魁」匾額。清代通過科舉的人數逐年增加：康雍時期（1687–1735）舉人15、進士0；乾隆（1736–1795）56／2；嘉道（1796–1850）74／6；咸同光（1851–1894）106／21＝最多。","cat":"人物","tb":"t13","era":"qpre"}]},{"ch":4,"name":"日治時期","years":[{"id":"t21","y":1895,"lb":"1895 乙未割臺・日治開始","sb":"馬關條約","nt":"甲午戰敗→1895 馬關條約割讓臺灣（末代巡撫唐景崧；乙未年臺人抗日＝乙未割臺）。日治時期將原住民改稱：熟番→平埔族、生番→高砂族。","tb":"j3","era":"hist","grp":{"事件":[],"人物":[],"地點":[],"重點":[{"id":"k4S1","lb":"無方針主義","sb":"1895–1919・武官・殖民地特殊統治","nt":"又稱「殖民地特殊統治時期」。時間 1895–1919（總督為武官）。背景＝日本剛領有臺灣，抗日事件頻繁。目的＝漸進式統治、鎮壓反抗鞏固統治，採非同化政策。方式：①鎮壓各地武裝抗日 ②安撫——尊重臺灣人民的風俗習慣、籠絡人心以消除反抗意識。抗日代表＝1915 西來庵事件。結果：一次大戰後轉向同化政策。","cat":"重點","tb":"j1","era":"jp1"}],"主題":[{"id":"m4Pol","lb":"日治政治發展","sb":"抗日→治臺三階段・★常考","nt":"兩條線一起看：①臺人的反抗——武裝抗日（臺灣民主國、西來庵事件）→非武裝的政治社會運動→1937 後全面被禁 ②日本的統治——無方針主義（1895–1919，武官）→內地延長主義（1919–1937，文官）→皇民化運動（1937–1945，武官）。兩個轉折點：1919 一戰結束、1937 中日戰爭爆發。","cat":"主題","tb":"jZ","era":""}]}},{"id":"t30","y":1896,"lb":"1896 六三法","sb":"總督專制的法源・★常考","nt":"日本頒布「法律第六十三號」（簡稱六三法），授予臺灣總督頒布具有法律效力的命令（律令）之權——總督因此集行政、立法、司法及軍事大權於一身。","tb":"j2","era":"jp1","grp":{"事件":[],"人物":[],"地點":[{"id":"e4Line","lb":"隘勇線・蕃童教育所","sb":"圍堵＋教化","nt":"隘勇線＝在山區設置，限制原住民活動範圍，並以鐵絲電網圍堵，藉以取得山地資源。蕃童教育所＝設在部落的學校，教化原住民、引進現代文明，也是後來改變原住民傳統習俗（出草、文面、室內葬）的推手。另有招待部落首領赴日參觀以宣揚國力。","cat":"地點","tb":"j4","era":"jp1"}],"重點":[{"id":"k4Gov","lb":"總督專制（六三法）","sb":"集四大權於一身・★常考","nt":"1895 年日人在臺設立臺灣總督府，是日本在臺最高統治機構，以臺灣總督為首長。1896 年頒布「法律第六十三號」（六三法），授予總督頒布具法律效力命令的權力→總督集行政、立法、司法及軍事大權於一身。","cat":"重點","tb":"j2","era":"jp1"},{"id":"k4Ctrl","lb":"警察與保甲制度","sb":"「警察政治」・★常考","nt":"總督專制之外，地方靠「警察政治」＝警察制度＋保甲制度兩隻手。警察制度：目的＝鎮壓臺人反抗、加強地方控制；在各地廣設派出所；職務無所不管（鎮壓抗日分子、檢查衛生、宣傳政令），權力很大使人民畏懼，被稱為「大人」。保甲制度：目的＝配合警察；10戶1甲設甲長（類似鄰長）、10甲1保設保正（類似里長）；工作＝維護治安、嚴密監控社會、推動政務（調查戶口、宣達政令）；保甲中的青壯年男子組成「壯丁團」，協助救災與鎮壓抗日分子。成效：警察與保甲相互配合，建立堅實的統治基礎。","cat":"重點","tb":"j2","era":"jp1"},{"id":"k4AbEarly","lb":"初期安撫與圍堵","sb":"隘勇線・蕃童教育所","nt":"背景：總督府疲於壓制平地武裝抗日事件，對原住民先採防堵、安撫。作法：①安撫＝設置「隘勇線」限制原住民活動範圍 ②教化＝設學校（如「蕃童教育所」）教化原住民、引進現代文明 ③宣威＝集合部落首領赴日參觀，見識現代文明與武力，宣揚日本國力也攏絡原住民 ④圍堵＝運用軍警深入山區迫原住民降服，用鐵絲電網圍堵，藉以取得山地資源。結果：①文化衝擊——原住民傳統文化受到衝擊 ②部落衝突——部分接受教化的原住民幫助日本統治，引發部落內部摩擦與衝突。","cat":"重點","tb":"j4","era":"jp1"},{"id":"e4Law","lb":"六三法","sb":"法律第六十三號・1896","nt":"1896 年日本頒布「法律第六十三號」，授權臺灣總督頒布具有法律效力的命令（律令）→總督集行政、立法、司法及軍事大權於一身，是總督專制的法源。為什麼特殊：日本國內的立法權由帝國議會掌握，僅天皇能發布緊急命令代替法律；《六三法》等於把「立法權」下放給臺灣總督，因此賦予總督極大的權力。","cat":"重點","tb":"j2","era":"jp1"},{"id":"e4Bao","lb":"保甲・壯丁團","sb":"10戶1甲・10甲1保","nt":"來源：保甲是清代既有的地方自衛組織，日本沿用來輔佐警察與地方機構執行公共事務。編制：10 戶為 1 甲設甲長（類似鄰長）；10 甲為 1 保設保正（類似里長），並採「連坐法」——一人違法全甲同罰，因此監控特別嚴密。運作：保甲輔助警察執行地方行政事務（調查戶口、宣達政令）；保甲中的青壯年男子組成「壯丁團」，協助警察維護治安、救災與鎮壓抗日分子。","cat":"重點","tb":"j2","era":"jp1"},{"id":"e4Cop","lb":"警察「大人」","sb":"派出所・無所不管","nt":"總督府在各地廣設派出所。警察是地方行政的重要角色，職務無所不管：鎮壓抗日分子、檢查衛生、宣傳政令、調查戶口。權力很大使人民相當畏懼，被稱為「大人」。日治時期臺灣每萬人配置的警察人數比例在當時各地中最高。","cat":"重點","tb":"j2","era":"jp1"}],"主題":[{"id":"m4Rule","lb":"殖民統治體制","sb":"總督專制＋警察保甲","nt":"以臺灣總督府為最高統治機構，《六三法》授權總督頒布具法律效力的命令，總督集行政、立法、司法、軍事大權於一身。地方控制靠「警察制度」（各地廣設派出所，民眾稱之為「大人」）與「保甲制度」（10戶1甲設甲長、10甲1保設保正，青壯年男子組壯丁團），兩者相互配合，有效監控臺灣社會、穩固統治基礎。","cat":"主題","tb":"jD","era":"jp1"}]}},{"id":"t31","y":1899,"lb":"1899 成立臺灣銀行","sb":"統一發行貨幣","nt":"清帝國時期各國貨幣都可在臺流通、幣制混亂。1899 成立臺灣銀行統一發行貨幣，解決幣制問題，也提供日商前進南洋的資金。","tb":"j5","era":"jp1","grp":{"事件":[],"人物":[{"id":"e4Goto","lb":"後藤新平","sb":"民政長官・基礎建設主導者","nt":"日治初期的民政長官，主導臺灣的基礎建設：專賣制度拓展財源、戶口／土地／林野三大調查、統一貨幣與度量衡、交通建設。1898 年後臺灣財政逐漸獨立，不再依賴日本國庫補助。","cat":"人物","tb":"j5","era":"jp1"}],"地點":[{"id":"e4Rail","lb":"西部縱貫鐵路・基隆高雄港","sb":"1908 通車","nt":"陸運：1908 年完成基隆到高雄的西部縱貫鐵路——突破西部河川東西向、不利南北往來的地形限制，連結西部重要城鎮，成為南北交通動脈；另興建阿里山森林鐵路，是臺灣林業開發的見證。海運：整建基隆港（臺灣與日本聯絡的門戶）與高雄港（南部貨物主要進出港），有利南進政策。通訊：普設郵局（郵便局）、電報、電話。目的是便於殖民統治及獲取臺灣資源。","cat":"地點","tb":"jC","era":"jp1"}],"重點":[{"id":"k4Base","lb":"基礎建設","sb":"後藤新平・專賣與三大調查・★常考","nt":"主導＝民政長官後藤新平等人。①拓展財源：日治初期臺灣財政依賴日本國庫補助，總督府將鴉片、樟腦等列為專賣、獨占經營→財政收入大增（1898 年後財政逐漸獨立）②調查工作：1905 起定期舉辦人口普查（出現戶口調查簿）、土地調查（確定土地所有權以利徵稅，田賦收入增加）、林野調查（無主山林收歸國有，賣給資本家開發山林資源）③統一貨幣及度量衡：1899 成立臺灣銀行統一發行貨幣，並統一度量衡與日本一致，減少市場交易爭議 ④交通建設：1908 完成基隆到高雄的西部縱貫鐵路、興建阿里山森林鐵路，整建基隆港與高雄港（有利南進），普設郵局、電報、電話。結果：奠定臺灣日後工業化的發展基礎，提高日本企業的投資意願。","cat":"重點","tb":"jC","era":"jp1"},{"id":"e4Mono","lb":"專賣制度（鴉片・樟腦）","sb":"財政收入大增","nt":"1897 年起對鴉片施行專賣，之後陸續納入樟腦、菸、酒、鹽等物資，由總督府獨占經營，是日治初期最重要的財源，使臺灣財政收入大增、有助推動各項建設。注意：鴉片專賣與「漸禁」政策並行，這也是禁鴉片效果有限的原因之一。","cat":"重點","tb":"j5","era":"jp1"},{"id":"e4Bank","lb":"臺灣銀行","sb":"1899・統一發行貨幣","nt":"1899 年成立，發行統一貨幣「臺灣銀行券」，解決清帝國時期各國貨幣都可流通的幣制混亂問題，方便臺日之間資金流通，也提供日商前進南洋的資金。與統一度量衡並列為「統一貨幣及度量衡」的兩大措施。","cat":"重點","tb":"j5","era":"jp1"},{"id":"e4Survey","lb":"戶口・土地・林野調查","sb":"三大調查・★常考","nt":"①戶口調查：1905 年第一次人口普查，之後定期舉辦，利用警察深入調查，建立詳實人口資料（戶口調查簿）→有助統治與人力運用 ②土地調查：確定土地所有權以利徵稅，使田賦收入增加——但原住民無法證明土地產權，生活空間因此被壓縮 ③林野調查：無主山林收歸國有，部分賣給資本家開發森林資源。","cat":"重點","tb":"j5","era":"jp1"}],"主題":[{"id":"m4Eco","lb":"殖民經濟發展","sb":"農業臺灣→工業臺灣・★常考","nt":"先打基礎（後藤新平：專賣、戶口／土地／林野調查、統一貨幣與度量衡、交通建設），再分兩期：日治前期「農業臺灣、工業日本」（新式製糖、蓬萊米、嘉南大圳，供應日本國內民生需求）；1930 年代起「工業臺灣、農業南洋」（配合南進政策，日月潭電力、軍需工業、輕工業，臺灣轉為半農半工社會）。","cat":"主題","tb":"jC","era":""}]}},{"id":"t32","y":1905,"lb":"1905 首次人口普查","sb":"臺灣第一次戶口普查","nt":"1905 年總督府在臺實施第一次人口普查，之後定期舉辦；作法＝利用警察深入調查，建立詳實的人口資料（出現「戶口調查簿」＝戶口名簿），有助統治與人力運用。","tb":"j5","era":"jp1","grp":{"事件":[],"人物":[],"地點":[],"重點":[],"主題":[]}},{"id":"t33","y":1908,"lb":"1908 西部縱貫鐵路通車","sb":"基隆↔高雄","nt":"1908 年完成基隆到高雄的西部縱貫鐵路，強化西半部的連結；另興建阿里山森林鐵路。海運整建基隆港與高雄港（有利南進政策），通訊普設郵局、電報、電話。","tb":"j5","era":"jp1","grp":{"事件":[],"人物":[],"地點":[],"重點":[],"主題":[]}},{"id":"t34","y":1910,"lb":"1910–1915 五年理蕃計畫","sb":"武力征討・開發山林","nt":"1910 年代日本已大致控制臺灣社會，第五任總督佐久間左馬太開始「五年理蕃計畫」。目的：①讓全臺原住民歸順 ②開發山林資源。作法：土地公有、沒收槍械、武力鎮壓、強制勞役、驅離傳統領域、警察介入部落。","tb":"j4","era":"jp1","grp":{"事件":[],"人物":[],"地點":[],"重點":[{"id":"k4AbFive","lb":"五年理蕃計畫","sb":"1910起・武力征討・★常考","nt":"背景：1910 年代日本已大致控制臺灣社會（第五任總督佐久間左馬太）。目的：①企圖讓全臺原住民歸順 ②開發山林資源。作法：①土地公有——總督府將大部分土地收歸公有，限縮原住民生活空間 ②壓迫原住民——沒收槍械、武力鎮壓、強制勞役、驅離傳統領域 ③打通東西橫貫道路，建立開發東部的運輸幹線 ④透過教育同化使原住民歸順 ⑤警察介入——以權威統治介入原住民社會，並延續清末以來的制度，將部落領袖稱為「頭目」以方便管理。結果：山林資源被開發、林木與樟腦被掠奪；原住民被迫改變生活方式、以勞力換取生活物資；受山地警察欺凌、負擔過重勞役→引發對日統治的不滿（霧社事件的遠因）。","cat":"重點","tb":"j4","era":"jp1"}],"主題":[{"id":"m4Ab","lb":"理蕃政策與原住民","sb":"安撫圍堵→武力征討→教化","nt":"三階段：①日治初期＝安撫＋圍堵（設隘勇線限制活動、招待頭目赴日參觀、設蕃童教育所）②1910 起＝五年理蕃計畫，武力征討、開發山林資源 ③霧社事件後＝改採較溫和手段，加強教育與同化、將山區原住民「集團移住」遷往山下集中管理。","cat":"主題","tb":"jB","era":""}]}},{"id":"t35","y":1915,"lb":"1915 西來庵事件","sb":"漢人最後一次大規模武裝抗日","nt":"余清芳以宗教為名，在噍吧哖（今臺南市玉井區）組織群眾武裝抗日。結果：因缺乏訓練無法與日軍抗衡，多人失敗被捕。影響：臺人有鑑於武裝抗日犧牲慘重，轉以非武裝的政治、社會運動爭取權益。","tb":"jA","era":"jp1","grp":{"事件":[{"id":"k4Armed","lb":"漢人武裝抗日","sb":"終點＝1915 西來庵事件","nt":"日本接收臺灣後，臺灣漢人在各地發動抗日行動；最後一次大規模武裝抗日＝1915 年西來庵事件（余清芳，噍吧哖／今臺南玉井）。影響：武裝抗日犧牲慘重→臺人轉向非武裝的政治、社會運動爭取權益。","cat":"事件","tb":"jA","era":"jp1"}],"人物":[{"id":"e4Yu","lb":"余清芳・噍吧哖","sb":"西來庵事件・1915","nt":"余清芳以宗教（西來庵）為名組織群眾武裝抗日，地點在噍吧哖（今臺南市玉井區）。因缺乏訓練無法與日軍抗衡，多人失敗被捕。這是漢人最後一次大規模武裝抗日，之後轉向非武裝的政治社會運動。臺南有余清芳紀念碑。","cat":"人物","tb":"jA","era":"jp1"}],"地點":[],"重點":[],"主題":[]}},{"id":"t36","y":1918,"lb":"1918 一戰結束→1919 內地延長主義","sb":"民族自決・改派文官總督","nt":"第一次世界大戰（1914–1918）於 1918 年結束，美國總統威爾遜提出的「民族自決」思潮風行全球；日本自 1919 年起改採內地延長主義。日本改採「內地延長主義」：將臺灣視為日本「內地」的一部分、標榜「日臺合一」、改派文官總督（1919–1937）。目的＝避免臺灣人受風潮影響而追求自治、獨立。","tb":"j1","era":"jp2","grp":{"事件":[],"人物":[],"地點":[],"重點":[{"id":"k4S2","lb":"內地延長主義","sb":"1919–1937・文官・日臺合一","nt":"時間 1919–1937（改派文官總督）。背景＝一次大戰於 1918 年結束、「民族自決」思潮風行（各民族有權決定自身事務、不受他人干涉）。目的＝避免臺灣人受風潮影響而追求自治、獨立，改採同化政策。方式：①將殖民地視為「內地」（日本）的一部分 ②標榜「日臺合一」 ③日本部分國內法可施行於臺灣。抗日：漢人轉向非武裝的社會運動；原住民 1930 霧社事件。結果：臺灣人並未獲得與日本人相同的待遇——實際上仍存在差別待遇。","cat":"重點","tb":"j1","era":"jp2"}],"主題":[]}},{"id":"t37","y":1921,"lb":"1921 臺灣文化協會・議會請願","sb":"非武裝抗日的起點・★常考","nt":"1921 年林獻堂、蔣渭水等人成立「臺灣文化協會」（宗旨＝「謀臺灣文化之向上」）；同年展開「臺灣議會設置請願運動」（1921–1934，共請願15次，要求設立民選的臺灣議會、爭取立法權）。","tb":"j8","era":"jp2","grp":{"事件":[{"id":"k4Mov","lb":"文化啟蒙與政治社會運動","sb":"四大組織・1937 終止・★常考","nt":"背景：①世界潮流——第一次世界大戰後全世界流行「民族自決」思潮（美國總統威爾遜提出）②日本國內要求民主呼聲高漲，衝擊臺灣知識分子。四大組織：①臺灣文化協會（1921–1931，林獻堂、蔣渭水；發行《臺灣民報》、設讀報社、舉辦演講會與夏季學校；喚起臺人民族意識）②臺灣議會設置請願運動（1921–1934，林獻堂；共請願15次，要求設立民選的臺灣議會、爭取立法權；日本政府雖未採納，但激起臺人追求自治的想法）③臺灣民眾黨（1927–1931，蔣渭水；臺灣史上第一個合法政黨）④臺灣地方自治聯盟（1930–1937，林獻堂等人離開民眾黨另組；宣傳民權與地方自治→促成 1935 年總督府首次開放地方議員選舉）。結束：1937 中日戰爭爆發後被迫終止。","cat":"事件","tb":"j8","era":"jp2"},{"id":"e4Pet","lb":"議會設置請願運動","sb":"1921–1934・15次・林獻堂","nt":"由林獻堂、蔣渭水等人領導，1921–1934 年間共請願 15 次，訴求＝設立民選的「臺灣議會」、爭取立法權。結果：日本政府雖未採納，但激起臺人追求自治的想法、喚起政治意識。","cat":"事件","tb":"j8","era":"jp2"}],"人物":[{"id":"e4Lin","lb":"林獻堂・蔣渭水","sb":"社會運動兩大推手・★常考","nt":"林獻堂：臺中霧峰士紳，臺中中學校、臺灣文化協會、議會設置請願運動、臺灣地方自治聯盟的核心人物。蔣渭水：醫師，臺灣文化協會創辦人之一，1927 年成立臺灣民眾黨（第一個合法政黨），支持農工運動。記法：請願與自治聯盟＝林獻堂；民眾黨＝蔣渭水；文協＝兩人共同。","cat":"人物","tb":"j8","era":"jp2"}],"地點":[],"重點":[{"id":"e4Assoc","lb":"臺灣文化協會・臺灣民報","sb":"1921–1931・文化啟蒙","nt":"1921 年林獻堂、蔣渭水等人成立，宗旨＝「謀臺灣文化之向上」，推行啟迪民智的工作、喚醒臺人民族意識。內容：發行《臺灣民報》、設讀報社、舉辦演講會（文化演講）與夏季學校。1927 年因左傾分裂，蔣渭水另組臺灣民眾黨。","cat":"重點","tb":"j8","era":"jp2"},{"id":"e4Party","lb":"臺灣民眾黨","sb":"1927・第一個合法政黨・蔣渭水","nt":"1927 年蔣渭水成立，是臺灣史上第一個合法政黨（1927–1931）。理念與行動：提倡自由民權、破除社會惡習與迷信、反對吸食鴉片、積極支持農工運動。今日國道5號（蔣渭水高速公路）即以他的名字命名。霧社事件時曾致電國際聯盟，抗議日本使用毒瓦斯屠殺霧社人民。","cat":"重點","tb":"j8","era":"jp2"},{"id":"e4League","lb":"臺灣地方自治聯盟","sb":"1930–1937・促成1935選舉","nt":"1930 年林獻堂等人離開臺灣民眾黨後另組，主張宣傳民權與地方自治、爭取參政權。結果：促成 1935 年總督府首次開放（有限度的）地方議員選舉——臺灣民眾第一次行使投票權。意義：對自治、普選、參政權有了初步概念。","cat":"重點","tb":"j8","era":"jp2"}],"主題":[{"id":"m4Mov","lb":"政治社會運動","sb":"民族自決→四大組織・★常考","nt":"背景：1920 年代臺籍知識分子受國際「民族自決」風潮鼓舞，爭取臺人權益。四大組織按時間背：臺灣文化協會（1921–1931，文化啟蒙）→臺灣議會設置請願運動（1921–1934）→臺灣民眾黨（1927–1931，第一個合法政黨）→臺灣地方自治聯盟（1930–1937）。結束：1937 中日戰爭爆發後被迫終止。","cat":"主題","tb":"j8","era":"jp2"}]}},{"id":"t38","y":1922,"lb":"1922 蓬萊米問世","sb":"磯永吉・稻米外銷日本","nt":"磯永吉培育並種出符合日本人口味的「蓬萊米」，1922 年改良成功。結果：稻米產量增加，可大量銷往日本。","tb":"j6","era":"jp2","grp":{"事件":[{"id":"e4Erlin","lb":"二林事件","sb":"1925・蔗農抗爭・★常考","nt":"1925 年彰化二林的蔗農，為爭取甘蔗收購權益而與警察爆發衝突，多人遭逮捕判刑。背景：新式製糖會社限制蔗農的販售對象、又偷斤減兩壓低收購價。影響：此後開啟全島性的農民運動，也是臺灣農民組合成立的契機。","cat":"事件","tb":"","era":"jp2"}],"人物":[{"id":"e4Rice","lb":"蓬萊米・磯永吉","sb":"1922 改良成功","nt":"磯永吉培育並種出符合日本人口味的「蓬萊米」，1922 年改良成功。結果：稻米產量增加，可大量銷往日本。與新式製糖合稱日治前期「農業臺灣、工業日本」的兩大主力：米與糖。","cat":"人物","tb":"j6","era":"jp2"}],"地點":[],"重點":[{"id":"k4Agr","lb":"農業臺灣・工業日本","sb":"糖業王國・蓬萊米・嘉南大圳","nt":"日治初期採「農業臺灣、工業日本」的分工體系：改善臺灣的農業生產環境，供應日本工業化後的民生需求。①新式製糖業＝總督府扶持日本資本家設立新式製糖廠（以機械動力取代舊式糖廍），設糖業試驗所培育新品種、擴大蔗園面積→有「糖業王國」美譽；蔗農備受剝削，出現「第一憨，種甘蔗予會社磅」的俗諺 ②稻作改良＝磯永吉培育「蓬萊米」（1922 改良成功），稻米大量銷往日本 ③水利設施＝八田與一設計建造嘉南大圳（1930 完工），增加嘉南平原灌溉面積，稻米與甘蔗產量大增。","cat":"重點","tb":"j6","era":"jp1"},{"id":"e4Sugar","lb":"新式製糖業・糖業王國","sb":"第一憨種甘蔗予會社磅","nt":"總督府為提高蔗糖產量，扶持日本資本家設立新式製糖廠（以機械動力取代舊式糖廍），並設糖業試驗所培育新品種、擴大蔗園面積。結果：臺灣製糖蓬勃發展，有「糖業王國」美譽；但蔗農權益備受壓榨——被限制販售對象（只能賣給指定會社）、又遭偷斤減兩，出現「第一憨，種甘蔗予會社磅」的俗諺，並在 1925 年引發二林事件。","cat":"重點","tb":"jC","era":"jp1"}],"主題":[]}},{"id":"t38a","y":1925,"lb":"1925 二林事件","sb":"全島性農民運動的開端","nt":"彰化二林的蔗農爭取權益時與警察爆發衝突，多人遭逮捕判刑。影響：此後開啟全島性的農民運動，是「第一憨，種甘蔗予會社磅」這句俗諺最具體的事件。","tb":"","era":"jp2","grp":{"事件":[],"人物":[],"地點":[],"重點":[],"主題":[]}},{"id":"t39","y":1927,"lb":"1927 臺灣民眾黨","sb":"臺灣史上第一個合法政黨","nt":"蔣渭水成立臺灣民眾黨（1927–1931）——臺灣第一個合法政黨。他原是臺灣文化協會的專務理事，因文協左傾、理念不合而另組。主張：提倡自由民權、破除社會惡習與迷信、反對吸食鴉片、積極支持農工運動。","tb":"j8","era":"jp2","grp":{"事件":[],"人物":[],"地點":[],"重點":[],"主題":[]}},{"id":"t3a","y":1928,"lb":"1928 臺北帝國大學","sb":"日治時期臺灣最高學府","nt":"1928 年總督府設立「臺北帝國大學」（今臺灣大學前身），是日治時期臺灣最高學府、高等教育最具代表性者。但高等教育機構不足，有志升學者多前往日本留學。","tb":"j7","era":"jp2","grp":{"事件":[],"人物":[],"地點":[{"id":"e4Sch","lb":"小學校・公學校・蕃童教育所","sb":"初等教育三軌・★常考","nt":"小學校＝日本人就讀，課程與日本內地一致；公學校＝臺灣人就讀，以教授日語為主；蕃人公學校與蕃童教育所＝原住民就讀（教師多由日本警察擔任）。無論師資、設備均比不上小學校，有種種限制與不公平待遇。1941 年配合皇民化一律改稱「國民學校」，1943 年實施六年國民義務教育。","cat":"地點","tb":"j7","era":""},{"id":"e4TC","lb":"臺中中學校","sb":"1915・第一所專收臺人子弟","nt":"1915 年林獻堂等臺灣士紳集資成立，是第一所專收臺灣人子弟的中學（今臺中一中）。中等教育初期以招收日人為主；職業學校則培養醫師（醫學校）、公學校教師（師範學校）與初級技術人才。","cat":"地點","tb":"j7","era":"jp2"},{"id":"e4Univ","lb":"臺北帝國大學","sb":"1928・今臺灣大學","nt":"1928 年總督府設立，是日治時期臺灣最高學府（今臺灣大學前身）。因高等教育資源與名額不足、臺灣人升學不易（1928 年臺灣人就學率仍只有20%左右），經濟條件較優渥的臺灣人大多前往日本留學；這些留學生回臺後，扮演推動政治社會運動的主要角色。統計對照：高等學校學生日本人 220 人、臺灣人僅 28 人。","cat":"地點","tb":"j7","era":"jp2"}],"重點":[{"id":"k4Edu","lb":"差別待遇的殖民教育","sb":"小學校／公學校／蕃童教育所・★常考","nt":"原則＝差別待遇、隔離政策，同時建立西式教育制度。目的：①同化——作為同化臺灣人民及推動產業政策的工具 ②新知——讓臺灣人從教育中獲得現代知識。初等教育：小學校（日本人就讀，課程比照日本內地）／公學校（臺灣人就讀，以教授日語為主）／蕃童教育所（原住民就讀）——無論師資、設備均比不上小學校，有種種限制與不公平待遇；1941 年配合皇民化一律改稱「國民學校」，1943 年開始實施六年國民義務教育。中等教育：初期以招收日人為主；1915 年成立第一所專收臺人子弟的臺中中學校；職業學校培養醫師（醫學校）、公學校教師（師範學校）、初級技術人才。高等教育：1928 臺北帝國大學（今臺灣大學）最具代表性；因高等教育不足，臺人多前往日本留學。影響：1920 年代以後新的社會菁英階層逐漸崛起，成為日後政治、社會與文化運動的推手。","cat":"重點","tb":"j7","era":""},{"id":"k4Custom","lb":"移風易俗與現代觀念","sb":"放足斷髮・公共衛生・守時守法","nt":"臺灣三大陋習＝吸食鴉片、辮髮、纏足，總督府逐一「改革」。①放足斷髮、禁吸鴉片：放足斷髮最初消極（為避免臺人抗爭而未積極禁止），後來透過保甲制度與多方宣導、由士紳倡導放足剪辮，帶動「易服改裝」風氣；影響＝改變服飾風潮（衣服帽子變成歐美或日式，但漢日洋並存）、婦女得到解放（走出家庭，從事教師、護士、車掌等工作）；鴉片自 1897 年起施行專賣，初採消極的漸禁態度（吸食者持有許可證即可購買，未嚴加禁止），總督府藉專賣獲利，因而被批評「無根絕誠意」，後因知識分子反對而被迫改變作法（臺灣民眾黨曾致電國際聯盟，力陳鴉片之害、請臺人重視基本人權），但效果有限、鴉片並沒有絕跡。②建立公共衛生及醫療制度：原因＝有效防止臺灣傳染病肆虐；作法＝醫療建立西式醫院、辦理預防注射和接種（推廣疫苗對抗霍亂等傳染病），公共建造自來水與下水道等公共衛生設施；影響＝改善傳染病肆虐的環境、防疫保健衛生觀念逐漸普及、傳染病逐漸得到控制、死亡率大幅下降→人口快速成長，臺灣人的壽命獲得提升。③養成守法守時的觀念：守法＝將現代司法制度引進臺灣、各級地方法院設立，確立臺灣的司法制度；守時＝改用西曆，並為符合工業生產需要引進標準時間制（一天24小時）與一週七天的星期制，舉辦守時宣傳活動→民眾養成守時習慣、行政機關與交通逐漸遵守時間、開始重視放假與休閒活動（除政府機關與學校外，民間仍沿用農曆）。","cat":"重點","tb":"j9","era":"jp2"},{"id":"k4City","lb":"現代都市與休閒生活","sb":"都市計畫・百貨公司・棒球","nt":"都市出現：原因＝1920 年代以後人口增加與集中，總督府引進現代化都市計畫（建設道路、自來水、下水道等公共設施）→1940 年代臺灣形成臺北、高雄、臺南等大都市。休閒生活公共化：①總督府在各地建造公園、博物館 ②1930 年代臺北的菊元百貨與臺南的林百貨相繼落成，開臺灣百貨公司之先河——前往百貨公司「搭電梯」是當時民眾最時髦的活動；另有咖啡館、新式餐廳、博物館等休閒場所 ③總督府推廣棒球運動 ④媒體與休閒地點＝報紙、廣播、咖啡廳與劇院出現 ⑤日本文化流行（溫泉、料理、歌曲）⑥搭乘鐵路的長程旅遊觀光盛行——都市中各類休閒娛樂場所日漸普及：百貨公司、咖啡廳、泡溫泉、西餐廳。新舊文化的調適：日治時期引進現代文明，但並未使臺灣原有傳統風俗消失，總督府推行的新制度不完全落實於民間，使臺灣社會中漢人、日本與西洋文化並存。城鄉差距：現代化均出現於都市，鄉村和原住民部落則大致保留原來的生活型態。","cat":"重點","tb":"j9","era":"jp2"},{"id":"e4Foot","lb":"放足斷髮・漸禁鴉片","sb":"移風易俗・效果有限","nt":"放足斷髮：最初消極（為避免臺人抗爭而未積極禁止），後來由士紳倡導放足、剪辮。影響：①改變服飾風潮（漢、日、洋並存）②婦女得到解放，走出家庭從事教師、護士、車掌等工作。鴉片：初採消極的漸禁態度（管制吸食人口），後因知識分子反對而被迫改變作法，但效果有限、鴉片並沒有絕跡（總督府本身即以鴉片專賣為財源）。","cat":"重點","tb":"j9","era":"jp2"},{"id":"e4Hyg","lb":"公共衛生・自來水・西式醫院","sb":"傳染病受控・壽命提升","nt":"原因＝有效防止臺灣傳染病肆虐。作法：醫療＝建立西式醫院、辦理預防注射和接種；公共＝建造自來水、廁所等公共衛生設施。影響：①將現代化的經驗引進臺灣，改善傳染病肆虐的環境 ②防疫、保健、衛生觀念逐漸普及 ③傳染病逐漸得到控制，臺灣人的壽命獲得提升。","cat":"重點","tb":"j9","era":"jp2"},{"id":"e4Time","lb":"標準時間・星期制・司法制度","sb":"守時守法觀念","nt":"守時：為符合工業生產需要，引進標準時間制（一天24小時）與一週七天的星期制，並舉辦各種守時宣傳活動→民眾養成守時習慣、行政機關與交通逐漸遵守時間、開始重視放假與休閒；但除政府機關與學校外，民間仍沿用農曆。守法：將現代司法制度引進臺灣，各級地方法院設立，確立臺灣的司法制度，臺人養成守法觀念。","cat":"重點","tb":"j9","era":"jp2"}],"主題":[{"id":"m4Soc","lb":"日治社會與文化","sb":"差別教育・移風易俗・都市","nt":"教育＝差別待遇與隔離政策（小學校／公學校／蕃童教育所），但也建立西式教育制度、培養新的社會菁英。移風易俗＝放足斷髮、漸禁鴉片、公共衛生與醫療、守時守法觀念。都市＝1920年代起引進現代都市計畫，1940年代形成臺北、高雄、臺南等大都市，休閒生活公共化。","cat":"主題","tb":"jE","era":""}]}},{"id":"t3b","y":1930,"lb":"1930 霧社事件・嘉南大圳完工","sb":"原住民最大抗日・水利工程","nt":"1930 年賽德克族頭目莫那魯道率領族人在霧社起事，日方調動軍警並使用毒氣、飛機轟炸，原住民死傷慘重。同年八田與一設計建造的嘉南大圳完工，大幅增加嘉南平原的灌溉面積。","tb":"jA","era":"jp2","grp":{"事件":[{"id":"k4Wushe","lb":"霧社事件","sb":"1930・莫那魯道・★常考","nt":"時間 1930 年。原因：①日本開發山林資源並侵擾原住民部落 ②日軍強迫族人服勞役，又不尊重原住民文化。經過：賽德克族頭目莫那魯道率領族人襲殺日人；總督府出動軍警，使用大炮、飛機、毒氣鎮壓。結果：原住民死傷慘重；日本國內及國際輿論譴責（臺灣民眾黨曾致電國際聯盟，抗議「日本使用毒瓦斯屠殺霧社人民」），臺灣總督下臺。影響：①溫和手段——總督府改變統治手段，強調警察應善待原住民、注意教化山區的風俗文化 ②集團移住——將山區原住民集體遷往山下，影響部落組織型態。原民調適：知難以武力抗日，逐漸調適並接受教化；二戰後期部分原住民組成高砂義勇隊赴南洋作戰。","cat":"事件","tb":"j4","era":"jp2"}],"人物":[{"id":"e4Mona","lb":"莫那魯道・賽德克族","sb":"霧社事件領導者","nt":"1930 年賽德克族頭目莫那魯道率領族人在霧社襲殺日人。總督府以軍警、大炮、飛機與毒氣鎮壓，原住民死傷慘重；國際輿論譴責日本使用毒瓦斯，臺灣總督因此下臺。","cat":"人物","tb":"jF","era":"jp2"}],"地點":[{"id":"e4Canal","lb":"嘉南大圳・八田與一","sb":"1930 完工","nt":"八田與一設計建造，1930 年完工，是日治時期規模最大的水利工程。目的＝提升農業生產力。結果：增加嘉南平原的灌溉面積，使稻米、甘蔗產量增加，米、糖產量有助於供應日本的需求。與清代四大水圳對照：從民間合資走向殖民政府主導的大型工程。","cat":"地點","tb":"jC","era":"jp2"}],"重點":[{"id":"k4AbId","lb":"原住民社會演變與身分認同","sb":"以「族」區分・高砂義勇隊","nt":"①族群觀念改變：原先原住民只有部落意識；總督府派學者根據習俗、語言、分布等要素進行調查，以「族」來區分原住民→促使族群觀念發生變化。②傳統文化改變：透過「蕃童教育所」與警察，教育原住民接受現代禮儀與醫療等知識，強迫停止出草、文面與室內葬等習俗→改變原住民傳統的社會文化。③語言姓氏改變：原住民被要求改日姓、說日語；族群語言混雜日語，甚至姓名以日語發音；平埔族語言快速流失，只剩噶瑪蘭族等語言可在族內流通。④身分上的矛盾：原住民以部落為中心、無國族意識；太平洋戰爭時參加「高砂義勇隊」至南洋作戰，產生新的身分（日本兵）——對參戰有不同態度，有志願的，也有被迫的。","cat":"重點","tb":"jB","era":"jp3"},{"id":"e4Gaosha","lb":"高砂義勇隊","sb":"太平洋戰爭・赴南洋作戰","nt":"第二次世界大戰後期，部分原住民自願或受徵調組成「高砂義勇隊」前往南洋作戰，產生新的身分（日本兵）。這是原住民在霧社事件後「知難以武力抗日、逐漸調適並接受教化」的延伸結果。對參戰有不同態度：有志願的，也有被迫的。","cat":"重點","tb":"j10","era":"jp3"}],"主題":[]}},{"id":"t3c","y":1934,"lb":"1934 日月潭水力發電所完工","sb":"工業化的電力基礎","nt":"1934 年日月潭水力發電所完工，提供工業發展所需電力，是「工業臺灣、農業南洋」與南進基地化的關鍵建設；臺灣輕工業生產指數自此明顯上揚。","tb":"j6","era":"jp2","grp":{"事件":[],"人物":[],"地點":[{"id":"e4Power","lb":"日月潭水力發電所","sb":"1934 完工・工業化關鍵","nt":"1934 年完工，提供工業發展所需的電力，是「工業臺灣、農業南洋」與南進基地化最重要的建設。臺灣輕工業生產指數在 1934 年後明顯上揚——生產指數反映產業發展速度，指數愈高發展愈快。","cat":"地點","tb":"jC","era":"jp2"}],"重點":[{"id":"k4Ind","lb":"工業臺灣・農業南洋","sb":"1930年代・南進基地化","nt":"背景：1930 年代日本向外擴張，把臺灣設為南洋補給基地，在臺推動工業化。目標＝「工業臺灣、農業南洋」＝南進基地化。重大建設：①電力＝1934 日月潭水力發電所完工，提供工業發展的電力 ②軍需工業＝發展機械、石化、金屬、造船 ③輕工業＝紡織、食品加工（鳳梨罐頭）也顯著成長。影響：①奠定臺灣日後工業基礎，提供充足電力 ②臺灣逐漸從農業社會走向工業社會（轉成半農、半工的社會）。","cat":"重點","tb":"j6","era":"jp2"}],"主題":[]}},{"id":"t3d","y":1935,"lb":"1935 首次地方議員選舉","sb":"臺人第一次行使參政權・★常考","nt":"受臺灣地方自治聯盟推動，1935 年總督府首次開放（有限度的）地方議員選舉——臺灣民眾第一次行使投票權。限制：僅少數男性有投票權、半數席次仍由官派，並未落實真正的地方自治。","tb":"j8","era":"jp2","grp":{"事件":[],"人物":[],"地點":[],"重點":[],"主題":[]}},{"id":"t3e","y":1937,"lb":"1937 中日戰爭爆發・皇民化","sb":"社會運動全面被禁・★常考","nt":"1937 中日戰爭爆發（盧溝橋事變），日本推行皇民化運動（1937–1945），並配合南進政策。臺灣的政治社會運動受到打壓而被迫終止，總督改回武官。","tb":"j1","era":"jp3","grp":{"事件":[{"id":"k4S3","lb":"皇民化運動","sb":"1937–1945・武官・徹底同化","nt":"時間 1937–1945（總督改回武官）。背景：①1937 中日戰爭爆發（起於盧溝橋事變）②配合日本南進政策，1941 太平洋戰爭（起於珍珠港事變）。1936 年小林躋造總督來臺執行皇民化運動，臺灣進入戰時體制。目的＝戰爭需要充分動員人力物資，強化臺灣人對日本的愛國心，成為效忠天皇的子民。方式（七項）：說日語、改日姓、穿和服、拜神社、實行日本風俗與禮儀、徵召臺人從軍、部分臺籍婦女被迫充當「慰安婦」。抗日：社會運動均被禁止。戰爭實況：1941 年後美軍轟炸臺灣，西部縱貫公路、鐵路受損；學生的旅遊行程也改為參拜神社和到醫院慰問士兵。結果：日本戰敗投降（天皇「玉音放送」宣布終戰），中華民國接收臺灣。","cat":"事件","tb":"j1","era":"jp3"}],"人物":[],"地點":[],"重點":[],"主題":[]}},{"id":"t3f","y":1941,"lb":"1941 太平洋戰爭・國民學校","sb":"戰爭動員・取消小公學校差別","nt":"1941 年太平洋戰爭爆發（珍珠港事變）；美軍此後轟炸臺灣，西部縱貫公路與鐵路受損。同年配合皇民化運動，將小學校、公學校一律改稱「國民學校」，取消名稱上的差別（實質差別待遇仍在）。戰爭後期徵召臺人從軍、赴南洋作戰。","tb":"j7","era":"jp3","grp":{"事件":[],"人物":[],"地點":[],"重點":[],"主題":[]}},{"id":"t3g","y":1943,"lb":"1943 六年國民義務教育","sb":"臺灣最早的義務教育","nt":"1943 年開始實施六年國民義務教育——臺灣最早的義務教育，學齡兒童就學率大幅提升。","tb":"j7","era":"jp3","grp":{"事件":[],"人物":[],"地點":[],"重點":[],"主題":[]}},{"id":"t3h","y":1945,"lb":"1945 日本投降","sb":"日治結束・中華民國接收","nt":"1945 年日本戰敗投降，第二次世界大戰結束，臺灣結束日本 50 年的殖民統治，由中華民國接收。","tb":"","era":"jp3","grp":{"事件":[],"人物":[],"地點":[],"重點":[],"主題":[]}}],"orphan":[{"id":"k4Rep","lb":"臺灣民主國","sb":"抗拒接收・非追求獨立・★常考","nt":"背景：1894 清、日因朝鮮問題爆發甲午戰爭，1895 清帝國戰敗簽訂《馬關條約》，割讓臺灣、澎湖給日本；消息傳回臺灣後，官紳倡組「臺灣民主國」。目的＝效忠清朝、抗拒日本接收（並非追求獨立建國）。領導：推唐景崧為總統、丘逢甲為義軍統領、劉永福為大將軍。結果：兵力與武器不如日本，領導者先後離臺，民主國瓦解→臺灣進入日本 50 年的殖民統治。象徵物：「藍地黃虎旗」。","cat":"重點","tb":"jA","era":"jp1"},{"id":"e4Korea","lb":"朝鮮問題","sb":"甲午戰爭的起因・★常考","nt":"清帝國與日本因朝鮮的宗主權問題衝突，1894 年爆發甲午戰爭。這是「朝鮮問題→甲午戰爭→馬關條約→割讓臺澎→臺灣民主國」這條因果鏈的起點。","cat":"重點","tb":"t19","era":"jp1"},{"id":"e4Maguan","lb":"馬關條約","sb":"1895・割讓臺灣澎湖","nt":"1895 年清帝國於甲午戰爭戰敗，與日本簽訂《馬關條約》，割讓臺灣、澎湖給日本。消息傳回臺灣後，官紳倡組臺灣民主國抗拒接收；同年日本展開統治，臺灣進入 50 年的殖民時期。","cat":"事件","tb":"j3","era":"jp1"},{"id":"e4Tang","lb":"唐景崧・丘逢甲・劉永福","sb":"臺灣民主國三人組","nt":"唐景崧＝總統（清末代臺灣巡撫）；丘逢甲＝義軍統領；劉永福＝大將軍，抗拒日本接收臺灣。結果：三人先後離臺，民主國瓦解。象徵：「藍地黃虎旗」。","cat":"人物","tb":"jA","era":"jp1"}]}],"TABLES":{"t1":{"title":"史前文化分期比較","html":"<table>\n<tr><th></th><th style=\"color:var(--blue)\">舊石器時代</th><th style=\"color:var(--red)\">新石器時代</th><th style=\"color:var(--green)\">金屬器時代</th></tr>\n<tr><th>工具特色</th><td><span class=\"hb\">用火</span>、<span class=\"hl\">打製</span>石器</td><td><span class=\"hl\">磨製</span>石器、<span class=\"hb\">陶器</span></td><td>金屬器（<span class=\"hl\">鐵器</span>）</td></tr>\n<tr><th>食物來源</th><td>採集、漁獵</td><td>飼養家畜、<span class=\"hb\">種植作物</span></td><td><span class=\"hb\">種稻</span>、漁獵</td></tr>\n<tr><th>生活型態</th><td><span class=\"hb\">不定居</span>，居於山洞</td><td><span class=\"hb\">定居</span>，修築房屋</td><td><span class=\"hl\">貿易頻繁</span>，外來文物多</td></tr>\n<tr><th>代表遺址</th><td><span class=\"hb\">長濱</span>文化</td><td><span class=\"hb\">大坌坑、圓山、卑南</span></td><td><span class=\"hb\">十三行</span>文化</td></tr>\n</table>"},"t2":{"title":"史前遺址統整（秒懂關鍵字）","html":"<table>\n<tr><th>遺址</th><th>分期</th><th>關鍵字</th></tr>\n<tr><th>長濱</th><td style=\"color:var(--blue)\">舊石器晚期</td><td>採集漁獵、臺東長濱、<span class=\"hb\">已知用火</span></td></tr>\n<tr><th>大坌坑</th><td style=\"color:var(--red)\">新石器早期</td><td><span class=\"hl\">粗繩紋陶</span>、<span class=\"hb\">根莖類作物</span>、中國東南沿海有相似文化</td></tr>\n<tr><th>圓山</th><td style=\"color:var(--red)\">新石器晚期</td><td>臺北市、<span class=\"hl\">貝塚</span>（臺北湖證據）</td></tr>\n<tr><th>卑南</th><td style=\"color:var(--red)\">新石器晚期</td><td>臺灣東部、<span class=\"hl\">石板屋、石板棺</span>、陪葬<span class=\"hb\">玉器</span></td></tr>\n<tr><th>十三行</th><td style=\"color:var(--green)\">金屬器</td><td><span class=\"hl\">煉鐵作坊</span>、鐵渣、八里、<span class=\"hl\">干欄式住屋</span>、<span class=\"hb\">砥石</span>、種植穀物</td></tr>\n</table>"},"t3":{"title":"平埔族群 vs 高山各族","html":"<table>\n<tr><th></th><th>平埔族群</th><th>高山各族</th></tr>\n<tr><th>起源</th><td colspan=\"2\" style=\"text-align:center\"><span class=\"hl\">南島語族</span></td></tr>\n<tr><th>漢化程度</th><td>接觸早，<span class=\"hb\">漢化較深</span></td><td>接觸晚，<span class=\"hb\">漢化較淺</span></td></tr>\n<tr><th>分布區域</th><td><span class=\"hb\">西部及東北部</span>平原、丘陵</td><td><span class=\"hb\">山區與東部</span>地區</td></tr>\n<tr><th>稱呼</th><td><span class=\"hl\">熟番、平埔族</span></td><td><span class=\"hl\">生番、高砂族</span>、高山族、山地同胞</td></tr>\n<tr><th>代表</th><td><span class=\"hb\">西拉雅、凱達格蘭、噶瑪蘭</span></td><td><span class=\"hb\">邵、排灣、賽夏</span></td></tr>\n</table>"},"t4":{"title":"原住民稱呼演變","html":"<table>\n<tr><th style=\"width:26%\">時期</th><th>稱呼　<span style=\"font-weight:400;color:var(--green)\">綠＝平埔線</span>　<span style=\"font-weight:400;color:var(--orange)\">橘＝高山線</span></th></tr>\n<tr><th>清帝國</th><td><span style=\"color:var(--green);font-weight:600\">熟番</span>　／　<span style=\"color:var(--orange);font-weight:600\">生番</span><br><span style=\"color:var(--muted)\">依是否<span class=\"hb\">納稅、服勞役</span></span></td></tr>\n<tr><th>日治</th><td><span style=\"color:var(--green);font-weight:600\">平埔族</span>　／　<span style=\"color:var(--orange);font-weight:600\">高砂族</span></td></tr>\n<tr><th>中華民國</th><td><span style=\"color:var(--green);font-weight:600\">部分平埔族</span>（多未列入）　／　<span style=\"color:var(--orange);font-weight:600\">高山族</span>（山地同胞）</td></tr>\n<tr><th>民國83年</th><td>兩線合流→修憲正名，統稱「<span class=\"hl\">原住民族</span>」（現認定<span class=\"hb\">16族</span>）</td></tr>\n<tr><th colspan=\"2\" style=\"text-align:left\">每列都是<span style=\"color:var(--green)\">平埔在前</span>、<span style=\"color:var(--orange)\">高山在後</span>，直著念就是兩條演變線：<span style=\"color:var(--green)\">熟番➡平埔族➡部分平埔族</span>／<span style=\"color:var(--orange)\">生番➡高砂族➡高山族</span>。全部屬<span class=\"hb\">南島語族</span>。</th></tr>\n</table>"},"t5":{"title":"荷蘭・西班牙・鄭氏在臺統治比較","html":"<table>\n<tr><th></th><th style=\"color:var(--orange)\">荷蘭</th><th style=\"color:var(--red)\">西班牙</th><th style=\"color:var(--green)\">鄭氏</th></tr>\n<tr><th>時間</th><td>1624～1662年（<span class=\"hb\">38年</span>）</td><td>1626～1642年（<span class=\"hb\">16年</span>）</td><td>1662～1683年（<span class=\"hb\">約20年</span>）</td></tr>\n<tr><th>亞洲總部／地區</th><td><span class=\"hb\">巴達維亞</span>（雅加達）・<span class=\"hl\">南部</span></td><td><span class=\"hb\">馬尼拉</span>（菲律賓）・<span class=\"hl\">北部</span></td><td>臺灣</td></tr>\n<tr><th>來臺目的</th><td>貿易、傳播<span class=\"hl\">基督教</span></td><td>貿易、傳播<span class=\"hl\">天主教</span></td><td>建立<span class=\"hl\">反清復明</span>根據地</td></tr>\n<tr><th>在臺建城</th><td>•<span class=\"hb\">熱蘭遮城</span>（大員）<br>•<span class=\"hb\">普羅民遮城</span>（赤崁）<br>•今<span class=\"hb\">淡水紅毛城</span></td><td><span class=\"hb\">聖薩爾瓦多城</span>（基隆）、<span class=\"hb\">聖多明哥城</span>（淡水）</td><td><span class=\"hb\">承天府</span>（臺南）</td></tr>\n<tr><th>統治原住民</th><td>•鎮壓反抗↔與歸順者結盟<br>•定期召開<span class=\"hl\">地方會議</span>，授予各社長老權杖，間接統治<br>•創制<span class=\"hl\">新港文</span></td><td>•鎮壓反抗➡安撫歸降<br>•建教堂、傳播天主教</td><td>•漢人拓墾入侵原住民空間<br>•要求原住民負擔勞役<br>•設學校，教導<span class=\"hl\">儒家文化</span></td></tr>\n<tr><th>原住民經濟</th><td>游耕、狩獵（捕鹿➡荷蘭透過漢原交易取得<span class=\"hb\">鹿皮</span>）</td><td>游耕、狩獵</td><td>開始學習漢人農耕技術➡逐漸以<span class=\"hb\">耕種</span>為務</td></tr>\n<tr><th>土地拓墾</th><td>招募漢人來臺種<span class=\"hb\">稻米、甘蔗</span></td><td>—</td><td><span class=\"hl\">軍屯</span>最重要</td></tr>\n<tr><th>對外貿易</th><td>對象：中國、日本、東南亞<br>出口：<span class=\"hl\">稻米、蔗糖、鹿皮</span>；進口：絲綢、瓷器、香料<br>➡<span class=\"hb\">轉口貿易獲利可觀</span></td><td>對象：中國、東南亞、日本（<span class=\"hb\">鎖國後中斷</span>）</td><td>對象：中國（<span class=\"hl\">走私貿易</span>）、日本、<span class=\"hl\">英國</span>、東南亞<br>出口：<span class=\"hl\">蔗糖、鹿皮</span>；進口：<span class=\"hb\">軍需品、布匹</span><br>➡使鄭氏政權穩定在臺發展</td></tr>\n<tr><th>退出臺灣</th><td>被<span class=\"hb\">鄭成功</span>驅逐</td><td>被<span class=\"hb\">荷蘭人</span>驅逐</td><td><span class=\"hb\">施琅</span>攻臺、鄭克塽出降</td></tr>\n</table>"},"t6":{"title":"明・清・日閉關自守政策比較（跨冊）","html":"<table>\n<tr><th></th><th style=\"color:var(--blue)\">明帝國海禁</th><th style=\"color:var(--orange)\">清帝國海禁</th><th>日本鎖國令</th></tr>\n<tr><th>實施時間</th><td><span class=\"hb\">14～16世紀</span></td><td><span class=\"hb\">17世紀後期</span></td><td><span class=\"hb\">1633～1854年</span></td></tr>\n<tr><th>實施背景</th><td><span class=\"hl\">防範倭寇</span>侵沿海地區</td><td><span class=\"hl\">封鎖鄭氏的經濟來源</span></td><td><span class=\"hl\">西方文化</span>與日本傳統衝突</td></tr>\n<tr><th>對臺影響</th><td>臺灣成為<span class=\"hb\">海商活動據點</span></td><td>鄭經採<span class=\"hb\">走私貿易</span>突破</td><td>西班牙<span class=\"hb\">減少駐臺守軍</span></td></tr>\n<tr><th>結束</th><td>16世紀後期<span class=\"hb\">部分開海</span></td><td><span class=\"hb\">1684年</span>將臺灣納入版圖</td><td>美國軍艦叩關（<span class=\"hl\">黑船事件</span>）</td></tr>\n</table>"},"t7":{"title":"鄭氏時期的重要人物","html":"<table>\n<tr><th>人物</th><th>身分</th><th>關鍵事蹟</th></tr>\n<tr><th style=\"color:var(--green)\">鄭成功</th><td>父</td><td>攻下<span class=\"hb\">熱蘭遮城</span>、城主<span class=\"hl\">揆一</span>開城投降、驅離入侵福爾摩沙的荷蘭人</td></tr>\n<tr><th style=\"color:var(--green)\">鄭經</th><td>子</td><td>謀恢復故土、長期與清朝對抗、接受建議興建<span class=\"hl\">孔廟</span>、與<span class=\"hb\">英國</span>貿易</td></tr>\n<tr><th style=\"color:var(--green)\">陳永華</th><td>臣</td><td>「<span class=\"hl\">鄭家諸葛</span>」——輔佐君王、推廣文化事業、<span class=\"hb\">內課農桑、外興貿易</span></td></tr>\n</table>"},"t8":{"title":"大航海時代原住民與外來者的互動","html":"<table>\n<tr><th></th><th style=\"color:var(--orange)\">荷蘭</th><th style=\"color:var(--red)\">西班牙</th><th style=\"color:var(--green)\">鄭氏</th></tr>\n<tr><th>主要互動族群</th><td>西南部平埔族群（<span class=\"hl\">西拉雅族</span>為主）</td><td>北臺灣平埔族群（<span class=\"hb\">凱達格蘭族</span>為主）</td><td><span class=\"hl\">中部平埔族群</span>（<span class=\"hl\">大肚王</span>統轄部落）</td></tr>\n<tr><th>武力反抗</th><td><span class=\"hb\">麻豆社之役</span></td><td>雞籠、淡水原住民均曾反抗</td><td><span class=\"hb\">大肚王反抗</span>（因漢人侵墾）</td></tr>\n<tr><th>經濟變遷</th><td colspan=\"3\">•外來者以鹿皮作為貿易商品➡原住民大量捕鹿➡<span class=\"hl\">梅花鹿數量大量減少</span><br>•游耕、漁獵➡<span class=\"hl\">定居耕種</span>（尤其漢人帶來水田耕作技術）</td></tr>\n<tr><th>文化變遷</th><td colspan=\"2\">傳統信仰➡西方宗教（<span class=\"hb\">基督新教、天主教</span>）</td><td>傳統信仰➡<span class=\"hb\">漢人信仰</span>（例：媽祖）</td></tr>\n<tr><th>例外</th><td colspan=\"3\">管轄之外的原住民（多為<span class=\"hl\">高山族群</span>）仍維持原有生活，不受外來者影響</td></tr>\n</table>"},"t9":{"title":"清帝國在臺行政區劃的調整（五階段）","html":"<table>\n<tr><th>時期</th><th>區劃</th><th>新增／改名的行政區</th><th>調整原因</th></tr>\n<tr><th>①康熙時期<br>康熙23年 1684</th><td><span class=\"hl\">一府三縣</span></td><td><span class=\"hb\">臺灣府</span>；臺灣縣、鳳山縣、諸羅縣</td><td>納入版圖，隸<span class=\"hb\">福建省</span></td></tr>\n<tr><th>②雍正～乾隆<br>1723・1727・1787</th><td>一府<span class=\"hb\">四縣二廳</span></td><td>增<span class=\"hl\">彰化縣、淡水廳</span>（雍正元年1723）、澎湖廳（雍正5年1727）；諸羅縣改名<span class=\"hl\">嘉義縣</span>（乾隆52年1787）</td><td><span class=\"hb\">朱一貴事件</span>後加強統治；<span class=\"hb\">林爽文事件</span>時諸羅縣民守城有功→改名「嘉義」</td></tr>\n<tr><th>③嘉慶～同治<br>嘉慶17年 1812</th><td>一府<span class=\"hb\">四縣三廳</span></td><td>增<span class=\"hl\">噶瑪蘭廳</span>（前期最晚設立的行政區）</td><td>漢人移民漸增（<span class=\"hb\">吳沙</span>開墾蛤仔難）、沿海受<span class=\"hb\">海盜</span>侵擾</td></tr>\n<tr><th>④沈葆楨時期<br>光緒元年 1875</th><td><span class=\"hb\">二府八縣四廳</span></td><td>北部崛起→增<span class=\"hl\">臺北府</span>（淡水縣、新竹縣、宜蘭縣、基隆廳）；牡丹社事件後→增<span class=\"hl\">恆春縣、卑南廳、埔里社廳</span></td><td><span class=\"hb\">牡丹社事件</span>後加強防務、經營後山</td></tr>\n<tr><th>⑤劉銘傳時期<br>光緒13年 1887</th><td><span class=\"hl\">三府一州十一縣三廳</span></td><td>中部增設<span class=\"hl\">臺灣府</span>（省城；雲林縣、苗栗縣等），原臺灣府改稱<span class=\"hb\">臺南府</span>；東部增<span class=\"hl\">臺東直隸州</span></td><td><span class=\"hb\">清法戰爭</span>後、光緒11年（1885）<span class=\"hl\">臺灣建省</span></td></tr>\n<tr><th>開發重心</th><td>集中在<span class=\"hb\">中南部平原</span></td><td>開發往<span class=\"hb\">北部</span>發展</td><td>拓墾範圍擴及<span class=\"hb\">東北部</span>（宜蘭）</td><td colspan=\"2\">政經重心<span class=\"hl\">北移</span>（臺北府→省城）</td></tr>\n<tr><th colspan=\"4\" style=\"text-align:left\">原則：①依社會、經濟發展需求設置調整 ②在<span class=\"hl\">治安（民變）</span>、<span class=\"hl\">國防（外力入侵）</span>需要時才增設<br>口訣（府數只增不減 1→1→1→2→3）：<span class=\"hl\">3縣 → 4縣2廳 → 4縣3廳 → 2府8縣4廳 → 3府1州11縣3廳</span></th></tr>\n</table>"},"t10":{"title":"清帝國時期臺灣貿易活動的比較","html":"<table>\n<tr><th>分期</th><th style=\"color:var(--blue)\">開港通商前</th><th style=\"color:var(--orange)\">開港通商後</th></tr>\n<tr><th>主要型態</th><td><span class=\"hl\">兩岸貿易</span>（對渡）</td><td><span class=\"hl\">國際貿易</span></td></tr>\n<tr><th>貿易對象</th><td>中國大陸為主</td><td>中國大陸、<span class=\"hb\">世界各國</span></td></tr>\n<tr><th>重要市鎮</th><td>對渡港口（海港、河港）：最初<span class=\"hl\">鹿耳門</span>（唯一合法正港）；發展為<span class=\"hb\">一府二鹿三艋舺</span></td><td>通商口岸：<span class=\"hb\">雞籠、淡水、安平、打狗</span></td></tr>\n<tr><th>出口商品</th><td>稻米、蔗糖</td><td><span class=\"hl\">茶葉、蔗糖、樟腦</span></td></tr>\n<tr><th>進口商品</th><td>紡織品、藥材、日用品</td><td><span class=\"hb\">鴉片</span>、紡織品</td></tr>\n<tr><th>商業組織</th><td><span class=\"hl\">郊</span>（行郊：泉郊、廈郊／<span class=\"hb\">米郊</span>、糖郊、布郊）</td><td><span class=\"hl\">洋行</span></td></tr>\n<tr><th>影響</th><td>「<span class=\"hb\">正港</span>」一說的出現</td><td><span class=\"hl\">政經中心北移</span>、1878 入超轉出超、<span class=\"hb\">大稻埕</span>崛起</td></tr>\n</table>"},"t11":{"title":"沈葆楨 vs 劉銘傳","html":"<table>\n<tr><th></th><th>沈葆楨</th><th>劉銘傳</th></tr>\n<tr><th>來臺背景</th><td><span class=\"hl\">牡丹社事件</span>後（1874）</td><td><span class=\"hl\">清法戰爭</span>後（1884）・<span class=\"hb\">建省首任巡撫</span></td></tr>\n<tr><th>原住民</th><td><span class=\"hl\">開山撫番</span></td><td>擴大開山撫番、<span class=\"hb\">剿番</span></td></tr>\n<tr><th>建設</th><td>增<span class=\"hb\">臺北府</span>、調整行政區、廢渡臺禁令</td><td>西式炮臺、<span class=\"hb\">電報線、郵政、鐵路</span></td></tr>\n</table>"},"t12":{"title":"械鬥與三大民變","html":"<table>\n<tr><th>類型</th><th>內容</th></tr>\n<tr><th>械鬥</th><td>移民爭利益，以<span class=\"hl\">閩粵、漳泉（祖籍別）</span>最盛</td></tr>\n<tr><th>三大民變</th><td><span class=\"hl\">朱一貴（1721）→ 林爽文（1786，規模最大）→ 戴潮春（1862，歷時最久）</span></td></tr>\n<tr><th>共同背景</th><td><span class=\"hb\">官逼民反</span>（吏治不良、會黨問題多）</td></tr>\n</table>"},"t13":{"title":"漢人的社會與文教（宗教・宗族・文教）","html":"<table>\n<tr><th colspan=\"7\" class=\"grp\">宗教信仰</th></tr>\n<tr><th style=\"width:12%\">背景</th><td colspan=\"6\">早期來臺的<span class=\"hb\">閩、粵</span>移民，拓墾過程充滿危機；常在<span class=\"hl\">原鄉聚居</span>的村莊建廟，供奉原鄉神明為守護神</td></tr>\n<tr><th>原鄉神明<br>（依祖籍）</th><td colspan=\"2\"><b>漳州人</b><br><span class=\"hl\">開漳聖王</span></td><td colspan=\"2\"><b>泉州人</b><br><span class=\"hl\">保生大帝、清水祖師</span></td><td colspan=\"2\"><b>潮州人</b><br><span class=\"hl\">三山國王</span></td></tr>\n<tr><th>共同信仰</th><td colspan=\"6\"><span class=\"hb\">媽祖、王爺、土地公</span>；<span class=\"hl\">有應公廟</span>＝祭祀孤魂野鬼</td></tr>\n<tr><th colspan=\"7\" class=\"grp\">宗族組織</th></tr>\n<tr><th>分類</th><td colspan=\"3\" style=\"text-align:center;color:var(--blue);font-weight:600\">唐山祖</td><td colspan=\"3\" style=\"text-align:center;color:var(--orange);font-weight:600\">開臺祖</td></tr>\n<tr><th>時間</th><td colspan=\"3\" style=\"font-weight:600\">初期</td><td colspan=\"3\" style=\"font-weight:600\">後期</td></tr>\n<tr><th>成員</th><td colspan=\"3\">同姓、<span class=\"hl\">不一定有血緣</span>關係</td><td colspan=\"3\">同姓，<span class=\"hl\">有血緣</span>關係</td></tr>\n<tr><th>祭祀對象</th><td colspan=\"3\">共同祭祀<span class=\"hb\">中國大陸原鄉</span>的祖先</td><td colspan=\"3\">祭祀<span class=\"hb\">來臺開發</span>的祖先</td></tr>\n<tr><th>費用</th><td colspan=\"3\"><span class=\"hl\">集資</span></td><td colspan=\"3\">修族譜、建祠堂，以<span class=\"hl\">部分祖產</span>作公費</td></tr>\n<tr><th colspan=\"7\" class=\"grp\">文教風氣</th></tr>\n<tr><th>早期不盛</th><td colspan=\"6\">移民為求生存，忙於<span class=\"hb\">墾殖</span>，文教並不發達</td></tr>\n<tr><th>後來興盛<br>（原因）</th><td colspan=\"6\">①人民<span class=\"hb\">經濟生活改善</span> ②官方及民間<span class=\"hb\">教育機構增設</span> ③官方與地方人士提倡</td></tr>\n<tr><th>結果</th><td colspan=\"6\">①通過<span class=\"hl\">科舉</span>考試的人數逐年增加 ②臺灣<span class=\"hl\">文風日益興盛</span>（18～19世紀）</td></tr>\n<tr><th>科舉人數<br>（舉人／進士）</th><td colspan=\"6\">康雍 1687–1735：<b>15</b>／0　｜　乾隆 1736–1795：<b>56</b>／2　｜　嘉道 1796–1850：<b>74</b>／6　｜　<span class=\"hl\">咸同光 1851–1894：106／21（最多）</span></td></tr>\n</table>"},"tSoc":{"title":"開港通商後的社會變遷","html":"<table>\n<tr><th colspan=\"3\" class=\"grp\">社會的轉變</th></tr>\n<tr><th style=\"width:14%\">豪族形成</th><td colspan=\"2\">部分<span class=\"hb\">地主、郊商</span>與政府合作，取得<span class=\"hl\">樟腦經營權</span>致富，成為<span class=\"hl\">豪族</span></td></tr>\n<tr><th>客家人<br>地位提升</th><td colspan=\"2\">原本：北部客家人多居<span class=\"hb\">丘陵、近山</span>，不利水稻、甘蔗生產<br>提升：開港後因<span class=\"hl\">茶葉、樟腦</span>生產致富，社會地位逐漸上升</td></tr>\n<tr><th colspan=\"3\" class=\"grp\">西方文化再傳入</th></tr>\n<tr><th>傳播者</th><td colspan=\"2\">傳教士在臺灣建教堂、傳福音，並以<span class=\"hl\">醫療、教育</span>作為傳教的方式；以基督教<span class=\"hb\">長老教會</span>為主</td></tr>\n<tr><th>代表人物</th><th style=\"text-align:center;color:var(--blue)\">馬偕（加拿大籍）・北部</th><th style=\"text-align:center;color:var(--orange)\">馬雅各（英國籍）・南部</th></tr>\n<tr><th>事蹟</th><td>①在<span class=\"hb\">淡水</span>設醫館 ②建<span class=\"hl\">理學堂大書院</span>（又稱牛津學堂，在今淡水真理大學內）③設<span class=\"hl\">淡水女學堂</span>，倡導女子教育（今淡江中學前身）</td><td>在<span class=\"hb\">臺南</span>設立臺灣第一間<span class=\"hl\">西醫醫館</span>（看西街醫館，今臺南新樓醫院前身）</td></tr>\n<tr><th colspan=\"3\" style=\"text-align:left\">影響：<span class=\"hl\">現代醫學知識與新式教育</span>傳入臺灣。記法：<span class=\"hb\">北馬偕、南馬雅各</span>。</th></tr>\n</table>"},"j1":{"title":"日治三階段（治臺政策的轉變）","html":"<table>\n<tr><th style=\"width:10%\">時期</th><th style=\"width:30%;color:var(--blue)\">殖民地特殊統治時期<br>（無方針主義）</th><th style=\"width:30%;color:var(--green)\">內地延長主義時期</th><th style=\"width:30%;color:var(--red)\">皇民化運動時期</th></tr>\n<tr><th>時間</th><td><span class=\"hl\">1895～1919</span></td><td><span class=\"hl\">1919～1937</span></td><td><span class=\"hl\">1937～1945</span></td></tr>\n<tr><th>背景</th><td>①日本領有臺灣，抗日事件頻繁（例：1915 <span class=\"hb\">西來庵事件</span>）②至第一次世界大戰結束</td><td>①一次大戰（1914–<span class=\"hb\">1918</span>）結束後 ②「<span class=\"hl\">民族自決</span>」思潮風行（各民族有權決定自身事務）③各地掀起<span class=\"hb\">殖民地獨立運動</span>風潮</td><td>①1937 <span class=\"hl\">中日戰爭</span>爆發 ②配合<span class=\"hb\">南進政策</span>，1941 太平洋戰爭</td></tr>\n<tr><th>總督</th><td><span class=\"hl\">武官</span></td><td><span class=\"hl\">文官</span></td><td><span class=\"hl\">武官</span></td></tr>\n<tr><th>目的</th><td>①漸進式統治、鎮壓反抗鞏固統治 ②<span class=\"hb\">非同化</span>政策</td><td>避免臺灣人追求<span class=\"hb\">自治、獨立</span>→改採<span class=\"hb\">同化</span>政策</td><td>戰爭需充分動員人力物資、強化臺人對日本的<span class=\"hb\">愛國心</span></td></tr>\n<tr><th>方式</th><td>①鎮壓武裝抗日 ②安撫——尊重臺灣人的風俗習慣、籠絡人心消除反抗</td><td>①殖民地視為「<span class=\"hl\">內地</span>」的一部分 ②標榜「<span class=\"hl\">日臺合一</span>」 ③日本部分國內法可施行於臺灣</td><td><span class=\"hl\">說日語・改日姓・穿和服・拜神社</span>、行日本風俗禮儀、徵召臺人從軍、部分臺籍婦女被迫充當「慰安婦」</td></tr>\n<tr><th>抗日</th><td>1915 <span class=\"hb\">西來庵（噍吧哖）事件</span>：失敗收場</td><td>①漢人＝轉向<span class=\"hb\">非武裝的社會運動</span> ②原住民＝1930 <span class=\"hb\">霧社事件</span></td><td><span class=\"hl\">社會運動均被禁止</span></td></tr>\n<tr><th>結果</th><td>一次大戰後轉向同化政策</td><td>臺灣人並未獲得與日本人<span class=\"hl\">相同的待遇</span></td><td>日本戰敗投降，中華民國接收臺灣</td></tr>\n</table>"},"jZ":{"title":"日治時期最精華（一頁背完）","html":"<table>\n<tr><th colspan=\"4\" class=\"grp\">一、十個必背年份</th></tr>\n<tr><th style=\"width:13%\">前期<br>1895–1919</th><td colspan=\"3\"><span class=\"hl\">1895</span> 馬關條約割臺・臺灣民主國　│　<span class=\"hl\">1908</span> 西部縱貫鐵路通車　│　<span class=\"hl\">1910–15</span> 五年理蕃計畫　│　<span class=\"hl\">1915</span> 西來庵事件（武裝抗日終點）</td></tr>\n<tr><th>中期<br>1919–1937</th><td colspan=\"3\"><span class=\"hl\">1919</span> 內地延長主義（一戰1918結束）　│　<span class=\"hl\">1921</span> 文化協會＋議會請願　│　<span class=\"hl\">1930</span> 霧社事件＋嘉南大圳　│　<span class=\"hl\">1934</span> 日月潭發電所　│　<span class=\"hl\">1935</span> 首次地方議員選舉</td></tr>\n<tr><th>後期<br>1937–1945</th><td colspan=\"3\"><span class=\"hl\">1937</span> 中日戰爭→皇民化　│　1941 太平洋戰爭・國民學校　│　1943 六年義務教育　│　<span class=\"hl\">1945</span> 日本投降</td></tr>\n<tr><th colspan=\"4\" class=\"grp\">二、三階段一句話</th></tr>\n<tr><th>階段</th><td style=\"color:var(--blue)\"><b>無方針主義</b> 1895–1919<br><span class=\"hb\">武官</span>・非同化</td><td style=\"color:var(--green)\"><b>內地延長主義</b> 1919–1937<br><span class=\"hb\">文官</span>・同化「日臺合一」</td><td style=\"color:var(--red)\"><b>皇民化運動</b> 1937–1945<br><span class=\"hb\">武官</span>・徹底同化</td></tr>\n<tr><th>關鍵字</th><td>鎮壓＋安撫（尊重臺人風俗）</td><td>民族自決→避免臺人求自治，實際仍差別待遇</td><td>說日語・改日姓・穿和服・拜神社・徵召從軍</td></tr>\n<tr><th colspan=\"4\" class=\"grp\">三、四條主線</th></tr>\n<tr><th>統治</th><td colspan=\"3\">總督專制（<span class=\"hl\">六三法</span>，集行政立法司法軍事於一身）＋<span class=\"hl\">警察政治</span>（派出所「大人」＋保甲10戶1甲・10甲1保・壯丁團）</td></tr>\n<tr><th>經濟</th><td colspan=\"3\"><span class=\"hb\">後藤新平</span>打底（專賣・三大調查・臺灣銀行・縱貫鐵路）→<span class=\"hl\">工業日本農業臺灣</span>（蓬萊米・新式製糖・嘉南大圳）→<span class=\"hb\">1930年代</span>→<span class=\"hl\">工業臺灣農業南洋</span>（日月潭電力・軍需工業）</td></tr>\n<tr><th>社會</th><td colspan=\"3\">差別教育（小學校／公學校／蕃童教育所）→社會菁英崛起；放足斷髮・公共衛生・守時守法・都會休閒；死亡率下降、人口快速成長</td></tr>\n<tr><th>原住民</th><td colspan=\"3\">隘勇線圍堵＋蕃童教育所→<span class=\"hl\">五年理蕃計畫</span>（1910）→<span class=\"hl\">霧社事件</span>（1930，莫那魯道）→集團移住與同化→高砂義勇隊</td></tr>\n<tr><th colspan=\"4\" class=\"grp\">四、「最」與「第一」（送分題）</th></tr>\n<tr><th>之最</th><td colspan=\"3\">最大規模武裝抗日＝<span class=\"hl\">西來庵（噍吧哖）事件</span>　│　原住民最大抗日＝<span class=\"hl\">霧社事件</span>　│　第一個合法政黨＝<span class=\"hl\">臺灣民眾黨</span>（蔣渭水）　│　最高學府＝<span class=\"hl\">臺北帝國大學</span>　│　首所專收臺人的中學＝<span class=\"hl\">臺中中學校</span>　│　最早的義務教育＝<span class=\"hl\">1943 六年國民義務教育</span>　│　臺人首次行使參政權＝<span class=\"hl\">1935 地方議員選舉</span></td></tr>\n<tr><th>人物</th><td colspan=\"3\"><span class=\"hb\">唐景崧・丘逢甲・劉永福</span>（臺灣民主國）│ <span class=\"hb\">余清芳</span>（西來庵）│ <span class=\"hb\">後藤新平</span>（基礎建設）│ <span class=\"hb\">磯永吉</span>（蓬萊米）│ <span class=\"hb\">八田與一</span>（嘉南大圳）│ <span class=\"hb\">莫那魯道</span>（霧社）│ <span class=\"hb\">林獻堂</span>（文協・請願・自治聯盟）│ <span class=\"hb\">蔣渭水</span>（文協・民眾黨）</td></tr>\n</table>"},"jF":{"title":"歷來原住民反抗政府事件比較（跨章總表）","html":"<table>\n<tr><th style=\"width:11%\">事件</th><th style=\"width:22%;color:var(--orange)\">麻豆社之役</th><th style=\"width:22%;color:var(--green)\">大肚王反抗</th><th style=\"width:22%;color:var(--blue)\">大甲西社事件</th><th style=\"width:23%;color:var(--red)\">霧社事件</th></tr>\n<tr><th>時間</th><td>1635</td><td>17 世紀中期</td><td>1731</td><td><span class=\"hl\">1930</span></td></tr>\n<tr><th>起事者</th><td><span class=\"hb\">西拉雅族</span>麻豆社</td><td><span class=\"hb\">大肚王</span>率領中、彰、投一帶原住民部落</td><td><span class=\"hb\">大甲西社</span>聯合中部平埔族</td><td><span class=\"hb\">賽德克族</span>莫那魯道</td></tr>\n<tr><th>統治者</th><td><span class=\"hl\">荷蘭</span></td><td><span class=\"hl\">荷蘭、鄭氏</span></td><td><span class=\"hl\">清帝國</span></td><td><span class=\"hl\">日本</span></td></tr>\n<tr><th>背景</th><td>不願服從荷蘭人命令</td><td>漢人拓墾土地、鄭氏徵召服勞役</td><td>不堪官府指派沉重勞役</td><td>總督府高壓理蕃、警察欺凌、山林資源遭掠奪</td></tr>\n<tr><th>結果</th><td>失敗</td><td>失敗</td><td>失敗</td><td>失敗</td></tr>\n<tr><th>影響</th><td>荷蘭奠定<span class=\"hb\">南臺灣統治權</span></td><td>勢力逐漸式微</td><td>遭鎮壓</td><td>總督府<span class=\"hl\">檢討統治原住民的政策</span>（集團移住、教育同化）</td></tr>\n<tr><th colspan=\"5\" style=\"text-align:left\">四件事都「失敗」，但影響一次比一次大：從鞏固殖民者統治→勢力式微→遭鎮壓→<span class=\"hl\">逼使統治者改變政策</span>。</th></tr>\n</table>"},"jD":{"title":"日治統治體制總覽（四條線）","html":"<table>\n<tr><th style=\"width:13%\">主軸</th><th style=\"width:29%\">前段</th><th style=\"width:29%\">中段</th><th style=\"width:29%\">後段</th></tr>\n<tr><th style=\"color:var(--red)\">漢人武裝抗日<br><span style=\"font-weight:400\">★常考</span></th><td><b>1895 <span class=\"hl\">臺灣民主國</span></b><br>唐景崧、丘逢甲成立，抗拒日本接收</td><td><b>1915 <span class=\"hl\">西來庵事件</span></b><br>余清芳策畫，武力抗日（噍吧哖）</td><td>武裝抗日終止➡轉為<span class=\"hb\">非武裝的政治社會運動</span></td></tr>\n<tr><th style=\"color:var(--blue)\">殖民體制</th><td><b><span class=\"hl\">總督專制</span></b><br>臺灣總督、<span class=\"hb\">六三法</span></td><td colspan=\"2\"><b>＋<span class=\"hl\">警察政治</span></b>　<span class=\"hb\">警察制度</span>（派出所・「大人」）＋<span class=\"hb\">保甲制度</span>（10戶1甲、10甲1保、壯丁團）</td></tr>\n<tr><th style=\"color:var(--green)\">殖民政策<br><span style=\"font-weight:400\">★常考</span></th><td><b>殖民地特殊統治</b>（無方針主義）<br>鎮壓抗日行動、尊重臺人風俗<br><span style=\"color:var(--muted)\">1895–1919・武官</span></td><td><b>內地延長主義</b>　<span class=\"hb\">←1919 年</span><br><span class=\"hl\">日臺合一</span>，實際未平等<br><span style=\"color:var(--muted)\">1919–1937・文官</span></td><td><b><span class=\"hl\">皇民化運動</span></b>　<span class=\"hb\">←1937 年</span><br>實行日本風俗、強化臺人認同<br><span style=\"color:var(--muted)\">1937–1945・武官</span></td></tr>\n<tr><th style=\"color:var(--orange)\">理蕃政策</th><td><b>初期</b><br>安撫、教育同化（隘勇線、蕃童教育所）</td><td><b><span class=\"hl\">五年理蕃計畫</span></b>（1910–1915）<br>確保資源，高壓統治</td><td><b>1930 <span class=\"hl\">霧社事件</span></b><br><span class=\"hb\">莫那魯道</span>領導➡集團移住、教化</td></tr>\n<tr><th colspan=\"4\" style=\"text-align:left\">兩個分界年份一起背：<span class=\"hl\">1919</span>（一戰1918結束→民族自決→內地延長主義、改文官總督）、<span class=\"hl\">1937</span>（中日戰爭→皇民化、改回武官）。</th></tr>\n</table>"},"jE":{"title":"日治經濟發展與社會文化總覽","html":"<table>\n<tr><th colspan=\"4\" class=\"grp\">經濟發展</th></tr>\n<tr><th style=\"width:13%\">專賣制度</th><td colspan=\"3\"><span class=\"hl\">鴉片、樟腦</span>等（後續菸、酒、鹽）＝總督府獨占經營，日治初期最大財源</td></tr>\n<tr><th>基礎建設<br><span style=\"font-weight:400\">★常考</span></th><td style=\"width:29%\"><b>目標</b><br><span class=\"hl\">強化統治、獲取資源</span></td><td style=\"width:29%\"><b>調查事業</b><br>土地與林野調查、<span class=\"hb\">人口普查</span>（1905）</td><td style=\"width:29%\"><b>統一貨幣</b>　<span class=\"hl\">臺灣銀行</span>發行（1899）<br><b>交通運輸</b>　<span class=\"hl\">基隆－高雄縱貫鐵路</span>（1908）、<span class=\"hb\">基隆港、高雄港</span></td></tr>\n<tr><th>產業發展<br><span style=\"font-weight:400\">★常考</span></th><td colspan=\"2\"><b><span class=\"hl\">工業日本，農業臺灣</span></b>（日治前期）<br><span class=\"hb\">蓬萊米</span>（1922 磯永吉）、<span class=\"hb\">新式製糖</span>（糖業王國）、<span class=\"hb\">嘉南大圳</span>（1930 八田與一）</td>
